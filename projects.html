      <!-- Straight to the projects. A group head is a TAG used for filtering and

      <div class="pd-main">

              <select class="pd-select pd-input-sm" id="group-by" title="Group projects by">
                <option value="grouphead">Group by: Group Head</option>

                <option value="none">Group by: None</option>
              </select>
              <select class="pd-select pd-input-sm" id="sort-by" title="Sort projects by">
                <option value="name">Sort: Name</option>
                <option value="grouphead">Sort: Group Head</option>

                <option value="finish">Sort: Forecast Finish</option>
                <option value="budget">Sort: Original Budget</option>
              </select>
              <input class="pd-input pd-input-sm" id="proj-search" type="search" placeholder="Search projects…" />
              <div class="pd-viewtoggle" role="group" aria-label="View">
                <button class="pd-vt active" id="vt-list" title="List view"><span data-ico="listView" data-ico-size="16"></span></button>
                <button class="pd-vt" id="vt-cards" title="Card view"><span data-ico="gridView" data-ico-size="16"></span></button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260819a"></script>
  <script src="assets/js/auth.js?v=20260814a"></script>
  <script src="assets/js/db.js?v=20260819b"></script>
  <script src="assets/js/ui.js?v=20260812b"></script>
  <script src="assets/js/icons.js?v=20260813a"></script>
  <script>
  (function () {
    // A project carries ONE group_head_id. There is no tree: sorting, filtering
    // and grouping by group head is the whole structure. `NONE` is a real
    // bucket, not a hidden state — an unassigned project must stay reachable.
    var NONE = '__nogh__';
    var GH = [], PROJ = [], ghById = {};
    var selectedGh = null;          // null = all group heads
    // ⚠️ Grouped by group head, matching the PRC App's Portfolio Overview. This is NOT the folder
    // tree A2 removed: every project is still on screen and one click away — the headers only label
    // the runs. "Group by: None" remains one selection away for a purely flat list.
    var view = 'list', groupBy = 'grouphead', sortBy = 'name';
    var canWrite = false;
    var IS_ADMIN = false;           // archive/delete are admin-only (also enforced in DB)

    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      canWrite = ['super_admin', 'admin', 'planner'].indexOf(profile.role) !== -1;
      IS_ADMIN = ['super_admin', 'admin'].indexOf(profile.role) !== -1;
      if (profile.role === 'admin' || profile.role === 'super_admin') {
        document.getElementById('nav-admin').style.display = '';
        var ns = document.getElementById('nav-sys'); if (ns) ns.style.display = '';
      }
      if (canWrite) document.getElementById('add-wrap').style.display = '';
      boot();
    });

    async function boot() {
      try {
        var res = await Promise.all([PDb.getGroupHeads(), PDb.getProjects()]);
        GH = res[0]; PROJ = res[1];
      } catch (e) { UI.toast('Load failed: ' + e.message, 'error'); return; }
      indexGh();
      renderGhFilter();
      render();
      wireToolbar();
    }

    function indexGh() { ghById = {}; GH.forEach(function (g) { ghById[g.id] = g; }); }

    // The one resolver every view uses. A project's group head is its own tag —
    // there is no ancestry to walk any more.
    function ghIdOf(p) { return p.group_head_id || NONE; }
    function ghNameOf(p) {
      var g = ghById[p.group_head_id];
      return g ? g.name : (p.group_head_id ? p.group_head_id : null);
    }
    function ghLabel(id) {
      if (id === NONE) return '— No group head —';
      var g = ghById[id]; return g ? g.name : id;
    }
    function countFor(id) {
      return PROJ.filter(function (p) { return ghIdOf(p) === id; }).length;
    }

    // ---- Group-head filter (toolbar) ----
    // Group heads are a filter only. A retired ("inactive") head still lists
    // while projects are assigned to it - otherwise those projects become
    // unreachable through the filter even though they are perfectly live.
    function renderGhFilter() {
      var sel = document.getElementById('gh-filter');
      var opts = ['<option value="__all__">All group heads (' + PROJ.length + ')</option>'];
      GH.slice().sort(function (a, b) {
        return (a.sort_order || 0) - (b.sort_order || 0) || String(a.name).localeCompare(String(b.name));
      }).forEach(function (g) {
        var n = countFor(g.id);
        if (g.active === false && !n) return;
        opts.push('<option value="' + Fmt.esc(g.id) + '">' + Fmt.esc(g.name) +
          (g.active === false ? ' (inactive)' : '') + ' (' + n + ')</option>');
      });
      // The unassigned bucket is a real scope, not a hidden state - but only
      // offer it when something is actually in it.
      var nUn = countFor(NONE);
      if (nUn) opts.push('<option value="' + NONE + '">\u2014 No group head \u2014 (' + nUn + ')</option>');
      sel.innerHTML = opts.join('');
      sel.value = (selectedGh === null) ? '__all__' : selectedGh;
      // A dangling selection (its head deleted or retired-and-emptied) would
      // leave the select blank while the list stayed silently filtered.
      if (!sel.value) { selectedGh = null; sel.value = '__all__'; }
      syncGhManage();
    }

    // Editing a group head used to hang off a gear inside each pane row. With
    // the pane gone it acts on whichever head is currently selected.
    function syncGhManage() {
      var b = document.getElementById('gh-manage');
      if (!b) return;
      var editable = canWrite && selectedGh !== null && selectedGh !== NONE && !!ghById[selectedGh];
      b.style.display = editable ? '' : 'none';
      if (editable) b.title = 'Edit group head: ' + ghLabel(selectedGh);
    }

    // ---- Projects in scope + search + sort ----
    function projectsInScope() {
      var q = (document.getElementById('proj-search').value || '').toLowerCase();
      var list = PROJ.slice();
      if (selectedGh !== null) list = list.filter(function (p) { return ghIdOf(p) === selectedGh; });
      if (q) list = list.filter(function (p) {
        return (p.name || '').toLowerCase().indexOf(q) !== -1 || (p.id || '').toLowerCase().indexOf(q) !== -1;
      });
      return sortList(list);
    }

    function sortList(list) {
      // Blanks sort last in every mode — an empty budget or finish date is
      // unknown, not zero/earliest.
      function s(v) { return (v == null || v === '') ? null : v; }
      var cmp = {
        name: function (a, b) { return String(a.name || a.id).localeCompare(String(b.name || b.id)); },
        id: function (a, b) { return String(a.id).localeCompare(String(b.id)); },
        grouphead: function (a, b) {
          var x = ghNameOf(a), y = ghNameOf(b);
          if (!x && !y) return cmp.name(a, b);
          if (!x) return 1; if (!y) return -1;
          return x.localeCompare(y) || cmp.name(a, b);
        },
        finish: function (a, b) {
          var x = s(a.forecast_finish || a.end_date), y = s(b.forecast_finish || b.end_date);
          if (!x && !y) return cmp.name(a, b);
          if (!x) return 1; if (!y) return -1;
          return String(x).localeCompare(String(y));
        },
        budget: function (a, b) {
          var x = s(a.original_budget), y = s(b.original_budget);
          if (x == null && y == null) return cmp.name(a, b);
          if (x == null) return 1; if (y == null) return -1;
          return Number(y) - Number(x);   // largest first
        },
      }[sortBy] || cmp.name;
      return list.sort(cmp);
    }

    function statusPill(st) {
      st = (st || 'active').toLowerCase();
      var cls = st === 'archived' ? 'pd-pill-muted' : 'pd-pill-ok';
      return '<span class="pd-pill ' + cls + '">' + Fmt.esc(st.charAt(0).toUpperCase() + st.slice(1)) + '</span>';
    }

    function render() {
      var list = projectsInScope();
      document.getElementById('proj-count').textContent = list.length + (list.length === 1 ? ' project' : ' projects');
      var area = document.getElementById('proj-area');
      if (!list.length) {
        area.innerHTML = '<div class="pd-empty">No projects' + (selectedGh !== null ? ' for this group head' : '') + ' yet.' +
          (canWrite ? ' Use <strong>+ Add</strong> to create one.' : '') + '</div>';
        return;
      }
      view === 'cards' ? renderCards(area, list) : renderList(area, list);
      area.querySelectorAll('[data-open]').forEach(function (el) {
        el.onclick = function () { openProject(el.dataset.open); };
      });
    }

    // Grouping key + label share one function per mode so a group's header can
    // never disagree with the rows filed under it.
    function groupKeyOf(p) {
      if (groupBy === 'status') return (p.status || 'active').toLowerCase();
      if (groupBy === 'none') return '__all__';
      return ghIdOf(p);
    }
    function groupLabelOf(k) {
      if (groupBy === 'status') return k.charAt(0).toUpperCase() + k.slice(1);
      if (groupBy === 'none') return 'All Projects';
      return ghLabel(k);
    }

    // Ordered [key, items] pairs. Shared by the list AND card views — the card
    // view used to ignore grouping entirely and render one flat run of cards,
    // silently discarding the Group-by selection the user had just made.
    function groupProjects(list) {
      var groups = {}, order = [];
      list.forEach(function (p) {
        var k = groupKeyOf(p);
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(p);
      });
      // The unassigned bucket always sits last; the rest read alphabetically.
      order.sort(function (a, b) {
        if (a === NONE) return 1; if (b === NONE) return -1;
        return groupLabelOf(a).localeCompare(groupLabelOf(b));
      });
      return order.map(function (k) { return [k, groups[k]]; });
    }

    function renderList(area, list) {
      var cols = canWrite ? 8 : 7;
      var rows = '<table class="pd-table pd-proj-table"><thead><tr>' +
        '<th>Name</th><th>ID</th><th>Status</th><th>Group Head</th><th>Forecast Start</th><th>Forecast Finish</th><th class="num">Original Budget</th>' +
        (canWrite ? '<th></th>' : '') + '</tr></thead><tbody>';
      groupProjects(list).forEach(function (g) {
        if (groupBy !== 'none') {
          // PRC's own group-header treatment (_ghHeadCells in the PRC app): a tinted chip with a
          // RED LEFT BORDER, then a muted "N projects" beside it — deliberately not a solid-red
          // pill (PRC records that as user feedback; red is reserved for the code pill).
          rows += '<tr class="pd-group-row"><td colspan="' + cols + '">' +
            '<span class="pd-ghchip">' + Fmt.esc(groupLabelOf(g[0])) + '</span>' +
            '<span class="pd-ghcount">' + g[1].length + ' project' + (g[1].length === 1 ? '' : 's') + '</span>' +
            '</td></tr>';
        }
        g[1].forEach(function (p) {
          rows += '<tr class="pd-proj-row" data-open="' + Fmt.esc(p.id) + '">' +
            '<td class="pd-proj-name"><span class="pd-proj-ic">' + Icons.svg('project', 16) + '</span>' + Fmt.esc(p.name) + '</td>' +
            '<td><code>' + Fmt.esc(p.id) + '</code></td>' +
            '<td>' + statusPill(p.status) + '</td>' +
            '<td>' + Fmt.esc(ghNameOf(p) || '—') + '</td>' +
            '<td>' + Fmt.date(p.forecast_start || p.start_date) + '</td>' +
            '<td>' + Fmt.date(p.forecast_finish || p.end_date) + '</td>' +
            '<td class="num">' + (p.original_budget != null ? Fmt.moneyShort(p.original_budget) : '—') + '</td>' +
            (canWrite ? '<td><button class="pd-btn pd-btn-sm" data-edit="' + Fmt.esc(p.id) + '">Edit</button></td>' : '') +
          '</tr>';
        });
      });
      rows += '</tbody></table>';
      area.innerHTML = rows;
      if (canWrite) area.querySelectorAll('[data-edit]').forEach(function (b) {
        b.onclick = function (e) { e.stopPropagation(); projectModal(PROJ.find(function (x) { return x.id === b.dataset.edit; })); };
      });
    }

    function cardHTML(p) {
      return '<div class="pd-proj-card" data-open="' + Fmt.esc(p.id) + '">' +
        '<div class="pd-proj-card-top"><span class="pd-proj-ic">' + Icons.svg('project', 22) + '</span>' + statusPill(p.status) + '</div>' +
        '<div class="pd-proj-card-title">' + Fmt.esc(p.name) + '</div>' +
        '<div class="pd-proj-card-id"><code>' + Fmt.esc(p.id) + '</code></div>' +
        '<div class="pd-proj-card-meta">' +
          '<div><span>Group Head</span><b>' + Fmt.esc(ghNameOf(p) || '—') + '</b></div>' +
          '<div><span>Forecast Finish</span><b>' + Fmt.date(p.forecast_finish || p.end_date) + '</b></div>' +
          '<div><span>Original Budget</span><b>' + (p.original_budget != null ? Fmt.moneyShort(p.original_budget) : '—') + '</b></div>' +
        '</div>' +
        (p.location ? '<div class="pd-proj-card-loc">' + Icons.svg('mapPin', 13) + '<span>' + Fmt.esc(p.location) + '</span></div>' : '') +
      '</div>';
    }
    // Cards honour the SAME grouping as the list view (see groupProjects).
    function renderCards(area, list) {
      area.innerHTML = groupProjects(list).map(function (g) {
        var head = (groupBy === 'none') ? '' :
          '<div class="pd-cardgroup"><span class="pd-ghchip">' + Fmt.esc(groupLabelOf(g[0])) + '</span>' +
          '<span class="pd-ghcount">' + g[1].length + ' project' + (g[1].length === 1 ? '' : 's') + '</span>' +
          '<span class="pd-cardgroup-rule"></span></div>';
        return head + '<div class="pd-proj-cards">' + g[1].map(cardHTML).join('') + '</div>';
      }).join('');
    }

    function openProject(id) {
      var p = PROJ.find(function (x) { return x.id === id; });
      if (!p) return;
      sessionStorage.setItem('pd_project', p.id);
      sessionStorage.setItem('pd_project_name', p.name || p.id);
      sessionStorage.setItem('pd_group_head', p.group_head_id || '');
      // ⚠️ A package belongs to ONE project. Carrying a previous selection across
      // would scope the shell to a package this project does not contain.
      sessionStorage.removeItem('pd_package');
      sessionStorage.removeItem('pd_package_name');
      location.href = 'dashboard.html';
    }

    // ---- Toolbar wiring ----
    function wireToolbar() {
      // ⚠️ 'input' alone is not enough: the native clear (×) and Esc fire 'search'
      // and 'change' but NOT 'input', which left the list filtered after clearing.
      bindSearch(document.getElementById('proj-search'), render);
      document.getElementById('gh-filter').onchange = function () {
        selectedGh = (this.value === '__all__') ? null : this.value;
        syncGhManage(); render();
      };
      document.getElementById('gh-manage').onclick = function () {
        if (ghById[selectedGh]) groupHeadModal(ghById[selectedGh]);
      };
      document.getElementById('group-by').onchange = function () { groupBy = this.value; render(); };
      document.getElementById('sort-by').onchange = function () { sortBy = this.value; render(); };
      document.getElementById('vt-list').onclick = function () { view = 'list'; setVt(); render(); };
      document.getElementById('vt-cards').onclick = function () { view = 'cards'; setVt(); render(); };
      if (canWrite) {
        var menu = document.getElementById('add-menu'), btn = document.getElementById('add-btn');
        btn.onclick = function (e) { e.stopPropagation(); menu.classList.toggle('open'); };
        document.addEventListener('click', function (e) { if (!menu.contains(e.target) && e.target !== btn) menu.classList.remove('open'); });
        menu.querySelectorAll('[data-add]').forEach(function (b) {
          b.onclick = function () { menu.classList.remove('open'); b.dataset.add === 'project' ? projectModal(null) : groupHeadModal(null); };
        });
      }
    }
    function bindSearch(el, fn) {
      if (!el) return;
      ['input', 'search', 'change'].forEach(function (ev) { el.addEventListener(ev, fn); });
    }

    function setVt() {
      document.getElementById('vt-list').classList.toggle('active', view === 'list');
      document.getElementById('vt-cards').classList.toggle('active', view === 'cards');
    }

    // ---- Add / edit Project ----
    // An inactive group head still appears when it is the project's CURRENT
    // value — otherwise the select would silently fall back to the first option
    // and saving would reassign the project without anyone asking for it.
    function ghOptions(cur) {
      var seen = {};
      var opts = GH.filter(function (g) { return g.active !== false || g.id === cur; })
        .sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0) || String(a.name).localeCompare(String(b.name)); })
        .map(function (g) {
          seen[g.id] = 1;
          return '<option value="' + Fmt.esc(g.id) + '"' + (cur === g.id ? ' selected' : '') + '>' +
            Fmt.esc(g.name) + (g.active === false ? ' (inactive)' : '') + '</option>';
        });
      if (cur && !seen[cur]) opts.unshift('<option value="' + Fmt.esc(cur) + '" selected>' + Fmt.esc(cur) + '</option>');
      return opts.join('');
    }

    function projectModal(p) {
      var isNew = !p; p = p || {};
      // A new project defaults to whichever group head is currently filtered —
      // the common case is "add another project to the group I'm looking at".
      var ghCur = p.group_head_id || (selectedGh && selectedGh !== NONE ? selectedGh : '');
      var m = UI.modal(
        '<h2 style="margin-top:0;">' + (isNew ? 'New Project' : 'Edit Project') + '</h2>' +
        '<div style="display:flex;gap:10px;"><div class="pd-field" style="flex:1;"><label>Project ID' + (isNew ? ' (e.g. AVR101)' : '') + '</label><input class="pd-input" id="p-id" value="' + Fmt.esc(p.id) + '"' + (isNew ? '' : ' disabled') + '></div>' +
        '<div class="pd-field" style="flex:1;"><label>Status</label><select class="pd-select" id="p-status">' + ['active', 'archived'].map(function (s) { return '<option' + (p.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div></div>' +
        '<div class="pd-field"><label>Name</label><input class="pd-input" id="p-name" value="' + Fmt.esc(p.name) + '"></div>' +
        '<div style="display:flex;gap:10px;"><div class="pd-field" style="flex:1;"><label>Group Head</label><select class="pd-select" id="p-gh"><option value="">— Unassigned —</option>' + ghOptions(ghCur) + '</select></div>' +
        '<div class="pd-field" style="flex:1;"><label>Location</label><input class="pd-input" id="p-loc" value="' + Fmt.esc(p.location) + '"></div></div>' +
        '<div class="pd-field"><label>Description</label><input class="pd-input" id="p-desc" value="' + Fmt.esc(p.description) + '"></div>' +
        '<div style="display:flex;gap:10px;"><div class="pd-field" style="flex:1;"><label>Forecast Start</label><input class="pd-input" type="date" id="p-fs" value="' + (p.forecast_start || '') + '"></div>' +
        '<div class="pd-field" style="flex:1;"><label>Forecast Finish</label><input class="pd-input" type="date" id="p-ff" value="' + (p.forecast_finish || '') + '"></div></div>' +
        '<div style="display:flex;gap:10px;"><div class="pd-field" style="flex:1;"><label>Original Budget (₱)</label><input class="pd-input" type="number" id="p-ob" value="' + (p.original_budget != null ? p.original_budget : '') + '"></div>' +
        '<div class="pd-field" style="flex:1;"><label>Estimated Cost (₱)</label><input class="pd-input" type="number" id="p-ec" value="' + (p.estimated_cost != null ? p.estimated_cost : '') + '"></div></div>' +
        // Admin-only destructive actions sit left, away from Save. Archive is the
        // safe everyday action; Delete only ever succeeds on an empty project.
        '<div style="margin-top:8px;display:flex;align-items:center;gap:8px;">' +
        (isNew || !IS_ADMIN ? '<div style="flex:1;"></div>' :
          '<button class="pd-btn" id="p-arch">' + (p.status === 'archived' ? 'Restore' : 'Archive') + '</button>' +
          '<button class="pd-btn pd-btn-danger" id="p-del">Delete…</button><div style="flex:1;"></div>') +
        '<button class="pd-btn" id="p-cancel">Cancel</button> <button class="pd-btn pd-btn-primary" id="p-save">Save</button></div>');
      m.el.querySelector('#p-cancel').onclick = m.close;
      if (!isNew && IS_ADMIN) {
        m.el.querySelector('#p-arch').onclick = async function () {
          var toArchive = p.status !== 'archived';
          try {
            await PDb.archiveProject(p.id, toArchive);
            UI.toast(toArchive ? 'Project archived' : 'Project restored', 'ok');
            m.close(); await reloadData();
          } catch (e) { UI.toast(e.message, 'error'); }
        };
        m.el.querySelector('#p-del').onclick = function () { deleteProjectModal(p, m); };
      }
      m.el.querySelector('#p-save').onclick = async function () {
        var num = function (id) { var v = m.el.querySelector(id).value; return v === '' ? null : Number(v); };
        var data = {
          name: m.el.querySelector('#p-name').value.trim(),
          status: m.el.querySelector('#p-status').value,
          group_head_id: m.el.querySelector('#p-gh').value || null,
          location: m.el.querySelector('#p-loc').value.trim() || null,
          description: m.el.querySelector('#p-desc').value.trim() || null,
          forecast_start: m.el.querySelector('#p-fs').value || null,
          forecast_finish: m.el.querySelector('#p-ff').value || null,
          original_budget: num('#p-ob'), estimated_cost: num('#p-ec'),
        };
        if (!data.name) { UI.toast('Name required', 'warn'); return; }
        try {
          if (isNew) {
            var id = m.el.querySelector('#p-id').value.trim();
            if (!id) { UI.toast('Project ID required', 'warn'); return; }
            data.id = id; await PDb.createProject(data);
          } else { await PDb.updateProject(p.id, data); }
          UI.toast('Saved', 'ok'); m.close(); await reloadData();
        } catch (e) { UI.toast(e.message, 'error'); }
      };
    }

    // ---- Delete confirmations (admin) ----
    // Both deletes are hard and unguarded by any undo, so the id must be typed
    // to arm the button. The DB refuses a non-empty project / an in-use group
    // head and returns a message naming what's blocking — shown verbatim.
    function confirmDelete(opts) {
      var m = UI.modal(
        '<h2 style="margin-top:0;">' + Fmt.esc(opts.title) + '</h2>' +
        '<p style="color:var(--pd-muted);">' + opts.body + '</p>' +
        '<div class="pd-field"><label>Type <b>' + Fmt.esc(opts.id) + '</b> to confirm</label>' +
        '<input class="pd-input" id="d-echo" autocomplete="off"></div>' +
        '<div style="margin-top:8px;text-align:right;"><button class="pd-btn" id="d-cancel">Cancel</button> ' +
        '<button class="pd-btn pd-btn-danger" id="d-go" disabled>Delete permanently</button></div>');
      var echo = m.el.querySelector('#d-echo'), go = m.el.querySelector('#d-go');
      echo.oninput = function () { go.disabled = echo.value.trim() !== opts.id; };
      m.el.querySelector('#d-cancel').onclick = m.close;
      go.onclick = async function () {
        go.disabled = true;
        try {
          await opts.run();
          UI.toast(opts.ok, 'ok'); m.close(); if (opts.parent) opts.parent.close();
          await reloadData();
        } catch (e) { UI.toast(e.message, 'error'); go.disabled = false; }
      };
      echo.focus();
    }

    function deleteProjectModal(p, parent) {
      confirmDelete({
        id: p.id, parent: parent, title: 'Delete project ' + Fmt.esc(p.id) + '?',
        body: 'This cannot be undone. It is refused while the project still holds <b>real work</b> — a ' +
              'schedule, baseline, register, risk or cash-flow record — and the error names what is ' +
              'blocking. Working calendars, audit history and derived data (S-curve, roll-ups) are ' +
              'cleared automatically and never block. To keep the history instead, <b>Archive</b> ' +
              '(hides it from active use).',
        ok: 'Project deleted',
        run: function () { return PDb.deleteProject(p.id); },
      });
    }

    function deleteGroupHeadModal(g, parent) {
      confirmDelete({
        id: g.id, parent: parent, title: 'Delete group head ' + Fmt.esc(g.id) + '?',
        body: 'This cannot be undone. It only works if <b>no project is still assigned</b> to this ' +
              'group head. To retire one that has history, untick <b>Active</b> instead — it stops ' +
              'appearing as a choice on new projects but keeps every existing assignment readable.',
        ok: 'Group head deleted',
        run: function () { return PDb.deleteGroupHead(g.id); },
      });
    }

    // ---- Add / edit Group Head ----
    function groupHeadModal(g) {
      var isNew = !g; g = g || {};
      var m = UI.modal(
        '<h2 style="margin-top:0;">' + (isNew ? 'New Group Head' : 'Edit Group Head') + '</h2>' +
        '<div style="display:flex;gap:10px;"><div class="pd-field" style="flex:1;"><label>ID' + (isNew ? ' (e.g. CALIMAG)' : '') + '</label><input class="pd-input" id="g-id" value="' + Fmt.esc(g.id) + '"' + (isNew ? '' : ' disabled') + '></div>' +
        '<div class="pd-field" style="flex:1;"><label>Sort order</label><input class="pd-input" type="number" id="g-sort" value="' + (g.sort_order != null ? g.sort_order : 0) + '"></div></div>' +
        '<div class="pd-field"><label>Name</label><input class="pd-input" id="g-name" value="' + Fmt.esc(g.name) + '"></div>' +
        '<div class="pd-field"><label><input type="checkbox" id="g-active"' + (g.active === false ? '' : ' checked') + '> Active <small>(uncheck to retire — existing projects keep their assignment)</small></label></div>' +
        '<div style="margin-top:8px;display:flex;align-items:center;gap:8px;">' +
        (isNew || !IS_ADMIN ? '<div style="flex:1;"></div>' :
          '<button class="pd-btn pd-btn-danger" id="g-del">Delete…</button><div style="flex:1;"></div>') +
        '<button class="pd-btn" id="g-cancel">Cancel</button> <button class="pd-btn pd-btn-primary" id="g-save">Save</button></div>');
      m.el.querySelector('#g-cancel').onclick = m.close;
      if (!isNew && IS_ADMIN) {
        m.el.querySelector('#g-del').onclick = function () { deleteGroupHeadModal(g, m); };
      }
      m.el.querySelector('#g-save').onclick = async function () {
        var data = {
          name: m.el.querySelector('#g-name').value.trim(),
          sort_order: Number(m.el.querySelector('#g-sort').value || 0),
          active: m.el.querySelector('#g-active').checked,
        };
        if (!data.name) { UI.toast('Name required', 'warn'); return; }
        try {
          if (isNew) {
            var id = m.el.querySelector('#g-id').value.trim().toUpperCase();
            if (!id) { UI.toast('ID required', 'warn'); return; }
            data.id = id; await PDb.createGroupHead(data);
          } else { await PDb.updateGroupHead(g.id, data); }
          UI.toast('Saved', 'ok'); m.close(); await reloadData();
        } catch (e) { UI.toast(e.message, 'error'); }
      };
    }

    async function reloadData() {
      GH = await PDb.getGroupHeads(); PROJ = await PDb.getProjects();
      indexGh();
      // A group head that was just deleted must not stay as a dangling filter.
      if (selectedGh && selectedGh !== NONE && !ghById[selectedGh]) selectedGh = null;
      renderGhFilter(); render();
    }
  })();
  </script>
</body>
</html>
