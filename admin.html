  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260917za" />
  <style>
    /* ⚠ `nowrap`: a chip is one token — "6 modules hidden" broken over three lines reads as
       three separate facts. The row scrolls instead, which is what .pd-tablewrap is for. */
    .pd-chip { display:inline-block; white-space:nowrap; font-size:var(--pd-fs-xs); padding:2px 8px; border-radius:var(--pd-radius-pill); background:var(--pd-bg); margin:2px 3px 2px 0; }
    /* the two placeholders that sit where a chip would, and wrapped for the same reason */
    .pd-nochip { color:var(--pd-muted); white-space:nowrap; }
    /* ⚠ The date under an Activity pill. `nowrap` for the same reason the chips carry it —
       "4 working days ago" broken over two lines reads as two facts. */
    .pd-subline { margin-top:3px; font-size:var(--pd-fs-xs); color:var(--pd-muted); white-space:nowrap; }
    .pd-uname { font-weight:700; white-space:nowrap; }
    /* ⚠ The count beside a group heading. The heading row is uppercase/800 from the shared
       `.pd-grp`, so the count is de-emphasised back to normal weight and case — otherwise it
       reads as part of the department's name. */
    .pd-grpn { font-weight:500; text-transform:none; letter-spacing:0; color:var(--pd-muted); }
    /* The search bar. ⚠ The icon is absolutely positioned rather than placed in a flex row, so
       the input stays one full-width control that a screen reader announces once. */
    .pd-usearch { position:relative; margin-bottom:14px; }
    .pd-usearch .pd-input { width:100%; padding-left:36px; }
    .pd-usearch-ico { position:absolute; left:11px; top:50%; transform:translateY(-50%);
      color:var(--pd-muted); display:inline-flex; pointer-events:none; }
    .pd-nomatch { color:var(--pd-muted); padding:18px 10px; text-align:center; }
    .pd-bulk { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px;
      padding:9px 12px; border:1px solid var(--pd-red); border-radius:var(--pd-radius);
      background:var(--pd-red-light); }
    .pd-bulk-n { font-weight:700; margin-right:4px; }
    /* ⚠⚠ THE SELECTS NEED AN EXPLICIT WIDTH. `.pd-select` is `width:100%` in the shared sheet
       (correct — it is designed to fill a form field), so dropped into a flex row each one
       claimed the whole line and the bar rendered 161px tall instead of 50. Measured, not
       guessed: a three-line action bar above the table it acts on is worse than no bar. */
    .pd-bulk .pd-select { width:auto; min-width:148px; flex:0 0 auto; }
    /* ⚠ A fixed, narrow select column, so a table that was measured to fit does not lose that
       property to a checkbox that grew. */
    .pd-ckcol { width:34px; text-align:center; padding-left:6px !important; padding-right:6px !important; }
    .pd-ckoff { color:var(--pd-line); }
    .pd-table tr.pd-rowsel > td { background:var(--pd-red-light); }
    /* ⚠ Tighter gutters on THIS table only. Nine columns pay the cell padding nine times, so
       10px -> 7px each side recovers ~54px and is the difference between fitting a 1400px laptop
       and scrolling it. Scoped to #users-table rather than .pd-table: every other table in the
       app is fine at 10px and a shared change to make one screen fit is how a design system
       starts drifting. */
    #users-table th, #users-table td { padding-left:7px; padding-right:7px; }
    /* ⚠ `.pd-status-*` RETIRED 2026-09-17 with the Status column. Their only consumer was
       that cell; grouping states the status now. Left in place they would be three rules
       matching nothing, which is what the next editor edits by mistake. */

    /* ⚠️⚠️ dashboard.css's own `.pd-app .pd-main table .pd-select { height:34px;
       min-height:0 }` (≤700px) exists so a SELECT inside a dense editable grid
       (the BOQ table, a cost matrix) stays as compact as the row it lives in —
       correct there, because those rows are themselves ~34px. This table's rows
       are ordinary `.pd-table` rows (8/10px padding) and these two selects carry
       whole words ("super_admin", "Human Resources") at the 16px the iOS-zoom
       guard forces on every mobile input — 34px is not enough box for that
       font-size's own line height plus the select's 10px vertical padding, and
       the clipped/overlapping glyphs are what read as garbled on a phone.
       `#users-table` (an id) beats `.pd-app .pd-main table` (three classes/
       elements) on specificity regardless of rule order, so no !important
       is needed to win back the room. */
    @media (max-width: 700px) {
      #users-table .pd-select { height:auto; min-height:var(--pd-tap); min-width:150px; }
    }

    /* Actions menu — a single "Actions" trigger replacing three loose buttons,
       with Approve/Reject/Delete as icon-only controls inside it (title=
       carries the label, matching this app's icon-only-button convention).
       ⚠️⚠️ Appended to <body> and positioned `fixed` from the trigger's own
       rect, rather than nested `absolute` inside the table cell — the table's
       card wrapper is `overflow:auto` (so a wide table scrolls), and a popover
       nested inside it would be clipped by that same scroller the moment a row
       near the bottom opened one. ⚠️ Toggled by a CLASS, never `[hidden]` —
       dashboard.css already documents at length how `[hidden]` loses a
       specificity tie against an author's own `display` rule on other
       components in this app; a class sidesteps that whole trap rather than
       risking it a third time. */
    .pd-actions-menu {
      display:none; position:fixed; z-index:var(--pd-z-escape);
      background:var(--pd-card); border:1px solid var(--pd-line);
      border-radius:var(--pd-radius-md); box-shadow:var(--pd-shadow-lg);
      padding:4px; gap:2px;
    }
    .pd-actions-menu.open { display:flex; }
    .pd-am-btn {
      border:none; background:transparent; cursor:pointer; color:var(--pd-ink);
      width:var(--pd-tap); height:var(--pd-tap); border-radius:var(--pd-radius);
      display:inline-flex; align-items:center; justify-content:center;
    }
    .pd-am-btn:hover { background:var(--pd-bg); }
    .pd-am-btn.pd-am-approve:hover { background:var(--pd-ok-bg); color:var(--pd-ok-text); }
    .pd-am-btn.pd-am-reject:hover  { background:var(--pd-warn-bg); color:var(--pd-warn-text); }
    .pd-am-btn.pd-am-danger { color:var(--pd-bad-text); }
    .pd-am-btn.pd-am-danger:hover { background:var(--pd-bad-bg); }
    /* .pd-actions-trigger needs no rules of its own — .pd-btn already gives it
       inline-flex + gap, which is all "Actions <chevron>" needs. */
  </style>
</head>
<body>
  <div class="pd-app">
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="assets/img/logo-white.png" alt="Megawide Construction"><img class="pd-brand-mark" src="assets/img/favicon-icon.png?v=20260903a" alt="" aria-hidden="true">Planners Dashboard<small>Planning Suite</small></div>
      <!-- Contents depend on the current mode (Portfolio here) — rendered by UI.renderNav. -->
      <nav id="side-nav"></nav>
      <!-- Cross-app links to sibling apps. Separate Supabase projects /
           separate logins — open in a new tab rather than navigating away. -->
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="appEngineering"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="appProcurement"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <!-- PRC's .sidebar-footer, pinned to the bottom of the panel. -->
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>PMO Department</div>
    </aside>
    <div class="pd-content">
      <!-- ⚠️ `<h1>Users</h1>` (2026-09-15) — this page was "Admin" carrying BOTH user
           management and project/group-head CRUD, and the latter already lives in
           projects.html (which owns the identical `manageGroupHeadsModal` /
           `createProject`/`updateProject`/`deleteProject`/`archiveProject` calls this
           page used to duplicate). Owner: "projects already has a separate module, no
           need to mix with admin. for admin keep only user management and rename to
           Users." Only the VISIBLE label changes — `active: 'admin'` below, the
           `admin.html` filename, and `requireAdmin`'s own role check are all left as
           they are, so nothing that links here (the sidebar, a bookmark, `requireAdmin`)
           silently breaks. Same convention this repo already uses for a relabelled
           screen whose identifier stays put (`personal-dashboard`, `data-view="loading"`
           — see ui.js's own comment on the My Work row). -->
      <div class="pd-topbar"><div id="ctx-switcher"></div><h1>Users</h1><div id="user-bar"></div></div>
      <div class="pd-main">
        <!-- ⚠⚠ `.pd-tablewrap`, NOT a bare `overflow:auto`. Owner 2026-09-17: *"Columns
             wrap unnecessarily when side panel is opened."* A `width:100%` table with no
             minimum CRUSHES its columns first and only scrolls once it can crush no further,
             so with the sidebar open "No projects assigned" broke over three lines AND the
             row still scrolled sideways — the worst of both. `.pd-tablewrap` (dashboard.css)
             pairs `overflow-x:auto` with `> table { min-width: max-content }`, so the table
             keeps its natural column widths and the wrapper scrolls cleanly.
             ⚠ It was already in the shared stylesheet and used on ZERO pages. Reviving it
             beats a third local copy of the same two rules. -->
        <!-- ⚠ ABOVE THE CARD AND FULL WIDTH, matching the procurement dashboard's User
             Management screen, which is what the owner pointed at. A search that filters a whole
             table belongs over the table, not inside its first column. -->
        <div class="pd-usearch">
          <span class="pd-usearch-ico" data-ico="search" data-ico-size="16" aria-hidden="true"></span>
          <input class="pd-input" id="users-q" type="search" autocomplete="off"
                 placeholder="Search by name, email or department&hellip;"
                 aria-label="Search users by name, email or department" />
        </div>
        <!-- ⚠ Appears only when something is selected, and sits where the selection is —
             directly above the rows it acts on. A permanently visible bar reading "0 selected"
             is a control that is disabled most of the time. -->
        <div class="pd-bulk" id="users-bulk" hidden>
          <span class="pd-bulk-n" id="users-bulk-n"></span>
          <button class="pd-btn pd-btn-sm" data-bulk="approve">Approve</button>
          <button class="pd-btn pd-btn-sm" data-bulk="reject">Reject</button>
          <select class="pd-select pd-input-sm" id="users-bulk-role" aria-label="Set role for the selected users">
            <option value="">Set role&hellip;</option>
          </select>
          <select class="pd-select pd-input-sm" id="users-bulk-dept" aria-label="Set department for the selected users">
            <option value="">Set department&hellip;</option>
          </select>
          <button class="pd-btn pd-btn-sm" data-bulk="clear">Clear</button>
        </div>
        <div class="pd-card pd-tablewrap" style="padding:0;">
          <table class="pd-table" id="users-table"></table>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260917zb"></script>
  <script src="assets/js/auth.js?v=20260917zf"></script>
  <script src="assets/js/db.js?v=20260917zf"></script>
  <script src="assets/js/ui.js?v=20260917zb"></script>
  <script src="assets/js/notebook.js?v=20260915d"></script>
  <script src="assets/js/icons.js?v=20260915f"></script>
  <script>
    var ME = null, ALL_PROJECTS = [];
    /* Which group headings are folded. Page-scope so a re-render after `setUser` keeps them. */
    var GRP_SHUT = {};
    /* ⚠ The fetched rows and the current query, both page-scope. Typing must NOT re-read the
       table — `getAllUsers` is a network round trip and this filters fourteen rows. `setUser`
       still reloads for real, because a saved role has to come back from the database rather than
       from whatever this cached a moment ago. */
    var USERS_CACHE = null, USER_Q = '';
    /* ⚠ The selection, by id. Page-scope so it survives the re-render that `setUser` triggers,
       and CLEARED whenever the query changes — acting on rows the search has hidden is the one
       behaviour a bulk control must never have. */
    var SEL = {};
    function selCount() { return Object.keys(SEL).filter(function (k) { return SEL[k]; }).length; }
    /* ⚠ Matches name, email AND department, which is what the placeholder says. Department is
       in there because the table is now grouped by it — typing "PMO" and getting nothing would
       be the obvious thing to try and the obvious thing to get wrong. */
    function filterUsers(list, q) {
      q = String(q || '').trim().toLowerCase();
      if (!q) return list;
      return list.filter(function (u) {
        return [u.name, u.email, u.department].some(function (v) {
          return String(v || '').toLowerCase().indexOf(q) !== -1;
        });
      });
    }
    // ⚠️ Modules RESTRICTED by role default — since 2026-09-17 that means
    // `planner` and above can open them and `user`/`viewer` cannot (config.js
    // `superAdminOnly`, whose name predates the change; `MODULE_ALL_ROLES` in
    // auth.js is the rule). Read off the live registry rather than hardcoded,
    // so this list can never drift from what ui.js/modules-grid.js actually
    // gate. A per-user override (below) can still put any of these in reach of
    // a `user`, or take an ordinary module away from anyone — this is only the
    // DEFAULT.
    var RESTRICTED_MODULES = (window.APP_CONFIG && APP_CONFIG.MODULES || []).filter(function (m) { return m.superAdminOnly; });
    // Every module a user could plausibly be granted or denied — retired
    // (`enabled:false`) modules are not offered here, since there is nothing
    // real to turn on for them.
    var ENABLED_MODULES = (window.APP_CONFIG && APP_CONFIG.MODULES || []).filter(function (m) { return m.enabled; });

    /* ==== ACTIVITY AND REGISTERED =============================================================
       Owner 2026-09-17: *"a feature tracking the activity and registered date in the users which
       is already available in the procurement dashboard … This information should only be
       available to admins and super_admins."*

       ⚠⚠ THE ACCESS REQUIREMENT IS ALREADY MET IN THE DATABASE, WHICH IS THE ONLY PLACE IT
       COUNTS. `users_self_read` is `auth.uid() = id or is_admin()`, and `is_admin()` is
       `role in ('admin','super_admin') and status = 'approved'` — so a planner cannot read
       ANOTHER user's row at all, `last_login` included. Read out of supabase-schema.sql, not
       assumed. This page adds no second gate of its own: `requireAdmin` already fronts it, and a
       UI check layered over an RLS rule invites the belief that the UI is what protects it.

       ⚠ NO MIGRATION. `users.last_login` and `users.created_at` have both existed since
       2026-08-11, and `listUsers` already does `select('*')`, so the figures were being fetched
       and thrown away. What was missing was a column, not a schema.

       ⚠ WORKING DAYS, NOT CALENDAR DAYS — matching the procurement dashboard, because a planner
       who last signed in on Friday is not "3 days idle" on Monday. Computed in closed form rather
       than by stepping day by day: whole weeks contribute five each and only the remainder is
       walked, so a stale account from 2024 costs the same as one from yesterday. */
    var ACTIVE_WORKING_DAYS = 7;
    function workingDaysSince(iso) {
      var then = new Date(iso);
      if (isNaN(+then)) return null;
      var a = new Date(then.getFullYear(), then.getMonth(), then.getDate());
      var n = new Date();
      var b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      var days = Math.round((b - a) / 86400000);
      if (days <= 0) return 0;
      var weeks = Math.floor(days / 7), out = weeks * 5;
      for (var i = weeks * 7 + 1; i <= days; i++) {
        var c = new Date(a); c.setDate(a.getDate() + i);
        var dow = c.getDay();
        if (dow !== 0 && dow !== 6) out++;
      }
      return out;
    }
    /* ⚠ THREE ABSENCES, THREE MESSAGES. `undefined` means the COLUMN is not on this database
       (an older deployment that never ran the 2026-08-11 migration); `null` means the column is
       there and this person has never signed in. Collapsing them into one dash would send an
       admin looking for a person when the answer is a migration. */
    function activityCell(u) {
      if (u.last_login === undefined)
        return '<span class="pd-nochip" title="users.last_login is not on this database — see ' +
               'migrations/2026-08-11-fix-privilege-escalation.sql">not tracked</span>';
      if (u.last_login === null)
        return '<span class="pd-pill pd-pill-muted">Never signed in</span>';
      var wd = workingDaysSince(u.last_login);
      if (wd === null) return '<span class="pd-nochip">—</span>';
      var pill = wd <= ACTIVE_WORKING_DAYS
        ? '<span class="pd-pill pd-pill-ok">Active</span>'
        : '<span class="pd-pill pd-pill-warn">Inactive</span>';
      var ago = wd === 0 ? 'today' : wd === 1 ? '1 working day ago' : wd + ' working days ago';
      /* ⚠ A DATE OBJECT, NOT THE ISO STRING. Fmt.date's string branch reads the yyyy-mm-dd
         PREFIX, which is UTC, while workingDaysSince parses to local time — so a sign-in at
         02:00 Manila would print the previous day's date beside a correctly-counted pill. The
         object branch formats the parsed instant, and both then read the same clock. */
      return pill + '<div class="pd-subline">' + Fmt.esc(Fmt.date(new Date(u.last_login))) +
             ' · ' + ago + '</div>';
    }
    function registeredCell(u) {
      return u.created_at
        ? Fmt.esc(Fmt.date(new Date(u.created_at)))
        : '<span class="pd-nochip">—</span>';
    }

    AppAuth.requireAdmin(function (user, profile) {
      ME = profile;
      UI.renderUserBar(profile);
      // requireAdmin already gated the page, so isAdmin is always true here.
      // ⚠️ `active: 'admin'` is the sidebar's INTERNAL key (assets/js/ui.js), not the
      // label — it stays 'admin' so the highlighted-row match against admin.html's own
      // nav link (still `cls('admin')`, now labelled "Users") keeps working.
      UI.renderNav(document.getElementById('side-nav'), 'portfolio', { active: 'admin', base: '', isAdmin: true });
      UI.renderSwitcher(document.getElementById('ctx-switcher'), { mode: 'portfolio', base: '' });
      loadUsers();
    });

    // -------- Users --------
    async function loadUsers(fromCache) {
      var users = (fromCache && USERS_CACHE) ? USERS_CACHE : (USERS_CACHE = await PDb.getAllUsers());
      // ⚠️ Kept here (not moved to projects.html) — the Assign Projects modal below is
      // still part of USER management (who can reach which project), even though
      // creating/editing/deleting the projects themselves is now projects.html's alone.
      if (!ALL_PROJECTS.length) ALL_PROJECTS = await PDb.getProjects();
      var t = document.getElementById('users-table');
      // ⚠️ DEPARTMENTS is duplicated from modules/issues-lessons/module.js rather than
      // shared: the contract forbids a module editing shared assets, so promoting it to
      // config.js is a change the module owner has to make. Keep the two lists in step —
      // a value here that the register does not offer becomes an unselectable default.
      var DEPARTMENTS = ['Commercial and Contracts', 'Engineering', 'Procurement', 'Finance',
                         'Human Resources', 'Quality', 'Health and Safety', 'Operations',
                         'PMO', 'COO', 'CEO'];
      // ⚠️⚠️ The Projects column used to print the raw `.projects` array for every
      // role, and that array is meaningless for admin/super_admin: `can_access_project()`
      // (and its client mirror `AppAuth.canAccessProject`) grant them EVERY project
      // regardless of what is checked here — verified against both, not assumed. So an
      // admin with an empty array read as "no project access", which is backwards; they
      // had all of it. What each role actually grants is stated here, and only
      // planner/user/viewer — the roles the array genuinely restricts — still show the
      // literal assignment.
      // ⚠️ Projects and Modules are now their OWN columns rather than one combined
      // "Access" cell — a project answers "which projects", a module answers "which
      // screens", and squeezing both into one cell is what made each button
      // read as belonging to neither. Each button sits INSIDE its own cell,
      // beside the thing it assigns. ⚠️ The Modules button/`moduleAccessModal`
      // (2026-09-15) supersede the note this comment used to carry here — module
      // visibility was a pure role default with nothing to override; it no longer
      // is, now that `users.module_access` can hold a per-user custom list.
      var restrictedNames = RESTRICTED_MODULES.map(function (m) { return m.name; }).join(', ');
      var rowOf = function (u, attr) {
          var canSuper = ME.role === 'super_admin';
          var isSuper = u.role === 'super_admin';
          // ⚠️⚠️ A plain admin can SEE a super_admin's row in full — RLS
          // already grants that (`users_self_read` is `auth.uid() = id or
          // is_admin()`, and `is_admin()` covers both admin and
          // super_admin) — but must not be able to CHANGE it. Owner:
          // "if I am an admin, I should not be able to change the access of
          // super_admin but I should be able to see who are super_admin."
          // `admin_delete_user()` already enforces "only a super_admin may
          // delete a super_admin" server-side; `locked` extends that same
          // rule to every other control on this row. Enforced again in the
          // DATABASE (migrations/2026-09-16-users-protect-super-admin.sql
          // tightens `users_admin_update`) — this is a courtesy so a
          // disabled control reads as locked rather than a write silently
          // doing nothing (or throwing) once it reaches RLS.
          var locked = isSuper && !canSuper;
          var lockAttr = locked ? ' disabled title="Only a super_admin can change a super_admin’s account"' : '';
          // ⚠️ Include `super_admin` as an option whenever the row's CURRENT
          // role already is one, even if this viewer could not have GRANTED
          // it — otherwise the <select> has no matching option, the browser
          // silently falls back to displaying the first one, and a
          // super_admin's own row would misreport its role to an admin
          // looking right at it. The row is `disabled` in that case anyway
          // (see `locked` above), so this only fixes what is shown, never
          // what can be picked.
          var roleOpts = AppAuth.ROLES
            .filter(function (r){ return r !== 'super_admin' || canSuper || isSuper; })
            .map(function (r){ return '<option value="'+r+'"'+(u.role===r?' selected':'')+'>'+r+'</option>'; }).join('');
          var isFullAccess = (u.role === 'admin' || u.role === 'super_admin');
          var okChip = 'style="background:var(--pd-ok-bg);color:var(--pd-ok-text);"';
          var projCell = isFullAccess
            ? '<span class="pd-chip" '+okChip+' title="Role-based — every project is reachable no matter what is checked in Assign projects.">All projects</span>'
            : ((u.projects||[]).map(function(p){ return '<span class="pd-chip">'+Fmt.esc(p)+'</span>'; }).join('') || '<span class="pd-nochip">No projects assigned</span>');
          // Assigning projects to a role that already sees every one of them is a
          // control that changes nothing — it re-appears the moment the role is
          // dropped to planner/user/viewer, where the assignment is real again.
          var projBtn = !isFullAccess ? '<button class="pd-btn pd-btn-sm" data-projects="'+u.id+'">Projects</button>' : '';
          // ⚠️⚠️ A per-user override (`module_access`, 2026-09-15) means this column can no
          // longer just report the ROLE's default — a custom list may say something
          // different, and showing the role text over a custom list would be a lie. Same
          // shape as the Projects column correction above: state what actually applies.
          var hasOverride = Array.isArray(u.module_access);
          var visibleCount = ENABLED_MODULES.filter(function (m) { return AppAuth.moduleVisible(m, u); }).length;
          var moduleCell;
          if (hasOverride) {
            moduleCell = '<span class="pd-chip" title="Custom module access, set from the Modules button — no longer follows the '+Fmt.esc(u.role)+' role default">'+
              visibleCount+' of '+ENABLED_MODULES.length+' modules (custom)</span>';
          } else if (RESTRICTED_MODULES.length) {
            /* ⚠⚠ ASKED, NOT ASSERTED. This read `isSuper ? all : hidden`, which was a second
               copy of the role rule and was wrong for every planner the moment 2026-09-17
               widened it — the table would have gone on reporting "6 modules hidden" for
               people who could by then open all six. Both branches now come from
               `AppAuth.moduleVisible`, the same function the sidebar and the launcher use, so
               this cell restates nothing and cannot drift again. */
            var hiddenMods = RESTRICTED_MODULES.filter(function (rm) { return !AppAuth.moduleVisible(rm, u); });
            moduleCell = !hiddenMods.length
              ? '<span class="pd-chip" '+okChip+' title="'+Fmt.esc(restrictedNames)+'">+ all modules</span>'
              : '<span class="pd-chip" title="'+Fmt.esc(hiddenMods.map(function (rm) { return rm.name; }).join(', '))+' — not visible to the '+Fmt.esc(u.role)+' role">'+hiddenMods.length+' module'+(hiddenMods.length===1?'':'s')+' hidden</span>';
          } else {
            moduleCell = '<span class="pd-nochip">—</span>';
          }
          // ⚠️⚠️ Approve/Reject/Delete collapse into one "Actions" menu with icon-only
          // controls (title= carries the label) rather than three loose buttons —
          // `data-approve`/`data-reject`/`data-del` are unchanged, so the wiring
          // below needs no change, only where the attribute is printed. A row with
          // none of the three applicable (impossible today — Approve or Reject
          // always applies) renders no trigger at all rather than a dead button.
          // ⚠️ `Modules` is deliberately NOT in this menu — it rides beside the
          // Modules column's own chip, the same place the Projects button rides
          // beside the Projects column's chip list, rather than joining a menu
          // meant for record-lifecycle actions (approve/reject/delete).
          var hasMenu = (u.status!=='approved') || (u.status!=='rejected') || (u.id!==ME.id);
          /* ⚠⚠ NO CHECKBOX ON A ROW THIS ADMIN CANNOT WRITE. `locked` is the same rule the
             per-row selects already use (a plain admin may see a super_admin but not change one),
             and the DATABASE enforces it in `users_admin_update`. Offering a checkbox that can
             only ever produce a refusal is worse than offering nothing.
             ⚠ And never your OWN row: a bulk Reject that included you would lock you out of the
             page you ran it from. The per-row Actions menu still lets you act on yourself
             deliberately. */
          var pickable = !locked && u.id !== ME.id;
          return '<tr' + (attr || '') + (SEL[u.id] ? ' class="pd-rowsel"' : '') + '>' +
            '<td class="pd-ckcol">' + (pickable
              ? '<input type="checkbox" data-pick="' + u.id + '"' + (SEL[u.id] ? ' checked' : '') +
                ' aria-label="Select ' + Fmt.esc(u.name || u.email) + '">'
              : '<span class="pd-ckoff" title="' + (u.id === ME.id ? 'This is you'
                  : 'Only a super_admin can change a super_admin\u2019s account') + '">\u2014</span>') +
            '</td>' +
            /* ⚠⚠ ONE CELL, NOT TWO. Owner 2026-09-17: *"squeeze the table … in a way that
               the table does not necessarily need to be scrollable."* Name and Email were two
               full columns holding THE SAME STRING for every account created from an email
               address with no display name — half this table. Stacking them recovers about
               250px, which is most of what the two new columns cost, and it is the shape the
               procurement dashboard's USER column already uses.
               ⚠ When there is no name, or it IS the email, the email is the primary line and
               there is no sub-line — printing it twice in one cell would be the same
               duplication in less space. */
            '<td>' + (function () {
              var nm = String(u.name || '').trim(), em = String(u.email || '').trim();
              if (!nm || nm.toLowerCase() === em.toLowerCase())
                return '<div class="pd-uname">' + Fmt.esc(em || '—') + '</div>';
              return '<div class="pd-uname">' + Fmt.esc(nm) + '</div>' +
                     '<div class="pd-subline">' + Fmt.esc(em) + '</div>';
            })() + '</td>' +
            '<td><select class="pd-select" style="min-width:112px;" data-role="'+u.id+'"'+lockAttr+'>'+roleOpts+'</select></td>' +
            // The department a person raises issues for (D1). Defaults their entries in
            // the Issues & Concerns register so it is not retyped — and mistyped — per
            // issue. ⚠️ Locked too, not just role/status/access — the DATABASE now
            // refuses ANY column write to a super_admin's row from a plain admin (see
            // `locked` above), and leaving this one control live would have it click,
            // toast "Saved", and change nothing: `users_admin_update`'s `using` clause
            // simply excludes the row, so the UPDATE affects 0 rows with no error to
            // catch. One disabled control is honest; a live one that silently no-ops is
            // the "PostgREST answers a filtered UPDATE with 200 and 0 rows" trap this
            // repo has already paid for once (`boq_tag_activities`).
            '<td><select class="pd-select" style="min-width:118px;" data-dept="'+u.id+'"'+lockAttr+'>' +
              '<option value="">—</option>' +
              DEPARTMENTS.map(function(d){ return '<option'+(u.department===d?' selected':'')+'>'+d+'</option>'; }).join('') +
            '</select></td>' +
            '<td><div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;">'+projCell+projBtn+'</div></td>' +
            '<td><div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;">'+moduleCell+
              '<button class="pd-btn pd-btn-sm" data-modules="'+u.id+'"'+lockAttr+'>Modules</button></div></td>' +
            '<td>' + activityCell(u) + '</td>' +
            '<td style="white-space:nowrap;">' + registeredCell(u) + '</td>' +
            '<td>' + (hasMenu
              ? '<button type="button" class="pd-btn pd-btn-sm pd-actions-trigger" data-actions-trigger="'+u.id+'">Actions '+(window.Icons?Icons.svg('chevronDown',13):'▾')+'</button>'
              : '<span class="pd-nochip">—</span>') +
            '</td>' +
          '</tr>';
      };

      /* ==== GROUPING — PENDING FIRST, THEN BY DEPARTMENT ======================================
         Owner 2026-09-17: *"Can we also group the users by department? Let's follow the existing
         grouping UI"* and *"Can we also segregate the users and the ones that are pending
         approval."* Both answered by one ordering, because they are the same question asked twice:
         what needs doing, and then who is who.

         ⚠ THE APP'S OWN GROUPED-TABLE IDIOM, not a new one: `tr.pd-grp` heading rows inside the
         SAME table, which `dashboard.css` already styles and already remaps for dark mode, and
         which `modules/minutes-of-meeting/module.js` uses for its minutes-by-meeting view. One
         table means the columns stay aligned across groups by construction rather than by tuning.
         ⚠ `.pd-grptog` and `.pd-collapsed` were already in the shared stylesheet with NO consumer
         — the same state `.pd-tablewrap` was in this morning. Reviving them beats inventing a
         fourth caret.

         ⚠⚠ PENDING IS FIRST AND IS NOT A DEPARTMENT. Someone awaiting approval has no
         department yet in the usual case, and filing them under "No department" would bury the one
         group on this page that needs an action. Rejected goes last for the mirror reason: it is
         an archive, not a queue.
         ⚠ "No department" sorts after the named ones rather than alphabetically, or an unset
         field would lead the list.
         ⚠ The collapsed set is page-scope, NOT rebuilt per render: every role or department
         change calls `setUser`, which reloads and re-renders, and a fold that sprang open on each
         save would be worse than no fold at all. */
      var GRP_COLS = 9;
      function userGroups(list) {
        var pend = [], rej = [], byDept = {}, NO_DEPT = 'No department';
        list.forEach(function (u) {
          if (u.status === 'pending') { pend.push(u); return; }
          if (u.status === 'rejected') { rej.push(u); return; }
          var d = String(u.department || '').trim() || NO_DEPT;
          (byDept[d] = byDept[d] || []).push(u);
        });
        var names = Object.keys(byDept).sort(function (a, b) {
          if ((a === NO_DEPT) !== (b === NO_DEPT)) return a === NO_DEPT ? 1 : -1;
          return a.localeCompare(b);
        });
        var out = [];
        if (pend.length) out.push({ key: 'pending', label: 'Pending approval', rows: pend, act: true });
        names.forEach(function (n) { out.push({ key: 'd:' + n, label: n, rows: byDept[n] }); });
        if (rej.length) out.push({ key: 'rejected', label: 'Rejected', rows: rej });
        return out;
      }
      function groupedBody(list) {
        return userGroups(list).map(function (g) {
          var shut = !!GRP_SHUT[g.key];
          var n = g.rows.length;
          var count = g.act
            ? '<span class="pd-pill pd-pill-warn">' + n + ' awaiting</span>'
            : '<span class="pd-grpn">' + n + (n === 1 ? ' person' : ' people') + '</span>';
          return '<tr class="pd-grp"><td colspan="' + GRP_COLS + '">' +
              '<button type="button" class="pd-grptog" data-grp="' + Fmt.esc(g.key) + '"' +
                ' aria-expanded="' + (shut ? 'false' : 'true') + '"' +
                ' title="' + (shut ? 'Show' : 'Hide') + ' these rows">' +
                (shut ? '\u25b8' : '\u25be') + '</button>' +
              Fmt.esc(g.label) + ' ' + count +
            '</td></tr>' +
            g.rows.map(function (u) {
              return rowOf(u, ' data-ingrp="' + Fmt.esc(g.key) + '"' + (shut ? ' class="pd-collapsed"' : ''));
            }).join('');
        }).join('');
      }

      /* ⚠ The EMPTY RESULT is its own message, quoting what was typed. A grouped table that
         simply renders no rows reads as a page that failed to load. */
      var shown = filterUsers(users, USER_Q);
      /* The rows a checkbox is offered on — the same `locked` rule the row uses, evaluated once
         here so the header's select-all and the row cells cannot disagree about it. */
      var meSuper = ME.role === 'super_admin';
      var selectable = shown.filter(function (u) {
        return !(u.role === 'super_admin' && !meSuper) && u.id !== ME.id;
      });
      /* ⚠⚠ THE STATUS COLUMN IS GONE, AND GROUPING IS WHY. Pending and Rejected are their
         own headings now, so every remaining row said "approved" — a column of one repeated word.
         Dropping it pays for the select column almost exactly, which is how a table that had just
         been made to fit stays fitting. The status is still on screen for the two cases where it
         varies: the heading above the row. */
      var allBox = selectable.length
        ? '<input type="checkbox" id="users-all" aria-label="Select all shown"' +
          (selectable.length && selectable.every(function (u) { return SEL[u.id]; }) ? ' checked' : '') + '>'
        : '';
      t.innerHTML = '<thead><tr><th class="pd-ckcol">' + allBox + '</th><th>User</th><th>Role</th><th>Department</th><th>Projects</th><th>Modules</th><th>Activity</th><th>Registered</th><th>Actions</th></tr></thead><tbody>' + (shown.length
        ? groupedBody(shown)
        : '<tr><td colspan="' + GRP_COLS + '" class="pd-nomatch">No user matches \u201c' +
          Fmt.esc(USER_Q) + '\u201d.</td></tr>') + '</tbody>';

      /* ⚠ ONE delegated listener, bound ONCE. `t` survives every render (only its innerHTML is
         replaced), so binding here without the guard would stack a fresh copy per reload — the
         exact accumulation the note on `closeActionMenus` below already records. */
      /* ==== BULK EDIT =========================================================================
         Owner 2026-09-17: *"add bulk edit so that its convenient to approve/edit/update multiple
         users."*
         ⚠⚠ IT WRITES ONE ROW AT A TIME AND REPORTS EACH FAILURE. `users_admin_update` can
         refuse an individual row (a plain admin may not touch a super_admin), so a bulk write is
         not one operation that succeeds or fails — it is N of them. Swallowing that into a single
         "Saved" is how an admin comes to believe they approved twelve people when they approved
         eleven. The toast names the count and the refusals.
         ⚠ Sequential, not Promise.all: twelve parallel UPDATEs on one table for no gain, and the
         first rejection would mask the rest.
         ⚠ NO BULK DELETE. Deletion is irreversible, frees the email for re-registration, and
         `admin_delete_user` is a per-row RPC with its own confirmation. A convenience control for
         "approve these ten" should not sit one button away from "delete these ten".
         ⚠ Every bulk action CONFIRMS first, naming the action and the count — this is the one
         control on the page that acts on people it is not pointing at. */
      function bulkTargets(list) {
        return list.filter(function (u) { return SEL[u.id]; });
      }
      async function bulkApply(patch, verb) {
        var targets = bulkTargets(users);
        if (!targets.length) return;
        var okd = 0, bad = [];
        for (var i = 0; i < targets.length; i++) {
          try { await PDb.updateUser(targets[i].id, patch); okd++; }
          catch (e) { bad.push((targets[i].name || targets[i].email) + ' (' + (e.message || e) + ')'); }
        }
        SEL = {};
        UI.toast(bad.length
          ? okd + ' updated \u00b7 ' + bad.length + ' refused: ' + bad.join('; ')
          : verb + ' ' + okd + ' user' + (okd === 1 ? '' : 's'), bad.length ? 'error' : 'ok');
        loadUsers();
      }
      function bulkConfirm(msg, run) {
        var m = UI.modal('<h2 style="margin-top:0;">' + Fmt.esc(msg) + '</h2>' +
          '<div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px;">' +
          '<button class="pd-btn" data-x>Cancel</button>' +
          '<button class="pd-btn pd-btn-primary" data-go>Continue</button></div>');
        /* ⚠ `m.el`, not `m`. UI.modal returns { el, close } — a bare `m.querySelector` parses
           cleanly and throws "not a function" on the first click, which is the one place nobody
           looks during a read-through. Every other modal on this page already writes `m.el`. */
        m.el.querySelector('[data-x]').onclick = function () { m.close(); };
        m.el.querySelector('[data-go]').onclick = function () { m.close(); run(); };
      }
      var bar = document.getElementById('users-bulk');
      var barN = document.getElementById('users-bulk-n');
      var bRole = document.getElementById('users-bulk-role');
      var bDept = document.getElementById('users-bulk-dept');
      function paintBar() {
        var n = selCount();
        if (bar) bar.hidden = !n;
        if (barN) barN.textContent = n + ' selected';
      }
      /* the two selects offer exactly what the per-row ones offer */
      if (bRole && bRole.options.length === 1)
        AppAuth.ROLES.filter(function (r) { return r !== 'super_admin' || ME.role === 'super_admin'; })
          .forEach(function (r) { bRole.add(new Option(r, r)); });
      if (bDept && bDept.options.length === 1) {
        bDept.add(new Option('\u2014 (clear)', '__none'));
        DEPARTMENTS.forEach(function (dn) { bDept.add(new Option(dn, dn)); });
      }
      if (bar && !bar._wired) {
        bar._wired = true;
        bar.addEventListener('click', function (e) {
          var b = e.target.closest && e.target.closest('[data-bulk]');
          if (!b) return;
          var n = selCount();
          if (b.dataset.bulk === 'clear') { SEL = {}; loadUsers(true); return; }
          if (!n) return;
          var act = b.dataset.bulk === 'approve' ? 'Approve' : 'Reject';
          bulkConfirm(act + ' ' + n + ' user' + (n === 1 ? '' : 's') + '?', function () {
            bulkApply({ status: b.dataset.bulk === 'approve' ? 'approved' : 'rejected' }, act + 'd');
          });
        });
        bRole.addEventListener('change', function () {
          var v = bRole.value, n = selCount(); bRole.value = '';
          if (!v || !n) return;
          bulkConfirm('Set ' + n + ' user' + (n === 1 ? '' : 's') + ' to ' + v + '?',
            function () { bulkApply({ role: v }, 'Updated'); });
        });
        bDept.addEventListener('change', function () {
          var v = bDept.value, n = selCount(); bDept.value = '';
          if (!v || !n) return;
          var label = v === '__none' ? 'no department' : v;
          bulkConfirm('Move ' + n + ' user' + (n === 1 ? '' : 's') + ' to ' + label + '?',
            function () { bulkApply({ department: v === '__none' ? null : v }, 'Updated'); });
        });
      }
      paintBar();

      /* ⚠ One delegated listener for the row checkboxes and the select-all, bound once for the
         same reason as everything else on this page. The select-all covers only the SELECTABLE
         rows currently SHOWN — it must not silently pick up someone the filter is hiding or a
         super_admin this admin cannot write. */
      if (!t._pickWired) {
        t._pickWired = true;
        t.addEventListener('change', function (e) {
          var el = e.target;
          if (el.id === 'users-all') {
            selectable.forEach(function (u) { if (el.checked) SEL[u.id] = true; else delete SEL[u.id]; });
            loadUsers(true); return;
          }
          if (el.dataset && el.dataset.pick) {
            if (el.checked) SEL[el.dataset.pick] = true; else delete SEL[el.dataset.pick];
            var tr = el.closest('tr'); if (tr) tr.classList.toggle('pd-rowsel', el.checked);
            var all = document.getElementById('users-all');
            if (all) all.checked = selectable.length > 0 && selectable.every(function (u) { return SEL[u.id]; });
            paintBar();
          }
        });
      }

      /* ⚠ Bound once, for the same reason as the group toggle below: the input survives every
         render, so an unguarded listener would stack a copy per reload. Re-renders from the CACHE
         — typing must not hit the network. */
      var q = document.getElementById('users-q');
      if (q && !q._wired) {
        q._wired = true;
        q.addEventListener('input', function () {
          USER_Q = q.value;
          SEL = {};            /* ⚠ see the note on SEL: never act on what the filter hid */
          loadUsers(true);
        });
      }
      if (q) q.value = USER_Q;   /* the value survives the re-render it triggers */

      if (!t._grpWired) {
        t._grpWired = true;
        t.addEventListener('click', function (e) {
          var b = e.target.closest && e.target.closest('.pd-grptog');
          if (!b || !t.contains(b)) return;
          var k = b.dataset.grp;
          GRP_SHUT[k] = !GRP_SHUT[k];
          var shut = !!GRP_SHUT[k];
          b.textContent = shut ? '\u25b8' : '\u25be';
          b.setAttribute('aria-expanded', shut ? 'false' : 'true');
          b.title = (shut ? 'Show' : 'Hide') + ' these rows';
          t.querySelectorAll('tr[data-ingrp="' + (window.CSS && CSS.escape ? CSS.escape(k) : k) + '"]')
            .forEach(function (tr) { tr.classList.toggle('pd-collapsed', shut); });
        });
      }

      t.querySelectorAll('[data-role]').forEach(function(s){ s.onchange = function(){ setUser(s.dataset.role, { role: s.value }); }; });
      t.querySelectorAll('[data-dept]').forEach(function(s){ s.onchange = function(){ setUser(s.dataset.dept, { department: s.value || null }); }; });
      t.querySelectorAll('[data-projects]').forEach(function(b){ b.onclick = function(){ assignProjects(users.find(function(x){return x.id===b.dataset.projects;})); }; });
      t.querySelectorAll('[data-modules]').forEach(function(b){ b.onclick = function(){ moduleAccessModal(users.find(function(x){return x.id===b.dataset.modules;})); }; });
      wireActionsMenus(t, users);
    }

    // Closes every open actions-menu popover. Page-scope and wired to
    // document ONCE (below, outside loadUsers) rather than re-bound on every
    // render — a listener re-added on each approve/reject/delete would stack
    // a fresh, never-removed copy per call and accumulate for the life of the
    // session, each one a no-op past its own render but still walking the DOM
    // on every click.
    function closeActionMenus() { document.querySelectorAll('.pd-actions-menu.open').forEach(function (m) { m.classList.remove('open'); }); }
    document.addEventListener('click', closeActionMenus);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeActionMenus(); });

    // ⚠️⚠️ The menus are appended to <body>, not nested in the table cell — see
    // the CSS comment on .pd-actions-menu for why. That means they OUTLIVE a
    // table rebuild unless removed by hand first: loadUsers() re-renders on
    // every approve/reject/delete/role/department change, and each call would
    // otherwise leave the previous render's menus behind, accumulating in the
    // DOM (and, since they're keyed by user id, silently reusing stale ids).
    function wireActionsMenus(t, users) {
      document.querySelectorAll('.pd-actions-menu').forEach(function (m) { m.remove(); });
      t.querySelectorAll('[data-actions-trigger]').forEach(function (trig) {
        var id = trig.dataset.actionsTrigger;
        var u = users.find(function (x) { return x.id === id; });
        if (!u) return;
        var items = [];
        if (u.status !== 'approved') items.push({ act:'approve', ico:'check',  label:'Approve', cls:'pd-am-approve' });
        if (u.status !== 'rejected') items.push({ act:'reject',  ico:'x',      label:'Reject',  cls:'pd-am-reject'  });
        if (u.id !== ME.id)          items.push({ act:'del',     ico:'trash',  label:'Delete',  cls:'pd-am-danger'  });
        if (!items.length) return;
        var menu = document.createElement('div');
        menu.className = 'pd-actions-menu';
        menu.innerHTML = items.map(function (it) {
          return '<button type="button" class="pd-am-btn '+it.cls+'" title="'+it.label+'" data-am-act="'+it.act+'">'+(window.Icons?Icons.svg(it.ico,16):it.label)+'</button>';
        }).join('');
        document.body.appendChild(menu);
        trig.onclick = function (e) {
          e.stopPropagation();
          var willOpen = !menu.classList.contains('open');
          closeActionMenus();
          if (willOpen) {
            var r = trig.getBoundingClientRect();
            menu.style.top = (r.bottom + 4) + 'px';
            menu.style.right = (window.innerWidth - r.right) + 'px';
            menu.style.left = 'auto';
            menu.classList.add('open');
          }
        };
        menu.querySelectorAll('[data-am-act]').forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            closeActionMenus();
            var act = b.dataset.amAct;
            if (act === 'approve') setUser(u.id, { status:'approved' });
            else if (act === 'reject') setUser(u.id, { status:'rejected' });
            else if (act === 'del') deleteUser(u);
          };
        });
      });
    }

    function deleteUser(u) {
      var m = UI.modal(
        '<h2 style="margin-top:0;">Delete user</h2>' +
        '<p>Permanently delete <strong>'+Fmt.esc(u.name||u.email)+'</strong> ('+Fmt.esc(u.email)+')?</p>' +
        '<p style="color:var(--pd-muted);font-size:13px;">This removes their account completely. Their email is freed, so they can <strong>Request Access again</strong> in the future. Records they created are kept (their authorship is cleared). This cannot be undone.</p>' +
        '<div style="margin-top:16px;text-align:right;"><button class="pd-btn" id="du-cancel">Cancel</button> ' +
        '<button class="pd-btn pd-btn-danger" id="du-confirm">Delete permanently</button></div>');
      m.el.querySelector('#du-cancel').onclick = m.close;
      m.el.querySelector('#du-confirm').onclick = async function () {
        var btn = m.el.querySelector('#du-confirm'); btn.disabled = true; btn.textContent = 'Deleting…';
        try { await PDb.deleteUser(u.id); UI.toast('User deleted','ok'); m.close(); loadUsers(); }
        catch (e) { UI.toast(e.message,'error'); btn.disabled = false; btn.textContent = 'Delete permanently'; }
      };
    }

    async function setUser(id, patch) {
      try { await PDb.updateUser(id, patch); UI.toast('Saved','ok'); loadUsers(); }
      catch (e) { UI.toast(e.message,'error'); }
    }

    function assignProjects(u) {
      var checks = ALL_PROJECTS.map(function(p){
        var on = (u.projects||[]).indexOf(p.id) !== -1;
        return '<label style="display:block;padding:5px 0;"><input type="checkbox" value="'+p.id+'"'+(on?' checked':'')+'> '+Fmt.esc(p.name)+' <span style="color:var(--pd-muted);">('+p.id+')</span></label>';
      }).join('') || '<p style="color:var(--pd-muted);">No projects yet — create one in the Projects module.</p>';
      var m = UI.modal(
        '<h2 style="margin-top:0;">Assign projects — '+Fmt.esc(u.name)+'</h2>' +
        '<div style="max-height:50vh;overflow:auto;">'+checks+'</div>' +
        '<div style="margin-top:16px;text-align:right;"><button class="pd-btn" id="ap-cancel">Cancel</button> ' +
        '<button class="pd-btn pd-btn-primary" id="ap-save">Save</button></div>');
      m.el.querySelector('#ap-cancel').onclick = m.close;
      m.el.querySelector('#ap-save').onclick = async function () {
        var ids = Array.prototype.slice.call(m.el.querySelectorAll('input:checked')).map(function(c){return c.value;});
        try { await PDb.updateUser(u.id, { projects: ids }); UI.toast('Projects updated','ok'); m.close(); loadUsers(); }
        catch (e) { UI.toast(e.message,'error'); }
      };
    }

    // -------- Module access (2026-09-15) --------
    // Owner: "provide options to change module access for users with button to reset to
    // default." One checklist over every ENABLED module (retired ones have nothing to
    // grant), pre-ticked from whatever applies to this user RIGHT NOW — the role default
    // via AppAuth.moduleVisible if they have no override yet, or their existing custom
    // list if they do — so opening the dialog never looks like it is proposing a change
    // that has not happened.
    function moduleAccessModal(u) {
      var hasOverride = Array.isArray(u.module_access);
      var rows = ENABLED_MODULES.map(function (m) {
        var on = AppAuth.moduleVisible(m, u);
        return '<label style="display:flex;align-items:center;gap:8px;padding:5px 0;">' +
          '<input type="checkbox" value="'+Fmt.esc(m.key)+'"'+(on?' checked':'')+'> ' +
          Fmt.esc(m.name) +
          // ⚠ Names the actual default rather than the flag's stale name — a planner
          //   reading "(super_admin by default)" beside a TICKED box would reasonably
          //   conclude the tick was a per-user grant, and untick it.
          (m.superAdminOnly ? ' <span style="color:var(--pd-muted);font-size:11px;">(planner and above by default)</span>' : '') +
          '</label>';
      }).join('');
      var m = UI.modal(
        '<h2 style="margin-top:0;">Module access — '+Fmt.esc(u.name)+'</h2>' +
        '<p style="color:var(--pd-muted);font-size:13px;margin-top:-6px;">' +
          (hasOverride
            ? 'This user has a <b>custom</b> module list, overriding the <b>'+Fmt.esc(u.role)+'</b> role default.'
            : 'Ticked as the <b>'+Fmt.esc(u.role)+'</b> role currently sees it. Changing anything below and saving ' +
              'records it as this user&rsquo;s own list, independent of their role from then on.') +
        '</p>' +
        '<div style="max-height:50vh;overflow:auto;">'+rows+'</div>' +
        '<div style="margin-top:16px;display:flex;align-items:center;gap:8px;">' +
          '<button class="pd-btn" id="ma-reset"'+(hasOverride?'':' disabled')+
            ' title="Clear the custom list — this user goes back to seeing whatever their role grants">Reset to default</button>' +
          '<div style="flex:1;"></div>' +
          '<button class="pd-btn" id="ma-cancel">Cancel</button> ' +
          '<button class="pd-btn pd-btn-primary" id="ma-save">Save</button>' +
        '</div>');
      m.el.querySelector('#ma-cancel').onclick = m.close;
      // ⚠️ Writes `module_access: null`, NOT `[]` — null is what AppAuth.moduleVisible
      // reads as "no override, fall back to the role default"; an empty array is itself
      // a (valid, if unusual) override meaning "no modules at all."
      m.el.querySelector('#ma-reset').onclick = async function () {
        try { await PDb.updateUser(u.id, { module_access: null }); UI.toast('Reset to role default','ok'); m.close(); loadUsers(); }
        catch (e) { UI.toast(e.message,'error'); }
      };
      m.el.querySelector('#ma-save').onclick = async function () {
        var keys = Array.prototype.slice.call(m.el.querySelectorAll('input:checked')).map(function(c){return c.value;});
        try { await PDb.updateUser(u.id, { module_access: keys }); UI.toast('Module access saved','ok'); m.close(); loadUsers(); }
        catch (e) { UI.toast(e.message,'error'); }
      };
    }
  </script>
</body>
</html>
