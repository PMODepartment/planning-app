  <script>
  (function () {
    var pid = sessionStorage.getItem('pd_project');
    // No project chosen yet → go pick one first (Primavera-style entry).
    if (!pid) { location.replace('projects.html'); return; }

    var PROJ = [], GH = [], ghById = {}, curProj = null, canWrite = false, isAdmin = false;
    var CURUSER = null;   // the signed-in auth user; My Work needs the id, not the profile

    AppAuth.requireLogin(function (user, profile) {
      CURUSER = user;
      UI.renderUserBar(profile);
      var first = (profile.name || profile.email || '').split(' ')[0];
      canWrite = ['super_admin', 'admin', 'planner'].indexOf(profile.role) !== -1;
      isAdmin = ['admin', 'super_admin'].indexOf(profile.role) !== -1;
      // Draw the shell immediately from what's already known (sessionStorage) —
      // the network round-trip below only refines the label/group-head text.
      var pnameNow = sessionStorage.getItem('pd_project_name') || pid;
      UI.renderNav(document.getElementById('side-nav'), 'project', {
        active: 'dashboard', base: '', isAdmin: isAdmin, pname: pnameNow, modules: APP_CONFIG.MODULES,
      });
      // Fast paint from sessionStorage alone (a single option) — refreshed with the
      // real full list the moment boot()'s fetch resolves, in renderHeader() below.
      renderProjPicker([{ id: pid, name: pnameNow }]);
      boot();
    });

    // Project selector — same searchable, Group-Head-grouped picker every module's
    // topbar uses (UI.enhanceProjectSelect). `list` is either the sessionStorage-only
    // fast-paint fallback (one option) or the real project list once PROJ has loaded.
    function renderProjPicker(list) {
      var sel = document.getElementById('dh-project');
      if (!sel) return;
      sel.innerHTML = (list || []).map(function (p) {
        return '<option value="' + Fmt.esc(p.id) + '"' + (p.id === pid ? ' selected' : '') + '>' +
          Fmt.esc(p.name || p.id) + '</option>';
      }).join('');
      UI.enhanceProjectSelect(sel);
      sel.onchange = function () {
        var id = this.value;
        var p = (PROJ || []).filter(function (x) { return x.id === id; })[0];
        sessionStorage.setItem('pd_project', id);
        sessionStorage.setItem('pd_project_name', (p && p.name) || id);
        sessionStorage.setItem('pd_group_head', (p && p.group_head_id) || '');
        // ⚠️ A package belongs to the OLD project — carrying it across would
        // scope the shell to a package this project does not contain.
        sessionStorage.removeItem('pd_package');
        sessionStorage.removeItem('pd_package_name');
        location.reload();
      };
    }

    async function boot() {
      try {
        var res = await Promise.all([PDb.getProjects(), PDb.getGroupHeads()]);
        PROJ = res[0]; GH = res[1];
      } catch (e) { /* still show cached header */ }
      GH.forEach(function (g) { ghById[g.id] = g; });
      curProj = PROJ.find(function (p) { return p.id === pid; }) ||
        { id: pid, name: sessionStorage.getItem('pd_project_name') || pid };
      renderHeader();
      loadStatus();
      // Independent of one another: a packages failure must not blank the tiles.
      renderTiles();
      // ⚠️ Not awaited, and its own failure is contained inside renderBlock —
      // a personal panel must never be able to stop the project dashboard from
      // rendering. Base is '' because dashboard.html sits at the app root.
      initMyDrawer();
    }

    // The project's own tag — there is no workspace ancestry to walk any more.
    // Falls back to the raw id so a group head that failed to load still reads
    // as something, rather than silently blanking the caption.
    function groupHead(p) {
      if (!p || !p.group_head_id) return null;
      var g = ghById[p.group_head_id];
      return g ? g.name : p.group_head_id;
    }
    function renderHeader() {
      // ⚠️ Location is shown ONLY when the project record carries one. A placeholder dash in a
      // title bar reads as "this project has no location", which is a claim about the project;
      // omitting the segment says nothing, which is the truth when the field is simply unset.
      var loc = (curProj.location || '').trim();
      document.getElementById('proj-title').textContent = curProj.name || curProj.id;
      document.getElementById('dash-sub').textContent =
        '(' + curProj.id + ')' + (loc ? '  ·  ' + loc : '');
      document.getElementById('dash-sub').title = loc || '';
      // Re-render the picker + nav now that the authoritative project list/name are
      // in — cheap, and the first pass above already made the shell usable. This is
      // what gives the picker's popover the FULL project list (it only offers
      // projects that are actually present as <option>s on the underlying select).
      renderProjPicker(PROJ);
      UI.renderNav(document.getElementById('side-nav'), 'project', {
        active: 'dashboard', base: '', isAdmin: isAdmin, pname: curProj.name || curProj.id, modules: APP_CONFIG.MODULES,
      });
    }

    // ---- Module tiles (A5) ----
    // Each enabled module gets a tile. Figures come from the module's own `dash`
    // spec in config.js — the shell does not know any module's tables.
    // ---- Project status band -----------------------------------------------------------------
    // Every figure below comes from a module's own declared dash.metrics. Nothing here knows a
    // module's table or column names; if a module declares no metrics it simply contributes nothing.
    var MET = {};   // module key -> metrics object

    function _n(v) { return (v == null || v === '' || !isFinite(+v)) ? null : +v; }
    function _days(a, b) {
      var x = a && new Date(a + 'T00:00:00Z'), y = b && new Date(b + 'T00:00:00Z');
      if (!x || !y || isNaN(+x) || isNaN(+y)) return null;
      return Math.round((y - x) / 86400000);
    }
    // ---- Performance row -----------------------------------------------------------------------
    // Four cards: Planned POC, Actual POC, SPI, CPI. (The S-Curve started here as a fifth, small
    // card on 2026-09-01 and was promoted to its own panel the same day — a curve is a shape, and
    // a shape does not fit in a stat tile.)
    // ⚠️ EVERY CARD NAMES ITS BASIS, because these four are NOT all measured the same way and a row
    //    of bare numbers invites a reader to combine them:
    //      · Planned POC / Actual POC are both DURATION-weighted, so they are directly comparable
    //        and their difference is meaningful. That is why `pvDur` exists in config.js — the
    //        pre-existing `pv` is COST-weighted, and pairing it with `poc` would have put two
    //        different bases side by side under labels that look like a matched pair.
    //      · SPI and CPI stay COST ratios (EV/PV, EV/AC), because that is what EVM defines them as.
    // ⚠️ A card with no inputs says what is missing and stays grey. None fall back to a
    //    neutral-looking 1.00 or 0% — a needle resting at "fine" because nothing is loaded is the
    //    most misleading thing this row could do.
    function perfCard(o) {
      var none = !o.value;
      return '<div class="pd-perf' + (none ? ' pd-perf-none' : '') + '" style="--pc:' + (o.color || 'var(--pd-muted)') + '">' +
        '<span class="pd-perf-l">' + Fmt.esc(o.label) + '</span>' +
        (o.value
          ? '<strong class="pd-perf-v">' + o.value + '</strong>'
          : '<strong class="pd-perf-v pd-perf-em">' + Fmt.esc(o.empty || 'No data') + '</strong>') +
        (o.bar != null ? '<div class="pd-perf-bar"><i style="width:' + Math.max(0, Math.min(100, o.bar)) + '%"></i></div>' : '') +
        (o.note ? '<small class="pd-perf-note">' + o.note + '</small>' : '') +
        (o.basis ? '<small class="pd-perf-b">' + o.basis + '</small>' : '') + '</div>';
    }

    function renderPerf() {
      var host = document.getElementById('perf-grid'); if (!host) return;
      var sch = MET['project-schedule'] || {};
      var acts = sch.__rows || 0;
      var poc = _n(sch.poc), planned = _n(sch.pvDur);
      var ev = _n(sch.ev), ac = _n(sch.actual), bac = _n(sch.budget), pvPct = _n(sch.pv);
      var pv = (bac != null && pvPct != null) ? (bac * pvPct / 100) : null;
      var spi = (ev != null && pv) ? (ev / pv) : null;
      var cpi = (ev != null && ac) ? (ev / ac) : null;
      var blN = _n(sch.baselined) || 0;
      function r2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
      function tone(ok) { return ok ? 'pd-perf-good' : 'pd-stat-warn'; }

      var c1 = planned == null
        ? perfCard({ label: 'Planned POC', empty: blN ? 'No baseline dates' : 'Not baselined',
            basis: 'Needs <b>bl_start</b> and <b>bl_finish</b> on the activities. Capture a baseline in <b>Project Schedule</b>.' })
        : perfCard({ label: 'Planned POC', value: Math.round(planned) + '%', color: '#8A93A6', bar: planned,
            note: 'Baseline, ' + blN + ' activit' + (blN === 1 ? 'y' : 'ies') });

      var c2;
      if (poc == null) {
        c2 = perfCard({ label: 'Actual POC', empty: acts ? 'Not started' : 'No activities',
          basis: acts ? 'No progress recorded against any activity yet.' : 'Nothing to report on.' });
      } else {
        var gap = planned == null ? null : (poc - planned);
        // ⚠ The comparison IS the useful half and stays; the sentence explaining the
        //   weighting moved to the row-level basis line below, where it is said once.
        c2 = perfCard({ label: 'Actual POC', value: Math.round(poc) + '%', color: '#2FA36B', bar: poc,
          note: (gap == null
            ? '<span class="pd-stat-warn">No baseline to compare</span>'
            : '<span class="' + tone(gap >= 0) + '">' + (gap >= 0 ? '+' : '') + Math.round(gap) +
              ' pts vs planned</span>') });
      }

      var c3 = spi == null
        ? perfCard({ label: 'SPI', empty: 'No planned value',
            basis: 'SPI is EV &divide; PV. Needs a <b>baseline</b> and <b>planned cost</b> to measure against.' })
        : perfCard({ label: 'SPI', value: r2(spi), color: spi >= 1 ? '#2FA36B' : '#E5534B',
            note: '<span class="' + tone(spi >= 1) + '">' + (spi >= 1 ? 'On or ahead of plan' : 'Behind schedule') + '</span>' });

      var c4 = cpi == null
        ? perfCard({ label: 'CPI', empty: 'No actual cost',
            basis: 'CPI is EV &divide; AC. Needs recorded <b>actual cost</b> on the schedule.' })
        : perfCard({ label: 'CPI', value: r2(cpi), color: cpi >= 1 ? '#2FA36B' : '#E5534B',
            note: '<span class="' + tone(cpi >= 1) + '">' + (cpi >= 1 ? 'Under budget' : 'Over budget') + '</span>' });

      // ⚠⚠ THE BASIS IS STILL STATED — ONCE, FOR THE ROW, instead of four times in four
      //    paragraphs. The owner's complaint was the volume of explanatory text ("every KPI
      //    card should be very intuitive"), NOT the honesty: the comment above this function
      //    is load-bearing and still holds, because POC and SPI/CPI are genuinely not
      //    measured the same way and a row of bare numbers invites combining them. Saying it
      //    once, contrasting the two bases in a single sentence, is clearer than four cards
      //    each explaining themselves in isolation — and it is four lines of prose, not
      //    sixteen. ⚠ EMPTY cards keep their own text: that one is not an explanation, it
      //    names the missing input and where to capture it, which is actionable.
      /* ⚠⚠ THE BASIS PARAGRAPH IS GONE, AND REMOVING IT WIDENED THE CARDS BY 233px EACH.
         Owner asked for two things -- *"The 4 KPI cards should fit properly right now everything
         looks squeezed"* and *"remove the ... tooltip since this is understood common sense"* --
         and they were THE SAME BUG. The paragraph carried `grid-column:1/-1`, which OCCUPIES every
         track of `repeat(auto-fit, minmax(196px,1fr))`, so `auto-fit` could never collapse the
         empty ones. MEASURED at 1900px: WITH the line, 8 live tracks and cards at 221px with
         captions wrapping to 3 lines; WITHOUT it, 4 tracks at 454px and 4 collapsed to 0, captions
         down to 1-2. A full-width child in an auto-fit grid silently defeats the auto-fit.
         ⚠ The prose was defensible when written -- a number with no stated basis gets trusted
         further than it deserves -- but the owner is right that EV/PV and duration-weighting are
         common ground for a planner. The EMPTY cards keep their own text, which names a missing
         input and where to capture it rather than explaining a concept; that is the half worth
         keeping. */
      host.innerHTML = c1 + c2 + c3 + c4;
    }

    // ---- shared bits -------------------------------------------------------------------------
    function vizHead(t, sub, legend) {
      return '<div class="pd-viz-h"><div><div class="pd-viz-t">' + Fmt.esc(t) + '</div>' +
        (sub ? '<div class="pd-viz-s">' + sub + '</div>' : '') + '</div>' +
        (legend ? '<div class="pd-viz-legend">' + legend + '</div>' : '') + '</div>';
    }
    function vizEmpty(host, title, why) {
      var el = document.getElementById(host); if (!el) return;
      el.innerHTML = vizHead(title) + '<div class="pd-viz-empty">' + why + '</div>';
    }
    var C_OK = '#2FA36B', C_LATE = '#E5534B', C_WARN = '#E08A3C', C_BLUE = '#4F8EF7', C_GOLD = '#C9A227', C_VIO = '#7A6FF0';

    // ---- 1. Programme view -------------------------------------------------------------------
    // One bar per trade, positioned on the project's own timeline. Colour is STATE, not decoration:
    // complete / behind the plan / on track.
    // How many days from today, negative = overdue. Null when the row carries no date.
    function _dueIn(d) {
      if (!d) return null;
      var t = new Date(); t.setHours(0, 0, 0, 0);
      var m = String(d).match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return null;
      return Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - t) / 86400000);
    }
    // ⚠️ "Overdue" is stated as a fact, never softened into "due 3 days ago". A planner scanning
    //    this list is looking for the word.
    function _dueChip(d) {
      var n = _dueIn(d);
      if (n == null) return '<span class="pd-tag">No date</span>';
      if (n < 0) return '<span class="pd-tag pd-tag-bad">' + Math.abs(n) + 'd overdue</span>';
      if (n === 0) return '<span class="pd-tag pd-tag-warn">Due today</span>';
      if (n <= 7) return '<span class="pd-tag pd-tag-warn">in ' + n + 'd</span>';
      return '<span class="pd-tag">in ' + n + 'd</span>';
    }

    // ---- Approaching deadlines ------------------------------------------------------------------
    function renderDue() {
      var sch = MET['project-schedule'] || {};
      var list = (sch.lists && sch.lists.dueSoon) || [];
      var total = (sch.lists && sch.lists.dueSoon__total) || 0;
      var mod = (APP_CONFIG.MODULES || []).find(function (x) { return x.key === 'project-schedule'; });
      var link = mod ? '<a class="pd-viz-s" href="' + ModulesGrid.href(mod) + '">Open schedule</a>' : '';
      if (!sch.__rows) {
        return vizEmpty('viz-due', 'Approaching Deadlines',
          'No schedule on this project yet, so nothing can be due.');
      }
      if (!list.length) {
        return vizEmpty('viz-due', 'Approaching Deadlines',
          'Nothing unfinished falls due in the next 30 days, and nothing is overdue from the last 30. ' +
          '⚠️ Activities with <b>no finish date</b> are not counted here — they cannot be late if nobody said when they were due.');
      }
      // ⚠️ The overdue figure is the DECLARED `overdue` list's total, not a count of the rows on
      //    screen. Counting the visible slice would have said "1 already overdue" over a schedule
      //    with nine — the eight-row cap is a display limit, and a headline number must not inherit
      //    it. The two lists share their where-clauses; only the date window differs.
      var overdue = (sch.lists && sch.lists.overdue__total) || 0;
      var body = list.map(function (r) {
        var isMs = String(r.activity_type || '').toLowerCase().indexOf('milestone') !== -1;
        var pc = Math.max(0, Math.min(100, Math.round(r.percent_complete || 0)));
        var n = _dueIn(r.end_date);
        return '<li class="pd-list-r pd-due-r' + (n != null && n < 0 ? ' late' : '') + '">' +
          '<span class="pd-list-t" title="' + Fmt.esc(r.activity_name || '') + '">' +
            (isMs ? '<b class="pd-ms">◆</b> ' : '') + Fmt.esc(r.activity_name || r.activity_id || 'Untitled') +
            '<small>' + Fmt.esc(r.activity_id || '') + (r.work_type ? ' &middot; ' + Fmt.esc(r.work_type) : '') + '</small>' +
          '</span>' +
          '<span class="pd-due-p">' + pc + '%</span>' +
          '<span class="pd-list-d">' + Fmt.esc(Fmt.date(r.end_date)) + '</span>' +
          _dueChip(r.end_date) + '</li>';
      }).join('');
      document.getElementById('viz-due').innerHTML =
        vizHead('Approaching Deadlines',
          // ⚠️ The window is stated in full. "Due within 30 days" would be a half-truth: the list
          //    deliberately reaches 30 days into the PAST, because an activity that was due last
          //    week and is still unfinished is the most urgent thing on it.
          total + ' unfinished activit' + (total === 1 ? 'y' : 'ies') + ' due in the next 30 days or the last 30' +
          (overdue ? ' &middot; <span class="pd-stat-warn">' + overdue + ' already overdue</span>' : ''),
          link) +
        '<ul class="pd-list pd-list-top">' + body + '</ul>' +
        (total > list.length
          ? '<div class="pd-viz-s pd-mini-note">Showing the ' + list.length + ' soonest of ' + total + '.</div>'
          : '');
    }

    // ---- S-Curve panel -------------------------------------------------------------------------
    // Baseline (planned), actual and forecast, from PDScurve — the SAME engine the S-Curve module
    // runs, so the two screens cannot disagree about one project's curve.
    // ⚠️ The chart and the period table share ONE horizontal scroller and one column width, so a
    //    column in the table is always under the point it describes. Two scrollers would drift the
    //    moment either one was touched, and a table that disagrees with the chart above it is worse
    //    than no table.
    // ⚠️ A MINIMUM, not a fixed width. 46px is what "100.00" needs at 10px tabular figures, and a
    //    narrower column clips a figure into a different number. But a QUARTERLY axis is a third of
    //    the columns, and at a fixed width a two-year programme drew a chart that stopped two-thirds
    //    of the way across the panel with its gridlines ending in mid-air — which reads as a chart
    //    that has been cut off, not as one that fits. When the whole axis fits, the columns share
    //    the room out instead.
    var SC_COL = 46;      // px per period, MINIMUM — the scroll unit for both the chart and the table
    var SC_H = 150;       // px, plot height
    // ⚠️ The table carries a row-label column the chart does not. The SVG is therefore INDENTED by
    //    exactly that width, so month i sits at the same x in both. Every mouse-x, tooltip and
    //    scroll figure below goes through it — it is not a style, it is part of the alignment.
    var SC_KEY = 78;      // px, the 'Planned / Actual / Forecast' label column (swatch + word)

    // ⚠️ THE PERIOD IS A VIEW OVER THE ENGINE'S MONTHLY SERIES, NOT A SECOND COMPUTATION.
    //    PDScurve walks months; quarterly re-groups what it returned. Recomputing the curve on a
    //    quarterly axis would be a second engine, and the two would eventually disagree.
    // ⚠️ A quarter's value is the value at the quarter's END, never a sum of its months. These are
    //    CUMULATIVE series — adding three cumulative points gives a number roughly three times the
    //    truth, and on a chart that reaches 100% it would look like nothing worse than optimism.
    // ⚠️ The first and last groups are routinely PARTIAL (a project starting in February gives a
    //    two-month Q1). That is correct for a cumulative read — the end of the group is still the
    //    end of the group — but the header would say "Q1" over two months of data, so the tooltip
    //    names the real month span rather than letting the label speak for it.
    function scPeriods(c, mode) {
      var out = [];
      if (mode !== 'q') {
        c.months.forEach(function (m, k) {
          out.push({ first: k, last: k, year: m.getFullYear(),
                     label: m.toLocaleDateString('en-US', { month: 'short' }), newYear: m.getMonth() === 0 });
        });
        return out;
      }
      var i = 0;
      while (i < c.months.length) {
        var m = c.months[i], q = Math.floor(m.getMonth() / 3), y = m.getFullYear(), first = i;
        while (i < c.months.length &&
               c.months[i].getFullYear() === y && Math.floor(c.months[i].getMonth() / 3) === q) i++;
        out.push({ first: first, last: i - 1, year: y, label: 'Q' + (q + 1), newYear: q === 0 });
      }
      return out;
    }

    // The three display series, one point per period, plus which period holds the data date.
    // ⚠️ THE CURRENT PERIOD IS READ AT TODAY, every other one at its end — the same rule the
    //    monthly view has always used, generalised. Reading the current quarter's ACTUAL at the
    //    quarter end would report a figure from `actualC`'s post-data-date padding, i.e. zero, and
    //    a project would appear to have un-built itself the moment you switched to quarterly.
    function scSeries(c, P) {
      var TOT = c.TOT;
      function at(arr, idx) {
        var v = arr[idx];
        return v == null ? null : { y: TOT ? Math.max(0, Math.min(100, v / TOT * 100)) : 0 };
      }
      var ti = 0;
      P.forEach(function (p, k) { if (c.ti >= p.first && c.ti <= p.last) ti = k; });
      return {
        ti: ti,
        pl: P.map(function (p) { return at(c.plannedC, p.last); }),
        // null once the period starts after the data date: an actual for the future is not a low
        // number, it is not a number.
        ac: P.map(function (p) { return p.first > c.ti ? null : at(c.actualC, Math.min(p.last, c.ti)); }),
        // null before the data date — a forecast of the past is a claim about history, and history
        // is what `actual` is for.
        fc: P.map(function (p) {
          if (p.last < c.ti) return null;
          return at(c.forecastC, p.first <= c.ti ? c.ti : p.last);
        })
      };
    }

    // ⚠️ The column width is a per-render figure, so it is PASSED rather than read from the
    //    constant. Every x in the panel — path, gridline, now-line, table column, hover — has to
    //    come from the same number, and a helper quietly using the constant while the table uses
    //    the computed one is exactly the chart-vs-table drift this panel has already been bitten by.
    // ⚠️ The cap's only job is the DEGENERATE axis — a one- or two-period programme, where sharing
    //    the whole panel out gives a single 700px column and a "curve" that is one dot. It is not
    //    there to stop the chart filling the width: this is a line chart, and a six-quarter
    //    programme spread across the panel is exactly what the quarterly view is for. Set low
    //    (104px) it left a fifth of the plot empty and the gridlines still ended in mid-air.
    var SC_COL_MAX = 160;
    function scColFor(host, n) {
      var avail = (host && host.clientWidth ? host.clientWidth : 0) - 34 - SC_KEY;  // 34 = panel padding
      if (!(avail > 0) || !n) return SC_COL;
      return Math.max(SC_COL, Math.min(SC_COL_MAX, Math.floor(avail / n)));
    }
    function scPath(pts, COL) {
      var d = '', open = false;
      pts.forEach(function (p, i) {
        if (!p) { open = false; return; }
        var x = i * COL + COL / 2, y = SC_H - (p.y / 100) * SC_H;
        d += (open ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
        open = true;
      });
      return d.trim();
    }

    // ⚠️ TWO DECIMALS, and the '%' lives in the ROW LABEL rather than in every cell (owner,
    //    2026-09-01: *"at least 2 decimal points in the table"*). Repeating the sign 78 times is
    //    noise, and at 10px it is the difference between "100.00" fitting a column and being
    //    clipped to a different number. The tooltip keeps its '%' — there it is prose, not a grid.
    function scPct(p) { return p == null ? '—' : p.y.toFixed(2); }
    // The same figure with its sign, for prose. ⚠️ No '%' on the em dash — the dash means "there is
    // no number here", and "—%" reads as a number that failed to print rather than an absence.
    function scPctU(p) { return p == null ? '—' : p.y.toFixed(2) + '%'; }

    // The chosen period. ⚠️ THE STATE LIVES IN A VARIABLE; localStorage only SEEDS it and is a
    //    best-effort place to remember it. Reading the mode straight out of storage on every render
    //    looks tidier and makes the control DEAD wherever storage is unavailable — a private window,
    //    or a browser set to block site data — because the write throws, the read throws, and the
    //    repaint comes back with the mode it started on. Clicking "Quarterly" would do nothing at
    //    all, with no error and nothing to see. Found in the harness, which runs from a `data:` URL
    //    where localStorage throws outright.
    var SC_PERIOD_KEY = 'pd_dash_sc_period';
    var scMode = (function () {
      try { return localStorage.getItem(SC_PERIOD_KEY) === 'q' ? 'q' : 'm'; } catch (e) { return 'm'; }
    })();
    function scPeriodMode() { return scMode === 'q' ? 'q' : 'm'; }
    function scSetPeriodMode(v) {
      scMode = v === 'q' ? 'q' : 'm';
      try { localStorage.setItem(SC_PERIOD_KEY, scMode); } catch (e) { /* the view still switches */ }
    }

    function renderScurve() {
      var host = document.getElementById('viz-scurve'); if (!host) return;
      var sch = MET['project-schedule'] || {};
      var c = sch.curve;
      var mod = (APP_CONFIG.MODULES || []).find(function (x) { return x.key === 's-curve'; });
      var link = mod ? '<a class="pd-viz-s" href="' + ModulesGrid.href(mod) + '">Open S-Curve</a>' : '';

      if (!c || c.empty) {
        // ⚠️ Three DIFFERENT empty states, because they send a planner to three different places.
        var why = c && c.noCost
          ? 'The schedule is fine — the <b>cost loading</b> has not been done, so there is no money curve to draw. ' +
            'Load it in <b>Project Schedule → Cost Loading</b>, or read the duration curve in <b>S-Curve</b>.'
          : c && c.noEngine
            ? 'The curve engine did not load on this page.'
            : 'No dated activities yet, so there is nothing to plot. Push a programme from <b>Schedule Setup</b>, ' +
              'or set start and finish dates on the activities.';
        return vizEmpty('viz-scurve', 'S-Curve', why);
      }

      var mode = scPeriodMode();
      var P = scPeriods(c, mode), n = P.length;
      var S = scSeries(c, P), pl = S.pl, ac = S.ac, fc = S.fc, ti = S.ti;
      var COL = scColFor(host, n);
      var W = n * COL;
      var unit = mode === 'q' ? 'quarter' : 'month';

      // Gridlines at 0/25/50/75/100% and a year rule at the first period of each year.
      var grid = '';
      [0, 25, 50, 75, 100].forEach(function (g) {
        var y = SC_H - (g / 100) * SC_H;
        grid += '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + W + '" y2="' + y.toFixed(1) + '" class="pd-sc-grid"/>';
      });
      P.forEach(function (p, i) {
        if (!p.newYear || i === 0) return;
        var x = (i * COL).toFixed(1);
        grid += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + SC_H + '" class="pd-sc-year"/>';
      });
      // The data date — where "actual" stops being a record and "forecast" starts being a guess.
      var tx = (ti * COL + COL / 2).toFixed(1);
      grid += '<line x1="' + tx + '" y1="0" x2="' + tx + '" y2="' + SC_H + '" class="pd-sc-now"/>';

      var svg =
        '<svg class="pd-sc-svg" width="' + W + '" height="' + SC_H + '" viewBox="0 0 ' + W + ' ' + SC_H + '"' +
          ' style="margin-left:' + SC_KEY + 'px" aria-hidden="true">' +
          grid +
          '<path d="' + scPath(pl, COL) + '" class="pd-sc-pl"/>' +
          '<path d="' + scPath(fc, COL) + '" class="pd-sc-fc"/>' +
          '<path d="' + scPath(ac, COL) + '" class="pd-sc-ac"/>' +
          '<line id="sc-guide" x1="0" y1="0" x2="0" y2="' + SC_H + '" class="pd-sc-guide" style="opacity:0"/>' +
        '</svg>';

      var head = '', rPl = '', rAc = '', rFc = '';
      P.forEach(function (p, i) {
        var yr = (p.newYear || i === 0) ? '<small>' + p.year + '</small>' : '';
        var nw = i === ti ? ' class="now"' : '';
        head += '<th' + nw + '>' + p.label + yr + '</th>';
        rPl += '<td' + nw + '>' + scPct(pl[i]) + '</td>';
        rAc += '<td' + nw + '>' + scPct(ac[i]) + '</td>';
        rFc += '<td' + nw + '>' + scPct(fc[i]) + '</td>';
      });
      // ⚠️ The header needs the CORNER cell, and that cell needs the KEY column's WIDTH (see the
      // th.k rule). Both halves matter and only one of them is visible: without the cell, thead has
      // one fewer column than every tbody row; with the cell but at the period width, the table is
      // narrower than it declares and slides a whole column off the chart. Either way the figures
      // are labelled with the wrong period and the table looks perfectly tidy.
      // ⚠️ Caught by measuring the 'now' header's centre against the chart's now-line — they must
      //    be the same x — not by looking at it.
      // ⚠️ One <colgroup> rather than a width on 27 cells: under `table-layout:fixed` a col's width
      // beats a cell's, so this is the single place the table's geometry comes from, and it is the
      // same COL the chart above it was drawn with.
      var cols = '<colgroup><col style="width:' + SC_KEY + 'px">' +
        P.map(function () { return '<col style="width:' + COL + 'px">'; }).join('') + '</colgroup>';
      var table =
        '<table class="pd-sc-tbl" style="width:' + (W + SC_KEY) + 'px">' + cols +
          '<thead><tr><th class="k"></th>' + head + '</tr></thead><tbody>' +
          '<tr class="pl"><td class="k">Planned %</td>' + rPl + '</tr>' +
          '<tr class="ac"><td class="k">Actual %</td>' + rAc + '</tr>' +
          '<tr class="fc"><td class="k">Forecast %</td>' + rFc + '</tr>' +
          '</tbody></table>';

      var vari = c.variance;
      var sub = (c.money ? 'Cost-weighted' : 'Duration-weighted') + ' &middot; ' + c.activities + ' activities &middot; ' +
        'forecast finish ' + Fmt.esc(Fmt.date(c.fcFinish)) + (c.manual ? ' (pinned)' : ' (from SPI ' + (Math.round(c.spi * 100) / 100).toFixed(2) + ')');
      var seg =
        '<span class="pd-seg" id="sc-period" role="group" aria-label="Period">' +
          '<button type="button" data-p="m"' + (mode === 'm' ? ' class="on"' : '') +
            ' aria-pressed="' + (mode === 'm') + '">Monthly</button>' +
          '<button type="button" data-p="q"' + (mode === 'q' ? ' class="on"' : '') +
            ' aria-pressed="' + (mode === 'q') + '">Quarterly</button>' +
        '</span>';

      host.innerHTML =
        vizHead('S-Curve', sub, seg + link) +
        '<div class="pd-sc-kpi">' +
          '<span><b>' + c.plannedPct.toFixed(2) + '%</b> planned to date</span>' +
          '<span><b>' + c.actualPct.toFixed(2) + '%</b> actual</span>' +
          '<span class="' + (vari >= 0 ? 'pd-perf-good' : 'pd-stat-warn') + '"><b>' +
            (vari >= 0 ? '+' : '') + vari.toFixed(2) + ' pts</b> variance</span>' +
        '</div>' +
        '<div class="pd-sc-legend">' +
          '<span><i class="pl"></i>Planned (baseline)</span>' +
          '<span><i class="ac"></i>Actual</span>' +
          '<span><i class="fc"></i>Forecast</span>' +
          '<span><i class="nw"></i>Today</span>' +
        '</div>' +
        '<div class="pd-sc-scroll" id="sc-scroll">' +
          '<div class="pd-sc-inner" style="width:' + (W + SC_KEY) + 'px">' + svg + table + '</div>' +
          '<div class="pd-sc-tip" id="sc-tip" hidden></div>' +
        '</div>' +
        // ⚠️ The scroll hint is CONDITIONAL. On a quarterly axis the columns share the panel out and
        //    there is usually nothing to scroll, and an instruction to do something the page will not
        //    do reads as a broken control rather than as a leftover sentence.
        // ⚠ Three sentences down to one. What went is the half that described what
        //   HOVERING does — hovering demonstrates itself — and the note that percentages
        //   are comparable, which the shared axis already shows. What stays is the two
        //   things the chart cannot say for itself: that the current period is read at
        //   TODAY rather than at its end, and (quarterly only) that a cumulative curve
        //   must not be added up. The scroll half stays CONDITIONAL for the reason above.
        '<div class="pd-viz-s pd-mini-note">' +
          (W + SC_KEY > (host.clientWidth || 0) - 34 ? 'Scroll sideways for the whole programme. ' : '') +
          'The <b>' + unit + ' in progress</b> is read at today, not at its end.' +
          (mode === 'q' ? ' Quarters read at their <b>end</b> and are never added up.' : '') + '</div>';

      // ---- the period toggle ----
      // A repaint, never a re-fetch: the curve is already computed and held in MET.
      host.querySelectorAll('#sc-period [data-p]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.dataset.p === mode) return;
          scSetPeriodMode(b.dataset.p);
          renderScurve();
        });
      });

      // ---- hover: one guide line + a tooltip, driven off the pointer's column ----
      var scroll = document.getElementById('sc-scroll');
      var tip = document.getElementById('sc-tip');
      var guide = host.querySelector('#sc-guide');
      if (!scroll || !tip || !guide) return;
      var MON = { month: 'short' }, MONY = { month: 'short', year: 'numeric' };
      scroll.addEventListener('mousemove', function (e) {
        var r = scroll.getBoundingClientRect();
        var x = e.clientX - r.left + scroll.scrollLeft - SC_KEY;
        var i = Math.max(0, Math.min(n - 1, Math.floor(x / COL)));
        var cx = i * COL + COL / 2;
        var p = P[i];
        guide.setAttribute('x1', cx); guide.setAttribute('x2', cx);
        guide.style.opacity = '1';
        tip.hidden = false;
        // ⚠️ The span is spelled out, not implied by the label. On a partial group "Q1 2026" covers
        //    whatever months the programme actually occupies, and a reader comparing it with a full
        //    quarter beside it deserves to be told which.
        var span = p.first === p.last
          ? c.months[p.first].toLocaleDateString('en-US', MONY)
          : c.months[p.first].toLocaleDateString('en-US', MON) + '–' +
            c.months[p.last].toLocaleDateString('en-US', MONY);
        tip.innerHTML =
          '<b>' + Fmt.esc(mode === 'q' ? p.label + ' ' + p.year : span) + '</b>' +
          (mode === 'q' ? '<span class="pd-sc-tip-s">' + Fmt.esc(span) + '</span>' : '') +
          (i === ti ? '<span class="pd-sc-tip-s">read at today</span>' : '') +
          '<span><i class="pl"></i>Planned ' + scPctU(pl[i]) + '</span>' +
          '<span><i class="ac"></i>Actual ' + scPctU(ac[i]) + '</span>' +
          '<span><i class="fc"></i>Forecast ' + scPctU(fc[i]) + '</span>';
      // Keep the tip inside the scroller rather than letting it hang off the right edge.
        var left = cx + SC_KEY - scroll.scrollLeft + 12;
        if (left + 150 > r.width) left = Math.max(4, left - 174);
        tip.style.left = left + 'px';
      });
      scroll.addEventListener('mouseleave', function () {
        tip.hidden = true; guide.style.opacity = '0';
      });
      // Open on the data date rather than at month 1 — the current position is what a planner
      // came to see, and on a three-year programme month 1 is a year of scrolling away.
      // ⚠️ `ti`, the PERIOD index — not `c.ti`, which is the engine's MONTHLY one. On a quarterly
      //    axis the monthly index is about three times too far right, so the panel would have opened
      //    scrolled past the data date it exists to show. Every other x here was converted; this one
      //    reads correctly either way on the monthly axis, which is how it survived the conversion.
      scroll.scrollLeft = Math.max(0, ti * COL + SC_KEY - scroll.clientWidth / 2);
    }

    // ---- Trades programme ------------------------------------------------------------------------
    // ⚠️ WHAT THE OWNER SAW AND WHY IT WAS WRONG (2026-09-01): every bar showed a big RED FILL while
    //    every trade read 0%. That coloured band was never progress — it was the trade's DATE SPAN,
    //    tinted with the row's status colour at .22 opacity. So "0% complete" and "a bar that looks
    //    three-quarters full" were on screen together, and the only honest reading of that is that
    //    the chart is lying. A shape that means "when" must not be painted in the colour that means
    //    "how much".
    //    Now: the span is NEUTRAL (it answers *when*), the progress fill is the only coloured thing
    //    (it answers *how much*), and a separate hatched region shows time elapsed but unearned —
    //    which is what "behind" actually looks like.
    function renderProgram() {
      var sch = MET['project-schedule'] || {}, rowsPv = sch.program || [];
      rowsPv = rowsPv.filter(function (r) { return r.from && r.to; });
      if (!rowsPv.length) return vizEmpty('viz-program', 'Project Schedule & Milestones',
        'No dated activities with a trade yet. Push a programme from Schedule Setup, or set the Trade on the activities.');
      var min = null, max = null;
      rowsPv.forEach(function (r) { if (!min || r.from < min) min = r.from; if (!max || r.to > max) max = r.to; });
      var span = Math.max(1, _days(min, max));
      rowsPv.sort(function (a, b) { return a.from < b.from ? -1 : a.from > b.from ? 1 : 0; });
      var today = new Date().toISOString().slice(0, 10);
      var elapsed = Math.max(0, Math.min(100, _days(min, today) / span * 100));

      var body = rowsPv.slice(0, 9).map(function (r) {
        var x = _days(min, r.from) / span * 100, w = Math.max(1.2, (_days(r.from, r.to) + 1) / span * 100);
        var pct = r.pct == null ? 0 : Math.round(r.pct);
        // `own` = how much of THIS trade's own duration has gone, 0..100.
        var own = Math.max(0, Math.min(100, (elapsed - x) / w * 100));
        var behind = own > 5 && pct < own - 10;
        // ⚠️ THE FILL IS NEVER RED. It is work that has actually been done, and the legend has one
        //    swatch for that. Painting a behind trade's completed 12% red said "this 12% is the
        //    problem" when the problem is the 18% beside it that is missing — and it contradicted
        //    the very legend printed above it. Red belongs to the shortfall band alone; the
        //    percentage TEXT still carries the status colour, which is where a reader looks for it.
        var col = pct >= 100 ? C_OK : C_BLUE;
        var txtCol = pct >= 100 ? C_OK : behind ? C_LATE : C_BLUE;
        // The shortfall band: time gone that work has NOT caught up with. The only red on the bar,
        // and drawn only where it actually exists.
        var shortfall = behind ? (own - pct) : 0;
        return '<div class="pd-pv-l"><b title="' + Fmt.esc(r.key) + '">' + Fmt.esc(r.key) + '</b>' +
            '<small>' + Fmt.esc(Fmt.date(r.from)) + ' &rarr; ' + Fmt.esc(Fmt.date(r.to)) + '</small>' +
            '<small class="dim">' + r.n + ' activit' + (r.n === 1 ? 'y' : 'ies') +
              (r.done ? ' &middot; ' + r.done + ' done' : '') + '</small></div>' +
          '<div class="pd-pv-t">' +
            // the span: neutral, so it reads as "when", never as "how much"
            '<div class="pd-pv-span" style="left:' + x.toFixed(2) + '%;width:' + w.toFixed(2) + '%">' +
              (shortfall > 0
                ? '<div class="pd-pv-gap" style="left:' + pct + '%;width:' + shortfall.toFixed(2) + '%"></div>'
                : '') +
              '<div class="pd-pv-f" style="width:' + pct + '%;background:' + col + '"></div>' +
              (own > 0 && own < 100
                ? '<i class="pd-pv-now" style="left:' + own.toFixed(2) + '%" title="' + Math.round(own) +
                  '% of this trade’s duration has elapsed"></i>' : '') +
            '</div>' +
          '</div>' +
          '<div class="pd-pv-n" style="color:' + txtCol + '">' + pct + '%' +
            (behind ? '<small>' + Math.round(own) + '% elapsed</small>' : '') + '</div>';
      }).join('');

      document.getElementById('viz-program').innerHTML =
        vizHead('Project Schedule & Milestones',
          Fmt.date(min) + ' &rarr; ' + Fmt.date(max) + ' &middot; ' + rowsPv.length + ' trades &middot; ' +
          Math.round(elapsed) + '% of the programme elapsed',
          '<span><i class="pd-lg-span"></i>Trade span</span>' +
          '<span><i style="background:' + C_BLUE + '"></i>Work done</span>' +
          '<span><i style="background:' + C_OK + '"></i>Complete</span>' +
          '<span><i class="pd-lg-gap"></i>Time gone, work not done</span>' +
          '<span><i class="pd-lg-now"></i>Today</span>') +
        '<div class="pd-pv">' + body + '</div>' +
        (rowsPv.length > 9 ? '<div class="pd-viz-s pd-mini-note">Showing the 9 earliest of ' + rowsPv.length + ' trades.</div>' : '');
    }

    // ---- 2. Minutes of Meeting -----------------------------------------------------------------
    // ⚠️ A module with NO ROWS is reported as "not in use", never as "0 drafts". The rule the old
    //    status band applied to registers applies here too: zero on an unused module reads as good
    //    news, and "no minutes have ever been recorded" is not good news.
    function renderMom() {
      var m = MET['minutes-of-meeting'] || {};
      var mod = (APP_CONFIG.MODULES || []).find(function (x) { return x.key === 'minutes-of-meeting'; });
      var link = mod ? '<a class="pd-viz-s" href="' + ModulesGrid.href(mod) + '">Open module</a>' : '';
      if (!m.__rows) {
        return vizEmpty('viz-mom', 'Minutes of Meeting',
          'No minutes recorded on this project yet. Record one in <b>Minutes of Meeting</b> — ' +
          'issues raised on the register are pulled onto the next agenda from there.');
      }
      var total = m.__rows || 0, draft = _n(m.draft) || 0, latest = m.latest || null;
      var issued = Math.max(0, total - draft);
      var pctIssued = total ? Math.round(issued / total * 100) : 0;
      var series = _n(m.series) || 0;
      // ⚠️ Escape the DATES, not the assembled string. Wrapping the whole thing in Fmt.esc()
      // turned the '&rarr;' entity into a literal "&rarr;" on screen — the same double-escape
      // that made the Issues panel read "Issues &amp; Concerns".
      var span = (m.earliest && latest && m.earliest !== latest)
        ? Fmt.esc(Fmt.date(m.earliest)) + ' &rarr; ' + Fmt.esc(Fmt.date(latest))
        : (latest ? Fmt.esc(Fmt.date(latest)) : null);

      // ⚠️ The LATEST MEETING'S ACTION ITEMS, not a list of meeting titles (owner, 2026-09-01). A
      // list of titles tells a planner nothing they cannot get from the count above it; what they
      // came for is what was decided and who owes it.
      var last = (m.recent || [])[0] || null;
      var items = last ? (m.sub || []).filter(function (r) { return r.mom_id === last.id; }) : [];
      // Open first, then by due date — the ones with no date last, since an undated item cannot
      // be ranked against a dated one without inventing a deadline for it.
      items.sort(function (a, b) {
        var ao = a.status === 'Closed' ? 1 : 0, bo = b.status === 'Closed' ? 1 : 0;
        if (ao !== bo) return ao - bo;
        if (!a.due_date) return b.due_date ? 1 : 0;
        if (!b.due_date) return -1;
        return a.due_date < b.due_date ? -1 : a.due_date > b.due_date ? 1 : 0;
      });
      var openN = items.filter(function (r) { return r.status !== 'Closed'; }).length;
      var rows = items.slice(0, 4).map(function (r) {
        var txt = r.action_item || r.description || 'Untitled item';
        var closed = r.status === 'Closed';
        return '<li class="pd-list-r' + (closed ? ' done' : '') + '">' +
          '<span class="pd-list-t" title="' + Fmt.esc(txt) + '">' +
            (r.item_no ? '<b class="pd-no">' + Fmt.esc(r.item_no) + '</b> ' : '') + Fmt.esc(txt) +
            (r.owner ? '<small>' + Fmt.esc(r.owner) + '</small>' : '') + '</span>' +
          (closed ? '<span class="pd-tag pd-tag-ok">Closed</span>' : _dueChip(r.due_date)) +
          '</li>';
      }).join('');
      var itemsHead = last
        ? '<div class="pd-list-h">From ' + Fmt.esc(last.title || 'the latest meeting') +
          (last.meeting_date ? ' &middot; ' + Fmt.esc(Fmt.date(last.meeting_date)) : '') +
          ' &mdash; ' + (items.length ? openN + ' open of ' + items.length + ' item' + (items.length === 1 ? '' : 's')
                                      : 'no action items recorded') + '</div>'
        : '';

      document.getElementById('viz-mom').innerHTML =
        vizHead('Minutes of Meeting',
          total + ' meeting' + (total === 1 ? '' : 's') + (span ? ' &middot; ' + span : ''),
          link) +
        '<div class="pd-mini-band">' +
          miniCell('Meetings', String(total), null, 'Recorded on this project') +
          miniCell('Distributed', String(issued), issued === total ? true : null, pctIssued + '% are out') +
          miniCell('Draft', String(draft), draft ? false : true, draft ? 'Not yet distributed' : 'None in draft') +
          miniCell('Recurring', String(series), null,
            series ? 'From a meeting schedule' : 'All one-off meetings') +
        '</div>' +
        '<div class="pd-mini-bar" title="' + issued + ' distributed of ' + total + '"><i style="width:' + pctIssued + '%"></i></div>' +
        (last ? itemsHead : '') +
        (rows ? '<ul class="pd-list">' + rows + '</ul>' : '') +
        (draft
          ? '<div class="pd-viz-s pd-mini-note"><span class="pd-stat-warn">' + draft +
            ' minute' + (draft === 1 ? '' : 's') + ' still in draft.</span> A minute nobody has ' +
            'received cannot carry an action.</div>'
          : '<div class="pd-viz-s pd-mini-note">Every recorded minute has been distributed.</div>');
    }

    // ---- 3. Issues & Concerns ------------------------------------------------------------------
    // ⚠️ 'On Hold' counts as OPEN here, the same rule the register, its PDF and the carry-over
    //    logic already follow. A held issue is unresolved work, not a closed one.
    function renderIssues() {
      var m = MET['issues-lessons'] || {};
      var mod = (APP_CONFIG.MODULES || []).find(function (x) { return x.key === 'issues-lessons'; });
      var link = mod ? '<a class="pd-viz-s" href="' + ModulesGrid.href(mod) + '">Open module</a>' : '';
      // ⚠️ PLAIN '&', not '&amp;'. vizHead escapes its title, so a pre-escaped entity was escaped
      //    a second time and the panel rendered the literal text "Issues &amp; Concerns".
      if (!m.__rows) {
        return vizEmpty('viz-issues', 'Issues & Concerns',
          'Nothing on this register yet. ⚠️ An empty register is not the same as a clear one — ' +
          'if issues are being raised in meetings, they belong here too.');
      }
      var total = m.__rows || 0, open = _n(m.open) || 0, closed = _n(m.closed) || 0;
      var hold = _n(m.onHold) || 0, crit = _n(m.critical) || 0, high = _n(m.high) || 0;
      var other = Math.max(0, total - open - closed);
      var pctClosed = total ? Math.round(closed / total * 100) : 0;

      // ⚠️ The OPEN list, oldest first — not `recent`. `recent` is the 4 newest entries, so on a
      // register whose latest rows happen to be closed this panel would have shown a tidy list
      // while a dozen open items sat below the fold. Oldest first because an issue open since
      // June is worse news than one raised yesterday.
      var openRows = (m.lists && m.lists.open) || [];
      var openTotal = (m.lists && m.lists.open__total) || 0;
      var rows = openRows.slice(0, 4).map(function (r) {
        var st = String(r.status || '').trim();
        var sev = String(r.severity || '').trim();
        var sevCls = sev === 'Critical' ? ' pd-tag-bad' : sev === 'High' ? ' pd-tag-warn' : '';
        var age = _dueIn(r.date_raised);
        return '<li class="pd-list-r">' +
          '<span class="pd-list-t" title="' + Fmt.esc(r.title || '') + '">' + Fmt.esc(r.title || 'Untitled entry') +
            '<small>' + (r.date_raised ? 'raised ' + Fmt.esc(Fmt.date(r.date_raised)) +
              (age != null && age < 0 ? ' &middot; ' + Math.abs(age) + ' days open' : '') : 'no date raised') +
              (r.champion ? ' &middot; ' + Fmt.esc(r.champion) : '') + '</small></span>' +
          (sev ? '<span class="pd-tag' + sevCls + '">' + Fmt.esc(sev) + '</span>' : '') +
          '<span class="pd-tag' + (st === 'On Hold' ? ' pd-tag-warn' : '') + '">' + Fmt.esc(st || 'No status') + '</span>' +
          '</li>';
      }).join('');
      var openHead = openRows.length
        ? '<div class="pd-list-h">Open items, oldest first' +
          (openTotal > openRows.length ? ' &mdash; showing ' + openRows.length + ' of ' + openTotal : '') + '</div>'
        : '';

      document.getElementById('viz-issues').innerHTML =
        vizHead('Issues & Concerns',
          total + ' entr' + (total === 1 ? 'y' : 'ies') +
          (m.latest ? ' &middot; latest raised ' + Fmt.esc(Fmt.date(m.latest)) : ''),
          link) +
        '<div class="pd-mini-band">' +
          miniCell('Open', String(open), open ? false : true, hold ? hold + ' of them on hold' : 'None on hold') +
          miniCell('Critical', String(crit), crit ? false : true, crit ? 'Open and critical' : 'None open') +
          miniCell('High', String(high), high ? false : null, high ? 'Open and high' : 'None open') +
          miniCell('Closed', String(closed), closed ? true : null, pctClosed + '% of the register') +
        '</div>' +
        '<div class="pd-mini-bar" title="' + closed + ' closed of ' + total + '"><i style="width:' + pctClosed + '%"></i></div>' +
        openHead +
        (rows ? '<ul class="pd-list">' + rows + '</ul>' : '') +
        (other
          ? '<div class="pd-viz-s pd-mini-note"><span class="pd-stat-warn">' + other +
            ' entr' + (other === 1 ? 'y carries' : 'ies carry') + ' no status</span>, so ' +
            (other === 1 ? 'it is' : 'they are') + ' counted as neither open nor closed.</div>'
          : open
            ? '<div class="pd-viz-s pd-mini-note">Open items are pulled onto the next meeting agenda from Minutes of Meeting.</div>'
            : '<div class="pd-viz-s pd-mini-note">Nothing open on this register.</div>');
    }

    // Shared by both panels above. `good` === null means "no opinion" — a neutral figure must not
    // be coloured as if it were a verdict, the same rule the old EVM cells followed.
    function miniCell(label, value, good, sub) {
      return '<div class="pd-mini-c' + (good === true ? ' ok' : good === false ? ' bad' : '') + '">' +
        '<span class="pd-mini-l">' + Fmt.esc(label) + '</span>' +
        '<strong class="pd-mini-v">' + Fmt.esc(value) + '</strong>' +
        (sub ? '<small class="pd-mini-s">' + Fmt.esc(sub) + '</small>' : '') + '</div>';
    }

    /* ==========================================================================================
       THE PROGRESS PHOTOS VIEWER.
       Owner 2026-09-10: *"can you input a progress photos viewer for the dashboard and make it
       visually pleasing."*

       A hero frame, a rail of the rest, and a lightbox. ⚠️ ONE list drives all three (`PH`), so
       the rail, the hero and the lightbox can never be showing different photos — the index is the
       only state, and every control moves that index.
       ⚠️ NOTHING IS FETCHED HERE. The photos are the `recent` block the shell already loads for
       every module that declares one (see APP_CONFIG's progress-photos `dash.recent`), signed
       once by PDb. A viewer that re-queried would be a second source for the same six rows.
       ========================================================================================== */
    var PH = [], PHi = 0;
    // What a photo is called, and what is known about when and where. Used by the hero, the rail's
    // tooltips and the lightbox, so the three cannot describe the same photo differently.
    function phTitle(r) { return r.title || r.works || 'Untitled'; }
    function phSub(r) {
      return [r.taken_at ? Fmt.date(r.taken_at) : '', r.location || '', r.works && r.title ? r.works : '']
        .filter(Boolean).join(' · ');
    }
    function renderPhotos() {
      var ph = MET['progress-photos'] || {}, rec = ph.recent || [];
      var mod = (APP_CONFIG.MODULES || []).find(function (m) { return m.key === 'progress-photos'; });
      var link = mod ? '<a class="pd-viz-s" href="' + ModulesGrid.href(mod) + '">Open the module</a>' : '';
      if (!rec.length) return vizEmpty('viz-photos', 'Progress Photos',
        'No photos uploaded for this project yet.' + (mod ? ' ' + link : ''));
      PH = rec; PHi = 0;
      document.getElementById('viz-photos').innerHTML =
        vizHead('Progress Photos',
          // ⚠️ States the window, not just the count: "6 most recent of 340" made a planner ask
          // which 6, and the answer — the newest by date taken — is the thing worth saying.
          rec.length + ' newest of ' + (ph.__rows == null ? rec.length : ph.__rows) +
            ' &middot; click to enlarge', link) +
        '<div class="pd-ph-v">' +
          '<div id="ph-hero"></div>' +
          (rec.length > 1 ? '<div class="pd-ph-rail" id="ph-rail"></div>' : '') +
        '</div>';
      /* ⚠️⚠️ THE RAIL IS BUILT BEFORE THE FIRST phPaint, and that order is the fix for a real
         defect: phPaint marks the current thumbnail by querying [data-phi], so called first it
         found an empty rail and NOTHING was ever marked until the planner clicked something.
         Caught by measuring, not by looking: the index of the tile carrying the .on class came
         back as -1 on a freshly rendered panel, which looks exactly like a panel whose first photo
         simply is not the current one. */
      var rail = document.getElementById('ph-rail');
      if (rail) {
        rail.innerHTML = rec.map(function (r, i) {
          return '<button type="button" class="pd-ph-t" data-phi="' + i + '"' +
            ' title="' + Fmt.esc(phTitle(r) + (phSub(r) ? ' — ' + phSub(r) : '')) + '"' +
            ' aria-label="' + Fmt.esc('Show photo ' + (i + 1) + ' of ' + rec.length + ': ' + phTitle(r)) + '">' +
            (r.__url ? '<img src="' + Fmt.esc(r.__url) + '" alt="" loading="lazy">' : '<span class="pd-ph-x">No preview</span>') +
            '</button>';
        }).join('');
        rail.querySelectorAll('[data-phi]').forEach(function (b) {
          b.onclick = function () { PHi = +b.dataset.phi; phPaint(); };
        });
      }
      phPaint();
    }
    // Repaints the hero and re-marks the rail. ⚠️ Style and text only on the rail — the tiles are
    // never rebuilt, so clicking one does not restart six image loads.
    function phPaint() {
      var host = document.getElementById('ph-hero'); if (!host || !PH.length) return;
      var r = PH[PHi] || PH[0], sub = phSub(r);
      host.innerHTML =
        '<button type="button" class="pd-ph-hero" id="ph-open" aria-label="' +
          Fmt.esc('Enlarge: ' + phTitle(r)) + '">' +
          (r.__url ? '<img src="' + Fmt.esc(r.__url) + '" alt="' + Fmt.esc(phTitle(r)) + '">'
                   : '<span class="pd-ph-x">No preview available for this photo</span>') +
          '<span class="pd-ph-hint">' + (PHi + 1) + ' / ' + PH.length + ' &middot; click to enlarge</span>' +
          '<span class="pd-ph-cap"><b>' + Fmt.esc(phTitle(r)) + '</b>' +
            (sub ? '<small>' + Fmt.esc(sub) + '</small>' : '') + '</span>' +
        '</button>';
      var op = document.getElementById('ph-open');
      if (op) op.onclick = function () { phLightbox(PHi); };
      var rail = document.getElementById('ph-rail');
      if (rail) rail.querySelectorAll('[data-phi]').forEach(function (b) {
        var on = +b.dataset.phi === PHi;
        b.classList.toggle('on', on);
        b.setAttribute('aria-current', on ? 'true' : 'false');
      });
    }
    /* The lightbox. ⚠️ Built and destroyed per opening rather than parked in the page: it holds a
       full-size image, and leaving one in the DOM behind an `opacity:0` keeps that decode alive on
       a dashboard nobody has asked to look at photos on.
       ⚠️ The keydown listener is removed by close(), and close() is the ONLY way out — every exit
       (Esc, the ×, the backdrop) goes through it, so the listener cannot outlive the overlay. */
    function phLightbox(start) {
      if (!PH.length) return;
      var i = Math.max(0, Math.min(PH.length - 1, start || 0));
      var box = document.createElement('div');
      box.className = 'pd-lb';
      box.setAttribute('role', 'dialog');
      box.setAttribute('aria-modal', 'true');
      box.setAttribute('aria-label', 'Progress photo viewer');
      box.innerHTML =
        '<div class="pd-lb-top"><span class="pd-lb-n" id="lb-n"></span>' +
          '<button type="button" class="pd-lb-x" id="lb-x" aria-label="Close">&times;</button></div>' +
        '<div class="pd-lb-stage" id="lb-stage">' +
          '<button type="button" class="pd-lb-nav prev" id="lb-prev" aria-label="Previous photo">&#10094;</button>' +
          '<img id="lb-img" alt="">' +
          '<button type="button" class="pd-lb-nav next" id="lb-next" aria-label="Next photo">&#10095;</button>' +
        '</div>' +
        '<div class="pd-lb-foot"><b id="lb-t"></b><small id="lb-s"></small></div>';
      document.body.appendChild(box);
      // One frame later, so the opacity transition has a start state to move from.
      requestAnimationFrame(function () { box.classList.add('open'); });
      var img = box.querySelector('#lb-img');
      function paint() {
        var r = PH[i], sub = phSub(r);
        // ⚠️ A photo with no signed URL is skipped rather than shown as a broken frame — but only
        // in the lightbox, where there is nothing else on screen to explain the blank.
        img.style.display = r.__url ? '' : 'none';
        if (r.__url) { img.src = r.__url; img.alt = phTitle(r); }
        box.querySelector('#lb-n').textContent = (i + 1) + ' of ' + PH.length;
        box.querySelector('#lb-t').textContent = phTitle(r);
        box.querySelector('#lb-s').textContent = sub || (r.__url ? '' : 'No preview available');
        box.querySelector('#lb-prev').disabled = (i <= 0);
        box.querySelector('#lb-next').disabled = (i >= PH.length - 1);
      }
      function go(d) { var n = i + d; if (n < 0 || n >= PH.length) return; i = n; paint(); }
      function close() {
        document.removeEventListener('keydown', onKey);
        box.classList.remove('open');
        // ⚠️ The index the planner navigated to becomes the panel's hero, so closing the viewer
        // does not throw away where they got to.
        PHi = i; phPaint();
        setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 180);
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); close(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      }
      box.querySelector('#lb-x').onclick = close;
      box.querySelector('#lb-prev').onclick = function () { go(-1); };
      box.querySelector('#lb-next').onclick = function () { go(1); };
      // ⚠️ The BACKDROP closes, the stage does not: a click meant for the next arrow that lands a
      // few pixels off should not dismiss the photo being read.
      box.onclick = function (e) { if (e.target === box || e.target.id === 'lb-stage') close(); };
      document.addEventListener('keydown', onKey);
      paint();
      box.querySelector('#lb-next').focus();
    }

    function renderViz() {
      // Each panel is independent: one module's missing data must not blank the others.
      // Each panel is independently guarded: one module's bad data must not blank the rest.
      try { renderPerf(); } catch (e) { var pg = document.getElementById('perf-grid'); if (pg) pg.innerHTML = '<div class="pd-viz-empty">Could not draw the performance row.</div>'; }
      try { renderDue(); } catch (e) { vizEmpty('viz-due', 'Approaching Deadlines', 'Could not draw this panel.'); }
      try { renderScurve(); } catch (e) { vizEmpty('viz-scurve', 'S-Curve', 'Could not draw this panel.'); }
      try { renderProgram(); } catch (e) { vizEmpty('viz-program', 'Project Schedule & Milestones', 'Could not draw this panel.'); }
      try { renderMom(); } catch (e) { vizEmpty('viz-mom', 'Minutes of Meeting', 'Could not draw this panel.'); }
      try { renderIssues(); } catch (e) { vizEmpty('viz-issues', 'Issues &amp; Concerns', 'Could not draw this panel.'); }
      try { renderPhotos(); } catch (e) { vizEmpty('viz-photos', 'Progress Photos', 'Could not draw this panel.'); }
    }

    // Load every module's declared metrics in parallel, then draw once. A module that fails or
    // declares nothing contributes nothing — one bad spec must not blank the band.
    function loadStatus() {
      var mods = (APP_CONFIG.MODULES || []).filter(function (m) { return m.enabled && m.dash && (m.dash.metrics || m.dash.recent); });
      if (!mods.length) { var b = document.getElementById('stat-band'); if (b) b.style.display = 'none'; return; }
      Promise.all(mods.map(function (m) {
        return PDb.moduleMetrics(m.dash, pid).then(function (r) { MET[m.key] = r || {}; },
          function () { MET[m.key] = {}; });
      })).then(function () { renderViz(); }, function () { renderViz(); });
    }

    // ---- "My items" drawer -----------------------------------------------------------------
    // ⚠️ Rendered ONCE, lazily, on first open — not on page load. It is three extra queries for a
    //    panel most visits never open, and the dashboard's own panels should not queue behind a
    //    personal to-do list. The badge count is the one thing computed eagerly, because a drawer
    //    that hides an overdue item behind a click nobody knows to make is worse than no drawer.
    var mwLoaded = false;
    function initMyDrawer() {
      var fab = document.getElementById('mw-fab'), dr = document.getElementById('mw-drawer'),
          sc = document.getElementById('mw-scrim'), x = document.getElementById('mw-close'),
          host = document.getElementById('mw-block');
      if (!fab || !dr || !host) return;

      function open() {
        dr.hidden = false; sc.hidden = false;
        // Two frames: `hidden` must be off and the element laid out before the class that
        // transitions it, or the browser paints it already-open and there is no animation.
        requestAnimationFrame(function () { requestAnimationFrame(function () { dr.classList.add('open'); sc.classList.add('open'); }); });
        fab.setAttribute('aria-expanded', 'true');
        if (!mwLoaded) {
          mwLoaded = true;
          try { MyWork.renderBlock(host, CURUSER, pid, ''); }
          catch (e) { host.innerHTML = '<p class="mw-empty">Could not load your items.</p>'; }
        }
        x.focus();
      }
      function close() {
        dr.classList.remove('open'); sc.classList.remove('open');
        fab.setAttribute('aria-expanded', 'false');
        // Wait out the transition before hiding, or it snaps shut.
        setTimeout(function () { dr.hidden = true; sc.hidden = true; }, 200);
        fab.focus();
      }
      fab.addEventListener('click', function () { dr.hidden ? open() : close(); });
      x.addEventListener('click', close);
      sc.addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !dr.hidden) close(); });

      // The badge: my OPEN items on this project, counted by MyWork itself so the drawer and the
      // cross-project page cannot disagree about what "mine" means.
      if (MyWork.countOpen) {
        MyWork.countOpen(CURUSER.id, pid).then(function (n) {
          var b = document.getElementById('mw-fab-n');
          if (!b || !n) return;
          b.textContent = n > 99 ? '99+' : String(n);
          b.hidden = false;
          fab.classList.add('has');
        }).catch(function () { /* a badge is not worth a visible failure */ });
      }
    }

    function renderTiles() {
      var grid = document.getElementById('tile-grid');
      // superAdminOnly modules (config.js) drop out here too — same rule ModulesGrid.render()
      // and UI.renderNav() apply, so a hidden module can't surface as a live-figures tile here
      // while being absent from the launcher and the sidebar.
      var mods = (APP_CONFIG.MODULES || []).filter(function (m) { return !window.ModulesGrid || ModulesGrid.visible(m); });
      grid.innerHTML = mods.map(function (m) {
        // ⚠️ Delegated to the LAUNCHER's own card builder (2026-09-01, owner). This branch used
        // to render its own dead grey box, so Drawing Register and Material Submittal Log were
        // clickable on modules.html — where ModulesGrid.card() sends a retired module to the
        // Engineering App in a new tab — and inert here. Two builders for one card is how the
        // two screens came to disagree; there is one now, and the dashboard gets the external
        // link for free. Enabled modules keep the dashboard's OWN card below, because it carries
        // live figures the launcher's card has no place for.
        if (!m.enabled) return ModulesGrid.card(m);
        return '<a class="pd-module-card" href="' + ModulesGrid.href(m) + '">' +
          '<div class="pd-module-icon">' + Icons.svg(m.icon, 24) + '</div>' +
          '<div class="pd-module-body"><div class="pd-module-title">' + Fmt.esc(m.name) + '</div>' +
          '<div class="pd-module-figs" data-fig="' + Fmt.esc(m.key) + '">' +
            (m.dash ? '<span class="pd-fig-load">Loading…</span>'
                    : '<span class="pd-fig-none">No summary published</span>') + '</div>' +
          '</div></a>';
      }).join('');

      mods.forEach(function (m) {
        if (!m.enabled || !m.dash) return;
        var host = grid.querySelector('[data-fig="' + m.key + '"]');
        PDb.moduleSummary(m.dash, pid).then(function (s) {
          if (!host) return;
          var html = '<span class="pd-fig"><b>' + s.total + '</b> ' + Fmt.esc(m.dash.unit || 'records') + '</span>';
          if (s.attention != null) {
            html += '<span class="pd-fig' + (s.attention ? ' warn' : '') + '"><b>' + s.attention + '</b> ' +
              Fmt.esc(s.attentionLabel) + '</span>';
          }
          if (s.lastActivity) html += '<span class="pd-fig-when">updated ' + Fmt.date(s.lastActivity) + '</span>';
          host.innerHTML = html;
        }).catch(function (e) {
          // One module's broken spec (or a table that has not been migrated yet)
          // must not take the rest of the dashboard down with it.
          if (host) host.innerHTML = '<span class="pd-fig-none" title="' + Fmt.esc(e.message) + '">Summary unavailable</span>';
        });
      });
    }
  })();
  </script>
</body>
</html>
