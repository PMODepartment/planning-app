<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon-icon.png?v=20260903a" />
  <link rel="apple-touch-icon" href="assets/img/icon.png?v=20260830b" />
  <script src="assets/js/theme.js?v=20260910w7"></script>
  <title>Dashboard — Planners Dashboard</title>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260910z5" />
  <link rel="stylesheet" href="assets/css/my-work.css?v=20260910w3" />
</head>
<body>
  <div class="pd-app">
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="assets/img/logo-white.png" alt="Megawide Construction"><img class="pd-brand-mark" src="assets/img/favicon-icon.png?v=20260903a" alt="" aria-hidden="true">Planners Dashboard<small>Planning Suite</small></div>
      <!-- Contents depend on the current mode (Project here) — rendered by UI.renderNav. -->
      <nav id="side-nav"></nav>
      <!-- Cross-app links to sibling apps. Separate Supabase projects /
           separate logins — open in a new tab rather than navigating away. -->
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="appEngineering"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="appProcurement"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <!-- PRC's .sidebar-footer, pinned to the bottom of the panel. -->
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>PMO Department</div>
    </aside>

    <div class="pd-content">
      <div class="pd-topbar">
        <!-- Project selector — the SAME searchable, Group-Head-grouped picker every
             module uses (UI.enhanceProjectSelect), not a separate switcher component. -->
        <div class="dh-projctx">
          <select class="pd-select dh-project" id="dh-project" title="Project"></select>
        </div>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <!-- ⚠️ The heading is the PROJECT, not the reader. "Welcome, <name>" was removed
             2026-09-01 (owner): it told a planner something they already knew and pushed the
             one fact they came for — which project am I looking at — into a subtitle. The
             location now sits beside the id, since two Megawide projects can share a name. -->
        <div class="pd-home-head">
          <h2 id="proj-title">Loading…</h2>
          <p id="dash-sub">Loading this project…</p>
        </div>

        <!-- ---- Project status (management band) ------------------------
             ⚠️ 2026-09-01 (owner): the two card rows that stood here — the project-facts row
             (Status / Original Budget / Forecast Start / Forecast Finish / Location) and the
             four status cards (Schedule / Progress / Cost / Needs attention) — were REMOVED
             and replaced by the performance row below. The decisions strip was explicitly
             kept: it sits outside the removal in the owner's screenshot and is the one part
             of the old band that names something a planner must act on. -->
        <section class="pd-stat-band" id="stat-band" aria-label="Project status">
          <div class="pd-perf-grid" id="perf-grid"></div>
          <div class="pd-viz" id="viz-scurve"></div>
          <div class="pd-viz" id="viz-program"></div>
          <div class="pd-viz-2col">
            <div class="pd-viz" id="viz-mom"></div>
            <div class="pd-viz" id="viz-issues"></div>
          </div>
          <!-- ⚠️ Approaching Deadlines sits BELOW the two registers at the owner's request
               (2026-09-01). The order it makes is a reading order: the curve and the programme
               say where the project stands, the two registers say what is being talked about,
               and this says what falls due next — the thing you leave the dashboard to act on. -->
          <div class="pd-viz" id="viz-due"></div>
          <div class="pd-viz" id="viz-photos" style="margin-top:12px;"></div>
        </section>


        <!-- ---- Module summaries (A5) ----------------------------------- -->
        <section>
          <div class="pd-sec-head">
            <h3>Modules</h3>
            <a class="pd-btn pd-btn-sm" href="modules.html">Open module launcher</a>
          </div>
          <div class="pd-module-grid" id="tile-grid"></div>
        </section>
      </div>

      <!-- ---- "My items" drawer (2026-09-01) ---------------------------
           ⚠️ Rendered by the SAME code as the cross-project My Work page
           (assets/js/my-work.js), never a second copy of the rules — two
           screens each computing "my items" their own way is how one page
           comes to disagree with the other about what a planner owes.
           It moved out of the page flow at the owner's request: it is a
           personal to-do list, not a project fact, and it was sitting
           between the project's own panels and the module grid. -->
      <button type="button" class="mw-fab" id="mw-fab" aria-expanded="false" aria-controls="mw-drawer">
        <span class="mw-fab-ico" aria-hidden="true">☑</span>
        <span class="mw-fab-txt">My items</span>
        <span class="mw-fab-n" id="mw-fab-n" hidden></span>
      </button>
      <div class="mw-scrim" id="mw-scrim" hidden></div>
      <aside class="mw-drawer" id="mw-drawer" hidden aria-label="My items on this project">
        <div class="mw-drawer-head">
          <strong>My items on this project</strong>
          <button type="button" class="mw-drawer-x" id="mw-close" aria-label="Close">&times;</button>
        </div>
        <div class="mw-drawer-body"><section class="mw-sec" id="mw-block"></section></div>
      </aside>
    </div>
  </div>

  <style>
    .pd-stat-band { margin:0 0 18px; }
    /* ---- Performance row (2026-09-01) --------------------------------------------------------
       Replaces .pd-stat-grid / .pd-stat, which went with the two card rows the owner removed.
       The decisions chips that sat below them went on 2026-09-01 at the owner's request. */
    .pd-perf-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(196px, 1fr)); gap:12px; }
    .pd-perf {
      position:relative; overflow:hidden; padding:13px 15px 12px; border-radius:var(--pd-radius-lg);
      background:var(--pd-card, var(--pd-bg)); border:1px solid var(--pd-line);
    }
    .pd-perf::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pc, var(--pd-muted)); }
    .pd-perf-l { font-size:var(--pd-fs-micro); letter-spacing:.07em; text-transform:uppercase; color:var(--pd-muted); font-weight:700; }
    .pd-perf-v { display:block; font-size:var(--pd-fs-hero); font-weight:800; line-height:1.15; margin-top:5px; letter-spacing:-.02em; }
    /* An empty card must not look like a measured one: smaller, muted, and it states the gap. */
    .pd-perf-em { font-size:var(--pd-fs-md); font-weight:700; color:var(--pd-muted); }
    .pd-perf-bar { position:relative; height:5px; border-radius:3px; background:var(--pd-line); margin-top:9px; overflow:hidden; }
    .pd-perf-bar > i { display:block; height:100%; border-radius:3px; background:var(--pc, var(--pd-muted)); }
    /* ⚠️ The basis line is not decoration: a number with no stated basis gets trusted further than
       it deserves. Every card carries one, including the empty ones. */
    .pd-perf-b { display:block; font-size:var(--pd-fs-xs); color:var(--pd-muted); margin-top:6px; line-height:1.45; }
    /* One short line, not a paragraph: a verdict or a comparison, never an explanation. */
    .pd-perf-note { display:block; font-size:var(--pd-fs-xs); color:var(--pd-muted); margin-top:5px; line-height:1.4; }
    .pd-perf-good { color:#2FA36B; }
    .pd-perf-none .pd-perf-b { opacity:.9; }
    @media (max-width:640px) { .pd-perf-v { font-size:var(--pd-fs-stat); } }
    /* Kept from the retired chips block: the perf cards and both list panels still use it. */
    .pd-stat-warn { font-size:var(--pd-fs-xs); color:var(--pd-muted); }

    /* ---- Mini stat band, shared by the Minutes of Meeting and Issues panels ------------------- */
    .pd-mini-band { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:8px; }
    .pd-mini-c { border:1px solid var(--pd-line); border-radius:9px; padding:9px 11px; background:var(--pd-card); border-left-width:3px; }
    .pd-mini-c.ok { border-left-color:var(--pd-ok, #2FA36B); }
    .pd-mini-c.bad { border-left-color:#E5534B; }
    .pd-mini-l { display:block; font-size:var(--pd-fs-micro); text-transform:uppercase; letter-spacing:.06em; color:var(--pd-muted); font-weight:700; }
    .pd-mini-v { display:block; font-size:var(--pd-fs-stat); font-weight:800; line-height:1.2; margin-top:3px; letter-spacing:-.02em; }
    .pd-mini-s { display:block; font-size:var(--pd-fs-micro); color:var(--pd-muted); margin-top:3px; line-height:1.4; }
    .pd-mini-bar { height:5px; border-radius:3px; background:var(--pd-line); margin-top:11px; overflow:hidden; }
    .pd-mini-bar > i { display:block; height:100%; border-radius:3px; background:#2FA36B; }
    .pd-mini-note { margin-top:10px; }
    /* A capped list -- four rows at most, set in config.js. A panel that grew with the register
       would push everything below it off the page on a busy project. */
    .pd-list { list-style:none; margin:12px 0 0; padding:10px 0 0; border-top:1px solid var(--pd-line); display:grid; gap:7px; }
    .pd-list-r { display:flex; align-items:center; gap:8px; font-size:var(--pd-fs-xs); min-width:0; }
    .pd-list-d { color:var(--pd-muted); flex:none; font-variant-numeric:tabular-nums; width:86px; }
    .pd-list-t { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pd-tag { flex:none; font-size:var(--pd-fs-micro); font-weight:700; padding:2px 7px; border-radius:var(--pd-radius-pill);
      border:1px solid var(--pd-line); color:var(--pd-muted); background:var(--pd-bg); }
    .pd-tag-ok { color:#2FA36B; border-color:#2FA36B55; }
    .pd-tag-warn { color:#E08A3C; border-color:#E08A3C55; }
    .pd-tag-bad { color:#E5534B; border-color:#E5534B55; }
    @media (max-width:520px) { .pd-list-d { display:none; } }

    /* ---- S-Curve panel ------------------------------------------------------------------------ */
    .pd-sc-kpi { display:flex; flex-wrap:wrap; gap:16px; font-size:var(--pd-fs-xs); color:var(--pd-muted); margin-bottom:8px; }
    .pd-sc-kpi b { font-size:var(--pd-fs-md); color:var(--pd-ink); font-weight:800; letter-spacing:-.02em; }
    .pd-sc-legend { display:flex; flex-wrap:wrap; gap:14px; font-size:var(--pd-fs-micro); color:var(--pd-muted); margin-bottom:6px; }
    .pd-sc-legend i, .pd-sc-tip i { display:inline-block; width:14px; height:0; border-top-width:2px; border-top-style:solid; margin-right:6px; vertical-align:middle; }
    .pd-sc-legend i.pl, .pd-sc-tip i.pl { border-top-color:#8A93A6; }
    .pd-sc-legend i.ac, .pd-sc-tip i.ac { border-top-color:#2FA36B; }
    .pd-sc-legend i.fc, .pd-sc-tip i.fc { border-top-color:#C9A227; border-top-style:dashed; }
    .pd-sc-legend i.nw { border-top-color:var(--pd-red); }
    /* ⚠️ ONE scroller around the chart AND the table, so a table column is always under the point
       it describes. Two scrollers drift apart the moment either is touched. */
    .pd-sc-scroll { position:relative; overflow-x:auto; overflow-y:hidden; padding-bottom:4px; }
    .pd-sc-inner { position:relative; }
    .pd-sc-svg { display:block; }
    .pd-sc-grid { stroke:var(--pd-line); stroke-width:1; }
    .pd-sc-year { stroke:var(--pd-line); stroke-width:1; stroke-dasharray:2 4; }
    .pd-sc-now  { stroke:var(--pd-red); stroke-width:1.5; opacity:.75; }
    .pd-sc-guide{ stroke:var(--pd-ink); stroke-width:1; opacity:0; pointer-events:none; }
    .pd-sc-pl { fill:none; stroke:#8A93A6; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
    .pd-sc-ac { fill:none; stroke:#2FA36B; stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
    .pd-sc-fc { fill:none; stroke:#C9A227; stroke-width:2; stroke-dasharray:5 4; stroke-linejoin:round; stroke-linecap:round; }
    .pd-sc-tbl { border-collapse:collapse; font-size:var(--pd-fs-micro); table-layout:fixed; margin-top:6px; }
    /* ⚠️ The 46px here is only a FALLBACK. The real widths come from the <colgroup> the panel
       emits, because the column width is computed per render (see scColFor) and the chart and the
       table must be laid out from one number. Under `table-layout:fixed` a col's width beats a
       cell's, so the colgroup wins wherever both are present. */
    .pd-sc-tbl th, .pd-sc-tbl td { width:46px; text-align:center; padding:3px 0; color:var(--pd-muted);
      white-space:nowrap; font-variant-numeric:tabular-nums; }
    .pd-sc-tbl th { font-weight:700; border-bottom:1px solid var(--pd-line); }
    .pd-sc-tbl th small { display:block; font-size:var(--pd-fs-micro); opacity:.75; font-weight:500; }
    /* ⚠️ th.k AND td.k, both. Under `table-layout:fixed` the FIRST row sets every column width,
       and that row is the header — so styling only `td.k` left the header's corner cell at the
       month width, the whole table 46px narrower than it declared, and every month column sitting
       one column to the RIGHT of the chart point it labels. The table looked perfectly tidy and
       was labelling every figure with the wrong month. */
    /* ⚠️ box-sizing:border-box, and it is load-bearing. The default content-box adds the 6px
       padding-right ON TOP of the declared 64px, so the key column measured 70 and every month
       column sat 6px right of its chart point — a small, plausible-looking drift that is still
       the table disagreeing with the chart. The declared width must BE the width, because
       SC_KEY in the script indents the plot by exactly this number. */
    .pd-sc-tbl th.k, .pd-sc-tbl td.k { box-sizing:border-box; position:sticky; left:0; z-index:2;
      width:78px; text-align:left; font-weight:700; background:var(--pd-card, var(--pd-bg));
      padding-right:6px; }
    .pd-sc-tbl th.k { border-bottom:1px solid var(--pd-line); }
    /* ⚠️ The row label says WHICH LINE with a swatch, not by tinting its own text. Tinting put
       10px bold type at 2.42:1 (Forecast) and 3.09:1 (Planned) against the card — a label that
       names a line you cannot read is not colour-coding. The swatch carries the colour; the text
       carries the normal foreground. Same swatch vocabulary as the legend above the chart. */
    .pd-sc-tbl td.k::before { content:''; display:inline-block; width:12px; height:0; margin-right:5px;
      border-top:2px solid transparent; vertical-align:middle; }
    .pd-sc-tbl tr.pl td.k::before { border-top-color:#8A93A6; }
    .pd-sc-tbl tr.ac td.k::before { border-top-color:#2FA36B; }
    .pd-sc-tbl tr.fc td.k::before { border-top-color:#C9A227; border-top-style:dashed; }
    .pd-sc-tbl .now { color:var(--pd-ink); font-weight:800; }
    .pd-sc-tip { position:absolute; top:6px; z-index:3; pointer-events:none; min-width:150px;
      background:var(--pd-card, var(--pd-bg)); border:1px solid var(--pd-line); border-radius:var(--pd-radius-md);
      padding:7px 9px; font-size:var(--pd-fs-micro); color:var(--pd-muted); display:grid; gap:2px;
      box-shadow:0 6px 18px rgba(0,0,0,.28); }
    .pd-sc-tip b { color:var(--pd-ink); font-size:var(--pd-fs-xs); margin-bottom:2px; }
    .pd-sc-tip-s { font-size:var(--pd-fs-micro); opacity:.85; margin-bottom:2px; }

    /* Period switch. .pd-seg now lives in assets/css/dashboard.css (promoted
       2026-09-08). The copy that stood here was identical in effect and, loading
       after that file, was the one actually on screen -- so leaving both would have
       meant the shared block was never the thing rendered. Same control, one
       definition, now shared with the two registers' band toggles.
       The dashboard is the SINGLE-CHOICE mode; .pd-seg-multi is the registers'. */
    /* The head puts the legend slot on the right; the switch shares it with the module link. */
    .pd-viz-h .pd-viz-legend { align-items:center; gap:12px; }

    /* ---- list extras shared by the deadline / MoM / Issues panels ---------------------------- */
    .pd-list-top { margin-top:0; padding-top:0; border-top:0; }
    .pd-list-h { font-size:var(--pd-fs-micro); color:var(--pd-muted); margin-top:12px; padding-top:10px;
      border-top:1px solid var(--pd-line); font-weight:700; }
    .pd-list-h + .pd-list { margin-top:7px; padding-top:0; border-top:0; }
    .pd-list-t small { display:block; font-size:var(--pd-fs-micro); color:var(--pd-muted); font-weight:500;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pd-list-r.done .pd-list-t { opacity:.6; }
    .pd-list-r .pd-no { color:var(--pd-muted); font-weight:700; font-size:var(--pd-fs-micro); }
    .pd-ms { color:#C9A227; }
    .pd-due-r.late .pd-list-t { color:var(--pd-ink); }
    .pd-due-p { flex:none; width:34px; text-align:right; font-size:var(--pd-fs-micro); font-weight:700;
      color:var(--pd-muted); font-variant-numeric:tabular-nums; }

    /* ---- "My items" drawer -------------------------------------------------------------------- */
    .mw-fab { position:fixed; right:18px; bottom:18px; z-index:60; display:inline-flex; align-items:center;
      gap:8px; padding:11px 15px; border-radius:var(--pd-radius-pill); border:1px solid var(--pd-line);
      background:var(--pd-card, var(--pd-bg)); color:var(--pd-ink); font-size:var(--pd-fs-sm); font-weight:700;
      cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.32); }
    .mw-fab:hover { border-color:var(--pd-muted); }
    .mw-fab.has { border-color:var(--pd-red); }
    .mw-fab-ico { font-size:var(--pd-fs-md); line-height:1; }
    .mw-fab-n { min-width:19px; height:19px; padding:0 5px; border-radius:var(--pd-radius-pill); background:var(--pd-red);
      color:#fff; font-size:var(--pd-fs-micro); line-height:19px; text-align:center; font-weight:800; }
    .mw-scrim { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.42);
      opacity:0; transition:opacity .18s ease; }
    .mw-scrim.open { opacity:1; }
    .mw-drawer { position:fixed; top:0; right:0; bottom:0; z-index:71; width:min(460px, 94vw);
      display:flex; flex-direction:column; background:var(--pd-card, var(--pd-bg));
      border-left:1px solid var(--pd-line); box-shadow:-12px 0 34px rgba(0,0,0,.34);
      transform:translateX(100%); transition:transform .2s ease; }
    .mw-drawer.open { transform:translateX(0); }
    .mw-drawer-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 18px; border-bottom:1px solid var(--pd-line); font-size:var(--pd-fs-md); flex:none; }
    .mw-drawer-x { background:none; border:0; color:var(--pd-muted); font-size:var(--pd-fs-hero); line-height:1;
      cursor:pointer; padding:0 4px; }
    .mw-drawer-x:hover { color:var(--pd-ink); }
    .mw-drawer-body { overflow-y:auto; padding:14px 18px 22px; flex:1 1 auto; }
    /* The block was written for a full-width page section; inside a 460px drawer its own head
       is redundant (the drawer has one) and its tables must be allowed to scroll. */
    .mw-drawer-body .mw-sechead { display:none; }
    .mw-drawer-body table { width:100%; }
    .mw-drawer-body .mw-tblwrap, .mw-drawer-body .mw-scroll { overflow-x:auto; }
    @media (prefers-reduced-motion:reduce) {
      .mw-drawer, .mw-scrim { transition:none; }
    }
    @media (max-width:640px) { .mw-fab-txt { display:none; } .mw-fab { padding:12px; } }

    /* ---- Visual panels ---------------------------------------------------------------------- */
    .pd-viz { margin-top:12px; padding:15px 17px 16px; border-radius:var(--pd-radius-lg);
      background:var(--pd-card, var(--pd-bg)); border:1px solid var(--pd-line); }
    .pd-viz-2col { display:grid; grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); gap:12px; }
    .pd-viz-2col > .pd-viz { margin-top:12px; }
    .pd-viz-h { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:13px; }
    .pd-viz-t { font-size:var(--pd-fs-base); font-weight:800; letter-spacing:-.01em; }
    .pd-viz-s { font-size:var(--pd-fs-xs); color:var(--pd-muted); }
    .pd-viz-empty { font-size:var(--pd-fs-sm); color:var(--pd-muted); padding:14px 2px; line-height:1.55; }
    .pd-viz-legend { display:flex; gap:13px; flex-wrap:wrap; font-size:var(--pd-fs-micro); color:var(--pd-muted); }
    .pd-viz-legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }

    /* Programme view — one row per trade.
       ⚠️ The colour rule: NEUTRAL means "when", COLOUR means "how much". The old bar painted the
       trade's date span in the status colour, so a 0%-complete trade showed a big red band that
       read as three-quarters finished. Only the fill and the shortfall band carry colour now. */
    .pd-pv { display:grid; grid-template-columns:196px 1fr 62px; gap:9px 12px; align-items:center; }
    .pd-pv-l { min-width:0; line-height:1.3; }
    .pd-pv-l b { display:block; font-size:var(--pd-fs-xs); font-weight:700; color:var(--pd-ink);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pd-pv-l small { display:block; font-size:var(--pd-fs-micro); color:var(--pd-muted); white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .pd-pv-l small.dim { opacity:.75; }
    .pd-pv-t { position:relative; height:18px; border-radius:9px; background:var(--pd-line); overflow:hidden; }
    /* The span answers WHEN. Neutral by design. */
    .pd-pv-span { position:absolute; top:0; bottom:0; border-radius:9px; overflow:hidden;
      background:var(--pd-card, var(--pd-bg)); border:1px solid var(--pd-line); }
    /* The fill answers HOW MUCH, and is the only thing that carries the status colour. */
    .pd-pv-f { position:absolute; top:0; bottom:0; left:0; border-radius:9px 0 0 9px; opacity:.95; }
    /* Time gone that work has not caught up with — hatched, so it cannot be mistaken for progress. */
    .pd-pv-gap { position:absolute; top:0; bottom:0; opacity:.5;
      background:repeating-linear-gradient(135deg, #E5534B 0 4px, transparent 4px 8px); }
    /* ⚠️⚠️ THIS MARKER WAS INVISIBLE, and had been since it shipped. It read `var(--pd-fg)`,
       and THERE IS NO --pd-fg TOKEN in this app — assets/css/dashboard.css defines --pd-ink.
       An undefined custom property is not a no-op: on an INHERITED property (color, stroke) it
       falls back to the inherited value and looks right by accident, which is why every text
       rule using it seemed fine. `background` is NOT inherited, so it computed to the initial
       value — transparent. The elapsed-time marker, its legend swatch and the S-curve's hover
       guide were all drawing nothing. Found by measuring computed styles, not by looking:
       a marker that is not there and a marker at 0% look identical on a bar. */
    .pd-pv-now { position:absolute; top:-1px; bottom:-1px; width:2px; background:var(--pd-ink);
      opacity:.55; border-radius:1px; }
    /* Its own grid cell, never inside the clipped track — a % that can be sliced mid-digit into a
       different number is worse than no %. */
    .pd-pv-n { font-size:var(--pd-fs-xs); font-weight:700; text-align:right; line-height:1.25; }
    .pd-pv-n small { display:block; font-size:var(--pd-fs-micro); font-weight:500; color:var(--pd-muted); }
    .pd-viz-legend i.pd-lg-span { background:var(--pd-card); border:1px solid var(--pd-line); }
    .pd-viz-legend i.pd-lg-gap { background:repeating-linear-gradient(135deg, #E5534B 0 3px, transparent 3px 6px); }
    .pd-viz-legend i.pd-lg-now { background:var(--pd-ink); opacity:.55; width:3px; border-radius:1px; }
    @media (max-width:720px) {
      .pd-pv { grid-template-columns:132px 1fr 52px; gap:8px; }
      .pd-pv-l small.dim { display:none; }
    }

    /* ==========================================================================================
       PROGRESS PHOTOS — a viewer, not a contact sheet.
       Owner 2026-09-10: *"can you input a progress photos viewer for the dashboard and make it
       visually pleasing."*

       ⚠️ WHAT WAS THERE: six 112×74 thumbnails in a grid, each with a caption under it. At that
       size a site photo is a smudge — you could see THAT photos existed, not what was in one —
       and nothing was clickable, so the only way to look at the work was to leave the dashboard
       for the module.
       ⚠️ WHAT IT IS NOW: one frame big enough to read, a rail of the rest under it, and a full
       lightbox on click. The hero carries its caption OVER the image rather than under it, so the
       picture gets the whole panel width instead of sharing it with a text column.
       ⚠️ 16:9, fixed by aspect-ratio: site photos arrive portrait and landscape from a dozen
       phones, and a frame that resized per photo would make the panel jump on every rail click —
       this panel sits above the module grid, so its height moving is felt down the whole page.
       ⚠️⚠️ The image is `contain`, NOT `cover`. A progress photo cropped to fill a frame is a photo
       with the thing being reported cut out of it. The letterbox is the panel's own ground, so it
       reads as a frame rather than as a gap.
       ========================================================================================== */
    .pd-ph-v { display:grid; gap:9px; }
    .pd-ph-hero { position:relative; aspect-ratio:16/9; border-radius:var(--pd-radius-lg); overflow:hidden;
      background:var(--pd-bg); border:1px solid var(--pd-line); cursor:zoom-in; padding:0; width:100%;
      display:block; text-align:left; }
    .pd-ph-hero img { display:block; width:100%; height:100%; object-fit:contain; }
    /* ⚠️ Only the caption BAND is tinted, never the picture: a scrim over the whole frame dims the
       one thing the panel exists to show. The gradient is what keeps white text legible over a
       photo whose bottom edge might be pale concrete or dark shadow — both are common here. */
    .pd-ph-cap { position:absolute; left:0; right:0; bottom:0; padding:26px 14px 11px; color:#fff;
      background:linear-gradient(to top, rgba(0,0,0,.80) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,0) 100%);
      pointer-events:none; }
    .pd-ph-cap b { display:block; font-size:var(--pd-fs-sm); font-weight:700; line-height:1.3;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.55); }
    .pd-ph-cap small { display:block; margin-top:2px; font-size:var(--pd-fs-micro); opacity:.9;
      text-shadow:0 1px 3px rgba(0,0,0,.55); }
    /* The frame says it opens, without a button sitting on top of the photograph. */
    .pd-ph-hint { position:absolute; top:9px; right:9px; padding:3px 8px; border-radius:var(--pd-radius-pill);
      background:rgba(0,0,0,.55); color:#fff; font-size:var(--pd-fs-micro); font-weight:700;
      opacity:0; transition:opacity .16s ease; pointer-events:none; }
    .pd-ph-hero:hover .pd-ph-hint, .pd-ph-hero:focus-visible .pd-ph-hint { opacity:1; }
    .pd-ph-hero:focus-visible { outline:2px solid var(--pd-red); outline-offset:2px; }
    /* The rail. ⚠️ Scrolls rather than wrapping, for the same height reason as the hero. */
    .pd-ph-rail { display:flex; gap:7px; overflow-x:auto; padding-bottom:3px; scrollbar-width:thin; }
    .pd-ph-t { flex:0 0 auto; width:84px; height:56px; border-radius:7px; overflow:hidden; padding:0;
      border:1px solid var(--pd-line); background:var(--pd-bg); cursor:pointer; position:relative;
      transition:border-color .14s ease, opacity .14s ease; opacity:.62; }
    .pd-ph-t img { display:block; width:100%; height:100%; object-fit:cover; }
    .pd-ph-t:hover { opacity:1; }
    /* ⚠️ A BORDER as well as full opacity marks the current tile. Opacity alone is a difference
       you have to compare to notice; a red edge is one you see. */
    .pd-ph-t.on { opacity:1; border-color:var(--pd-red); box-shadow:0 0 0 1px var(--pd-red); }
    .pd-ph-t:focus-visible { outline:2px solid var(--pd-red); outline-offset:1px; }
    /* Kept from the strip this replaced: a signed URL can fail or expire, and the caption still
       carries the information, so a tile degrades to words rather than to a broken-image icon. */
    .pd-ph-x { display:flex; align-items:center; justify-content:center; width:100%; height:100%;
      color:var(--pd-muted); font-size:var(--pd-fs-micro); text-align:center; padding:4px; }
    /* ---- The lightbox ------------------------------------------------------------------------
       ⚠️ position:fixed on the PAGE, not inside the panel: a viewer clipped by its own card's
       overflow is a viewer the size of the card. z-index clears the My-items drawer (71). */
    .pd-lb { position:fixed; inset:0; z-index:90; display:flex; flex-direction:column;
      background:rgba(8,9,11,.94); opacity:0; transition:opacity .16s ease; }
    .pd-lb.open { opacity:1; }
    .pd-lb-top { flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:12px 16px; color:#fff; }
    .pd-lb-n { font-size:var(--pd-fs-xs); opacity:.75; font-variant-numeric:tabular-nums; }
    .pd-lb-x { background:none; border:0; color:#fff; font-size:26px; line-height:1; cursor:pointer;
      padding:0 6px; opacity:.75; }
    .pd-lb-x:hover { opacity:1; }
    .pd-lb-stage { flex:1 1 auto; min-height:0; position:relative; display:flex; align-items:center;
      justify-content:center; padding:0 8px; }
    .pd-lb-stage img { max-width:100%; max-height:100%; object-fit:contain; border-radius:6px; }
    .pd-lb-nav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px;
      border-radius:50%; border:1px solid rgba(255,255,255,.28); background:rgba(0,0,0,.45);
      color:#fff; font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center;
      justify-content:center; }
    .pd-lb-nav:hover { background:rgba(0,0,0,.7); }
    .pd-lb-nav.prev { left:12px; } .pd-lb-nav.next { right:12px; }
    .pd-lb-nav:disabled { opacity:.25; cursor:default; }
    .pd-lb-foot { flex:none; padding:12px 18px 20px; color:#fff; text-align:center; }
    .pd-lb-foot b { display:block; font-size:var(--pd-fs-md); font-weight:700; }
    .pd-lb-foot small { display:block; margin-top:3px; font-size:var(--pd-fs-xs); opacity:.72; }
    @media (prefers-reduced-motion:reduce) { .pd-lb, .pd-ph-t, .pd-ph-hint { transition:none; } }
    @media (max-width:640px) {
      .pd-ph-t { width:66px; height:44px; }
      .pd-lb-nav { width:38px; height:38px; }
      .pd-lb-foot { padding:10px 14px 16px; }
    }
