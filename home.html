<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/icon.png?v=20260830b" />
  <script src="assets/js/theme.js?v=20260812b"></script>
  <title>Home — Planners Dashboard</title>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260831b" />
  <style>
    /* ---------------------------------------------------------------------
       Landing page, restyled to match the Procurement Dashboard's "Select
       Dashboard" mobile screen (per owner request, 2026-08-30). Bespoke
       markup — NOT UI.renderNavListInto — because that function is shared
       with every module's compact popover + the shell's topbar switcher, and
       reshaping it to a card/pill layout here would risk regressing those.
       Data source (PDb.getProjects/getGroupHeads) and the click targets
       (Portfolio -> portfolio-overview, project -> dashboard.html) are the
       same the app has always used; only the presentation changed. */
    .pd-home-wrap { max-width: 460px; margin: 0 auto; padding: 28px 16px 56px; }
    .pd-home-card { background: var(--pd-card); border: 1px solid var(--pd-line);
      border-radius: var(--pd-radius); box-shadow: var(--pd-shadow); overflow: hidden; }

    .pd-home-brand { text-align: center; padding: 26px 20px 4px; }
    .pd-home-mark { display: block; height: 46px; width: auto; margin: 0 auto 10px; }
    .pd-home-brandname { color: var(--pd-red); font-weight: 800; font-size: 19px; letter-spacing: .01em; }
    .pd-home-brandsub { color: var(--pd-muted); font-size: 11.5px; margin-top: 2px; }

    .pd-home-title { text-align: center; font-size: 21px; font-weight: 800; color: var(--pd-ink);
      margin: 18px 20px 2px; }
    .pd-home-greet { text-align: center; font-size: 13.5px; color: var(--pd-ink); margin: 6px 20px 0;
      display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap; }
    .pd-home-rolepill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10.5px;
      font-weight: 700; text-transform: capitalize; background: var(--pd-red-light); color: var(--pd-red); }
    .pd-home-sub { text-align: center; color: var(--pd-muted); font-size: 12.5px; margin: 4px 20px 18px; }

    .pd-home-choose { padding: 0 20px 14px; }
    .pd-home-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--pd-muted); margin-bottom: 8px; }
    .pd-home-search input { width: 100%; box-sizing: border-box; padding: 9px 12px; font: inherit;
      font-size: 13px; border: 1.5px solid var(--pd-red); border-radius: 8px;
      background: var(--pd-bg); color: var(--pd-ink); }
    .pd-home-search input:focus { outline: none; box-shadow: 0 0 0 3px var(--pd-red-light); }
    .pd-home-count { text-align: right; font-size: 11.5px; color: var(--pd-muted); margin-top: 7px; }

    .pd-home-list { border-top: 1px solid var(--pd-line); }

    .pd-home-row { display: flex; align-items: center; gap: 11px; padding: 12px 20px; cursor: pointer;
      border-bottom: 1px solid var(--pd-line); }
    .pd-home-row:hover { background: var(--pd-bg); }
    .pd-home-row.sel { background: var(--pd-red-light); border-left: 3px solid var(--pd-red);
      padding-left: 17px; }

    .pd-home-radio { flex: none; width: 17px; height: 17px; border-radius: 50%;
      border: 2px solid var(--pd-line); box-sizing: border-box; position: relative; }
    .pd-home-row.sel .pd-home-radio { border-color: var(--pd-red); }
    .pd-home-row.sel .pd-home-radio::after { content: ""; position: absolute; inset: 2.5px;
      border-radius: 50%; background: var(--pd-red); }

    .pd-home-rowbody { min-width: 0; flex: 1; }
    .pd-home-rowtop { display: flex; align-items: center; gap: 8px; }
    .pd-home-code { flex: none; font-size: 10.5px; font-weight: 700; padding: 1px 7px;
      border-radius: 999px; background: var(--pd-red-light); color: var(--pd-red);
      border: 1px solid var(--pd-red); }
    .pd-home-name { font-weight: 700; font-size: 13.5px; color: var(--pd-ink);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pd-home-loc { font-size: 11.5px; color: var(--pd-muted); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .pd-home-portfolio .pd-home-name { font-size: 14px; }

    .pd-home-ghhead { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 20px; background: var(--pd-bg); font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em; color: var(--pd-muted);
      border-bottom: 1px solid var(--pd-line); }
    .pd-home-ghhead.none-gh { font-style: italic; text-transform: none; }
    .pd-home-ghcount { flex: none; font-size: 10.5px; font-weight: 700; padding: 1px 7px;
      border-radius: 999px; background: var(--pd-line); color: var(--pd-muted); }

    .pd-home-empty { padding: 26px 20px; text-align: center; color: var(--pd-muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="pd-app">
    <div class="pd-content">
      <div class="pd-main">
        <div class="pd-home-wrap">
          <div class="pd-home-card">
            <div class="pd-home-brand">
              <img class="pd-home-mark" src="assets/img/favicon.png" alt="Megawide">
              <div class="pd-home-brandname">Planners Dashboard</div>
              <div class="pd-home-brandsub">Megawide Construction Corporation</div>
            </div>
            <div class="pd-home-title">Select Dashboard</div>
            <div class="pd-home-greet" id="home-greet"></div>
            <div class="pd-home-sub">Select the Portfolio, or a project under its Group Head, to continue.</div>

            <div class="pd-home-choose">
              <div class="pd-home-label">Choose a view</div>
              <div class="pd-home-search"><input id="home-q" type="search" placeholder="Search by project name or ID&hellip;" /></div>
              <div class="pd-home-count" id="home-count"></div>
            </div>

            <div class="pd-home-list" id="home-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260828b"></script>
  <script src="assets/js/auth.js?v=20260814a"></script>
  <script src="assets/js/db.js?v=20260827c"></script>
  <script>
  (function () {
    var esc = (window.Fmt && Fmt.esc) || function (s) { return String(s == null ? '' : s); };
    var PROJECTS = [], GROUP_HEADS = [];

    function firstName(profile) {
      var label = profile.name || profile.email || '';
      var first = label.trim().split(/\s+/)[0] || label;
      return first.replace(/[,@].*$/, '');
    }

    function goProject(p) {
      sessionStorage.setItem('pd_project', p.id);
      sessionStorage.setItem('pd_project_name', p.name || p.id);
      sessionStorage.setItem('pd_group_head', p.group_head_id || '');
      sessionStorage.removeItem('pd_package');
      sessionStorage.removeItem('pd_package_name');
      location.href = 'dashboard.html';
    }
    function goPortfolio() { location.href = 'modules/portfolio-overview/index.html'; }

    function render() {
      var q = (document.getElementById('home-q').value || '').trim().toLowerCase();
      var list = PROJECTS.filter(function (p) {
        if (!q) return true;
        return (p.name || '').toLowerCase().indexOf(q) > -1 || (p.id || '').toLowerCase().indexOf(q) > -1;
      });
      document.getElementById('home-count').textContent = list.length + (list.length === 1 ? ' project' : ' projects');

      var ghById = {};
      GROUP_HEADS.forEach(function (g) { ghById[g.id] = g; });
      var byGh = {}, order = [];
      list.forEach(function (p) {
        var k = p.group_head_id || '__none__';
        if (!byGh[k]) { byGh[k] = []; order.push(k); }
        byGh[k].push(p);
      });
      // Group Heads already come sorted by sort_order/name from PDb.getGroupHeads(); walk
      // them in that order, then append any bucket a group head lookup didn't cover, then "— No group head —" last.
      var orderedKeys = [];
      GROUP_HEADS.forEach(function (g) { if (byGh[g.id]) orderedKeys.push(g.id); });
      order.forEach(function (k) { if (orderedKeys.indexOf(k) === -1 && k !== '__none__') orderedKeys.push(k); });
      if (byGh.__none__) orderedKeys.push('__none__');

      var html = '<div class="pd-home-row pd-home-portfolio sel" id="home-portfolio">' +
        '<div class="pd-home-radio"></div>' +
        '<div class="pd-home-rowbody">' +
          '<div class="pd-home-name">Portfolio &mdash; Consolidated View</div>' +
          '<div class="pd-home-loc">All projects &amp; work packages</div>' +
        '</div></div>';

      if (!list.length) {
        html += '<div class="pd-home-empty">No projects match &ldquo;' + esc(q) + '&rdquo;.</div>';
      } else {
        orderedKeys.forEach(function (k) {
          var rows = byGh[k];
          var g = ghById[k];
          html += '<div class="pd-home-ghhead' + (k === '__none__' ? ' none-gh' : '') + '">' +
            '<span>' + (g ? esc(g.name) : '&mdash; No group head &mdash;') + '</span>' +
            '<span class="pd-home-ghcount">' + rows.length + '</span></div>';
          rows.forEach(function (p) {
            html += '<div class="pd-home-row" data-pid="' + esc(p.id) + '">' +
              '<div class="pd-home-radio"></div>' +
              '<div class="pd-home-rowbody">' +
                '<div class="pd-home-rowtop"><span class="pd-home-code">' + esc(p.id) + '</span>' +
                '<span class="pd-home-name">' + esc(p.name) + '</span></div>' +
                (p.location ? '<div class="pd-home-loc">' + esc(p.location) + '</div>' : '') +
              '</div></div>';
          });
        });
      }
      document.getElementById('home-list').innerHTML = html;

      document.getElementById('home-portfolio').onclick = goPortfolio;
      Array.prototype.forEach.call(document.querySelectorAll('.pd-home-list [data-pid]'), function (el) {
        el.onclick = function () {
          var p = list.filter(function (x) { return x.id === el.getAttribute('data-pid'); })[0];
          if (p) goProject(p);
        };
      });
    }

    AppAuth.requireLogin(async function (user, profile) {
      document.getElementById('home-greet').innerHTML =
        'Hi ' + esc(firstName(profile)) + '!' +
        '<span class="pd-home-rolepill">' + esc((profile.role || '').replace(/_/g, ' ')) + '</span>';

      try { PROJECTS = await PDb.getProjects(); } catch (e) {}
      try { GROUP_HEADS = await PDb.getGroupHeads(); } catch (e) {}
      render();
      document.getElementById('home-q').oninput = render;
    });
  })();
  </script>
</body>
</html>
