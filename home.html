<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/icon.png?v=20260830b" />
  <script src="assets/js/theme.js?v=20260812b"></script>
  <title>Home — Planners Dashboard</title>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260830e" />
  <style>
    /* This page IS the landing nav tree — item 1's ask — rendered full-width
       and always expanded (no popover chrome), reusing the exact same list
       body every topbar dropdown uses (UI.renderNavListInto). */
    .pd-home-nt { max-width: 640px; margin: 0 auto; background: var(--pd-card);
      border: 1px solid var(--pd-line); border-radius: var(--pd-radius); box-shadow: var(--pd-shadow); overflow: hidden; }
    .pd-home-nt .pd-nt-search { position: static; }
    .pd-home-wrap { padding: 28px 16px 48px; }
  </style>
</head>
<body>
  <div class="pd-app">
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="assets/img/logo-white.png" alt="Megawide Construction">Planners Dashboard<small>Planning Suite</small></div>
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>EPC &middot; PMO &middot; Planning Suite</div>
    </aside>

    <div class="pd-content">
      <div class="pd-topbar">
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <div class="pd-home-head">
          <h2>Welcome</h2>
          <p>Select the Portfolio, or a project under its Group Head, to continue.</p>
        </div>
        <div class="pd-home-wrap">
          <div class="pd-home-nt" id="home-nt"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260831a"></script>
  <script src="assets/js/auth.js?v=20260814a"></script>
  <script src="assets/js/db.js?v=20260827c"></script>
  <script src="assets/js/ui.js?v=20260830e"></script>
  <script src="assets/js/icons.js?v=20260830b"></script>
  <script>
  (function () {
    AppAuth.requireLogin(async function (user, profile) {
      UI.renderUserBar(profile);
      var isAdmin = profile.role === 'admin' || profile.role === 'super_admin';
      UI.renderNav(document.getElementById('side-nav'), 'portfolio', { active: 'home', isAdmin: isAdmin });

      var projects = [], groupHeads = [];
      try { projects = await PDb.getProjects(); } catch (e) {}
      try { groupHeads = await PDb.getGroupHeads(); } catch (e) {}

      UI.renderNavListInto(document.getElementById('home-nt'), projects, groupHeads, {
        onPortfolio: function () { location.href = 'modules/portfolio-overview/index.html'; },
        onProject: function (p) {
          sessionStorage.setItem('pd_project', p.id);
          sessionStorage.setItem('pd_project_name', p.name || p.id);
          sessionStorage.setItem('pd_group_head', p.group_head_id || '');
          sessionStorage.removeItem('pd_package');
          sessionStorage.removeItem('pd_package_name');
          location.href = 'dashboard.html';
        }
      });
    });
  })();
  </script>
</body>
</html>
