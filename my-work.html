<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/icon.png?v=20260830b" />
  <script src="assets/js/theme.js?v=20260812b"></script>
  <title>Personal Dashboard &mdash; Planners Dashboard</title>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260830c" />
  <link rel="stylesheet" href="assets/css/my-work.css?v=20260827a" />
</head>
<body>
  <div class="pd-app">
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="assets/img/logo-white.png" alt="Megawide Construction">Planners Dashboard<small>Planning Suite</small></div>
      <!-- Contents depend on the current mode (Portfolio here) — rendered by UI.renderNav. -->
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>EPC &middot; PMO &middot; Planning Suite</div>
    </aside>

    <div class="pd-content">
      <div class="pd-topbar">
        <div id="ctx-switcher"></div>
        <h1>Personal Dashboard</h1>
        <button class="pd-btn" id="mw-refresh" style="margin-left:auto;" title="Reload">
          <span data-ico="refresh" data-ico-size="16"></span></button>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <div class="pd-home-head">
          <h2 id="mw-hello">Personal Dashboard</h2>
          <p class="mw-note" id="mw-sub">Everything assigned to your account, across every project you can access.</p>
        </div>
        <div id="mw-body"><p class="mw-empty">Loading&hellip;</p></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260828b"></script>
  <script src="assets/js/auth.js?v=20260814a"></script>
  <script src="assets/js/db.js?v=20260827c"></script>
  <script src="assets/js/program.js?v=20260827a"></script>
  <script src="assets/js/ui.js?v=20260830c"></script>
  <script src="assets/js/icons.js?v=20260830b"></script>
  <script src="assets/js/my-work.js?v=20260827a"></script>
  <script>
  (function () {
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      var isAdmin = profile.role === 'admin' || profile.role === 'super_admin';
      UI.renderNav(document.getElementById('side-nav'), 'portfolio', { active: 'personal-dashboard', base: '', isAdmin: isAdmin });
      UI.renderSwitcher(document.getElementById('ctx-switcher'), { mode: 'portfolio', base: '' });
      var first = (profile.name || '').trim().split(/\s+/)[0] || 'there';
      document.getElementById('mw-hello').textContent = 'Personal Dashboard \u2014 ' + first;
      MyWork.render(document.getElementById('mw-body'), user, profile);
      document.getElementById('mw-refresh').onclick = function () {
        MyWork.render(document.getElementById('mw-body'), user, profile);
      };
    });
  })();
  </script>
</body>
</html>
