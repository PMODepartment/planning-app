<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png" />
  <script src="../../assets/js/theme.js?v=20260812b"></script>
  <title>Resource &amp; Role Master · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260827a" />
  <style>
    /* Uniform sidebar-less chrome (matches Progress Photos / Drawing Register / Cash Flow / S-Curve) */
    .pd-content { width:100%; }
    .pd-topbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px; }
    .pd-topbar #user-bar { margin-left:10px; padding-left:10px; border-left:1px solid var(--pd-line); flex:none; }
    .pd-topbar #pd-theme-toggle { width:34px; height:34px; padding:0; margin-left:4px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
    .rl-modback { width:36px; height:36px; padding:0; flex:none; display:inline-flex; align-items:center; justify-content:center; }
    .rl-title { flex:0 1 auto; min-width:0; display:flex; align-items:center; overflow:hidden; }
    .rl-title .rl-title-txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rl-title-ico { color:var(--pd-red); vertical-align:-3px; margin-right:4px; }
    .rl-projctx { display:flex; align-items:center; min-width:0; flex:0 1 auto; }
    .rl-project { max-width:230px; min-width:120px; height:34px; font-weight:600; font-size:13px; background:transparent; border-color:transparent; }
    .rl-project:hover, .rl-project:focus { background:var(--pd-card); border-color:var(--pd-line); }
    .rl-topbar-tools { display:flex; align-items:center; gap:6px; margin-left:auto; flex-wrap:wrap; }
    .rl-search-input { height:34px; width:200px; font-size:13px; }
    .rl-topbar-tools .pd-btn.rl-tb-labeled { height:34px; padding:0 12px; gap:6px; background:var(--pd-red); border-color:var(--pd-red); color:#fff; }
    .rl-topbar-tools .pd-btn.rl-tb-labeled:hover { filter:brightness(.94); }
    .rl-tb-sep { width:1px; align-self:stretch; margin:5px 3px; background:var(--pd-line); }
    @media (max-width:820px) { .rl-title-txt { display:none; } .rl-search-input { width:140px; } }
    .rl-tabs { display:flex; border-bottom:2px solid var(--pd-line); margin-bottom:14px; }
    .rl-tab { padding:8px 18px; cursor:pointer; font-weight:600; font-size:13px; color:var(--pd-muted); border:none; border-bottom:2px solid transparent; margin-bottom:-2px; background:none; display:inline-flex; align-items:center; gap:6px; }
    .rl-tab.active { color:var(--pd-red); border-bottom-color:var(--pd-red); }

    /* KPI cards */
    .rl-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
    .rl-kpi { background:var(--pd-card); border:1px solid var(--pd-line); border-radius:8px; padding:13px 16px; }
    .rl-kpi-v { font-size:22px; font-weight:800; line-height:1; } .rl-kpi-v.rl-bad { color:var(--pd-bad); }
    .rl-kpi-l { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--pd-muted); margin-top:6px; }

    /* Filter bar (card, matches risk-register / stakeholder-map) */
    .rl-filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; background:var(--pd-card); border:1px solid var(--pd-line); border-radius:var(--pd-radius); padding:8px 12px; }
    .rl-filt-ico { color:var(--pd-muted); flex:none; }
    .rl-filters .pd-select { height:34px; font-size:13px; max-width:200px; }

    .rl-table { width:100%; border-collapse:collapse; font-size:13px; }
    .rl-table th { background:var(--pd-bg); padding:9px 12px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--pd-muted); border-bottom:2px solid var(--pd-line); white-space:nowrap; }
    .rl-table th.num, .rl-table td.num { text-align:right; }
    .rl-table td { padding:8px 12px; border-bottom:1px solid var(--pd-line); }
    .rl-table tr:hover td { background:var(--pd-bg); }
    .rl-badge { font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--pd-bg); }
    .rl-empty { text-align:center; padding:40px; color:var(--pd-muted); }
    .rl-actions { display:flex; gap:5px; }
    .rl-btn-sm { padding:3px 9px; font-size:11px; border-radius:5px; border:1px solid var(--pd-line); background:var(--pd-card); color:var(--pd-ink); cursor:pointer; }
    .rl-btn-sm:hover { border-color:var(--pd-red); color:var(--pd-red); }

    /* Loading (utilization matrix) */
    .rl-load-controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
    .rl-seg { display:inline-flex; border:1px solid var(--pd-line); border-radius:8px; overflow:hidden; }
    .rl-seg button { border:0; background:var(--pd-card); color:var(--pd-ink); padding:6px 13px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
    .rl-seg button + button { border-left:1px solid var(--pd-line); }
    .rl-seg button.active { background:var(--pd-red); color:#fff; }
    .rl-ck { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--pd-ink); cursor:pointer; }
    .rl-matrix { border-collapse:collapse; font-size:12.5px; min-width:100%; }
    .rl-matrix th, .rl-matrix td { padding:7px 10px; border-bottom:1px solid var(--pd-line); text-align:right; white-space:nowrap; }
    .rl-matrix thead th { position:sticky; top:0; z-index:2; background:var(--pd-bg); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--pd-muted); border-bottom:2px solid var(--pd-line); }
    .rl-matrix th:first-child, .rl-matrix td:first-child { position:sticky; left:0; z-index:1; text-align:left; background:var(--pd-card); font-weight:700; }
    .rl-matrix thead th:first-child { z-index:3; background:var(--pd-bg); }
    .rl-matrix tfoot td { font-weight:800; border-top:2px solid var(--pd-line); background:var(--pd-card); }
    .rl-u-ok   { background:rgba(22,163,74,.14); }
    .rl-u-warn { background:rgba(217,119,6,.20); }
    .rl-u-over { background:rgba(220,38,38,.22); color:var(--pd-bad); font-weight:700; }
    .rl-over-tag { font-size:10px; font-weight:700; color:var(--pd-bad); margin-left:6px; }
    .rl-legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:10px; font-size:12px; color:var(--pd-muted); }
    .rl-lg { display:inline-flex; align-items:center; gap:6px; } .rl-lg .sw { width:14px; height:14px; border-radius:3px; display:inline-block; }

    .rl-note { font-size:12px; color:var(--pd-muted); margin-top:10px; }
    .rl-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; align-content:start; }
    .rl-form-full { grid-column:1 / -1; }
    .rl-form-sec { grid-column:1 / -1; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
      color:var(--pd-red); margin:14px 0 -2px; padding-top:12px; border-top:1px solid var(--pd-line); }
    .rl-form-grid > .rl-form-sec:first-child { margin-top:0; padding-top:0; border-top:none; }
    .rl-hint { grid-column:1 / -1; font-size:11.5px; color:var(--pd-muted); margin:-6px 0 0; }
    .rl-days { display:flex; gap:10px; flex-wrap:wrap; }
    .rl-days label { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:400; }

    /* ---- Calendar editor (2026-08-24) --------------------------------------
       Templates, seasonal work patterns and the year preview. The preview is
       the point of all of it: a planner has to SEE how many working days a
       calendar actually gives per month before a duration is counted against
       it, because a mis-ticked Saturday or an overlapping season is invisible
       in a form and very visible in a finish date.
       ---------------------------------------------------------------------- */
    .rl-tpl { grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; }
    .rl-tpl button { text-align:left; padding:9px 11px; border:1px solid var(--pd-border); border-radius:8px;
                     background:var(--pd-card); cursor:pointer; font:inherit; color:inherit; }
    .rl-tpl button:hover { border-color:var(--pd-accent); background:var(--pd-bg); }
    .rl-tpl b { display:block; font-size:12.5px; margin-bottom:3px; }
    .rl-tpl span { font-size:11px; color:var(--pd-muted); line-height:1.35; }
    .rl-season { grid-column:1 / -1; border:1px solid var(--pd-border); border-radius:8px; padding:10px 12px; margin-bottom:8px; background:var(--pd-card); }
    .rl-season-hd { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .rl-season-hd input { flex:1; }
    .rl-mo { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
    .rl-mo label { font-size:11px; font-weight:600; padding:3px 7px; border:1px solid var(--pd-border); border-radius:6px; cursor:pointer; }
    .rl-mo input { display:none; }
    .rl-mo label.on { background:var(--pd-accent); color:#fff; border-color:var(--pd-accent); }
    .rl-season-row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:12px; }
    .rl-warn { grid-column:1 / -1; font-size:11.5px; color:#b45309; margin:0; }
    .rl-yr { grid-column:1 / -1; overflow:auto; max-height:260px; }
    .rl-yr table { border-collapse:collapse; width:100%; min-width:520px; font-size:12px; }
    .rl-yr th, .rl-yr td { padding:5px 8px; border-bottom:1px solid var(--pd-border); text-align:left; white-space:nowrap; }
    .rl-yr th { font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--pd-muted); }
    .rl-yr td.num, .rl-yr th.num { text-align:right; }
    .rl-yr tr.wet td:first-child { box-shadow:inset 3px 0 0 #2563eb; }
    .rl-yr tr.dry td:first-child { box-shadow:inset 3px 0 0 #f59e0b; }
    .rl-yr .rl-hol { font-size:11px; color:var(--pd-muted); white-space:normal; }
  
      /* ---- Mobile & tablet (2026-07-23) --------------------------------
         Shared chrome comes from dashboard.css. The rosters and the Loading
         utilization matrix stay horizontal scrollers: the matrix compares
         resources ACROSS months, which a stacked card layout would destroy.
         ------------------------------------------------------------------ */
      @media (max-width: 700px) {
        .rl-table { min-width: 700px; }
        .rl-kpis { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .rl-filters { flex-wrap: wrap; gap: 8px; }
        .rl-filters > * { flex: 1 1 100%; min-width: 0; }
        .rl-search-input { width: 100%; }
        .rl-form-grid { grid-template-columns: 1fr; }
      }
    </style>
</head>
<body>
<div class="pd-app">
  <!-- Sidebar-less shell (uniform across the suite) -->
  <div class="pd-content">
    <div class="pd-topbar">
      <a class="pd-btn rl-modback" href="../../modules.html" title="Back to modules"><span data-ico="arrowLeft" data-ico-size="18"></span></a>
      <h1 class="rl-title" style="margin:0;">
        <span class="rl-title-ico" data-ico="users" data-ico-size="20"></span>
        <span class="rl-title-txt">Resource &amp; Role Master</span>
      </h1>
      <div class="rl-projctx">
        <select class="pd-select rl-project" id="rl-project" title="Project"></select>
      </div>
      <div class="rl-topbar-tools">
        <input class="pd-input rl-search-input" id="rl-search" placeholder="Search…" />
        <span class="rl-tb-sep"></span>
        <button class="pd-btn pd-btn-primary rl-tb-labeled" id="rl-add"><span data-ico="plus" data-ico-size="15"></span> <span id="rl-add-lbl">Add resource</span></button>
      </div>
      <div id="rl-presence" title="People viewing this project"></div>
      <div id="user-bar"></div>
    </div>
    <div class="pd-main">

      <div class="rl-tabs">
        <button class="rl-tab active" data-tab="resources"><span data-ico="users" data-ico-size="15"></span> Resources</button>
        <button class="rl-tab" data-tab="roles"><span data-ico="group" data-ico-size="15"></span> Roles</button>
        <button class="rl-tab" data-tab="calendars"><span data-ico="calendar" data-ico-size="15"></span> Calendars</button>
        <button class="rl-tab" data-tab="loading"><span data-ico="pulse" data-ico-size="15"></span> Loading</button>
      </div>

      <div class="rl-kpis" id="rl-kpis"></div>
      <div class="rl-filters" id="rl-filterbar" style="display:none;"></div>

      <!-- Master roster (Resources / Roles / Calendars) -->
      <div id="rl-roster">
        <div class="pd-card" style="padding:0;overflow:auto;">
          <table class="rl-table" id="rl-table"></table>
        </div>
        <p class="rl-note">
          OPC-style resource master: Default Units/Time and Max Units/Time (availability) are percentages.
          The <strong>Loading</strong> tab spreads assignments across time to show utilization vs each resource’s availability.
        </p>
      </div>

      <!-- Resource Loading (utilization matrix) -->
      <div id="rl-loading" style="display:none;">
        <div class="rl-load-controls">
          <div class="rl-seg" id="rl-mode">
            <button data-mode="util" class="active">Utilization %</button>
            <button data-mode="units">Units</button>
            <button data-mode="cost">Cost</button>
          </div>
          <label class="rl-ck"><input type="checkbox" id="rl-overonly"> Over-allocated only</label>
        </div>
        <div class="pd-card" style="padding:0;overflow:auto;">
          <table class="rl-matrix" id="rl-matrix"></table>
        </div>
        <div class="rl-legend">
          <span class="rl-lg"><span class="sw rl-u-ok"></span> ≤ 85% of availability</span>
          <span class="rl-lg"><span class="sw rl-u-warn"></span> 86–100%</span>
          <span class="rl-lg"><span class="sw rl-u-over"></span> over-allocated (&gt; 100%)</span>
        </div>
        <p class="rl-note" id="rl-load-note"></p>
      </div>

    </div>
  </div>
</div>

<!-- Modal -->
<div class="pd-modal-overlay" id="rl-modal" style="display:none;">
  <div class="pd-modal" style="max-width:620px;width:95vw;">
    <div class="pd-modal-header"><span id="rl-modal-title">Add</span><button class="pd-modal-close" id="rl-modal-x">&#215;</button></div>
    <div class="pd-modal-body"><form id="rl-form" class="rl-form-grid" onsubmit="return false;"></form></div>
    <div class="pd-modal-footer"><button class="pd-btn" id="rl-cancel">Cancel</button> <button class="pd-btn pd-btn-primary" id="rl-save">Save</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/config.js?v=20260826e"></script>
<script src="../../assets/js/auth.js?v=20260814a"></script>
<script src="../../assets/js/db.js?v=20260827a"></script>
<script src="../../assets/js/program.js?v=20260827a"></script>
<script src="../../assets/js/ui.js?v=20260824a"></script>
<script src="../../assets/js/icons.js?v=20260813a"></script>
<script src="../../assets/js/calendar.js?v=20260824a"></script>

<script src="../../assets/js/collab.js?v=20260812b"></script>
<script>
(function () {
  'use strict';
  var pid = null, tab = 'resources', rows = { resources: [], roles: [], calendars: [] }, editId = null, profile = null, search = '';
  var assignments = [], schedById = {}, loadingLoaded = false;         // Loading view data (lazy)
  var rfilters = { type: '', role: '', discipline: '' };
  var loadMode = 'util', overOnly = false;
  function sb() { return AppAuth.getSB(); }
  function esc(s) { return Fmt.esc(s); }

  // ===== live collaboration (presence + who's-editing row cursor) + offline =====
  // Master data: presence + a row cursor when someone opens the Edit modal + offline
  // UPDATES + a read-cache. Deliberately NO live-value stream (three tables, low
  // traffic) — a reduced form of the register recipe.
  var _collab = null, _remoteSel = {}, _collabSelf = {};
  function joinCollab() {
    if (!window.PDCollab) return;
    if (_collab) { _collab.leave(); _collab = null; }
    _remoteSel = {};
    if (!pid) { renderPresence([]); return; }
    _collab = PDCollab.join({
      key: 'resource_loading:' + pid, projectId: pid, self: _collabSelf,
      onPresence: function (ms) { renderPresence(ms); _remoteSel = {}; ms.forEach(function (m) { if (!m.self && m.sel) _remoteSel[m.id] = { id: m.id, name: m.name, color: m.color, sel: m.sel }; }); paintRemote(); },
      onSelection: function (d) { if (d.sel) _remoteSel[d.id] = { id: d.id, name: d.name, color: d.color, sel: d.sel }; else delete _remoteSel[d.id]; paintRemote(); }
    });
  }
  function renderPresence(ms) { var el = document.getElementById('rl-presence'); if (el) el.innerHTML = window.PDCollab ? PDCollab.avatarsHTML(ms || []) : ''; }
  function broadcastCollabSel(id, editing) { if (_collab) _collab.setSelection(id ? { rowId: id, editing: !!editing } : null); }
  function _collabRow(id) { var rid = (window.CSS && CSS.escape) ? CSS.escape(String(id)) : id; return document.querySelector('tr[data-id="' + rid + '"]') || (function () { var b = document.querySelector('[data-edit="' + rid + '"]'); return b ? b.closest('tr') : null; })(); }
  function paintRemote() { if (!window.PDCollab) return; PDCollab.clearCells(document); Object.keys(_remoteSel).forEach(function (k) { var m = _remoteSel[k]; if (!m || !m.sel || !m.sel.rowId) return; var tr = _collabRow(m.sel.rowId); if (!tr) return; var td = tr.querySelector('td'); if (td) PDCollab.paintCell(td, m); }); }
  var TYPES = ['Labor', 'Nonlabor', 'Material'];
  var TABLES = { resources: 'resources', roles: 'resource_roles', calendars: 'calendars' };
  var DAYS = [['work_mon', 'Mon'], ['work_tue', 'Tue'], ['work_wed', 'Wed'], ['work_thu', 'Thu'], ['work_fri', 'Fri'], ['work_sat', 'Sat'], ['work_sun', 'Sun']];
  var MABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fnum(n, dp) { if (n == null || !isFinite(n)) return '—'; var v = Math.round(n * Math.pow(10, dp)) / Math.pow(10, dp); return v.toLocaleString(undefined, { maximumFractionDigits: dp }); }

  async function loadProjects() {
    var projects = await PDb.getProjects();
    var sel = document.getElementById('rl-project');
    pid = sessionStorage.getItem('pd_project') || (projects[0] && projects[0].id) || null;
    sel.innerHTML = '<option value="">— Select project —</option>' + projects.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === pid ? ' selected' : '') + '>' + esc(p.name || p.id) + '</option>';
    }).join('');
    UI.enhanceProjectSelect(sel);   // shared searchable project picker
    if (pid) load();
  }

  async function load() {
    loadingLoaded = false;   // roster data changed → loading cache is stale
    if (!pid) { rows = { resources: [], roles: [], calendars: [] }; assignments = []; schedById = {}; render(); return; }
    var r1 = await sb().from('resources').select('*').eq('project_id', pid).order('resource_code');
    var r2 = await sb().from('resource_roles').select('*').eq('project_id', pid).order('name');
    var r3 = await sb().from('calendars').select('*').eq('project_id', pid).order('name');
    if (r1.error || r2.error || r3.error) {
      // Offline / network failure → open from the last cached copy (edits queue via PDSync).
      if (window.PDSync) {
        var c1 = await PDSync.cacheGet('rl:resources:' + pid);
        if (c1 && c1.rows) {
          var c2 = await PDSync.cacheGet('rl:roles:' + pid), c3 = await PDSync.cacheGet('rl:calendars:' + pid);
          rows.resources = c1.rows.slice(); rows.roles = (c2 && c2.rows) ? c2.rows.slice() : []; rows.calendars = (c3 && c3.rows) ? c3.rows.slice() : [];
          render(); return;
        }
      }
      UI.toast((r1.error || r2.error || r3.error).message, 'error'); return;
    }
    rows.resources = r1.data || []; rows.roles = r2.data || []; rows.calendars = r3.data || [];
    if (window.PDSync) { PDSync.cachePut('rl:resources:' + pid, rows.resources); PDSync.cachePut('rl:roles:' + pid, rows.roles); PDSync.cachePut('rl:calendars:' + pid, rows.calendars); }
    await ensureDefaultCalendar();
    if (tab === 'loading') await loadLoading();
    render();
  }

  // Lazy-load the assignments + their activities' schedule dates for the Loading matrix.
  async function loadLoading() {
    if (loadingLoaded || !pid) return;
    // Keyset-paginate (Supabase caps a single select at 1000 rows) so projects with
    // many assignments — e.g. a P6/XER import — aren't silently truncated.
    assignments = [];
    var last = null;
    while (true) {
      var q = sb().from('resource_assignments').select('*').eq('project_id', pid).order('id', { ascending: true }).limit(1000);
      if (last) q = q.gt('id', last);
      var a = await q;
      if (a.error) { UI.toast(a.error.message, 'error'); return; }
      var batch = a.data || [];
      assignments = assignments.concat(batch);
      if (batch.length < 1000) break;
      last = batch[batch.length - 1].id;
    }
    schedById = {};
    var codes = Array.from(new Set(assignments.map(function (x) { return x.activity_id; }).filter(Boolean)));
    if (codes.length) {
      // fetch only the assigned activities' dates (chunked IN to stay well under URL limits)
      for (var i = 0; i < codes.length; i += 200) {
        var chunk = codes.slice(i, i + 200);
        var s = await sb().from('project_schedule').select('activity_id,start_date,end_date,actual_start,actual_finish').eq('project_id', pid).in('activity_id', chunk);
        if (s.error) { UI.toast(s.error.message, 'error'); break; }
        (s.data || []).forEach(function (row) {
          if (!schedById[row.activity_id]) schedById[row.activity_id] = { s: row.actual_start || row.start_date, e: row.actual_finish || row.end_date };
        });
      }
    }
    loadingLoaded = true;
  }

  async function ensureDefaultCalendar() {
    if (!pid || rows.calendars.length || !profile) return;
    var d = PDCal.defaultCalendar();
    var payload = { project_id: pid, name: d.name, hours_per_day: d.hours_per_day,
      work_mon: d.work_mon, work_tue: d.work_tue, work_wed: d.work_wed, work_thu: d.work_thu,
      work_fri: d.work_fri, work_sat: d.work_sat, work_sun: d.work_sun, extra_holidays: [],
      is_default: true, created_by: profile.id };
    var res = await sb().from('calendars').insert(payload).select().single();
    if (!res.error) rows.calendars = [res.data];
  }

    var html =
      // WARNING: templates only on a NEW calendar. Offering them while editing
      // invites one click that silently rewrites a pattern other rows already use.
      (isNew ? sec('Start from a template') +
        '<div class="rl-tpl">' + PDCal.CALENDAR_TEMPLATES.map(function (t) {
          return '<button type="button" data-tpl="' + t.key + '"><b>' + esc(t.name) + '</b><span>' + esc(t.note) + '</span></button>';
        }).join('') + '</div>' +
        hint('A template only pre-fills this form &mdash; the saved calendar is an ordinary one you can edit freely afterwards.') : '') +
      sec('Base pattern') +
      fld('Calendar name', '<input class="pd-input" id="f-name" value="' + esc(c.name) + '" placeholder="Philippine Standard (6-day, 8h)">', true) +
      fld('Hours per day', '<input class="pd-input" id="f-hpd" type="number" min="1" max="24" step="0.5" value="' + (c.hours_per_day != null ? c.hours_per_day : 8) + '">') +
      fld('Site climate type (PAGASA)', '<select class="pd-select" id="f-clim"><option value="">&mdash; not set &mdash;</option>' +
        PDCal.PH_CLIMATE_TYPES.map(function (t) {
          return '<option value="' + t.key + '"' + (c.climate_type === t.key ? ' selected' : '') + '>' + esc(t.short) + '</option>';
        }).join('') + '</select>') +
      fld('Working days', '<div class="rl-days">' + DAYS.map(function (d) {
        return '<label><input type="checkbox" data-day="' + d[0] + '"' + (c[d[0]] ? ' checked' : '') + '> ' + d[1] + '</label>';
      }).join('') + '</div>', true) +
      (ct ? hint(esc(ct.name) + ' &mdash; ' + esc(ct.areas) + '.')
          : hint('Setting the climate type seeds the season presets below and the rain-day allowance in a duration scenario. It is where the SITE is, not where the office is &mdash; a Mindanao project planned against a Luzon wet season is the mistake this prevents.')) +

      sec('Holidays') +
      fld('Philippine special (non-working) days',
        '<div class="rl-days"><label><input type="checkbox" id="f-spec"' + (c.observe_special_days ? ' checked' : '') + '> Treat as non-working</label></div>', true) +
      hint('Black Saturday, Ninoy Aquino Day, All Saints&rsquo;, Immaculate Conception and Dec 31. Off by default: a special day is &ldquo;no work, no pay&rdquo; rather than a regular holiday and many sites work them. The 10 PH <em>regular</em> holidays are always applied and are listed in the preview below.') +
      fld('Extra / proclaimed dates', '<textarea class="pd-input" id="f-hol" rows="3" placeholder="2026-03-20">' + esc((c.extra_holidays || []).join('\n')) + '</textarea>', true) +
      hint('One YYYY-MM-DD per line &mdash; Eid&rsquo;l Fitr, Eid&rsquo;l Adha, Chinese New Year, or a proclamation-moved date. These are announced yearly and cannot be computed offline, which is why they are typed rather than derived.') +

      sec('Seasonal work patterns') +
      hint('A season changes the <em>week itself</em> for the months it covers &mdash; a shorter week or shorter days through the monsoon. This is a decision the project has made, so it applies to the live schedule and to every scenario alike. It is not the same as rain days, which are weather <em>taken</em> from you and belong to a duration scenario&rsquo;s rain profile; the two compose.') +
      (ct ? '<div class="rl-form-full"><button type="button" class="rl-btn-sm" id="f-seed">Seed wet/dry seasons from ' + esc(ct.short) + '</button></div>'
          : hint('Pick a climate type above to seed wet/dry season months automatically.')) +
      c.seasons.map(seasonHtml).join('') +
      '<div class="rl-form-full"><button type="button" class="rl-btn-sm" id="f-addseason">+ Add season</button></div>' +
      calOverlapWarning() +

      sec('Year preview &mdash; ' + calPrevYear) +
      hint('The working days this calendar actually gives, month by month. Check it before trusting a finish date to this calendar: a mis-ticked day or an overlapping season is invisible in the form above and obvious here.') +
      calYearPreview();

    form.innerHTML = html;
    // Tab/Enter on an empty field takes the greyed suggestion. Bound on the form,
    // which survives every re-render of its contents.
    if (window.UI && UI.acceptSuggestOnTab) UI.acceptSuggestOnTab(form);
    // ⚠️ A throw in wiring must not leave a rendered form whose controls do nothing.
    try { wireCalForm(isNew); }
    catch (err) { UI.toast('Calendar editor could not attach its controls: ' + (err && err.message || err), 'error'); }
    if (window.Icons) Icons.hydrate(form);
  }

  function seasonHtml(s, i) {
    return '<div class="rl-season" data-season="' + i + '">' +
      '<div class="rl-season-hd">' +
        '<input class="pd-input" data-sfield="label" value="' + esc(s.label || '') + '" placeholder="Wet season — reduced week">' +
        '<button type="button" class="rl-btn-sm" data-sdel="' + i + '">&#215;</button>' +
      '</div>' +
      '<div class="rl-mo">' + MONTH_ABBR.map(function (m, k) {
        var on = (s.months || []).indexOf(k + 1) !== -1;
        return '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" data-smonth="' + (k + 1) + '"' + (on ? ' checked' : '') + '>' + m + '</label>';
      }).join('') + '</div>' +
      '<div class="rl-season-row">' +
        '<span>Hours/day <input class="pd-input" style="width:70px;" type="number" min="1" max="24" step="0.5" data-sfield="hours_per_day" value="' + (s.hours_per_day != null ? s.hours_per_day : '') + '" placeholder="base"></span>' +
        DAYS.map(function (d) {
          // Tri-state on purpose: a season that only shortens the DAY must not be
          // forced to restate the whole week. "base" = inherit the base pattern.
          var val = (s[d[0]] === undefined || s[d[0]] === null) ? '' : (s[d[0]] ? '1' : '0');
          return '<label><select class="pd-select" style="width:66px;padding:2px 4px;" data-sday="' + d[0] + '">' +
            '<option value=""' + (val === '' ? ' selected' : '') + '>base</option>' +
            '<option value="1"' + (val === '1' ? ' selected' : '') + '>work</option>' +
            '<option value="0"' + (val === '0' ? ' selected' : '') + '>off</option>' +
            '</select> ' + d[1] + '</label>';
        }).join('') +
      '</div></div>';
  }

  // Overlapping months are refused rather than averaged: PDCal takes the FIRST
  // matching season, so an overlap would resolve by list order and read as random.
  function calOverlapDupes() {
    var seen = {}, dup = {};
    (calDraft.seasons || []).forEach(function (s) {
      (s.months || []).forEach(function (m) { if (seen[m]) dup[m] = true; seen[m] = true; });
    });
    return Object.keys(dup).map(Number);
  }
  function calOverlapWarning() {
    var d = calOverlapDupes();
    if (!d.length) return '';
    return '<p class="rl-warn">' + d.map(function (m) { return MONTH_ABBR[m - 1]; }).join(', ') +
      ' ' + (d.length > 1 ? 'are' : 'is') + ' claimed by more than one season. Saving is blocked until each month belongs to at most one.</p>';
  }

  function calYearPreview() {
    var st = PDCal.yearStats(calDraft, calPrevYear), ct = calDraft.climate_type;
    var body = st.months.map(function (m) {
      var seas = ct ? PDCal.phSeasonOf(ct, m.month) : '';
      return '<tr class="' + seas + '"><td><strong>' + MONTH_ABBR[m.month - 1] + '</strong>' +
        (m.season ? ' <span class="rl-badge">' + esc(m.season) + '</span>' : '') + '</td>' +
        '<td class="num">' + m.working + '</td>' +
        '<td class="num">' + Math.round(m.hours) + '</td>' +
        '<td>' + (ct ? (seas === 'wet' ? 'Wet' : seas === 'dry' ? 'Dry / sunny' : 'Mixed') : '&mdash;') + '</td>' +
        '<td class="rl-hol">' + (m.holidays.length ? m.holidays.map(function (h) { return esc(h.name); }).join(', ') : '&mdash;') + '</td></tr>';
    }).join('');
    return '<div class="rl-yr"><table><thead><tr><th>Month</th><th class="num">Working days</th>' +
      '<th class="num">Hours</th><th>Season</th><th>Holidays taken out</th></tr></thead><tbody>' + body +
      '<tr><td><strong>Year</strong></td><td class="num"><strong>' + st.total + '</strong></td>' +
      '<td class="num"><strong>' + Math.round(st.months.reduce(function (a, m) { return a + m.hours; }, 0)) + '</strong></td>' +
      '<td colspan="2"></td></tr></tbody></table></div>';
  }

  // Reads the live inputs back into the draft before any re-render, so a name or
  // hours value typed but not yet committed survives adding a season.
  function syncCalDraft() {
    if (!calDraft) return;
    var n = document.getElementById('f-name'); if (n) calDraft.name = n.value.trim();
    var h = document.getElementById('f-hpd'); if (h) calDraft.hours_per_day = parseFloat(h.value) || 8;
    var cl = document.getElementById('f-clim'); if (cl) calDraft.climate_type = cl.value || null;
    var sp = document.getElementById('f-spec'); if (sp) calDraft.observe_special_days = sp.checked;
    var ho = document.getElementById('f-hol');
    if (ho) calDraft.extra_holidays = ho.value.split('\n').map(function (x) { return x.trim(); }).filter(function (x) { return /^\d{4}-\d{2}-\d{2}$/.test(x); });
    DAYS.forEach(function (d) { var e = document.querySelector('[data-day="' + d[0] + '"]'); if (e) calDraft[d[0]] = e.checked; });
  }

  function wireCalForm(isNew) {
    var form = document.getElementById('rl-form');
    form.querySelectorAll('[data-tpl]').forEach(function (b) {
      b.onclick = function () {
        var keep = calDraft.seasons, ct = calDraft.climate_type;
        calDraft = PDCal.templateCalendar(b.dataset.tpl);
        calDraft.seasons = keep; calDraft.climate_type = ct;   // a template is a week shape; it must not un-pick the site
        renderCalForm(isNew);
      };
    });
    // Re-render on the controls the preview depends on. Free-text fields are not
    // re-rendered per keystroke (it would fight the caret) but are synced first.
    ['f-hpd', 'f-clim', 'f-spec', 'f-hol'].forEach(function (id) {
      var e = document.getElementById(id);
      if (e) e.onchange = function () { syncCalDraft(); renderCalForm(isNew); };
    });
    form.querySelectorAll('[data-day]').forEach(function (e) {
      e.onchange = function () { syncCalDraft(); renderCalForm(isNew); };
    });
    var seed = document.getElementById('f-seed');
    if (seed) seed.onclick = function () {
      syncCalDraft();
      calDraft.seasons = PDCal.phSeasonPreset(calDraft.climate_type, {});
      renderCalForm(isNew);
    };
    var add = document.getElementById('f-addseason');
    if (add) add.onclick = function () {
      syncCalDraft();
      calDraft.seasons.push({ id: 's' + Math.random().toString(36).slice(2, 8), label: '', months: [], hours_per_day: null });
      renderCalForm(isNew);
    };
    form.querySelectorAll('[data-sdel]').forEach(function (b) {
      b.onclick = function () { syncCalDraft(); calDraft.seasons.splice(+b.dataset.sdel, 1); renderCalForm(isNew); };
    });
    form.querySelectorAll('.rl-season').forEach(function (box) {
      var s = calDraft.seasons[+box.dataset.season];
      box.querySelectorAll('[data-sfield]').forEach(function (e) {
        e.oninput = function () {
          var f = e.dataset.sfield;
          s[f] = (f === 'hours_per_day') ? (e.value === '' ? null : parseFloat(e.value)) : e.value;
        };
        if (e.dataset.sfield === 'hours_per_day') e.onchange = function () { syncCalDraft(); renderCalForm(isNew); };
      });
      box.querySelectorAll('[data-smonth]').forEach(function (e) {
        e.onchange = function () {
          var m = +e.dataset.smonth;
          s.months = s.months || [];
          var at = s.months.indexOf(m);
          if (e.checked && at === -1) s.months.push(m); else if (!e.checked && at !== -1) s.months.splice(at, 1);
          s.months.sort(function (a, b) { return a - b; });
          syncCalDraft(); renderCalForm(isNew);
        };
      });
      box.querySelectorAll('[data-sday]').forEach(function (e) {
        e.onchange = function () {
          s[e.dataset.sday] = e.value === '' ? null : e.value === '1';
          syncCalDraft(); renderCalForm(isNew);
        };
      });
    });
  }

  function fld(label, control, full) { return '<div class="' + (full ? 'rl-form-full' : '') + '"><label class="pd-label">' + label + '</label>' + control + '</div>'; }
  function sec(label) { return '<div class="rl-form-sec">' + label + '</div>'; }
  function hint(text) { return '<p class="rl-hint">' + text + '</p>'; }

  function v(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  function num(id) { var x = v(id); return x === '' ? null : parseFloat(x); }

  async function save() {
    var payload, table = TABLES[tab];
    if (tab === 'resources') {
      if (!v('f-name')) { UI.toast('Name is required.', 'error'); return; }
      var code = v('f-code');
      if (code) {   // duplicate resource-code guard (within the project)
        var dup = rows.resources.find(function (r) { return r.id !== editId && (r.resource_code || '').toLowerCase() === code.toLowerCase(); });
        if (dup) { UI.toast('Resource ID “' + code + '” already exists in this project.', 'error'); return; }
      }
      payload = { project_id: pid, resource_code: code || null, name: v('f-name'),
        type: document.getElementById('f-type').value, primary_role: document.getElementById('f-role').value || null,
        default_units_per_time: num('f-def'), max_units_per_time: num('f-max'), price_per_unit: num('f-rate'),
        uom: v('f-uom') || null, calendar_id: document.getElementById('f-cal').value || null, remarks: v('f-rem') || null, updated_at: new Date().toISOString() };
    } else if (tab === 'roles') {
      if (!v('f-name')) { UI.toast('Role name is required.', 'error'); return; }
      payload = { project_id: pid, name: v('f-name'), discipline: v('f-disc') || null, uom: v('f-uom') || null, price_per_unit: num('f-rate'), remarks: v('f-rem') || null, updated_at: new Date().toISOString() };
    } else {
      syncCalDraft();
      if (!calDraft.name) { UI.toast('Calendar name is required.', 'error'); return; }
      // A calendar with no working day at all would make addWorkingDays run to its
      // guard and hand back a finish date 20 years out. Refuse it here instead.
      if (!DAYS.some(function (d) { return calDraft[d[0]]; })) { UI.toast('A calendar needs at least one working weekday.', 'error'); return; }
      var dupes = calOverlapDupes();
      if (dupes.length) { UI.toast('Two seasons claim the same month (' + dupes.map(function (m) { return MONTH_ABBR[m - 1]; }).join(', ') + ') — fix that first.', 'error'); return; }
      // Drop seasons that cover no month: they change nothing but read as if they do.
      var seasons = (calDraft.seasons || []).filter(function (x) { return x.months && x.months.length; }).map(function (x) {
        var o = { id: x.id || ('s' + Math.random().toString(36).slice(2, 8)), label: (x.label || '').trim() || 'Season', months: x.months.slice() };
        if (x.hours_per_day != null && x.hours_per_day !== '') o.hours_per_day = Number(x.hours_per_day);
        DAYS.forEach(function (d) { if (x[d[0]] === true || x[d[0]] === false) o[d[0]] = x[d[0]]; });
        return o;
      });
      payload = { project_id: pid, name: calDraft.name, hours_per_day: calDraft.hours_per_day || 8,
        extra_holidays: calDraft.extra_holidays || [], seasons: seasons,
        observe_special_days: !!calDraft.observe_special_days, climate_type: calDraft.climate_type || null,
        updated_at: new Date().toISOString() };
      DAYS.forEach(function (d) { payload[d[0]] = !!calDraft[d[0]]; });
    }
    if (editId) {
      var cur = rows[tab].find(function (x) { return x.id === editId; });
      if (cur) Object.assign(cur, payload);   // optimistic — applies whether online or queued offline
      if (window.PDSync) {
        var w = await PDSync.write({ table: table, op: 'update', id: editId, patch: payload });
        if (!w.ok) { UI.toast((w.error && w.error.message) || 'Save failed', 'error'); return; }
        PDSync.cachePut('rl:' + tab + ':' + pid, rows[tab]);
      } else {
        var ur = await sb().from(table).update(payload).eq('id', editId);
        if (ur.error) { UI.toast(ur.error.message, 'error'); return; }
      }
      UI.toast('Saved.', 'success');
      broadcastCollabSel(null);
      document.getElementById('rl-modal').style.display = 'none'; editId = null; render();
    } else {
      payload.created_by = profile.id;
      var ir = await sb().from(table).insert(payload);
      if (ir.error) { UI.toast(ir.error.message, 'error'); return; }
      UI.toast('Added.', 'success');
      document.getElementById('rl-modal').style.display = 'none'; editId = null; load();
    }
  }

  // Delete with referential guards (the FKs have no ON DELETE, so an in-use delete
  // would otherwise fail with a raw Postgres error).
  async function del(id) {
    if (tab === 'roles') {
      var role = rows.roles.find(function (x) { return x.id === id; });
      var n = role ? resCountForRole(role.name) : 0;
      if (!confirm(n ? n + ' resource(s) list “' + role.name + '” as their Primary Role. Deleting the role leaves that text on them. Delete anyway?' : 'Delete this role?')) return;
    } else if (tab === 'calendars') {
      var cal = rows.calendars.find(function (x) { return x.id === id; });
      var used = resCountForCal(id);
      if (used) { UI.toast(used + ' resource(s) use this calendar — reassign them before deleting.', 'error'); return; }
      if (!confirm((cal && cal.is_default ? 'This is the default calendar. ' : '') + 'Delete this calendar?')) return;
    } else {
      // resource: assignments may not be loaded — count server-side.
      var cnt = await sb().from('resource_assignments').select('id', { count: 'exact', head: true }).eq('resource_id', id);
      if (!cnt.error && cnt.count) { UI.toast(cnt.count + ' assignment(s) reference this resource — remove them in Project Schedule first.', 'error'); return; }
      if (!confirm('Delete this resource?')) return;
    }
    var res = await sb().from(TABLES[tab]).delete().eq('id', id);
    if (res.error) { UI.toast(res.error.message, 'error'); return; }
    UI.toast('Deleted.', 'success'); load();
  }

  AppAuth.requireLogin(function (user, prof) {
    profile = prof; UI.renderUserBar(prof); UI.initShell();
    _collabSelf = { id: (user && user.id) || (prof && prof.id), name: (prof && (prof.name || prof.email)) || 'Someone' };
    document.querySelectorAll('.rl-tab').forEach(function (b) {
      b.onclick = function () {
        tab = b.dataset.tab;
        document.querySelectorAll('.rl-tab').forEach(function (x) { x.classList.toggle('active', x === b); });
        if (tab === 'loading' && !loadingLoaded && pid) { loadLoading().then(render); } else { render(); }
      };
    });
    document.getElementById('rl-project').onchange = function (e) { pid = e.target.value || null; if (pid) sessionStorage.setItem('pd_project', pid); load(); joinCollab(); };
    document.getElementById('rl-search').oninput = function (e) { search = e.target.value; renderRoster(); };
    document.getElementById('rl-add').onclick = function () { openForm(null); };
    document.getElementById('rl-modal-x').onclick = document.getElementById('rl-cancel').onclick = function () { broadcastCollabSel(null); document.getElementById('rl-modal').style.display = 'none'; editId = null; };
    document.getElementById('rl-save').onclick = save;
    document.getElementById('rl-modal').onclick = function (e) { if (e.target === this) { broadcastCollabSel(null); this.style.display = 'none'; editId = null; } };
    document.querySelectorAll('#rl-mode button').forEach(function (b) { b.onclick = function () { loadMode = b.dataset.mode; renderLoading(); }; });
    document.getElementById('rl-overonly').onchange = function (e) { overOnly = e.target.checked; renderLoading(); };
    loadProjects().then(function () { joinCollab(); });
  });
})();
</script>
</body>
</html>
