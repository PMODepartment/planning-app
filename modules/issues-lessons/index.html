<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon-icon.png?v=20260903a" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png?v=20260830b" />
  <script src="../../assets/js/theme.js?v=20260812b"></script>
  <title>Issues, Concerns &amp; Lessons Learned · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260903a" />
  <link rel="stylesheet" href="module.css?v=20260903a" />
</head>
<body>
  <div class="pd-app">
    <!-- Persistent module sidebar (uniform across the suite — see MODULE_CONTRACT.md
         §"Sidebar"). Contents are mode='project', rendered by UI.renderNav below. -->
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="../../assets/img/logo-white.png" alt="Megawide Construction">Planners Dashboard<small>Planning Suite</small></div>
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>EPC &middot; PMO &middot; Planning Suite</div>
    </aside>
    <div class="pd-content">
      <div class="pd-topbar">
        <h1 class="il-title" style="margin:0;">
          <span class="il-title-ico" data-ico="clipboard" data-ico-size="20"></span>
          <span class="il-title-txt" id="il-screen-title">Issues &amp; Concerns</span>
        </h1>
        <div class="il-projctx">
          <select class="pd-select il-project" id="il-project" title="Project"></select>
        </div>

        <!-- Top-level tabs: what was raised is chased in the register, what it taught
             is kept in the library, and Dashboard is a THIRD tab now (not a per-screen
             Dashboard/Log toggle) combining both — every issue regardless of status,
             plus every lesson, in one place. Minutes of Meeting moved to its own module
             (modules/minutes-of-meeting/) — see that module's link back here (the
             "From MOM" tag) and this module's link out to it (the Lessons Learned
             screen's "A meeting action item" source). -->
        <div class="il-tabs" role="tablist">
          <button class="il-tab active" data-screen="issues">Issues &amp; Concerns</button>
          <button class="il-tab" data-screen="lessons">Lessons Learned</button>
          <button class="il-tab" data-screen="dashboard">Issues Dashboard</button>
        </div>

        <!-- Tool cluster beside the profile: one labelled primary + icon tools. The
             Dashboard/Log toggle that used to live here is gone — Dashboard is a tab now.
             Item 1: a topbar search box + funnel toggle, the same UX Progress Photos
             uses — one shared pair of controls; which screen's filters they read/write
             is decided by whichever screen (`screen`) is active. See wireTopFilters()
             in module.js. -->
        <div class="il-topbar-tools">
          <div class="il-topsearch" id="il-topsearch-wrap">
            <input class="pd-input" id="il-topsearch" placeholder="Search…" />
          </div>
          <button class="il-topfilttoggle" id="il-topfilttoggle" title="More filters">
            <span data-ico="filter" data-ico-size="16"></span></button>
          <span class="il-tb-sep"></span>
          <button class="pd-btn pd-btn-primary il-tb-labeled" id="il-new" title="Log a new issue">+ New issue</button>
          <span class="il-tb-sep" id="il-sep"></span>
          <button class="pd-btn" id="il-refresh" title="Reload">
            <span data-ico="refresh" data-ico-size="16"></span></button>
          <!-- Item 8: export the currently-shown Issues or Lessons list (whichever
               screen is active) as Excel / PDF / HTML. Hidden on the Dashboard tab
               (nothing there is "the list" to export) — see syncChrome() in module.js. -->
          <div class="il-exportwrap" id="il-exportwrap">
            <button class="pd-btn" id="il-export-btn" title="Export this list">
              <span data-ico="download" data-ico-size="16"></span></button>
            <div class="il-export-menu" id="il-export-menu">
              <button data-export="excel">Export as Excel (.xlsx)</button>
              <button data-export="pdf">Export as PDF</button>
              <button data-export="html">Export as HTML</button>
            </div>
          </div>
        </div>
        <div id="il-presence" title="People viewing this project"></div>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <!-- ================= Issues & Concerns ================= -->
        <!-- Visible by default (matches the JS default screen='issues'), same
             convention every other module in this app follows — a screen's
             initial visibility must not depend solely on JS having run
             switchScreen()/switchTab()/switchView() before paint. -->
        <div id="il-screen-issues">
          <!-- ITEM #3 / item 1: filters are opt-in, called up by the topbar's search box
               and funnel toggle (above) rather than always shown. The panel stays open
               once revealed until toggled shut again; a dot on the funnel
               (module.css .il-topfilttoggle.has-active) shows a filter narrower than
               the Open default is applied even while the panel is closed. The free-text
               search box below is kept in the DOM (hidden) so filters.search stays bound
               for anything still reading it by id — the topbar box is what a planner
               actually types into now. -->
          <div class="il-filters" id="il-issues-filters">
            <input class="pd-input il-search" id="il-f-search" placeholder="Search issue, cause, corrective action, champion…" hidden />
            <select class="pd-select" id="il-f-status"><option value="">All statuses</option></select>
            <select class="pd-select" id="il-f-department"><option value="">All departments</option></select>
            <select class="pd-select" id="il-f-champion"><option value="">All champions</option></select>
            <select class="pd-select" id="il-f-aging">
              <option value="">Any aging</option>
              <option value="open">Open items only</option>
              <option value="0-30">0–30 days</option>
              <option value="31-90">31–90 days</option>
              <option value="90+">Over 90 days</option>
            </select>
            <button class="il-clear" id="il-clearfilters" title="Clear all filters" hidden>
              <span data-ico="x" data-ico-size="14"></span>Clear filters</button>
          </div>

          <div class="il-kpis" id="il-kpis"></div>

          <!-- LOG: the register as a table — the default now (Dashboard moved to its
               own tab; there is nothing left to toggle to from here). Scanning ten
               issues for the one you want is a different job from reading one of them,
               which is what the DETAIL drill-down (below) is for.
               ITEM 3 (2026-09-02): a List | Kanban toggle (#il-issues-viewbar) plus a
               second, board presentation of the same data (#il-issues-kanban) — both
               built by renderIssuesLog() in module.js, which shows exactly one of
               #il-issues-listwrap / #il-issues-kanban at a time. -->
          <div id="il-issues-log">
            <div id="il-issues-viewbar"></div>
            <div id="il-issues-listwrap">
              <div class="pd-card" style="padding:0;overflow:auto;">
                <table class="pd-table il-table" id="il-table"></table>
              </div>
            </div>
            <div id="il-issues-kanban" hidden></div>
          </div>

          <!-- DETAIL: one issue at a time, laid out the way the Power Apps "View Open
               Issues" screen reports it — status panel beside the issue / cause /
               corrective action. A drill-down reached from the log or the Dashboard
               tab, hidden until then. -->
          <div id="il-issues-view" hidden></div>
        </div>

        <!-- ================= Lessons Learned ================= -->
        <div id="il-screen-lessons" hidden>
          <!-- Item 4: no separate "Lesson category" any more — a lesson is classified by
               Department, the same field an issue already carries, so there is one
               vocabulary instead of two. -->
          <div class="il-filters" id="il-lessons-filters">
            <span class="il-filt-ico" data-ico="filter" data-ico-size="15"></span>
            <input class="pd-input il-search" id="il-lf-search" placeholder="Search lessons…" hidden />
            <select class="pd-select" id="il-lf-department"><option value="">All departments</option></select>
            <button class="il-clear" id="il-lclearfilters" title="Clear all filters" hidden>
              <span data-ico="x" data-ico-size="14"></span>Clear filters</button>
          </div>

          <div class="il-kpis il-kpis-2" id="il-lkpis"></div>
          <div id="il-lessons-view"></div>
        </div>

        <!-- ================= Dashboard =================
             ⚠️ ONE combined analytics screen for both registers — every issue
             regardless of status (open AND closed), plus every lesson, together
             (item 6 — no separate Issues/Lessons sections). Item 1: it now has
             its own filter panel, same topbar search + funnel UX as the other
             two screens, scoped by its own `dFilters` — deliberately separate
             from the Issues/Lessons Log screens' own filter state, so switching
             screens never silently changes what a DIFFERENT screen is showing. -->
        <div id="il-screen-dashboard" hidden>
          <div class="il-filters" id="il-dashboard-filters">
            <span class="il-filt-ico" data-ico="filter" data-ico-size="15"></span>
            <input class="pd-input il-search" id="il-d-search" placeholder="Search issues, champions, departments…" hidden />
            <select class="pd-select" id="il-d-status"><option value="">All statuses</option></select>
            <select class="pd-select" id="il-d-department"><option value="">All departments</option></select>
            <select class="pd-select" id="il-d-champion"><option value="">All champions</option></select>
            <button class="il-clear" id="il-dclearfilters" title="Clear all filters" hidden>
              <span data-ico="x" data-ico-size="14"></span>Clear filters</button>
          </div>
          <div id="il-dashboard-view"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/config.js?v=20260902a"></script>
  <script src="../../assets/js/auth.js?v=20260901b"></script>
  <script src="../../assets/js/db.js?v=20260901d"></script>
  <script src="../../assets/js/program.js?v=20260827a"></script>
  <script src="../../assets/js/ui.js?v=20260902c"></script>
  <script src="../../assets/js/icons.js?v=20260903a"></script>
  <script src="../../assets/js/offline.js?v=20260812b"></script>
  <script src="../../assets/js/collab.js?v=20260812b"></script>
  <script src="../../assets/js/autosave.js?v=20260812b"></script>
  <!-- Item 8: export libraries — same pinned versions the rest of the suite already
       loads (drawing-register/project-schedule/etc for SheetJS; minutes-of-meeting/
       progress-photos for html2pdf.js). Loaded before module.js so both are ready by
       the time an export is clicked; the module degrades with a toast if either
       failed to load rather than throwing. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="module.js?v=20260903b"></script>
  <script>
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      UI.initShell();
      var pname = sessionStorage.getItem('pd_project_name') || sessionStorage.getItem('pd_project') || '';
      UI.renderNav(document.getElementById('side-nav'), 'project', {
        active: 'issues-lessons', base: '../../', pname: pname, modules: APP_CONFIG.MODULES,
      });
      // Issues & Concerns / Lessons Learned / Dashboard as a Project-Schedule-style
      // dropdown instead of a flat tab row (kept from before the Minutes of Meeting
      // split — still worth it at 3 tabs, matching every other module's chrome).
      // `icon: 'clipboard'` (2026-09-03) — the module mark shown before the
      // dropdown, matching config.js's own icon for this module; the `.il-title`
      // <h1> stays hidden (switchScreen() already turns it off on every screen —
      // see that comment for why it's the WHOLE element, never just its text).
      UI.tabsToDropdown('.il-tabs', { icon: 'clipboard' });
      IssuesLessons.init(user, profile);
    });
  </script>
</body>
</html>
