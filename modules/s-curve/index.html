       leaves a row of stubs along the floor of the chart — technically correct and unreadable.
       The bars are scaled to the LARGEST period in the series and the right-hand axis states what
       that scale is, so a bar's height can still be read as a number.
       ⚠️ The scale is taken over planned AND actual AND forecast together, never per series: three
       series each normalised to their own maximum cannot be compared, which is the only reason to
       draw them side by side.
       ⚠️ Drawn BEFORE the grid and the lines, so the curve is never hidden behind a bar. The bars
       answer "how much this month", the lines answer "where are we" — the lines are the subject.

    /* ⚠️⚠️ THE DATA-DATE MONTH'S ACTUAL BAR IS NOT DRAWN IN AUTOMATIC MODE, and this is a
       correctness fix, not a tidy-up. Caught by LOOKING at the chart: the bar reached 97% of the
       axis on a project that had done 35%, i.e. it claimed almost the whole job was built in one
       month.

       The cause is in the engine, and it is deliberate there: every month before the data date is
       MODELLED (`actualAt(monthEnd)`, interpolated from each activity's dates) while the data-date
       month is ANCHORED to the project's true recorded `overallDone`. So the step into that month
       absorbs the entire discrepancy between the modelled curve and reality — which is exactly
       what you want the cumulative line to do, and is NOT a month's production. Drawn as a
       periodic bar it is a wrong claim about one month.

       ⚠️ MANUAL MODE KEEPS ITS BAR: there the data-date month's actual is a figure a planner typed
       for that month, so it is the one thing on the chart that genuinely is that month's work. */

    var perMax = 0;
    [perP, perA, perF].forEach(function (arr) { arr.forEach(function (v) { if (v != null && v > perMax) perMax = v; }); });
    if (!(perMax > 0)) perMax = maxV || 1;

         yearly chart as twelve-month-wide gaps with 16px slivers in the middle of each. */

      /* ⚠️ NO <title> ON THE BARS ANY MORE. A native SVG tooltip appears after a ~1s hover delay,

       fixed "every nth": a 3-year monthly chart needs every 4th and a 3-year quarterly chart needs
       every one, and a hard stride would either crowd one or gut the other. At month granularity
       the year alone is still the label — twelve "Jan 2026 Feb 2026 …" do not fit and never did. */
    var xlab = '';
    (function () {
      var slot = nb > 1 ? (W - padL - padR) / (nb - 1) : (W - padL - padR);

      var stride = Math.max(1, Math.ceil(wantPx / Math.max(1, slot)));
      LB.forEach(function (b, i) {

    var ac = []; L.actualC.forEach(function (v, i) { if (v != null) ac.push(x(Math.min(LB[i].to, d.ti)) + ',' + y(v)); });
    // Forecast to finish: red dashed line from the actual point at the data date
    // up to 100% at the manual forecast-finish date (mapped precisely on the axis).
    function xAt(D) {
      var m0 = d.months[0];
      var fi = (D.getFullYear() - m0.getFullYear()) * 12 + (D.getMonth() - m0.getMonth()) + (D.getDate() - 1) / new Date(D.getFullYear(), D.getMonth() + 1, 0).getDate();

      return padL + (n <= 1 ? 0 : fi / (n - 1) * (W - padL - padR));
    }
    // Forecast to finish: an S-CURVE (not a straight line) following the SHAPE of the remaining
    // planned work, time-stretched to the (SPI-based) forecast finish and scaled from the actual%
    // at the data date up to 100%. So it starts on the actual point and mirrors the plan's ramp.
    var fc = '';
    if (d.fcFinish && d.actualC[d.ti] < d.TOT) {
      var dd = today(), rem = d.TOT - d.plannedC[d.ti];
      var plSpan = +d.plannedEnd - +dd, fcSpan = +d.fcFinish - +dd;
      var pts = [x(d.ti) + ',' + y(d.actualC[d.ti])];
      if (rem > 0.0001 && plSpan > 0 && fcSpan > 0) {
        for (var j = d.ti + 1; j < d.months.length; j++) {
          var mDate = d.months[j]; if (mDate > d.plannedEnd) break;   // month first-of, matches x(j)
          var timeFrac = Math.min(1, (+mDate - +dd) / plSpan);
          var valFrac = Math.min(1, Math.max(0, (d.plannedC[j] - d.plannedC[d.ti]) / rem));
          var fdate = new Date(+dd + timeFrac * fcSpan);

    var todayL = '<line x1="' + tx + '" y1="' + padT + '" x2="' + tx + '" y2="' + (H - padB) + '" class="sc-today"/><text x="' + (tx + 4) + '" y="' + (padT + 10) + '" class="sc-today-lab">Data date</text>';
    /* ==========================================================================================
       ONE TRANSPARENT BAND PER PERIOD — the hover and the click target.
       Owner 2026-09-10: *"when hovering over data, pls show the contents like POC, amount. And
       then when clicked, what are the details in terms of gen req, site works, structural works."*

       ⚠️⚠️ A BAND, NOT THE MARKS THEMSELVES. Hovering a 2px polyline or a 6px bar means hunting
       for the pixel; and the readout is about the PERIOD (planned, actual, forecast and the amount
       together), which is not any one mark's property. The band spans the full plot height and the
       whole gap to its neighbours, so anywhere in that column is a hit.
       ⚠️ Emitted LAST so it is on top of everything, and `fill:transparent` rather than
       `fill-opacity:0` — a zero-opacity fill still receives pointer events in every engine, but a
       reader inspecting the DOM cannot tell it is meant to be invisible.
       ⚠️ Boundaries are the MIDPOINTS between bucket centres, so the bands tile the plot with no
       dead gaps and no overlaps. A per-bucket rect from its own first to last month would leave
       the space between two buckets hitting nothing.

    var hit = '';

          '" width="' + Math.max(0.5, hi - lo) + '" height="' + (H - padT - padB) + '"></rect>';

      hit = '<line class="sc-guide" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) + '" style="display:none"></line>' + hit;
    })();

    // on top. A line hidden behind a bar is a line the planner cannot follow.
    host.innerHTML = '<div class="sc-plot">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" class="sc-svg' + (compact ? ' sc-svg-sm' : '') + '">' + bars + grid + todayL +
      (showLines
        ? '<polyline class="sc-planned" points="' + pl + '"/>' + fc +
          (ac.length ? '<polyline class="sc-earned" points="' + ac.join(' ') + '"/>' : '')
        : '') + xlab + (interactive || opts.hover !== false ? hit : '') + '</svg>' +
      // The readout, positioned against the plot box on hover. Empty until then.
      '<div class="sc-tip" hidden></div></div>' +
      '<div class="sc-legend' + (compact ? ' sc-legend-sm' : '') + '">' +
      (showLines
        ? '<span class="sc-lg"><span class="sw sw-planned"></span> Planned (cumulative)</span>' +
          '<span class="sc-lg"><span class="sw sw-earned"></span> Actual (cumulative)</span>' +
          '<span class="sc-lg"><span class="sw sw-forecast"></span> Forecast to finish</span>'
        : '') +
      (showBars
        ? '<span class="sc-lg"><span class="sw sw-barp"></span> Planned this month</span>' +
          '<span class="sc-lg"><span class="sw sw-bara"></span> Actual this month</span>' +
          '<span class="sc-lg"><span class="sw sw-barf"></span> Forecast this month</span>'
        : '') +
      '<span class="sc-lg"><span class="sw sw-today"></span> Data date (today)</span>' +
      // ⚠️ Says the chart is interactive. A hover readout nobody knows about is a hover readout
      // nobody uses, and this one carries the only amounts on the screen.
      '<span class="sc-lg sc-lg-hint">Hover a ' + (L.per === 'year' ? 'year' : L.per === 'quarter' ? 'quarter' : 'month') +
      ' for its figures' + (interactive ? ' · click for the trade breakdown' : '') + '</span></div>' +
      // ⚠️ Says what the bars' own axis is, because two y-axes on one chart is a thing a reader
      // has to be TOLD about — a bar read against the left-hand axis is out by an order of
      // magnitude, and nothing about the picture reveals that.
      (showBars ? '<p class="sc-note sc-axisnote' + (compact ? ' sc-axisnote-sm' : '') + '">The bars are read against the <b>right-hand</b> axis — ' +
        'each is that ' + (L.per === 'year' ? 'year' : L.per === 'quarter' ? 'quarter' : 'month') +
        '\'s own share of the total, peaking at ' +
        (maxV ? (Math.round(perMax / maxV * 1000) / 10) : 0) + '% in one ' +
        (L.per === 'year' ? 'year' : L.per === 'quarter' ? 'quarter' : 'month') + '. ' +
        'They are the differences between the cumulative points, so they always add back up to the lines.' +
        // ⚠️ An absent bar has to be explained, or it reads as a month of no work.
        (!d.manMode
          ? ' <b>The data-date ' + (L.per === 'year' ? 'year' : L.per === 'quarter' ? 'quarter' : 'month') +
            ' has no actual bar</b>: the curve anchors that point to the ' +
            'project\'s true recorded % complete, so the step into it carries the whole difference ' +
            'between the modelled curve and what has been booked — that is not one month\'s ' +
            'production, so it is not drawn as one. Enter it in <b>Manual</b> mode to state it.'
          : '') +
        '</p>' : '');
    /* ==========================================================================================
       WIRING THE READOUT AND THE BREAKDOWN.
       ⚠️ Bound here rather than once at init, because `host.innerHTML` above destroys the svg on
       every repaint — and this chart repaints on a basis switch, a filter, a granularity change and
       every frame of nothing else. Handlers bound to the old nodes would silently stop firing.
       ⚠️ The readout is positioned in the PLOT's coordinates (its offsetParent), not the page's, so
       it stays with the chart when the page scrolls and needs no scroll listener.
       ========================================================================================== */
    var plot = host.querySelector('.sc-plot'), tip = host.querySelector('.sc-tip');
    var svgEl = host.querySelector('.sc-svg'), guide = host.querySelector('.sc-guide');
    function tipHTML(i) {
      var b = LB[i], amt = bucketAmounts(b);
      var pct = function (v) { return v == null || !maxV ? null : Math.round(v / maxV * 1000) / 10; };
      var pc = pct(L.plannedC[i]), ac2 = pct(L.actualC[i]), fcp = pct(L.forecastC[i]);
      var pp = pct(L.perPlanned[i]), pa = pct(L.perActual[i]), pf = pct(L.perForecast[i]);
      var row = function (k, v, cls) {
        return '<div class="sc-tip-r' + (cls ? ' ' + cls : '') + '"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
      };
      /* ⚠️ THE VARIANCE IS ONLY SHOWN WHERE BOTH SIDES EXIST. A future period has a plan and no
         actual, and "0.0 pp behind" there would read as a project on track rather than as a
         period that has not happened. */
      var varTxt = (pc != null && ac2 != null)
        ? (function () { var v = Math.round((ac2 - pc) * 10) / 10; return (v > 0 ? '+' : '') + v + ' pp'; })()
        : null;
      var out = '<div class="sc-tip-h">' + esc(b.label) +
        (b.months.length > 1 ? '<small>' + b.months.length + ' months</small>' : '') + '</div>';
      out += '<div class="sc-tip-sec">Cumulative by the end of ' + esc(b.label) + '</div>';
      out += row(d.money ? 'Planned value' : 'Planned', pc == null ? '—' : pc + '%');
      out += ac2 == null
        ? row(d.money ? 'Earned value' : 'Actual', '<span class="sc-tip-dim">not yet</span>')
        : row(d.money ? 'Earned value' : 'Actual', ac2 + '%', 'is-act');
      if (fcp != null && ac2 == null) out += row('Forecast', fcp + '%', 'is-fc');
      if (varTxt) out += row('Variance', varTxt, (ac2 - pc) >= 0 ? 'is-ok' : 'is-bad');
      out += '<div class="sc-tip-sec">In this ' + (L.per === 'year' ? 'year' : L.per === 'quarter' ? 'quarter' : 'month') + '</div>';
      out += row('Planned', pp == null ? '—' : pp + '%');
      if (pa != null) out += row('Actual', pa + '%', 'is-act');
      if (pf != null) out += row('Forecast', pf + '%', 'is-fc');
      /* ⚠️⚠️ THE AMOUNT IS EITHER KNOWN OR SAID TO BE UNKNOWN — never derived from days. See
         costCompanion: on the duration basis there is no peso figure in the result at all, so an
         amount here would be a number with no basis. Two distinct absences, two messages: nothing
         is cost-loaded, or the rows this needs are not in memory yet (the fast path holds none). */
      if (amt) {
        out += '<div class="sc-tip-sec">Amount</div>';
        out += row('Planned to date', peso(amt.plannedC));
        if (amt.actualC != null && ac2 != null) out += row('Earned to date', peso(amt.actualC), 'is-act');
        if (amt.perPlanned != null) out += row('Planned this period', peso(amt.perPlanned));
        if (amt.perActual != null && ac2 != null) out += row('Earned this period', peso(amt.perActual), 'is-act');
      } else {
        out += '<div class="sc-tip-none">' + (rowsLoaded && rows.length
          ? 'No amount — nothing is cost-loaded on this schedule.'
          : 'Amounts need the activities. Click to load them.') + '</div>';
      }
      // ⚠️ Only where clicking actually does something — see opts.interactive.
      if (interactive) out += '<div class="sc-tip-cta">Click for the trade breakdown</div>';
      return out;
    }
    function showTip(i, el) {
      if (!tip || !plot) return;
      tip.innerHTML = tipHTML(i);
      tip.hidden = false;
      // ⚠️ Placed against the BAND's own box, then clamped inside the plot — a readout that runs
      // off the right-hand edge of the card is the usual failure of a follow-the-pointer tooltip.
      var pr = plot.getBoundingClientRect(), br = el.getBoundingClientRect();
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var left = (br.left - pr.left) + br.width / 2 - w / 2;
      left = Math.max(4, Math.min(pr.width - w - 4, left));
      var top = Math.max(4, Math.min(pr.height - h - 4, (br.top - pr.top) + 8));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      if (guide) {
        var cx2 = bcx(LB[i]);
        guide.setAttribute('x1', cx2); guide.setAttribute('x2', cx2);
        guide.style.display = '';
      }
    }
    function hideTip() { if (tip) tip.hidden = true; if (guide) guide.style.display = 'none'; }
    if (svgEl) {
      svgEl.querySelectorAll('.sc-hit').forEach(function (r) {
        var i = +r.dataset.b;
        r.addEventListener('mouseenter', function () { showTip(i, r); });
        r.addEventListener('mousemove', function () { if (tip && tip.hidden) showTip(i, r); });
        if (interactive) r.addEventListener('click', function () { openBreakdown(i, L, d); });
        // ⚠️ Keyboard-reachable: the breakdown is the only route to the per-trade figures, and a
        // click-only control makes them unreachable without a mouse.
        r.setAttribute('tabindex', '0');
        r.setAttribute('role', interactive ? 'button' : 'img');
        r.setAttribute('aria-label', LB[i].label + (interactive ? ' — figures and trade breakdown' : ' — figures'));
        r.addEventListener('focus', function () { showTip(i, r); });
        r.addEventListener('blur', hideTip);
        if (interactive) r.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBreakdown(i, L, d); }
        });
      });
      svgEl.addEventListener('mouseleave', hideTip);
    }
  }

  /* ==========================================================================================
     THE TRADE BREAKDOWN — what a clicked period is made of.
     Owner 2026-09-10: *"when clicked, what are the details in terms of gen req, site works,
     structural works, etc."*

     ⚠️⚠️ TWO COLUMNS THAT ARE ROUTINELY CONFUSED, AND THE HEADER SAYS SO: **Own %** is how far
     along that trade is, **Points** is how much of the PROJECT's percentage it is contributing.
     General Requirements at 100% of itself on a job where it is 6% of the scope contributes 6
     points, not 100 — and a reader given only the first number would read a nearly-finished
     project. The points column sums to the project's own figure, which is the check.
     ⚠️ It is a panel under the chart, not a modal. The question it answers is "what is inside
     THAT period", and covering the chart hides the period being asked about.
     ========================================================================================== */
  var bdOpen = null;              // the bucket key currently expanded, or null
  function closeBreakdown() {
    bdOpen = null;
    var el = document.getElementById('sc-bdcard');
    if (el) { el.style.display = 'none'; el.innerHTML = ''; }
  }
  function openBreakdown(i, L, d) {
    var card = document.getElementById('sc-bdcard'); if (!card) return;
    var bk = L.buckets[i];
    // ⚠️ Clicking the open period CLOSES it — the band is the toggle, so there is no second
    // control to find and nothing left open that the planner did not ask for.
    if (bdOpen === bk.key) { closeBreakdown(); return; }
    bdOpen = bk.key;
    card.style.display = '';
    /* ⚠️⚠️ THE PER-TRADE FIGURES NEED THE ACTIVITIES, and the landing view may not have them —
       the RPC monthly aggregate carries no trade (see compute()). So the panel says it is
       fetching and re-opens itself once they arrive, rather than reporting a project with no
       trades, which is what an unguarded read would have shown. */
    if (!rowsLoaded || !rows.length) {
      card.innerHTML = '<div class="sc-bd-head"><h3>' + esc(bk.label) + '</h3></div>' +
        '<div class="sc-man-note">Loading the activities this breakdown needs…</div>';
      ensureRows(function () { render(); var c2 = document.getElementById('sc-bdcard'); if (c2 && bdOpen === bk.key) { bdOpen = null; openBreakdown(i, lens(compute()), compute()); } });
      return;
    }
    var TS = tradeSeries();
    var amt = bucketAmounts(bk);
    var pctOf = function (v) { return v == null || !maxOf(d) ? null : Math.round(v / maxOf(d) * 1000) / 10; };
    var projP = pctOf(L.plannedC[i]), projA = pctOf(L.actualC[i]);
    if (!TS || !TS.rows.length) {
      card.innerHTML = '<div class="sc-bd-head"><h3>' + esc(bk.label) + '</h3>' +
        '<button class="pd-btn pd-btn-sm" id="sc-bdx">Close</button></div>' +
        '<div class="sc-man-note">No trade-tagged activities in this selection, so there is nothing to break down. ' +
        'Set the <b>Trade</b> column in <b>Project Schedule</b>.</div>';
      var x0 = document.getElementById('sc-bdx'); if (x0) x0.onclick = closeBreakdown;
      return;
    }
    // ⚠️ Ordered by what each trade CONTRIBUTES, biggest first — the reading order for "what is
    // this period made of". Alphabetical would bury the answer in the middle.
    var rowsOut = TS.rows.map(function (tr) { return { tr: tr, at: tradeAt(tr, bk) }; })
      .sort(function (a, b) { return (b.at.pts || 0) - (a.at.pts || 0); });
    var sumPts = 0, sumPtsA = 0, sumAmt = 0, anyAmt = false;
    rowsOut.forEach(function (r) {
      sumPts += r.at.pts || 0; sumPtsA += r.at.ptsA || 0;
      if (r.at.amtP != null) { sumAmt += r.at.amtP; anyAmt = true; }
    });
    var body = rowsOut.map(function (r) {
      var tr = r.tr, at = r.at;
      var own = at.own == null ? null : Math.round(at.own * 10) / 10;
      var ownA = at.ownA == null ? null : Math.round(at.ownA * 10) / 10;
      var gap = (own != null && ownA != null) ? Math.round((ownA - own) * 10) / 10 : null;
      var trAmtP = at.amtP;
      if (tr.empty) {
        return '<tr class="sc-bd-empty"><td class="k">' + esc(tr.trade) + '</td>' +
          '<td colspan="5">' + tr.n + ' activit' + (tr.n === 1 ? 'y' : 'ies') +
          ', none of them dated — no curve to read</td></tr>';
      }
      return '<tr><td class="k"><span class="dot"' + (isGR(tr.trade) ? ' style="background:#C9A227"' : '') + '></span>' +
          esc(tr.trade) + '<small>' + Math.round(tr.share * 1000) / 10 + '% of the project</small></td>' +
        '<td>' + (own == null ? '—' : own + '%') + '</td>' +
        '<td class="is-act">' + (ownA == null ? '—' : ownA + '%') + '</td>' +
        '<td class="' + (gap == null ? '' : gap >= 0 ? 'sc-ok' : 'sc-bad') + '">' +
          (gap == null ? '—' : (gap > 0 ? '+' : '') + gap + ' pp') + '</td>' +
        '<td>' + (at.pts == null ? '—' : Math.round(at.pts * 10) / 10) + '</td>' +
        '<td>' + (trAmtP == null ? '—' : peso(trAmtP)) + '</td></tr>';
    }).join('');
    card.innerHTML =
      '<div class="sc-bd-head"><h3>' + esc(bk.label) + ' — by trade</h3>' +
        '<span class="sc-note" style="margin:0;">' +
          (projP == null ? '' : 'project planned <b>' + projP + '%</b>') +
          (projA == null ? '' : ' · actual <b>' + projA + '%</b>') +
          (amt ? ' · ' + peso(amt.plannedC) + ' planned to date' : '') + '</span>' +
        '<button class="pd-btn pd-btn-sm" id="sc-bdx" style="margin-left:auto;">Close</button></div>' +
      '<div class="sc-sheetwrap"><table class="sc-sheet sc-bd">' +
        '<thead><tr>' +
          '<th class="k">Trade</th>' +
          '<th title="How far along this trade is, as a share of its OWN scope">Own % planned</th>' +
          '<th class="ac" title="How far along this trade actually is, as a share of its own scope">Own % actual</th>' +
          '<th title="This trade against its own plan, in points of its own scope">vs plan</th>' +
          '<th title="Points of the PROJECT\'s percentage this trade contributes — these sum to the project figure">Points of project</th>' +
          '<th title="This trade\'s own cost-loaded planned value at this date — from its own cost curve, not a share of the project\'s">Planned value to date</th>' +
        '</tr></thead><tbody>' + body + '</tbody>' +
        '<tfoot><tr><td class="k">Total</td><td>' + Math.round(sumPts * 10) / 10 + '</td>' +
          '<td class="is-act">' + Math.round(sumPtsA * 10) / 10 + '</td><td>—</td>' +
          '<td>' + Math.round(sumPts * 10) / 10 + '</td>' +
          '<td>' + (anyAmt ? peso(sumAmt) : '—') + '</td></tr></tfoot>' +
      '</table></div>' +
      '<div class="sc-man-note">' +
        '<b>Own %</b> is how far along that trade is. <b>Points of project</b> is how much of the ' +
        'project\'s own percentage it is contributing — a trade at 100% of itself that is 6% of the ' +
        'scope contributes 6 points, not 100. The points column adds up to the project figure above.' +
        (anyAmt
          ? ' <b>Planned value</b> is each trade\'s OWN cost curve at this date, not a share of the ' +
            'project\'s money split by duration — a trade can be a tenth of the programme and a ' +
            'third of the cost. A trade with nothing priced shows no amount rather than an estimate.'
          : ' <b>No amounts</b> — nothing is cost-loaded on this schedule.') +
      '</div>';
    var xb = document.getElementById('sc-bdx'); if (xb) xb.onclick = closeBreakdown;
  }
  // The denominator every percentage on this screen is taken against.
  function maxOf(d) { return d.TOT || 1; }

  function renderTable(d) {
    var wrap = document.getElementById('sc-tablewrap');
    if (!wrap) return;
    if (d.empty) { wrap.innerHTML = '<div class="sc-empty">No data.</div>'; return; }
    /* ⚠️⚠️ THE TABLE READS THE SAME LENS AS THE CHART, never its own bucketing of the same result.
       A quarterly chart over a monthly table is the shape of bug that gets believed: both are
       plausible, neither is obviously wrong, and the planner takes whichever they read second.
       ⚠️ The periodic rows are here too, because at quarterly and yearly granularity "what did we
       do IN Q3" is the figure a monthly table could never show and is what the bars now draw. */
    var T = lens(d);
    var pctOf = function (v) { return (v == null || !d.TOT) ? null : Math.round(v / d.TOT * 1000) / 10; };
    var head = '<th>POC</th>' + T.buckets.map(function (b) {
      return '<th>' + esc(T.per === 'month'
        ? b.label.replace(/ (\d{2})(\d{2})$/, " '$2")
        : b.label) + '</th>';
    }).join('');
    var cell = function (v, cls) { var x = pctOf(v); return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + (x == null ? '—' : x + '%') + '</td>'; };
    var planned = '<td>' + (d.money ? 'Planned value %' : 'Planned %') + '</td>' +
      T.plannedC.map(function (v) { return cell(v); }).join('');
    var actual = '<td>' + (d.money ? 'Earned value %' : 'Actual %') + '</td>' +
      T.actualC.map(function (v) { return cell(v); }).join('');
    var hasForecast = T.forecastC.some(function (v) { return v != null; });
    var forecast = hasForecast
      ? '<td>Forecast %</td>' + T.forecastC.map(function (v) { return cell(v, 'sc-fc-cell'); }).join('')
      : '';
    var pw = T.per === 'year' ? 'year' : T.per === 'quarter' ? 'quarter' : 'month';
    var perPl = '<td>Planned this ' + pw + '</td>' + T.perPlanned.map(function (v) { return cell(v); }).join('');
    var perAc = '<td>Actual this ' + pw + '</td>' + T.perActual.map(function (v) { return cell(v); }).join('');
    wrap.innerHTML = '<table class="sc-table"><thead><tr>' + head + '</tr></thead><tbody><tr>' +
      planned + '</tr><tr>' + actual + '</tr>' +
      (hasForecast ? '<tr class="sc-fc-row">' + forecast + '</tr>' : '') +
      '<tr class="sc-per-row">' + perPl + '</tr>' +
      '<tr class="sc-per-row">' + perAc + '</tr>' +
      '</tbody></table>';
  }

  /* ⚠️⚠️ REGISTERED BEFORE requireLogin AND OUTSIDE ITS CALLBACK, which is the whole point. That
     callback is two network round-trips away, and until it resolves the raw tab row sits on screen
     fully visible with nothing to convert it — the boot flash this app already fixed for six other
     modules. It needs neither auth nor project data, only the markup.
     ⚠️ A THIRD DOMContentLoaded listener, and initModuleTopbar() is deliberately NOT called here:
     theme.js injects into .pd-topbar assuming it runs BEFORE initModuleTopbar() restructures it,
     and both are DOMContentLoaded listeners fired in registration order. Registering last gets the
     required order for free; calling initModuleTopbar() early was tried in risk-register and
     reverted because it broke that injection. */
  (function () {
    function go() { if (window.UI && UI.tabsToDropdown) UI.tabsToDropdown('.sc-tabs'); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
    else go();
  })();
  AppAuth.requireLogin(function (user, prof) {
    UID = user.id; profile = prof;
    UI.renderUserBar(prof);
    UI.initShell();
    var pname = sessionStorage.getItem('pd_project_name') || sessionStorage.getItem('pd_project') || '';
    UI.renderNav(document.getElementById('side-nav'), 'project', {
      active: 's-curve', base: '../../', pname: pname, modules: APP_CONFIG.MODULES,
    });
    document.getElementById('sc-project').onchange = function (e) { pid = e.target.value || null; if (pid) sessionStorage.setItem('pd_project', pid); load().then(joinCollab); };
    document.getElementById('sc-refresh').onclick = function () { load(); };
    /* The tab strip. ⚠️ Wired here, beside every other control, because the buttons are static
       markup — tabsToDropdown() below only builds a second way to press them. */
    document.querySelectorAll('.sc-tabs [data-view]').forEach(function (b) {
      b.onclick = function () { switchView(b.dataset.view); };
    });
    // ⚠️ Switching TO cost re-loads: the duration path may have been served by the RPC aggregate,
    // which carries no `planned_cost`, so the rows simply are not in memory yet. Switching back is a
    // repaint — the rows we already hold answer both.
    document.querySelectorAll('#sc-weight [data-w]').forEach(function (b) {
      b.onclick = function () {
        if (basis === b.dataset.w) return;
        basis = b.dataset.w;
        try { localStorage.setItem(basisKey(), basis); } catch (e) {}
        if (basis === 'cost' && !rows.length) load(); else render();
      };
    });
    /* ⚠️ SWITCHING TO MANUAL NEEDS BOTH: the sheet (from the two new tables) AND the activities
       (to weight the trades — the manual numbers are the progress, the schedule is still the
       scope). Switching back to Automatic needs neither, so it is a repaint. */
    document.querySelectorAll('#sc-mode [data-m]').forEach(function (b) {
      b.onclick = function () {
        if (mode === b.dataset.m) return;
        mode = b.dataset.m;
        try { localStorage.setItem(modeKey(), mode); } catch (e) {}
        if (mode === 'manual') {
          showLoading();
          loadManual().then(function () { hideLoading(); ensureRows(function () { render(); }); },
                            function () { hideLoading(); render(); });
        } else render();
      };
    });
    document.getElementById('sc-forecast').onchange = function (e) {
      var v = e.target.value;
      // Set a date to pin (override) the forecast finish; clear it to revert to the auto SPI forecast.
      if (v) { fcManual = true; forecastFinish = pd(v); } else { fcManual = false; forecastFinish = null; }
      try { if (v) localStorage.setItem(fcKey(), v); else localStorage.removeItem(fcKey()); } catch (er) {}
      render();
    };
    document.getElementById('sc-tabletoggle').onclick = function () {
      var card = document.getElementById('sc-tablecard');
      var show = card.style.display === 'none';
      card.style.display = show ? '' : 'none';
      // icon-only tool: reflect state via title + active fill, not a text relabel
      this.title = show ? 'Hide data table' : 'Show data table';
      this.classList.toggle('is-active', show);
    };
    loadProjects();
  });
})();
</script>
</body>
</html>
