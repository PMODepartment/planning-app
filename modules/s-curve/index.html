    // month instead of every leaf activity (16k–40k on large schedules). Falls back to a
    // lean, keyset-paginated row fetch when the RPC isn't deployed yet.
    // ⚠️ The RPC aggregate is duration-only by construction (it returns pre-summed month buckets and
    // knows nothing about money), so the COST basis deliberately skips it and pays for the per-row
    // fetch. Trying to serve a cost curve from a duration aggregate is how a chart ends up labelled
    // in pesos while plotting days.
    try {
      if (basis !== 'cost') {
        var r = await sb().rpc('schedule_scurve_agg', { p_id: pid });
        if (!r.error && r.data && r.data.months) agg = r.data;
      }
    } catch (e) { agg = null; }
    if (!agg) {
      try {
        // ⚠️ ONE select list, in fetchRows — the two paths used to carry their own copies and a
        // column added to one silently read undefined in the other, which flattens the curve
        // rather than throwing.
        rows = await fetchRows(); rowsLoaded = true;
      } catch (e) {
        hideLoading();
        // Offline / fetch failed: render the last-cached curve so it still opens.
        if (window.PDSync) {
          var c = await PDSync.cacheGet('sc:' + pid);
          if (c && c.rows) { agg = c.rows.agg || null; rows = c.rows.rows || []; }
        }
        if (!agg && !rows.length) { UI.toast('Load failed: ' + (e.message || e), 'error'); return; }
        var sv0 = null; try { var s0 = localStorage.getItem(fcKey()); if (s0) sv0 = pd(s0); } catch (er) {}
        fcManual = !!sv0; forecastFinish = sv0 || null; render(); return;
      }
    }
    hideLoading();
    if (window.PDSync) PDSync.cachePut('sc:' + pid, { agg: agg, rows: rows });   // offline read-cache
    // Forecast finish is performance-based (auto) unless the user has pinned a date for this
    // project; a saved value = manual override. The input is filled in render() with the
    // effective date (auto or manual) once the SPI-based projection is computed.
    var saved = null; try { var sv = localStorage.getItem(fcKey()); if (sv) saved = pd(sv); } catch (e) {}
    fcManual = !!saved; forecastFinish = saved || null;
    /* ⚠️ A project that opens on Manual needs its sheet AND its rows before the first paint —
       otherwise the card flashes the "loading the activities" state on every open. The automatic
       path is untouched and still paints straight from the RPC aggregate. */
    if (mode === 'manual') {
      await loadManual();
      if (!manMissing && !rows.length) { try { rows = await fetchRows(); rowsLoaded = true; } catch (e) {} }
    }
    render();
  }

  // ⚠️ THE CURVE MATHS IS NO LONGER IN THIS FILE (2026-09-01). Two bases, the per-activity
  // spread curve, the SPI forecast and the month walk all moved to assets/js/scurve.js so the
  // DASHBOARD could draw the same curve; copying ~150 lines onto a second screen is how two
  // screens come to disagree about one project's progress. Read the engine there.
  // What stays HERE is the one thing that is genuinely this module's: the RPC branch.
  // `schedule_scurve_agg` returns pre-summed month buckets and is far faster than a per-row
  // fetch on a large schedule, but it is duration-only by construction — so the cost basis
  // deliberately skips it and lets the engine walk the rows.
  // The server aggregate, reshaped into the same {TOT, plannedAt, actualAt, …} contract the
  // shared engine consumes. Cumulative planned (pd) + actual (ad) at each month END, with a
  // 0-point prepended at the schedule start so sub-month values interpolate linearly.
  function rpcSeries() {
    var start = pd(agg.minDate);
    var pts = [{ t: +start, pd: 0, ad: 0 }];
    agg.months.forEach(function (mm) {
      var y = +String(mm.key).slice(0, 4), mo = +String(mm.key).slice(5, 7);
      pts.push({ t: +new Date(y, mo, 0), pd: +mm.pd || 0, ad: +mm.ad || 0 });
    });
    function interp(f, t) {
      if (t <= pts[0].t) return 0;
      var last = pts[pts.length - 1]; if (t >= last.t) return last[f];
      for (var i = 1; i < pts.length; i++) {
        if (t <= pts[i].t) { var a = pts[i - 1], b = pts[i]; var r = (b.t - a.t) ? (t - a.t) / (b.t - a.t) : 0; return a[f] + (b[f] - a[f]) * r; }
      }
      return last[f];
    }
    if (!(+agg.totDur > 0) || !start) return null;
    return {
      TOT: +agg.totDur, overallDone: +agg.doneDur || 0,
      minDate: start, plannedEnd: pd(agg.maxDate), nAct: agg.nAct || 0,
      plannedAt: function (D) { return interp('pd', +D); },
      actualAt: function (D) { return interp('ad', +D); }
    };
  }

  // ⚠️⚠️ THE SPREAD CURVE now lives in the shared engine, and this is the resolution of a
  // problem the old comment here described at length. Owner 2026-08-26: *"there should be a step
  // wherein the manner of distribution of an activity is defined… bell curve, front loaded, back
  // loaded, linear… in order to give a more accurate projection."* Cost Loading's "Spread over
  // time" step writes `project_schedule.cost_curve`; the engine reads it.
  // ⚠️ It used to be TRANSCRIBED here rather than shared — a second copy of `curveCdf` held to
  // the schedule module's copy by an assertion script, because a module could not reach into
  // another module's closure. assets/js/scurve.js is a shared asset, so there is now ONE copy and
  // nothing to hold in agreement. Do not re-transcribe it.
  // ⚠️ Reports the MIX rather than a single word. A schedule is routinely part-curved, and a note
  // reading "bell" over a project where three activities out of 300 are bell-shaped would be a
  // confident wrong answer about the whole curve. All-linear says so explicitly, and names where the
  // shape is set — otherwise "linear" reads as a property of the project rather than an unmade choice.
  function shapeNote(sh) { return PDScurve.shapeNote(sh); }
  function peso(n) {
    if (n == null || !isFinite(n)) return '—';
    if (Math.abs(n) >= 1e9) return '₱' + (Math.round(n / 1e8) / 10) + 'B';
    if (Math.abs(n) >= 1e6) return '₱' + (Math.round(n / 1e5) / 10) + 'M';
    if (Math.abs(n) >= 1e3) return '₱' + (Math.round(n / 100) / 10) + 'K';
    return '₱' + Math.round(n);
  }
  // Delegates to the shared engine; the module supplies only what is module-specific — which
  // basis is selected, whether the planner has pinned a forecast finish, and the RPC series.
  /* ==========================================================================================
     TWO SOURCES FOR ONE CURVE.
     Owner 2026-09-10: *"i want you to provide 2 options for the users, Manual intervention or
     automatic detecting. … For automatic detecting, it should be linked to the per trade
     accomplishment declared in the schedule."*

     AUTOMATIC is what this module already was: the curve is derived from `project_schedule` by
     the shared engine, and the trade filter above is what makes it *per trade*.
     MANUAL is the planner's own monthly S-curve, entered per trade — the curve that on a real job
     is negotiated and submitted before the schedule is fully loaded, and reported against monthly.

     ⚠️⚠️ THE TWO ARE NEVER MERGED, AND NEVER AVERAGED. A curve is either the schedule's or the
     planner's; the mode is stated on the card and travels into the heading, because screenshots of
     this card end up in reports and a manual curve read as a schedule-derived one is a claim
     nobody made. Switching modes changes nothing in the other one's data.
     ⚠️ Per project, not per user: two planners on one project must see one manual curve, which is
     why this lives in a table and not in localStorage. The chosen MODE is per user (it is a way of
     looking, not a fact about the project) and per project (one job is manually curved, another
     is not).
     ========================================================================================== */
  var mode = 'auto';              // 'auto' | 'manual'
  function modeKey() { return 'sc_mode_' + pid; }
  var MAN = null;                 // { rows: [...], locked: bool, lockedAt, lockedBy } or null
  var manMissing = false;         // the migration has not been run on this database
  /* ⚠️ `manTrade` IS GONE. The sheet showed one trade at a time, so it needed to remember which;
     the matrix shows every trade as a row, so the thing that has to be remembered is which KIND is
     being entered — see the note on the matrix in renderManual for why the kind is a mode. */
  var manKind = 'planned';        // 'planned' | 'actual' | 'forecast' — which sheet is being typed
  var manDirty = {};              // 'trade|YYYY-MM|kind' -> pct, not yet saved

  function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function monthFirstISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }
  function manCellKey(trade, mk, kind) { return trade + '|' + mk + '|' + kind; }

  /* ⚠️⚠️ WHAT A TRADE IS WORTH. A project curve cannot be the AVERAGE of its trades' POCs — a
     trade that is 2% of the job would then move the project as much as one that is 40% of it, and
     the resulting curve would be wrong in a way that looks entirely plausible. So each trade
     carries the weight the CURRENT BASIS gives it, taken from the schedule: its share of total
     duration, or of loaded cost.
     ⚠️ The weights come from the schedule even in Manual mode, and that is deliberate: the manual
     numbers are the PROGRESS, the schedule is still the SCOPE. A planner who wants different
     weights changes the schedule or the cost loading, where that decision belongs and is visible
     to every other module reading it.
     ⚠️ A trade the schedule does not know gets weight 0 and is REPORTED rather than dropped — see
     the editor's note. Silently giving it an equal share would invent scope. */
  function tradeWeights() {
    var w = {}, tot = 0;
    (rows || []).forEach(function (r) {
      if (PDScurve.isWbs(r)) return;
      var t = tradeOf(r), v;
      if (basis === 'cost') v = +r.planned_cost || 0;
      else {
        var sd = pd(r.start_date), ed = pd(r.end_date);
        v = (sd && ed) ? (Math.round((ed - sd) / 86400000) + 1) : 0;
      }
      if (!(v > 0)) return;
      w[t] = (w[t] || 0) + v; tot += v;
    });
    return { w: w, tot: tot };
  }

  // Has the project been actualized? ⚠️ Asked of the SCHEDULE, not of the manual sheet: "the
  // project is actualized" is a fact about the job, and a planner must not be able to unlock the
  // baseline by deleting their own actual entries.
  function scheduleHasActuals() {
    return (rows || []).some(function (r) {
      return !PDScurve.isWbs(r) && (+r.percent_complete > 0 || r.actual_start || r.actual_finish);
    });
  }
  /* THE PLANNED CURVE IS READ-ONLY WHEN EITHER IS TRUE:
       · a planner has locked it (recorded in scurve_manual_meta, with who and when), or
       · the schedule carries recorded progress — the *"locked as the project is actualized"* half,
         which needs no storage because it is a fact about the schedule.
     ⚠️ Both are stated on screen with which one is in force, because "why can't I type here" is
     the first question a read-only cell raises. */
  function plannedLocked() {
    if (MAN && MAN.locked) return 'locked';
    if (scheduleHasActuals()) return 'actualized';
    return '';
  }

  /* ==========================================================================================
     READING AND WRITING THE MANUAL SHEET.
     ⚠️⚠️ A MISSING TABLE IS A STATE, NOT AN ERROR. This module ships before the migration is run
     (`migrations/2026-09-10-scurve-manual-poc.sql` — additive, idempotent, run by hand in the SQL
     editor, which is how every migration in this repo lands). Postgres answers 42P01 for an
     unknown relation and Supabase passes it through; caught here, the module stays on Automatic
     and the Manual tab says which file to run. A toast reading "relation does not exist" would
     send a planner to report a bug against a feature that is simply not deployed yet.
     ⚠️ NOT cached to localStorage. Two planners on one project must see one manual curve, and a
     locally-cached baseline is how one of them keeps reporting against a plan the other replaced.
     ========================================================================================== */
  function isMissingTable(e) {
    var c = String((e && (e.code || e.message)) || '');
    return /42P01/.test(c) || /does not exist/i.test(c) || /schema cache/i.test(c);
  }
  async function loadManual() {
    MAN = null; manMissing = false;
    if (!pid) return;
    try {
      var r = await sb().from('scurve_manual')
        .select('trade,month,kind,pct').eq('project_id', pid);
      if (r.error) throw r.error;
      var meta = await sb().from('scurve_manual_meta')
        .select('planned_locked,planned_locked_at,planned_locked_by').eq('project_id', pid).maybeSingle();
      // ⚠️ A missing META row is not a missing table — an unlocked project has never written one.
      var mv = (meta && !meta.error && meta.data) || {};
      MAN = { rows: r.data || [], locked: !!mv.planned_locked,
              lockedAt: mv.planned_locked_at || null, lockedBy: mv.planned_locked_by || null };
    } catch (e) {
      if (isMissingTable(e)) { manMissing = true; MAN = null; return; }
      UI.toast('Could not read the manual curve: ' + (e.message || e), 'error');
      MAN = { rows: [], locked: false };
    }
  }
  /* Save every edited cell. ⚠️ ONE upsert on the natural key, not a delete-then-insert: a planner
     saving one month must not have a window in which the project has no curve at all, and an
     interrupted delete/insert would leave exactly that. */
  async function saveManual() {
    var keys = Object.keys(manDirty);
    if (!keys.length) { UI.toast('Nothing to save.', 'info'); return; }
    var payload = keys.map(function (k) {
      var parts = k.split('|');
      return { project_id: pid, trade: parts[0], month: parts[1] + '-01', kind: parts[2],
               pct: manDirty[k], updated_at: new Date().toISOString(), updated_by: UID || null };
    });
    showLoading();
    try {
      var r = await sb().from('scurve_manual')
        .upsert(payload, { onConflict: 'project_id,trade,month,kind' });
      if (r.error) throw r.error;
      manDirty = {};
      await loadManual();
      hideLoading();
      UI.toast(payload.length + ' month' + (payload.length === 1 ? '' : 's') + ' saved.', 'success');
      render();
    } catch (e) {
      hideLoading();
      if (isMissingTable(e)) { manMissing = true; render(); UI.toast('The manual-curve tables are not deployed yet.', 'error'); return; }
      UI.toast('Save failed: ' + (e.message || e), 'error');
    }
  }
  // The lock, and lifting it. ⚠️ Both directions are RECORDED (who, when) — a baseline that can be
  // unlocked is only trustworthy if unlocking leaves a mark. The card shows it.
  async function setPlannedLock(on) {
    if (!pid) return;
    if (!on && !confirm('Unlock the planned curve?\n\nThe planned S-curve is the baseline this ' +
        'project reports against. Unlocking is recorded against your name and the time, and the ' +
        'card will show that it was lifted.')) return;
    showLoading();
    try {
      var r = await sb().from('scurve_manual_meta').upsert([{
        project_id: pid, planned_locked: !!on,
        planned_locked_at: on ? new Date().toISOString() : null,
        planned_locked_by: on ? (UID || null) : null,
        updated_at: new Date().toISOString()
      }], { onConflict: 'project_id' });
      if (r.error) throw r.error;
      await loadManual(); hideLoading(); render();
      UI.toast(on ? 'The planned curve is locked.' : 'The planned curve is unlocked.', 'success');
    } catch (e) {
      hideLoading();
      UI.toast((isMissingTable(e) ? 'The manual-curve tables are not deployed yet.' : 'Could not change the lock: ' + (e.message || e)), 'error');
    }
  }

  /* ==========================================================================================
     THE MANUAL CURVE, in the same shape the renderers already consume.
     ⚠️⚠️ IT BUILDS THE WHOLE `d` OBJECT rather than feeding `opts.series` to the shared engine, and
     that is the honest seam. compute() derives its forecast from SPI; in Manual mode the FORECAST
     IS ALSO ENTERED, so handing it a series would have the engine overwrite the planner's own
     forward numbers with a projection. Same contract, different source — renderChart, renderTable
     and renderKpis are untouched and cannot tell the difference.
     ========================================================================================== */
  function computeManual() {
    if (manMissing) return { empty: true, manNoTable: true };
    var W = tradeWeights();
    if (!W.tot) return { empty: true, manNoScope: true };
    // ⚠️ EFFECTIVE, not saved — see manEffective. This is what makes the preview live.
    var mans = manEffective();
    // Which trades and months the sheet is about: the schedule's span, so a manual curve and an
    // automatic one cover the same calendar and can be compared month for month.
    var sp = null;
    (rows || []).forEach(function (r) {
      if (PDScurve.isWbs(r)) return;
      var a = pd(r.start_date), b = pd(r.end_date);
      if (a && (!sp || a < sp.min)) sp = { min: a, max: (sp ? sp.max : b || a) };
      if (b && sp && (!sp.max || b > sp.max)) sp.max = b;
    });
    if (!sp || !sp.min || !sp.max) return { empty: true, manNoScope: true };
    var months = [], c = new Date(sp.min.getFullYear(), sp.min.getMonth(), 1);
    while (c <= sp.max) { months.push(new Date(c)); c = new Date(c.getFullYear(), c.getMonth() + 1, 1); }
    var idx = {}; months.forEach(function (m, i) { idx[monthKey(m)] = i; });
    // Periodic, weighted, per kind. ⚠️ A trade's entry is a share of ITS OWN scope, so it is
    // multiplied by that trade's weight before it joins the project total — this is the line that
    // stops a small trade moving the project as much as a large one.
    var per = { planned: months.map(function () { return 0; }),
                actual: months.map(function () { return 0; }),
                forecast: months.map(function () { return 0; }) };
    var seen = { planned: false, actual: false, forecast: false };
    var unmatched = {};
    mans.forEach(function (m) {
      var i = idx[String(m.month || '').slice(0, 7)];
      if (i == null || !per[m.kind]) return;
      var wt = W.w[m.trade];
      if (!(wt > 0)) { unmatched[m.trade] = 1; return; }
      var v = (+m.pct || 0) / 100 * wt;
      if (!(v > 0)) return;
      per[m.kind][i] += v; seen[m.kind] = true;
    });
    function cum(arr) { var t = 0; return arr.map(function (v) { t += v; return t; }); }
    var plannedC = cum(per.planned), actualCraw = cum(per.actual), fcRaw = cum(per.forecast);
    var tnow = today();
    var ti = -1;
    for (var i2 = 0; i2 < months.length; i2++) {
      var me = new Date(months[i2].getFullYear(), months[i2].getMonth() + 1, 0);
      if (me >= tnow) { ti = i2; break; }
    }
    if (ti < 0) ti = months.length - 1;
    /* ⚠️ ACTUALS STOP AT THE DATA DATE and the forecast begins there — the same boundary the
       automatic curve draws, so the two are read the same way. An actual entered for a future
       month is kept in the table (it is the planner's data, not ours to delete) but is not drawn
       as an actual; the editor refuses to offer the cell, which is where that rule belongs. */
    var actualC = months.map(function (m, i) { return i <= ti ? actualCraw[i] : 0; });
    /* ⚠️ THE FORECAST IS CONTINUED FROM THE ACTUAL POINT, not plotted from zero. A forecast column
       states what each future month will deliver; the curve it makes has to start where the work
       actually is, or it draws a project restarting from nothing at the data date. */
    var forecastC = months.map(function () { return null; });
    if (seen.forecast) {
      forecastC[ti] = actualC[ti];
      var run = actualC[ti];
      for (var fj = ti + 1; fj < months.length; fj++) { run += per.forecast[fj]; forecastC[fj] = run; }
    }
    var TOT = W.tot;
    var fcFinish = null;
    for (var k = months.length - 1; k >= 0; k--) {
      if (per.forecast[k] > 0 || (k <= ti && per.actual[k] > 0)) {
        fcFinish = new Date(months[k].getFullYear(), months[k].getMonth() + 1, 0); break;
      }
    }
    return {
      empty: false, manual: true, manMode: true, months: months,
      plannedC: plannedC, actualC: actualC, forecastC: forecastC,
      TOT: TOT, ti: ti,
      plannedPct: TOT ? plannedC[ti] / TOT * 100 : 0,
      actualPct: TOT ? actualC[ti] / TOT * 100 : 0,
      overallPct: TOT ? actualC[ti] / TOT * 100 : 0,
      variance: TOT ? (actualC[ti] - plannedC[ti]) / TOT * 100 : 0,
      activities: (rows || []).filter(function (r) { return !PDScurve.isWbs(r); }).length,
      plannedEnd: new Date(sp.max), fcFinish: fcFinish, autoFc: fcFinish, spi: 1,
      money: basis === 'cost', priced: 0, shapes: null,
      manSeen: seen, manUnmatched: Object.keys(unmatched), manWeights: W,
      manPer: per
    };
  }

  /* ==========================================================================================
     MONTHLY / QUARTERLY / YEARLY.
     Owner 2026-09-10: *"for the landing page of the s-curve, allow users the option to view
     monthly, quarterly, yearly etc."*

     ⚠️⚠️ THE ENGINE STAYS MONTHLY AND IS NOT TOUCHED. `PDScurve.compute` walks the schedule once and
     returns month buckets; re-running it per granularity would be three walks of a 16k-row
     schedule to answer one question, and — worse — three chances for the three views to disagree
     about the same project. This is a LENS over that one result, so a quarter is by construction
     the sum of its own three months.

     ⚠️ CUMULATIVE TAKES THE LAST MONTH OF THE BUCKET, PERIODIC SUMS THEM. Those are different
     operations on the same numbers and getting them the same way round is the whole correctness
     of this file: a quarter's cumulative % is where the curve HAS REACHED by the end of March,
     not Jan+Feb+Mar added up (which would be about triple and would sail past 100%).
     ⚠️ The bucket holding the data date reads its actual at `ti`, not at the bucket's last month —
     the engine anchors that one month to the project's true recorded total and zeroes everything
     after it, so taking the bucket's last month would report 0% for the quarter we are standing in.
     ⚠️ A partial bucket is honest, not padded: a project starting in Nov gives a Q4 of two months
     and a first year of two months. Padding it to three would invent a month of nil progress.
     ========================================================================================== */
  var period = 'month';           // 'month' | 'quarter' | 'year'
  var _MABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function periodLabel(m, per) {
    if (per === 'year') return String(m.getFullYear());
    if (per === 'quarter') return 'Q' + (Math.floor(m.getMonth() / 3) + 1) + ' ' + m.getFullYear();
    return _MABBR[m.getMonth()] + ' ' + m.getFullYear();
  }
  function periodKey(m, per) {
    if (per === 'year') return String(m.getFullYear());
    if (per === 'quarter') return m.getFullYear() + '-Q' + (Math.floor(m.getMonth() / 3) + 1);
    return m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0');
  }
  /* Group the engine's months into the chosen granularity.
     Returns { buckets:[{key,label,from,to,months:[Date]}], ti } where from/to are indices into
     `d.months` and ti is the bucket holding the data date. */
  function periodBuckets(months, per, monthTi) {
    var out = [], seen = {};
    (months || []).forEach(function (m, i) {
      var k = periodKey(m, per);
      if (seen[k] == null) { seen[k] = out.length; out.push({ key: k, label: periodLabel(m, per), from: i, to: i, months: [m] }); }
      else { var b = out[seen[k]]; b.to = i; b.months.push(m); }
    });
    var ti = 0;
    for (var j = 0; j < out.length; j++) { if (monthTi >= out[j].from && monthTi <= out[j].to) { ti = j; break; } if (out[j].from > monthTi) break; }
    return { buckets: out, ti: ti };
  }
  /* The whole lens: the arrays every renderer draws from, already at the chosen granularity.
     ⚠️ ONE function, so the chart, the bars, the axis, the table, the hover readout and the
     per-trade breakdown cannot end up bucketing the same result three different ways — which is
     exactly how a quarterly chart comes to disagree with the quarterly table under it. */
  function lens(d) {
    var pb = periodBuckets(d.months, period, d.ti);
    var bs = pb.buckets, ti = pb.ti;
    var fc = d.forecastC || [];
    // Monthly periodic first, off the engine's own cumulative arrays — see periodic().
    var perP = periodic(d.plannedC, null), perA = periodic(d.actualC, null), perF = periodic(fc, d.ti);
    perA = perA.map(function (v, i) { return i <= d.ti ? v : null; });
    function sum(arr, b) {
      var t = null;
      for (var i = b.from; i <= b.to; i++) { if (arr[i] != null) t = (t == null ? 0 : t) + arr[i]; }
      return t;
    }
    return {
      buckets: bs, ti: ti, n: bs.length, per: period,
      // Cumulative: the value the curve has REACHED at the bucket's end.
      plannedC: bs.map(function (b) { return d.plannedC[b.to]; }),
      // ⚠️ min(b.to, d.ti) — see the note above; and null for a bucket entirely in the future,
      // because the engine's zeroes there are "not yet", not "nothing was done".
      actualC: bs.map(function (b) { return b.from > d.ti ? null : d.actualC[Math.min(b.to, d.ti)]; }),
      forecastC: bs.map(function (b) { return fc[b.to] == null ? null : fc[b.to]; }),
      // Periodic: what happens WITHIN the bucket.
      perPlanned: bs.map(function (b) { return sum(perP, b); }),
      perActual: bs.map(function (b) { return sum(perA, b); }),
      perForecast: bs.map(function (b) { return sum(perF, b); })
    };
  }

  /* ==========================================================================================
     THE AMOUNT BESIDE THE POC.
     Owner 2026-09-10: *"when hovering over data, pls show the contents like POC, amount."*

     ⚠️⚠️ POC AND AMOUNT ARE THE SAME CURVE ON TWO DIFFERENT WEIGHTINGS, and that is the whole
     difficulty. On the COST basis `d.TOT` is already pesos, so the amount is free. On the DURATION
     basis `d.TOT` is days — there is no peso figure anywhere in that result, and 40% of the
     duration is not 40% of the money. So a companion COST series is computed alongside, and the
     readout shows the POC from whichever basis is selected and the amount from the cost one.
     ⚠️ It is not a second engine: it is `PDScurve.compute(sameRows, {basis:'cost'})` — the same
     function, the same spread curves, the same forecast rule.
     ⚠️⚠️ ALIGNED BY MONTH KEY, NEVER BY INDEX. The two results can have DIFFERENT LENGTHS: the
     forecast finish is SPI-derived per basis, so a project behind on duration and ahead on cost
     produces two domains and index i is two different months in each. Reading it positionally
     would put March's money under June's progress and look entirely plausible.
     ⚠️ Memoised on the things it depends on, because it walks the rows — recomputing it on every
     hover would walk a 16k-row schedule per mouse move.
     ⚠️ Absent, not faked, when it cannot be known: no rows loaded (the RPC fast path holds none) or
     no cost loaded at all. The readout then shows the POC and says why there is no figure, rather
     than printing a peso amount derived from days.
     ========================================================================================== */
  var _costCo = null, _costCoKey = '';
  function costCompanion() {
    if (!rowsLoaded || !rows.length) return null;
    var key = mode + '|' + trScope + '|' + trSel.join(',') + '|' + rows.length + '|' + (fcManual && forecastFinish ? +forecastFinish : 0);
    if (_costCoKey === key) return _costCo;
    _costCoKey = key;
    _costCo = null;
    try {
      var c = PDScurve.compute(scopedRows(), {
        basis: 'cost',
        forecastFinish: fcManual && forecastFinish ? forecastFinish : null
      });
      if (c && !c.empty && c.TOT > 0) {
        // month key -> index, so every read is by DATE. See the note above.
        var idx = {};
        c.months.forEach(function (m, i) { idx[m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0')] = i; });
        c.__idx = idx;
        _costCo = c;
      }
    } catch (e) { _costCo = null; }
    return _costCo;
  }
  // The peso figure at a month, by date. Returns null where the companion has no such month.
  function _coAt(c, arr, m) {
    if (!c || !m) return null;
    var i = c.__idx[m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0')];
    if (i == null) return null;
    var v = arr[i];
    return v == null ? null : v;
  }
  /* The amounts for one bucket of the lens: cumulative planned / actual / forecast pesos at its
     end, and what was earned WITHIN it. ⚠️ Read at the bucket's LAST MONTH for the cumulative and
     as a difference across the bucket for the periodic — the same two operations, the same way
     round, as the lens itself. */
  function bucketAmounts(bk) {
    var c = costCompanion(); if (!c) return null;
    var last = bk.months[bk.months.length - 1], first = bk.months[0];
    var pEnd = _coAt(c, c.plannedC, last), aEnd = _coAt(c, c.actualC, last), fEnd = _coAt(c, c.forecastC, last);
    // The month BEFORE the bucket, for the within-period difference.
    var prev = new Date(first.getFullYear(), first.getMonth() - 1, 1);
    var pPrev = _coAt(c, c.plannedC, prev) || 0, aPrev = _coAt(c, c.actualC, prev) || 0;
    return {
      total: c.TOT,
      plannedC: pEnd, actualC: aEnd, forecastC: fEnd,
      perPlanned: pEnd == null ? null : Math.max(0, pEnd - pPrev),
      perActual: aEnd == null ? null : Math.max(0, aEnd - aPrev)
    };
  }

  /* ==========================================================================================
     THE PER-TRADE BREAKDOWN.
     Owner 2026-09-10: *"when clicked, what are the details in terms of gen req, site works,
     structural works, etc."*

     ⚠️⚠️ EACH TRADE IS ITS OWN CURVE, and it has to be — a trade's % complete is a share of ITS
     OWN scope, not of the project's. Taking the project's monthly figure and splitting it by trade
     weight would report every trade at the same percentage, which is the one answer that is always
     wrong. So the engine runs once per trade over that trade's rows.
     ⚠️ TWO NUMBERS PER TRADE, and the distinction is the point: **own %** is how far along that
     trade is, **share** is how many points of the PROJECT's percentage it is currently
     contributing. A trade at 100% of itself that is 3% of the job contributes 3 points, and a
     planner reading only the first number would think the project was nearly done.
     ⚠️ Memoised on the same key as the companion. Clicking through twelve quarters recomputes
     nothing; only a filter, a basis or a fresh load does.
     ========================================================================================== */
  var _trSeries = null, _trSeriesKey = '';
  function tradeSeries() {
    if (!rowsLoaded || !rows.length) return null;
    var key = mode + '|' + basis + '|' + trScope + '|' + trSel.join(',') + '|' + rows.length + '|' + (fcManual && forecastFinish ? +forecastFinish : 0);
    if (_trSeriesKey === key) return _trSeries;
    _trSeriesKey = key;
    var scoped = scopedRows();
    var byTrade = {}, order = [];
    scoped.forEach(function (r) {
      if (PDScurve.isWbs(r)) return;
      var t = tradeOf(r);
      if (!byTrade[t]) { byTrade[t] = []; order.push(t); }
      byTrade[t].push(r);
    });
    var W = tradeWeights();
    var out = [];
    order.forEach(function (t) {
      var c = null;
      try {
        c = PDScurve.compute(byTrade[t], { basis: basis, forecastFinish: fcManual && forecastFinish ? forecastFinish : null });
      } catch (e) { c = null; }
      if (!c || c.empty || !(c.TOT > 0)) { out.push({ trade: t, empty: true, weight: W.w[t] || 0, share: W.tot ? (W.w[t] || 0) / W.tot : 0, n: byTrade[t].length }); return; }
      var idx = {};
      c.months.forEach(function (m, i) { idx[m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0')] = i; });
      c.__idx = idx;
      /* ⚠️⚠️ THE TRADE'S OWN COST CURVE, not its share of the project's money. The first cut
         reported `projectAmount × durationShare`, which is wrong in the way that looks right: a
         trade that is 10% of the PROGRAMME's duration can easily be 40% of its MONEY (MEPF against
         General Requirements is exactly that), so the column would have quietly redistributed
         millions along the wrong axis. Running the engine again on this trade's rows at the cost
         basis gives the figure the money actually is.
         ⚠️ Absent, not estimated, when this trade carries no cost — a trade nobody has priced has
         no amount, and inventing one from its duration is the mistake being fixed here. */
      var cc = null;
      try {
        cc = PDScurve.compute(byTrade[t], { basis: 'cost', forecastFinish: fcManual && forecastFinish ? forecastFinish : null });
        if (cc && !cc.empty && cc.TOT > 0) {
          var ci = {};
          cc.months.forEach(function (m, i) { ci[m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0')] = i; });
          cc.__idx = ci;
        } else cc = null;
      } catch (e) { cc = null; }
      out.push({ trade: t, empty: false, c: c, cc: cc, weight: W.w[t] || 0,
                 share: W.tot ? (W.w[t] || 0) / W.tot : 0, n: byTrade[t].length });
    });
    _trSeries = { rows: out, tot: W.tot };
    return _trSeries;
  }
  // One trade's reading at one bucket. ⚠️ By date, for the same reason the companion is.
  function tradeAt(tr, bk) {
    if (tr.empty) return { own: null, ownA: null, pts: 0, ptsA: 0 };
    var last = bk.months[bk.months.length - 1];
    var pc = _coAt(tr.c, tr.c.plannedC, last), ac = _coAt(tr.c, tr.c.actualC, last);
    var fcv = _coAt(tr.c, tr.c.forecastC, last);
    /* ⚠️ A bucket PAST this trade's own domain is not 0% — it is "this trade's programme has
       ended", so the last value it reached is carried. A trade that finished in Q1 must not read
       0% in Q4; and a bucket BEFORE it starts is genuinely 0. */
    if (pc == null) pc = (last > tr.c.plannedEnd) ? tr.c.TOT : 0;
    if (ac == null) ac = (last > tr.c.plannedEnd) ? tr.c.overallDone != null ? tr.c.overallDone : 0 : 0;
    var own = tr.c.TOT ? pc / tr.c.TOT * 100 : 0;
    var ownA = tr.c.TOT ? ac / tr.c.TOT * 100 : 0;
    // The trade's own money at this bucket, read from its own cost curve by DATE — same carry-past
    // and zero-before rules as the percentages above, for the same reasons.
    var amtP = null, amtA = null, amtTot = null;
    if (tr.cc) {
      amtTot = tr.cc.TOT;
      var mp = _coAt(tr.cc, tr.cc.plannedC, last), ma = _coAt(tr.cc, tr.cc.actualC, last);
      if (mp == null) mp = (last > tr.cc.plannedEnd) ? tr.cc.TOT : 0;
      if (ma == null) ma = (last > tr.cc.plannedEnd) ? (tr.cc.overallDone != null ? tr.cc.overallDone : 0) : 0;
      amtP = mp; amtA = ma;
    }
    return { own: own, ownA: ownA, pts: own * tr.share, ptsA: ownA * tr.share,
             amtP: amtP, amtA: amtA, amtTot: amtTot,
             fc: fcv == null ? null : (tr.c.TOT ? fcv / tr.c.TOT * 100 : null) };
  }

  // The rows this view is about: every leaf that passes the trade filters. ⚠️ WBS summaries are
  // left in — the engine drops them itself (PDScurve.isWbs) and filtering them here would make
  // the two disagree about what a leaf is.
  function scopedRows() { return anyTradeFilter() ? rows.filter(rowPasses) : rows; }
  function compute() {
    // ⚠️ The mode decides WHERE the numbers come from, before anything decides how to draw them.
    if (mode === 'manual') return computeManual();
    /* ⚠️⚠️ THE SERVER AGGREGATE IS REFUSED WHENEVER A TRADE FILTER IS ON. It is summed over the
       WHOLE project and carries no trade, so using it under a filter would draw the entire
       project's curve beneath a "Structural Works only" heading — a confident wrong answer, which
       is the one outcome this module's notes keep calling out. Same reason the cost basis skips
       it. See ensureRows: the rows are fetched the first time a filter is touched. */
    var series = (!anyTradeFilter() && basis !== 'cost' && agg && agg.months && agg.months.length) ? rpcSeries() : null;
    return PDScurve.compute(scopedRows(), {
      basis: basis,
      forecastFinish: fcManual && forecastFinish ? forecastFinish : null,
      series: series
    });
  }
  /* ==========================================================================================
     THE PERIODIC SERIES — what happens IN a month, rather than where the project stands by it.
     Owner 2026-09-10: *"currently there is cumulative. I want you to add a periodic bar chart."*

     ⚠️⚠️ DERIVED, NEVER FETCHED OR RE-SUMMED. Period n = cumulative n − cumulative n−1, off the
     arrays the engine already returned. Two consequences worth stating: the bars ALWAYS add back
     up to the line (they cannot drift from it, because they are it), and no second pass over the
     schedule exists to keep in step with the first.
     ⚠️ The actual series stops at the data date and the forecast starts there — periodic bars
     inherit that boundary rather than re-deciding it, so no month carries both an actual bar and
     a forecast bar for the same work.
     ⚠️ `null` is preserved as null, not folded to 0. A month with no forecast is not a month
     forecast at zero, and a 0-height bar and an absent bar mean different things.
     ========================================================================================== */
  function periodic(cum, from) {
    var out = [];
    for (var i = 0; i < cum.length; i++) {
      var v = cum[i];
      if (v == null) { out.push(null); continue; }
      if (from != null && i < from) { out.push(null); continue; }
      var prev = null;
      for (var j = i - 1; j >= 0; j--) { if (cum[j] != null) { prev = cum[j]; break; } }
      out.push(Math.max(0, v - (prev == null ? 0 : prev)));
    }
    return out;
  }

  /* ==========================================================================================
     THE FILTER BAR: shape, scope, trades.
     ⚠️⚠️ THE TRADE LIST COMES FROM THE ROWS, so it cannot be offered until the rows are here —
     and on the RPC fast path they are not. Rather than pretend (an empty chip row reads as "this
     project has no trades") the bar says the work is one click away and fetches it on demand. A
     control that lies about the data is worse than a control that asks for a moment.
     ========================================================================================== */
  function renderFilters() {
    var host = document.getElementById('sc-filters'); if (!host) return;
    var seg = function (id, opts, cur) {
      return '<span class="sc-seg" id="' + id + '">' + opts.map(function (o) {
        return '<button data-v="' + o[0] + '"' + (o[0] === cur ? ' class="on"' : '') +
          ' title="' + esc(o[2] || o[1]) + '">' + esc(o[1]) + '</button>';
      }).join('') + '</span>';
    };
    /* ⚠️ PERIOD LEADS THE BAR, before the chart shape. It changes what a point MEANS — a bar is a
       month or a year of work — where the shape only changes how the same points are drawn. */
    var perSeg = '<span class="sc-fl">Period</span>' + seg('sc-period', [
      ['month', 'Monthly', 'One point and one bar per month'],
      ['quarter', 'Quarterly', 'Three months to a point — the cumulative reads at the quarter end, the bar is the quarter\'s own work'],
      ['year', 'Yearly', 'Twelve months to a point — the cumulative reads at the year end, the bar is the year\'s own work']
    ], period);
    var pw = (period === 'year' ? 'year' : period === 'quarter' ? 'quarter' : 'month');
    var shape = '<span class="sc-fl">Chart</span>' + seg('sc-shape', [
      ['both', 'Both', 'The cumulative curves with the ' + pw + 'ly bars behind them'],
      ['cum', 'Cumulative', 'Where the project stands at each ' + pw],
      ['per', 'Periodic', 'How much is done IN each ' + pw + ', as bars only']
    ], chartMode);

    if (!rowsLoaded || !rows.length) {
      host.innerHTML = perSeg + '<span class="sc-tb-sep"></span>' + shape + '<span class="sc-tb-sep"></span>' +
        '<button class="sc-chip" id="sc-loadtrades" title="Reads the activities so the curve can be split by trade. The fast monthly aggregate this view opens on carries no trade, so this is a one-off fetch.">Filter by trade…</button>' +
        '<span class="sc-filternote">The curve is drawn from the server\'s monthly aggregate, which carries no trade. ' +
        'Loading the activities once lets it be split by trade and by General Requirements vs Measured Works.</span>';
      wireShape();
      var lb = document.getElementById('sc-loadtrades');
      if (lb) lb.onclick = function () { ensureRows(function () { render(); }); };
      return;
    }
    var all = tradesIn(rows);
    var nOf = function (t) { return rows.filter(function (r) { return !PDScurve.isWbs(r) && tradeOf(r) === t; }).length; };
    var grN = all.filter(isGR).reduce(function (a, t) { return a + nOf(t); }, 0);
    var mwN = all.filter(function (t) { return !isGR(t) && t !== UNTRADED; }).reduce(function (a, t) { return a + nOf(t); }, 0);
    var unN = all.indexOf(UNTRADED) >= 0 ? nOf(UNTRADED) : 0;
    var scope = '<span class="sc-fl">Work</span>' + seg('sc-scope', [
      ['all', 'All work', 'Every activity, whatever its trade'],
      ['gr', 'General Requirements', grN + ' activities — preliminaries and overhead, matched on the trade name'],
      ['mw', 'Measured Works', mwN + ' activities — every named trade that is not General Requirements']
    ], trScope);
    var chips = '<span class="sc-chips" id="sc-trades">' +
      '<button class="sc-chip' + (trSel.length ? '' : ' on') + '" data-tr="ALL" aria-pressed="' + (!trSel.length) +
        '" title="Show every trade">All trades</button>' +
      all.map(function (t) {
        var on = trSel.indexOf(t) >= 0;
        return '<button class="sc-chip' + (on ? ' on' : '') + (isGR(t) ? ' gr' : t === UNTRADED ? '' : ' mw') +
          '" data-tr="' + esc(t) + '" aria-pressed="' + on + '" title="' + esc(t + ' · ' + nOf(t) + ' activities' +
          (on ? ' — click to drop it' : ' — click to add it')) + '">' +
          '<span class="dot"></span>' + esc(t) + '<span class="n">' + nOf(t) + '</span></button>';
      }).join('') + '</span>';
    /* ⚠️ THE UNTRADED COUNT IS STATED, not silently folded into either side of the split. It is the
       reason a Measured Works figure can fail to reconcile with the whole project, and a planner
       who cannot see it will look for the discrepancy in the schedule instead of in this column. */
    var note = unN
      ? '<span class="sc-filternote"><b>' + unN + ' activit' + (unN === 1 ? 'y carries' : 'ies carry') +
        ' no Trade</b>, so ' + (unN === 1 ? 'it is' : 'they are') + ' in neither General Requirements nor ' +
        'Measured Works — the two together are ' + (grN + mwN) + ' of ' + (grN + mwN + unN) + ' activities. ' +
        'Set it on the activity in <b>Project Schedule</b> (the Trade column), or file it under a trade branch of the WBS.</span>'
      : '';

      scope + '<span class="sc-tb-sep"></span>' + chips + note;
    wireShape();
    var sc = document.getElementById('sc-scope');
    if (sc) sc.querySelectorAll('[data-v]').forEach(function (b) {
      b.onclick = function () { trScope = b.dataset.v; render(); };
    });

    if (tc) tc.querySelectorAll('[data-tr]').forEach(function (b) {
      b.onclick = function () {
        var t = b.dataset.tr;
        // ⚠️ Multi-select, and "All trades" CLEARS rather than ticking every box — see the note on
        // trSel: an explicitly-full list would exclude a trade the project gains later.
        if (t === 'ALL') trSel = [];
        else { var i = trSel.indexOf(t); if (i >= 0) trSel.splice(i, 1); else trSel.push(t); }

  }
  /* ==========================================================================================
     THE MANUAL SHEET.
     One trade, months down the page, the three kinds across. See the CSS block for why this shape
     and not a trades × months matrix.

     ⚠️⚠️ WHICH CELLS ARE EDITABLE IS A RULE, NOT A STYLE:
       · PLANNED  — editable only while the plan is neither locked nor overtaken by actuals. Owner:
                    *"defined in the planning phase … locked as the project is actualized."*
       · ACTUAL   — editable up to and including the data date's month. A recorded actual for a
                    month that has not happened is not an actual.
       · FORECAST — editable AFTER the data date's month. Owner: *"allow users to input POCs
                    manually for the FOLLOWING months."* A forecast of the past is a claim about
                    history, and history is what the actual column is for.
     ⚠️ Every refusal is explained where it is refused — a read-only cell with no reason is the
     first thing a planner reports as broken.
     ========================================================================================== */
  // ⚠️ The month names live in _MABBR, declared once beside the period lens. This function had
  // its own MABBR2 copy of the same twelve strings until the lens arrived and needed them too;
  // two arrays of month names in one file is one more than can be kept in agreement.
  /* ==========================================================================================
     THE SAVED ROWS WITH THE UNSAVED EDITS OVER THE TOP.
     Owner 2026-09-10: *"while inputting, there would still be an scurve displayed above the
     table."*

     ⚠️⚠️ A PREVIEW THAT ONLY MOVES ON SAVE IS NOT A PREVIEW. `computeManual` read `MAN.rows` — the
     rows as the database has them — so a curve above the sheet would have sat still while the
     planner typed and jumped when they pressed Save. Every reader now goes through this, so the
     chart, the row totals and the column totals all describe the sheet as it is ON SCREEN.
     ⚠️ Same precedence as `manValue` (dirty wins over saved), because two different answers to
     "what is in this cell" is how a total comes to disagree with the cells it is adding up.
     ⚠️ IT DOES NOT WRITE ANYTHING. The dirty map is still the only record of an unsaved edit, and
     the Save button still carries the count — the curve showing them is not the same as them
     being kept, so the card says so in as many words.
     ========================================================================================== */
  function manEffective() {
    var out = [], seen = {};
    ((MAN && MAN.rows) || []).forEach(function (r) {
      var mk = String(r.month || '').slice(0, 7);
      var k = manCellKey(r.trade, mk, r.kind);
      seen[k] = out.length;
      out.push({ trade: r.trade, month: r.month, kind: r.kind, pct: +r.pct || 0 });
    });
    Object.keys(manDirty).forEach(function (k) {
      var parts = k.split('|');
      if (parts.length !== 3) return;
      var row = { trade: parts[0], month: parts[1] + '-01', kind: parts[2], pct: +manDirty[k] || 0 };
      if (seen[k] != null) out[seen[k]] = row; else { seen[k] = out.length; out.push(row); }
    });
    return out;
  }
  function manDirtyCount() { return Object.keys(manDirty).length; }

  function manValue(trade, mk, kind) {
    var k = manCellKey(trade, mk, kind);
    if (manDirty[k] != null) return manDirty[k];
    var hit = ((MAN && MAN.rows) || []).find(function (r) {
      return r.trade === trade && String(r.month || '').slice(0, 7) === mk && r.kind === kind;
    });
    return hit ? +hit.pct : null;
  }
  /* ==========================================================================================
     ONE WRITE PATH FOR A CELL, AND A REFRESH THAT DOES NOT REBUILD THE GRID.
     ⚠️⚠️ Every route into a cell — typing, a paste from Excel, PDGrid's fill-down, an undo — goes
     through `setCell`, so the validation is written once. A paste that skipped it would be a second
     set of rules about what a POC may be.
     ⚠️⚠️ AND IT MUST NOT RE-RENDER. Rebuilding the table takes the focus out of the cell being
     typed in and destroys PDGrid's listeners, so Tab, fill-down and paste would all stop working
     after the first edit. `manRefresh` writes the three things that actually changed — the row
     total, the column total, the Save count — and redraws the chart, which lives outside the table.
     ========================================================================================== */
  function setCell(trade, mk, raw, el) {
    var k = manCellKey(trade, mk, manKind);
    var txt = String(raw == null ? '' : raw).trim();
    if (txt === '') { manDirty[k] = 0; }
    else {
      /* ⚠️ A trailing % is stripped, because a column pasted out of Excel routinely carries one and
         this column IS a percentage — that is a notation the header already states, not a guess
         about what the number means. */
      var clean = txt.replace(/%\s*$/, '').trim();
      /* ⚠️⚠️ THE SHAPE IS VALIDATED, AND A COMMA IS REFUSED RATHER THAN STRIPPED. The first cut
         stripped commas, which turns the European "12,5" (meaning 12.5) into 125 — and stripping
         is a GUESS about the writer's locale that produces a plausible wrong number rather than an
         error. This repo settled the same question for Contracts & Claims on 2026-09-09: refuse,
         and say so, because "a wrong number that looks real" is the worse outcome. `parseFloat` on
         its own is no better — it reads "12,5" as 12 and "5abc" as 5, both silently. */
      var v = /^\d+(\.\d+)?$/.test(clean) ? parseFloat(clean) : NaN;
      if (!isFinite(v)) {
        // ⚠️ Two distinct refusals with two distinct messages: an unreadable value and an
        // out-of-range one are different mistakes, and one message for both sends a planner who
        // typed "12,5" hunting for a range problem they do not have.
        UI.toast('"' + txt + '" is not a number this cell can read \u2014 type it as 12.5, not 12,5.', 'error');
        if (el) el.value = '';
        return false;
      }
      if (v < 0 || v > 100) {
        UI.toast('A month\'s POC is a percentage of that trade, so it cannot be ' + v + '% \u2014 the range is 0 to 100.', 'error');
        if (el) el.value = '';
        return false;
      }
      manDirty[k] = Math.round(v * 1000) / 1000;
      if (el) el.value = manDirty[k];
    }
    manRefresh();
    return true;
  }
  // Redraw the preview curve into its own host. ⚠️ Recomputes from manEffective(), so it follows
  // the unsaved edits; interactive:false because the breakdown card lives in the other pane.
  function manChart() {
    if (!document.getElementById('sc-manchart')) return;
    var dm = computeManual();
    // ⚠️ compact: the preview sits on top of a 36-column sheet, and the chart's job here is to
    // show the SHAPE moving as you type — not to be read off. The Curve tab is where it is read.
    renderChart(dm, { host: 'sc-manchart', note: 'sc-mannote', interactive: false, compact: true });
    var note = document.getElementById('sc-mannote');
    var nd = manDirtyCount();
    /* ⚠️ A chart drawn from numbers that are not in the database yet MUST say so — a screenshot of
       it would otherwise assert data nobody has kept. Appended to renderChart's own note rather
       than replacing it, so the source and the weighting are still stated. */
    if (note && nd) {
      note.innerHTML = (note.innerHTML || '') +
        ' <b class="sc-unsaved-inline">Includes ' + nd + ' unsaved edit' + (nd === 1 ? '' : 's') + '.</b>';
    }
  }
  /* Update only what an edit changes. ⚠️ Reads the SAME manValue / weights the renderer used, so a
     refreshed total cannot disagree with a rebuilt one. */
  function manRefresh() {
    var card = document.getElementById('sc-mancard'); if (!card) return;
    var tbl = document.getElementById('sc-matrix'); if (!tbl) return;
    var W = tradeWeights(), all = tradesIn(rows);
    var d = computeManual();
    var months = (d && d.months) || [];
    // Row totals: this trade's own months added up, in its own scope.
    all.forEach(function (t) {
      var cell = tbl.querySelector('[data-rowtot="' + (window.CSS && CSS.escape ? CSS.escape(t) : t) + '"]');
      if (!cell) return;
      var sum = 0;
      months.forEach(function (m) { var v = manValue(t, monthKey(m), manKind); if (v != null) sum += v; });
      cell.textContent = (Math.round(sum * 10) / 10) + '%';
      // ⚠️ Only PLANNED is expected to reach 100 — an actual row at 62% is a trade 62% done, not
      // an error, so it is never marked wrong. Same rule the per-trade sheet stated.
      cell.className = 'tot' + (manKind !== 'planned' ? ' sc-tot-part'
        : Math.abs(sum - 100) < 0.05 ? ' sc-tot-ok' : sum > 100 ? ' sc-tot-off' : ' sc-tot-part');
    });
    // Column totals: the project's own weighted figure for that month.
    var grand = 0;
    months.forEach(function (m) {
      var mk = monthKey(m), tot = 0;
      all.forEach(function (t) {
        var v = manValue(t, mk, manKind);
        if (v != null && W.tot) tot += v / 100 * (W.w[t] || 0) / W.tot * 100;
      });
      grand += tot;
      var c = tbl.querySelector('[data-coltot="' + mk + '"]');
      if (c) c.textContent = (Math.round(tot * 10) / 10) + '%';
    });
    var g = tbl.querySelector('[data-grandtot]');
    if (g) g.textContent = (Math.round(grand * 10) / 10) + '%';
    // The Save button and the unsaved badge.
    var nd = manDirtyCount();
    var sv = document.getElementById('sc-mansave');
    if (sv) { sv.disabled = !nd; sv.textContent = 'Save' + (nd ? ' (' + nd + ')' : ''); }
    var badge = card.querySelector('.sc-unsaved');
    if (badge) { badge.textContent = nd + ' unsaved'; badge.hidden = !nd; }
    else if (nd) {
      var act = card.querySelector('.sc-man-act');
      if (act) { var sp = document.createElement('span'); sp.className = 'sc-unsaved'; sp.textContent = nd + ' unsaved'; act.insertBefore(sp, act.firstChild); }
    }
    manChart();
  }

  function renderManual() {
    var card = document.getElementById('sc-mancard'); if (!card) return;
    /* ⚠️⚠️ GATED ON THE TAB, NOT ON `mode` — that is the change the owner's *"add a tab wherein
       users are able to put the data manually"* asks for. The sheet used to appear only while the
       CHART was set to Manual, so entering next quarter's forecast meant first switching what the
       chart was claiming. They are separate questions now: this is where you type, the mode is
       what the curve is drawn from. */
    if (view !== 'manual') { card.innerHTML = ''; return; }
    /* ⚠️ It computes its OWN view rather than taking the caller's `d`: on the Curve tab that
       argument is the automatic curve, and the sheet's rows, months and data-date boundary are the
       manual one's. Reading the wrong one would lay a manual sheet over automatic months. */
    var d = computeManual();
    if (!d || d.empty) {
      if (d && d.manNoTable) {
        card.innerHTML = '<h3>Manual POC entry</h3><div class="sc-man-note">' +
          '<b>The tables this needs are not deployed on this database yet.</b><br>' +
          'Run <code>migrations/2026-09-10-scurve-manual-poc.sql</code> in the Supabase SQL editor — ' +
          'it is additive and idempotent, and creates <code>scurve_manual</code> and ' +
          '<code>scurve_manual_meta</code>. Until then the <b>Curve</b> tab works exactly as before.</div>';
        return;
      }
      // Every other empty state is handled by the guards below, which have their own wording.
    }
    if (!rowsLoaded || !rows.length) {
      card.innerHTML = '<h3>Manual POC entry</h3><div class="sc-man-note">Loading the activities ' +
        'this sheet needs to weight the trades…</div>';
      ensureRows(function () { render(); });
      return;
    }
    var W = tradeWeights();
    var all = tradesIn(rows);
    if (!all.length || !W.tot) {
      card.innerHTML = '<h3>Manual POC entry</h3><div class="sc-man-note">This project\'s schedule ' +
        'carries no dated, trade-tagged activities, so there is no scope to weight the trades by. ' +
        'A manual curve still needs the schedule to say <em>how much of the project each trade is</em>.</div>';
      return;
    }
    var months = (d && d.months && d.months.length) ? d.months : [];
    if (!months.length) { card.innerHTML = '<h3>Manual POC entry</h3><div class="sc-man-note">No months to enter.</div>'; return; }
    var ti = d.ti == null ? 0 : d.ti;
    var lock = plannedLocked();
    var pw = (basis === 'cost' ? 'loaded cost' : 'duration');

    /* ==========================================================================================
       TRADES DOWN, MONTHS ACROSS — and one KIND at a time.
       Owner 2026-09-10: *"what if it were the other way around. meaning the months are plotted as
       columns and the trades are plotted as rows. And then while inputting, there would still be
       an scurve displayed above the table."*

       ⚠️⚠️ THIS REVERSES THE SHAPE I ARGUED FOR YESTERDAY, and the argument was not wrong — it was
       incomplete. I refused a trades × months matrix because eight trades over three years is 288
       cells and, at three kinds per cell, **864**. The owner's shape is the right one and the
       resolution is to drop the third dimension out of the grid: **Planned / Actual / Forecast is a
       MODE, not a column triple**, so the sheet is 8 × 36 for one kind at a time. That is exactly
       what the spreadsheet a planner is copying from looks like, and it is the shape a monthly
       accomplishment submission is already in.
       ⚠️ It is also strictly better than the per-trade sheet it replaces: comparing two trades in
       the same month was impossible there (they were two different screens) and is a glance here.

       ⚠️ THE MATRIX IS ALWAYS MONTHLY, whatever the Period control above is set to. The stored
       grain is a month; letting somebody type a QUARTER would mean splitting it back across three
       months, and there is no honest way to choose that split — it would be invented data. The
       chart above it follows the Period control, because reading is not entering.
       ========================================================================================== */
    var KINDS = [['planned', 'Planned'], ['actual', 'Actual'], ['forecast', 'Forecast']];
    var kindLabel = (KINDS.filter(function (k) { return k[0] === manKind; })[0] || KINDS[0])[1];
    // Is this month editable for the kind being entered? ⚠️ One rule, read by the cell, by the
    // aria-label and by the refusal tooltip, so the three cannot disagree.
    function cellEditable(i) {
      return manKind === 'planned' ? !lock
           : manKind === 'actual' ? (i <= ti)
           : (i > ti);
    }
    function cellWhyNot(i) {
      return manKind === 'planned'
        ? (lock === 'locked' ? 'The planned curve is locked.' : 'The project is actualized, so the plan is history.')
        : manKind === 'actual' ? 'This month has not happened yet — enter it in the Forecast sheet.'
        : 'This month is in the past — enter what happened in the Actual sheet.';
    }

    // ---- the lock banner, saying which rule is in force and offering the one action ----------
    var lockBar =
      '<div class="sc-lockbar">' +
        /* ⚠️ 'signature' and 'pencil', NOT 'lock'/'unlock' — THERE ARE NO LOCK ICONS in
           assets/js/icons.js, and Icons.hydrate leaves an unknown key as an empty span. A 15px
           gap where an icon should be is the looks-live-does-nothing failure this repo keeps
           recording, and it is invisible in a diff. */
        '<span data-ico="' + (lock ? 'signature' : 'pencil') + '" data-ico-size="15" style="flex:none;margin-top:2px;"></span>' +
        '<span>' + (lock === 'locked'
          ? '<b>The planned curve is locked.</b> It is the baseline this project reports against' +
            (MAN && MAN.lockedAt ? ', locked ' + esc(Fmt.date(String(MAN.lockedAt).slice(0, 10))) : '') +
            '. Actual and forecast entry is unaffected.'
          : lock === 'actualized'
            ? '<b>The planned curve is read-only because the project is actualized.</b> The schedule ' +
              'already carries recorded progress, so the plan is history — it can still be locked ' +
              'explicitly, which records who did it and when.'
            : '<b>The planned curve is open for entry.</b> Define it now, in the planning phase; ' +
              'lock it when the plan is agreed and it becomes the baseline this project reports against.') +
        '</span>' +
        '<span class="sc-lockact">' + (lock === 'locked'
          ? '<button class="pd-btn pd-btn-sm" id="sc-unlock">Unlock…</button>'
          : '<button class="pd-btn pd-btn-sm" id="sc-lock">Lock the planned curve</button>') + '</span>' +
      '</div>';

    // ---- which kind is being entered ---------------------------------------------------------
    var kindSeg = '<span class="sc-fl">Entering</span><span class="sc-seg" id="sc-mankind">' +
      KINDS.map(function (k) {
        var n = manEffective().filter(function (r) { return r.kind === k[0] && (+r.pct || 0) > 0; }).length;
        return '<button data-k="' + k[0] + '"' + (manKind === k[0] ? ' class="on"' : '') +
          ' title="' + esc(k[1] + ' — ' + (n ? n + ' cell(s) entered' : 'nothing entered yet')) + '">' +
          k[1] + (n ? ' <i>' + n + '</i>' : '') + '</button>';
      }).join('') + '</span>';

    // ---- the matrix --------------------------------------------------------------------------
    var head = '<tr><th class="k">Trade</th>' +
      months.map(function (m, i) {
        return '<th class="mo' + (i === ti ? ' now' : '') + '" title="' + esc(_MABBR[m.getMonth()] + ' ' + m.getFullYear() +
          (i === ti ? ' — the data date falls here' : '')) + '">' +
          _MABBR[m.getMonth()] + '<small>\u2019' + String(m.getFullYear()).slice(2) + '</small></th>';
      }).join('') +
      '<th class="tot" title="This trade\'s ' + esc(kindLabel.toLowerCase()) + ' months added up. A trade\'s PLANNED months should reach 100% of that trade.">Total</th></tr>';

    var body = all.map(function (t) {
      var sh = W.tot ? Math.round((W.w[t] || 0) / W.tot * 1000) / 10 : 0;
      var rowSum = 0;
      var cells = months.map(function (m, i) {
        var mk = monthKey(m), v = manValue(t, mk, manKind);
        if (v != null) rowSum += v;
        var ed = cellEditable(i);
        /* ⚠️ data-i / data-f is PDGrid's contract (assets/js/xlgrid.js) — the row is the trade and
           the field is the month. Giving the cells those two attributes is the whole adoption: it
           buys Tab/Enter/arrow navigation, Ctrl+D fill-down and a paste of a whole row straight
           out of Excel, which is where a monthly accomplishment sheet already lives. */
        return '<td class="' + (i === ti ? 'now' : '') + '">' + (ed
          /* ⚠️⚠️ `type="text"` + `inputmode="decimal"`, NOT `type="number"`, AND THIS WAS MEASURED
             RATHER THAN PREFERRED. A number input REFUSES anything the spec cannot parse and reads
             back `""` — so typing "12,5" gave an empty string, `setCell`'s comma handling never saw a
             comma, and the value vanished with no error. This repo has recorded the same trap twice
             (the BOQ grid in August, nine Contracts & Claims money fields on 2026-09-09) and fixed
             it the same way both times. The keypad is kept by `inputmode`; the spinner is lost,
             which is the trade those two already made.
             ⚠️ `min`/`max`/`step` are dropped with it — they do nothing on a text input, and leaving
             them would read as validation that is not happening. The range IS enforced, in setCell,
             which is the one path every edit and every paste goes through. */
          ? '<input class="sc-in sc-mcell" type="text" inputmode="decimal" ' +
            'data-i="' + esc(t) + '" data-f="' + mk + '" value="' + (v == null ? '' : v) + '" ' +
            'aria-label="' + esc(t + ' — ' + manKind + ' % for ' + _MABBR[m.getMonth()] + ' ' + m.getFullYear()) + '">'
          : '<span class="sc-ro" title="' + esc(cellWhyNot(i)) + '">' + (v == null ? '\u2014' : v) + '</span>') +
          '</td>';
      }).join('');
      return '<tr><td class="k"><span class="dot"' + (isGR(t) ? ' style="background:#C9A227"' : '') + '></span>' +
        esc(t) + '<small>' + sh + '% of the project</small></td>' + cells +
        '<td class="tot" data-rowtot="' + esc(t) + '">' + (Math.round(rowSum * 10) / 10) + '%</td></tr>';
    }).join('');

    /* ⚠️⚠️ THE COLUMN TOTAL IS THE PROJECT'S OWN FIGURE FOR THAT MONTH, WEIGHTED — not the sum of
       the column. Adding six trades' percentages together would give a number over 100 that means
       nothing: each is a share of a different scope. Weighted, it is exactly the height of that
       month's bar on the chart above, which makes the footer a cross-check between the sheet and
       the curve rather than a second opinion. */
    function colTotal(mk) {
      var tot = 0;
      all.forEach(function (t) {
        var v = manValue(t, mk, manKind);
        if (v != null && W.tot) tot += v / 100 * (W.w[t] || 0) / W.tot * 100;
      });
      return Math.round(tot * 10) / 10;
    }
    var foot = '<tr><td class="k">Project (weighted)</td>' +
      months.map(function (m, i) {
        var mk = monthKey(m);
        return '<td class="' + (i === ti ? 'now' : '') + '" data-coltot="' + mk + '">' + colTotal(mk) + '%</td>';
      }).join('') +
      '<td class="tot" data-grandtot="1">' + (Math.round(months.reduce(function (acc, m) { return acc + colTotal(monthKey(m)); }, 0) * 10) / 10) + '%</td></tr>';

    var sheet = '<div class="sc-matrixwrap"><table class="sc-matrix" id="sc-matrix">' +
      '<thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>';

    /* ⚠️ THE SHEET SAYS WHETHER THE CURVE IS ACTUALLY READING IT. With the tab and the mode
       separate, a planner can fill this in for an hour while the Curve tab still draws the
       schedule — a legitimate thing to do and a terrible thing to discover afterwards. */
    var nDirty = manDirtyCount();
    var srcLine = (mode === 'manual')
      ? '<span class="sc-srcon">The <b>Curve</b> tab is drawing from this sheet.</span>'
      : '<span class="sc-srcoff">The <b>Curve</b> tab is drawing from the <b>schedule</b>, not from this sheet. ' +
        '<button class="pd-btn pd-btn-sm" id="sc-usemanual">Use this sheet</button></span>';

    card.innerHTML =
      '<div class="sc-man-head"><h3>Manual POC entry</h3>' +
        '<span class="sc-note" style="margin:0;">' + all.length + ' trades \u00b7 ' + months.length +
        ' months \u00b7 weighted by ' + pw + '</span>' +
        '<span class="sc-man-act">' +
          (nDirty ? '<span class="sc-unsaved">' + nDirty + ' unsaved</span>' : '') +
          '<button class="pd-btn pd-btn-sm" id="sc-mansave"' + (nDirty ? '' : ' disabled') + '>' +
            'Save' + (nDirty ? ' (' + nDirty + ')' : '') + '</button>' +
        '</span></div>' +
      /* ==========================================================================================
         THE CURVE ABOVE THE SHEET.
         Owner: *"while inputting, there would still be an scurve displayed above the table."*
         ⚠️ It is the SAME renderChart the Curve tab uses, pointed at this host — see the note on
         that function. And it is LIVE: computeManual reads manEffective(), so it redraws from the
         unsaved edits as they are typed rather than jumping on Save.
         ⚠️ Its own note carries the unsaved count, because a chart drawn from numbers that are not
         in the database yet must say so — a screenshot of it would otherwise assert data nobody
         has kept.
         ========================================================================================== */
      '<div class="sc-manchartwrap">' +
        '<div class="sc-mancap"><span class="t">Live preview</span>' +
        '<span class="s">redraws as you type, unsaved edits included</span></div>' +
        '<div id="sc-manchart"></div><p class="sc-note" id="sc-mannote"></p></div>' +
      '<div class="sc-srcbar">' + srcLine + '</div>' +
      lockBar +
      '<div class="sc-filterbar sc-kindbar">' + kindSeg +
        '<span class="sc-note" id="sc-manhint" style="margin:0;"></span></div>' +
      sheet +
      '<div class="sc-man-note">' +
        'Every cell is <b>that month\'s own share of that trade</b>, not of the project — so a ' +
        'trade\'s <b>Planned</b> row should add up to <b>100%</b> in the Total column. ' +
        'The <b>Project (weighted)</b> footer is each month weighted by its trades\' share of the ' +
        'schedule, which is the height of that month\'s bar on the chart above.' +
        '<br>\u26a0\ufe0f The sheet is always <b>monthly</b> — that is the grain the figures are stored at. ' +
        'The Period control changes the CHART only; entering a quarter would mean splitting it back ' +
        'across three months, and there is no honest way to choose that split.' +
        (d.manUnmatched && d.manUnmatched.length
          ? '<br>\u26a0\ufe0f <b>' + d.manUnmatched.length + ' trade' + (d.manUnmatched.length === 1 ? '' : 's') +
            ' in the saved sheet no longer match the schedule</b> (' + esc(d.manUnmatched.join(', ')) +
            ') \u2014 they carry no weight and are not on the curve. A trade renamed in the schedule keeps ' +
            'its entries here; re-enter them under the new name, or rename it back.'
          : '') +
      '</div>';

    // ---- the live chart ----------------------------------------------------------------------
    manChart();

    // ---- wiring ------------------------------------------------------------------------------
    var kb = document.getElementById('sc-mankind');
    if (kb) kb.querySelectorAll('[data-k]').forEach(function (bt) {
      bt.onclick = function () {
        if (manKind === bt.dataset.k) return;
        manKind = bt.dataset.k;
        try { localStorage.setItem('sc_mankind_' + pid, manKind); } catch (e) {}
        renderManual();
      };
    });
    /* ⚠️⚠️ A CELL EDIT DOES **NOT** RE-RENDER THE SHEET, and that is the change the matrix forced.
       The per-trade sheet re-rendered on every change because its running-cumulative column had to
       be recomputed — harmless there, fatal here: rebuilding the table drops the focus out of the
       cell being typed in and destroys PDGrid's listeners, so Tab, fill-down and paste would all
       die on the first keystroke. manRefresh() writes the totals and redraws the chart WITHOUT
       touching the grid. */
    card.querySelectorAll('.sc-mcell').forEach(function (el) {
      el.onchange = function () { setCell(el.dataset.i, el.dataset.f, el.value, el); };
    });
    /* PDGrid is the app's own spreadsheet layer (assets/js/xlgrid.js): Tab/Enter/arrows,
       Shift+arrow selection, Ctrl+D fill down, Ctrl+Z, and a paste of a TSV block straight from
       Excel. ⚠️ Its onSet routes through the SAME setCell an ordinary edit takes, so a pasted value
       gets identical validation — a second write path would be a second set of bugs.
       ⚠️ Degrades silently: without the script the grid is still a grid of ordinary inputs. */
    var mtable = document.getElementById('sc-matrix');
    if (mtable && window.PDGrid && PDGrid.attach) {
      try {
        PDGrid.attach({ root: mtable, cell: '.sc-mcell', storageKey: 'scmanual',
          onSet: function (rowId, field, value) { setCell(rowId, field, value, null); } });
      } catch (e) {}
    }
    var hint = document.getElementById('sc-manhint');
    if (hint) hint.innerHTML = (window.PDGrid && PDGrid.hintHTML) ? PDGrid.hintHTML()
      : 'Tab / Enter to move \u00b7 paste a row straight from Excel';
    var sv = document.getElementById('sc-mansave'); if (sv) sv.onclick = function () { saveManual(); };
    var um = document.getElementById('sc-usemanual');
    if (um) um.onclick = function () {
      mode = 'manual';
      try { localStorage.setItem(modeKey(), mode); } catch (e) {}
      render();
    };
    var lk = document.getElementById('sc-lock'); if (lk) lk.onclick = function () { setPlannedLock(true); };
    var ul = document.getElementById('sc-unlock'); if (ul) ul.onclick = function () { setPlannedLock(false); };
    if (window.Icons) Icons.hydrate(card);
  }

  function wireShape() {
    var sh = document.getElementById('sc-shape');
    if (sh) sh.querySelectorAll('[data-v]').forEach(function (b) {
      b.onclick = function () { chartMode = b.dataset.v; render(); };
    });
    var pe = document.getElementById('sc-period');
    if (pe) pe.querySelectorAll('[data-v]').forEach(function (b) {
      b.onclick = function () {
        if (period === b.dataset.v) return;
        period = b.dataset.v;
        try { localStorage.setItem('sc_period_' + pid, period); } catch (e) {}
        // ⚠️ A breakdown open on a month cannot survive a switch to years — its bucket key no
        // longer exists. Closed rather than re-mapped, because re-mapping would silently show
        // figures for a period nobody clicked.
        closeBreakdown();
        render();
      };
    });
  }

  function render() {
    var d = compute();
    /* ⚠️ The curve half is drawn even while the Manual tab is showing, because the pane is HIDDEN
       rather than emptied — so switching back is instant and the chart is not rebuilt from
       scratch on every tab press. The cost is one render of an off-screen chart; the alternative

    document.querySelectorAll('.sc-tabs [data-view]').forEach(function (b) { b.classList.toggle('active', b.dataset.view === view); });
    var h = document.getElementById('sc-cardh');
    /* ⚠️⚠️ THE HEADING NAMES THE FILTER. A curve of one trade under a heading reading "Project

    if (h) {
      var what = (basis === 'cost' ? 'Cost S-Curve — Planned Value vs Earned Value'

      var scopeTxt = trSel.length

  function renderKpis(d) {

    var v = r1(d.variance);

    // the curve is a percentage-of-total curve either way, and swapping the headline to a peso
    // amount would make "Schedule Variance ... pp" read as money too.
    var m = d.money;
    host.innerHTML =
      k(m ? 'Cost loaded' : 'Overall Progress', r1(d.overallPct) + '%',
        m ? (peso(d.TOT) + ' on ' + d.priced + ' of ' + d.activities + ' activities') : (d.activities + ' activities')) +
      k(m ? 'Planned value to date' : 'Planned to date', r1(d.plannedPct) + '%',
        m ? peso(d.plannedC[d.ti]) + ' should be spent' : 'Where the plan says we should be') +
      k(m ? 'Earned value to date' : 'Actual to date', r1(d.actualPct) + '%',
        m ? peso(d.actualC[d.ti]) + ' earned' : 'Physical progress achieved') +
      k(m ? 'Cost-weighted variance' : 'Schedule Variance', (v > 0 ? '+' : '') + v + ' pp',
        (m ? peso(d.actualC[d.ti] - d.plannedC[d.ti]) + ' vs plan · ' : '') + (v >= 0 ? 'On / ahead of plan' : 'Behind plan'),

  /* ⚠️⚠️ ONE RENDERER, TWO HOSTS — the Curve tab's chart and the live preview above the manual

     divergence would be a preview that disagrees with the chart it is previewing.
     ⚠️ `opts.interactive` is false for the preview: the click opens the trade breakdown, which is a
     card in the OTHER pane. The hover readout is kept — it is the only place the amounts appear —
     and its "click for the breakdown" line is dropped there rather than left as a dead promise.
     ⚠️ The tip, the guide and the svg are found by CLASS through `host.querySelector`, never by id:

    var compact = !!opts.compact;

        d.manNoTable

          ? 'No cost is loaded on this schedule yet — none of its ' + d.nAct + ' activities carries a Planned IBB, so there is no money to curve.<br>' +

    /* ⚠️⚠️ THE SOURCE IS NAMED FIRST, before the weighting. A manual curve and a schedule-derived

       places that distinguish them, and screenshots of this card end up in reports. */
    if (d.manMode) {

         curve, (2) what the trades are weighted by, (3) what has actually been entered; manChart
         appends the unsaved count to it. What the compact form drops is the sentence telling the
         planner where the sheet is and how to switch back to Automatic — both of which are on

      basisNote.innerHTML = compact

          (seenTxt.length ? 'entered: <b>' + seenTxt.join(', ') + '</b>'

        : '<b>Manual curve</b> — entered by hand, per trade, per month, in the sheet ' +

          'roll up to the project in proportion to what they are worth. ' +
          (seenTxt.length ? 'Entered so far: <b>' + seenTxt.join(', ') + '</b>. '
                          : '<b>Nothing entered yet</b> — the curve is flat until the sheet below is filled in. ') +

       renderChart entirely, so with the mode on Manual the Curve tab rendered the sentence
       explaining the curve and an EMPTY plot underneath it. Nothing errored, and the note made it
       look as though something had happened, which is why it survived a browser check — that check
       only ever ran the automatic mode. Found by pointing the same renderer at the live preview
       above the manual sheet and getting an empty host back.

    basisNote.textContent = (d.money
      ? 'Progress weighted by the COST loaded on each activity (' + peso(d.TOT) + ' across ' + d.priced + ' of ' + d.activities +

        '), spread over each activity\'s dates ' + shapeNote(d.shapes) + '. '
      : 'Progress weighted by activity duration across ' + d.activities + ' activities. ') +
      'Solid = planned & actual (to data date). Red dashed = forecast to finish — ' +
      (d.manual ? 'pinned to ' + iso(d.fcFinish) : 'performance-based (SPI ' + (Math.round(d.spi * 100) / 100) + ', auto finish ' + iso(d.autoFc) + ')') +

    }
    /* ==========================================================================================
       THE COMPACT VARIANT.
       Owner 2026-09-11: *"can you make the curve smaller for the manual POC entry."*
       ⚠️⚠️ A SHORTER PLOT BOX, NOT A SCALED-DOWN CHART. Capping the rendered height and letting the

       the fonts keep real sizes in CSS. The x-axis mapping, the bars, the forecast and the hit

       periodic scale's labels sit outside the viewBox and are simply not there.
       ⚠️ 56, not 44: measured in a browser, "per month" at 9px starts at x=962 and runs ~44px, so

       one mapping, `xAt(D)` still lands a real date on it, and the SPI forecast S-curve — which is

       required a second date mapping per granularity, and the first disagreement between them
       would be a forecast line that misses the finish date it is drawn to.

       ⚠️⚠️ A SECOND Y-AXIS, and it is not a decoration. A monthly increment on a 3-year programme
