<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon-icon.png?v=20260903a" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png?v=20260830b" />
  <script src="../../assets/js/theme.js?v=20260910w7"></script>
  <title>Project S-Curve · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260911uc" />
  <style>
    /* ---- Uniform module chrome (matches every other module). Keep in sync.
       2026-08-30: modules gained a persistent sidebar (MODULE_CONTRACT.md) —
       .pd-content no longer forces width:100%; the shared `.pd-content
       { flex:1; min-width:0 }` rule in dashboard.css already sizes it
       correctly next to `.pd-sidebar` in the `.pd-app` flex row. ---- */
    .pd-topbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px; }
    .pd-topbar #user-bar { margin-left:10px; padding-left:10px; border-left:1px solid var(--pd-line); flex:none; }
    .pd-topbar #pd-theme-toggle { width:34px; height:34px; padding:0; margin-left:4px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
    .sc-title { flex:0 1 auto; min-width:0; display:flex; align-items:center; overflow:hidden; margin:0; }
    .sc-title .sc-title-txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sc-title-ico { color:var(--pd-red); vertical-align:-3px; margin-right:4px; }
    /* Project context — borderless until hover */
    .sc-projctx { display:flex; align-items:center; min-width:0; flex:0 1 auto; }
    .sc-project { max-width:260px; min-width:120px; height:34px; font-weight:700; font-size:var(--pd-fs-base); background:transparent; border-color:transparent; }
    .sc-project:hover, .sc-project:focus { background:var(--pd-card); border-color:var(--pd-line); }
    /* Tool cluster beside the profile */
    .sc-topbar-tools { display:flex; align-items:center; gap:4px; margin-left:auto; flex-wrap:wrap; }
    .sc-topbar-tools .pd-btn { height:34px; width:34px; padding:0; font-size:var(--pd-fs-base); display:inline-flex; align-items:center; justify-content:center; background:transparent; border-color:transparent; }
    .sc-topbar-tools .pd-btn:hover { background:var(--pd-bg); border-color:var(--pd-line); }
    .sc-topbar-tools .pd-btn.is-active { background:var(--pd-red); border-color:var(--pd-red); color:#fff; }
    .sc-topbar-tools .pd-btn.sc-tb-labeled { width:auto; padding:0 12px; gap:6px; }
    .sc-tb-sep { width:1px; align-self:stretch; margin:5px 3px; background:var(--pd-line); }
    /* Forecast-finish control lives in the tool cluster */
    .sc-fc { display:inline-flex; align-items:center; gap:6px; font-size:var(--pd-fs-sm); color:var(--pd-muted); white-space:nowrap; flex:none; }
    .sc-fc .pd-input { height:34px; width:150px; font-size:var(--pd-fs-base); }
    .sc-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--pd-space-md); margin-bottom:18px; }
    .sc-kpi { background:var(--pd-card); border:1px solid var(--pd-line); border-radius:var(--pd-radius-lg); padding:var(--pd-space-lg) 18px; }
    .sc-kpi-l { font-size:var(--pd-fs-xs); font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--pd-muted); margin-bottom:5px; }
    .sc-kpi-v { font-size:var(--pd-fs-stat); font-weight:800; } .sc-kpi-s { font-size:var(--pd-fs-sm); color:var(--pd-muted); margin-top:2px; }
    .sc-ok { color:var(--pd-ok-text); } .sc-bad { color:var(--pd-bad-text); }
    .sc-card { background:var(--pd-card); border:1px solid var(--pd-line); border-radius:var(--pd-radius); padding:16px; margin-bottom:18px; }
    .sc-card h3 { margin:0 0 12px; font-size:var(--pd-fs-md); }
    .sc-svg { width:100%; height:auto; display:block; }
    .sc-grid { stroke:var(--pd-line); stroke-width:1; }
    .sc-ylab { fill:var(--pd-muted); font-size:11px; text-anchor:end; }
    .sc-xlab { fill:var(--pd-muted); font-size:11px; text-anchor:middle; }
    .sc-planned { fill:none; stroke:var(--pd-dark); stroke-width:2; }
    html.pd-dark .sc-planned { stroke:#c7ccd1; }
    .sc-earned { fill:none; stroke:var(--pd-red); stroke-width:2.5; }
    .sc-today { stroke:var(--pd-red); stroke-width:1.5; stroke-dasharray:4 3; }
    .sc-today-lab { fill:var(--pd-red); font-size:10px; font-weight:700; }
    .sc-forecast { fill:none; stroke:var(--pd-red); stroke-width:2; stroke-dasharray:7 5; }
    /* Weighting switch — what an activity is WORTH on the curve: its duration, or the money the
       Project Schedule's Cost Loading put on it. */
    .sc-seg { display:inline-flex; border:1px solid var(--pd-line); border-radius:var(--pd-radius-md); overflow:hidden; }
    .sc-seg button { border:0; background:var(--pd-card); color:var(--pd-ink); font:inherit; font-size:var(--pd-fs-sm);
      font-weight:700; padding:0 10px; height:32px; cursor:pointer; }
    .sc-seg button + button { border-left:1px solid var(--pd-line); }
    .sc-seg button:hover { background:var(--pd-bg); }
    .sc-seg button.on { background:var(--pd-red); color:#fff; }
    .sw-forecast { width:18px; height:0; border-top:2px dashed var(--pd-red); }
    .sc-legend { display:flex; flex-wrap:wrap; gap:18px; margin-top:12px; font-size:var(--pd-fs-sm); color:var(--pd-muted); }
    .sc-lg { display:inline-flex; align-items:center; }
    .sw { display:inline-block; width:18px; height:3px; margin-right:6px; }
    .sw-planned { background:var(--pd-dark); } html.pd-dark .sw-planned { background:#c7ccd1; }
    .sw-earned { background:var(--pd-red); } .sw-today { background:var(--pd-red); width:3px; height:12px; }
    .sc-empty { text-align:center; padding:40px; color:var(--pd-muted); }
    .sc-table { width:100%; border-collapse:collapse; font-size:var(--pd-fs-base); }
    .sc-table th { background:var(--pd-bg); padding:8px 12px; text-align:right; font-size:var(--pd-fs-xs); text-transform:uppercase; letter-spacing:.04em; color:var(--pd-muted); border-bottom:2px solid var(--pd-line); }
    .sc-table th, .sc-table td { white-space:nowrap; }
    .sc-table th:first-child, .sc-table td:first-child { text-align:left; position:sticky; left:0; z-index:1; font-weight:700; }
    .sc-table td:first-child { background:var(--pd-card); }
    .sc-table th:first-child { background:var(--pd-bg); }
    .sc-table td { padding:7px 12px; border-bottom:1px solid var(--pd-line); text-align:right; }
    .sc-fc-row td { color:var(--pd-red); font-style:italic; }
    .sc-fc-row td:first-child { color:var(--pd-red); }
    /* ---- The periodic bars -------------------------------------------------------------------
       ⚠️ The three fills are the SAME three colours as the cumulative lines, so a reader learns
       one key and not two. Planned is the neutral ink, actual is brand red, forecast is red at
       low opacity — the same "forecast is the pale one" rule the dashed line already uses. */
    .sc-barp { fill:var(--pd-dark); opacity:.20; }
    html.pd-dark .sc-barp { fill:#c7ccd1; opacity:.22; }
    .sc-bara { fill:var(--pd-red); opacity:.85; }
    .sc-barf { fill:var(--pd-red); opacity:.34; }
    .sc-ylab2 { fill:var(--pd-muted); font-size:10px; text-anchor:start; }
    .sc-ylab2-t { font-size:9px; font-weight:700; }
    .sw-barp { background:var(--pd-dark); opacity:.3; height:10px; }
    html.pd-dark .sw-barp { background:#c7ccd1; }
    .sw-bara { background:var(--pd-red); opacity:.85; height:10px; }
    .sw-barf { background:var(--pd-red); opacity:.34; height:10px; }
    .sc-axisnote { margin-top:6px; }
    /* ---- The filter bar ---------------------------------------------------------------------
       Owner 2026-09-10: *"a mode at the top to filter the trades being displayed. And then later
       on a filter for General Requirements vs Measured Works."* Two controls, coarse then fine:
       the scope split answers "which KIND of work", the chips answer "which trades exactly".
       ⚠️ Above the chart, not in the topbar. The topbar already carries five controls and this
       one changes WHAT THE CURVE IS ABOUT — it belongs with the thing it changes. */
    .sc-filterbar { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:12px; }
    .sc-fl { font-size:var(--pd-fs-xs); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
      color:var(--pd-muted); }
    .sc-chips { display:flex; gap:6px; flex-wrap:wrap; }
    .sc-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--pd-line);
      background:var(--pd-card); color:var(--pd-ink); border-radius:var(--pd-radius-pill);
      padding:4px 11px; font-size:var(--pd-fs-sm); cursor:pointer; font:inherit; font-size:var(--pd-fs-sm); }
    .sc-chip:hover { border-color:var(--pd-muted); }
    /* ⚠️ INK on the red tint, never brand red as the text — the same measured contrast fix the
       vertical stacking's chips record (#EE3124 on #3D1A19 is 3.75:1, under AA). The lit state IS
       the filter, so a chip you cannot read is a filter you cannot check. */
    .sc-chip.on { border-color:var(--pd-red); background:var(--pd-red-light); color:var(--pd-ink); font-weight:700; }
    .sc-chip .n { font-size:var(--pd-fs-micro); color:var(--pd-muted); font-weight:500; }
    .sc-chip.on .n { color:var(--pd-ink); opacity:.7; }
    .sc-chip .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--pd-muted); }
    .sc-chip.gr .dot { background:#C9A227; } .sc-chip.mw .dot { background:#4F8EF7; }
    .sc-filternote { font-size:var(--pd-fs-xs); color:var(--pd-muted); flex:1 1 100%; }
    /* ---- The manual entry sheet ---------------------------------------------------------------
       Owner 2026-09-10: *"allows users to input POCs per trade on a monthly basis, you decide the
       formatting but make it aesthetic and visually pleasing."*

       ⚠️⚠️ ONE TRADE AT A TIME, MONTHS DOWN THE PAGE — not a trades × months matrix. A 3-year
       job with eight trades is 288 cells, and with three kinds per cell it is 864: a grid nobody
       can fill in without losing their place, and one that has to scroll in both directions on
       any screen. A month per row, one trade selected, keeps the three numbers for a month on one
       line where they are read together and entered together.
       ⚠️ The three kinds are three COLUMNS side by side because the question a planner is
       actually answering is "against this plan, what did we do, and what will we do" — that is a
       comparison, and a comparison wants adjacency.
       ⚠️ Every entry shows its RUNNING CUMULATIVE beside it, greyed. The stored number is
       periodic (see the migration for why) and the curve is the running sum, so without this a
       planner has to add up in their head to know where the curve reaches.
       ------------------------------------------------------------------------------------------ */
    .sc-man-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
    .sc-man-head h3 { margin:0; flex:0 0 auto; }
    .sc-man-act { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .sc-sheet { width:100%; border-collapse:separate; border-spacing:0; font-size:var(--pd-fs-base); }
    .sc-sheet th { position:sticky; top:0; z-index:2; background:var(--pd-bg); padding:7px 10px;
      font-size:var(--pd-fs-xs); text-transform:uppercase; letter-spacing:.04em; color:var(--pd-muted);
      border-bottom:1px solid var(--pd-line); text-align:right; white-space:nowrap; }
    .sc-sheet th.k, .sc-sheet td.k { text-align:left; }
    /* The three kinds are tinted at their column head, using the same three colours as the
       curve and the bars — so the sheet and the chart are one key, not two. */
    .sc-sheet th.pl { box-shadow:inset 0 -2px 0 var(--pd-muted); }
    .sc-sheet th.ac { box-shadow:inset 0 -2px 0 var(--pd-red); }
    .sc-sheet th.fc { box-shadow:inset 0 -2px 0 rgba(238,49,36,.4); }
    .sc-sheet td { padding:4px 10px; border-bottom:1px solid var(--pd-line); text-align:right; white-space:nowrap; }
    .sc-sheet tbody tr:hover td { background:var(--pd-bg); }
    /* The month the data date falls in — the boundary between actual and forecast, marked once
       rather than explained twice. */
    .sc-sheet tr.now td { background:var(--pd-red-light); }
    .sc-sheet tr.now td.k { font-weight:800; }
    .sc-sheet td.k { font-weight:700; }
    .sc-sheet td.k small { display:block; font-size:var(--pd-fs-micro); color:var(--pd-muted); font-weight:500; }
    .sc-in { width:64px; height:30px; padding:0 7px; text-align:right; font:inherit;
      font-size:var(--pd-fs-sm); font-variant-numeric:tabular-nums; border:1px solid var(--pd-line);
      border-radius:var(--pd-radius-sm); background:var(--pd-card); color:var(--pd-ink); }
    .sc-in:focus { outline:none; border-color:var(--pd-red); box-shadow:0 0 0 2px var(--pd-red-light); }
    /* ⚠️ A cell that cannot be edited says so by BEING a figure rather than an empty box. An
       input with disabled styling still reads as "type here, but not now"; plain text reads as
       "this is the number". The reason is on the row group, once. */
    .sc-ro { display:inline-block; min-width:64px; padding:0 7px; color:var(--pd-muted);
      font-variant-numeric:tabular-nums; }
    .sc-cum { display:inline-block; min-width:52px; font-size:var(--pd-fs-micro); color:var(--pd-muted);
      font-variant-numeric:tabular-nums; }
    .sc-sheet tfoot td { padding:8px 10px; border-top:2px solid var(--pd-line); font-weight:800;
      border-bottom:0; background:var(--pd-card); position:sticky; bottom:0; }
    /* The sum-to-100 check. ⚠️ Green is NOT "good", it is "adds up" — and amber is not an error,
       it is a column still being filled in. A planner half-way through entering a plan must not
       be told they are wrong. */
    .sc-tot-ok { color:var(--pd-ok-text); }
    .sc-tot-off { color:var(--pd-bad-text); }
    .sc-tot-part { color:var(--pd-muted); }
    .sc-sheetwrap { max-height:min(60vh, 520px); overflow:auto; border:1px solid var(--pd-line);
      border-radius:var(--pd-radius-md); }
    .sc-lockbar { display:flex; align-items:flex-start; gap:9px; padding:9px 12px; margin-bottom:12px;
      border:1px solid var(--pd-line); border-left:3px solid var(--pd-red); border-radius:var(--pd-radius-md);
      background:var(--pd-bg); font-size:var(--pd-fs-sm); line-height:1.5; }
    .sc-lockbar b { color:var(--pd-ink); }
    .sc-lockbar .sc-lockact { margin-left:auto; flex:none; }
    .sc-man-note { font-size:var(--pd-fs-sm); color:var(--pd-muted); margin-top:10px; line-height:1.55; }
    @media (max-width:700px) { .sc-sheet { min-width:560px; } .sc-in, .sc-ro { width:56px; min-width:56px; } }
    /* ---- The tab strip ------------------------------------------------------------------------
       ⚠️ Styled like every other module's: the shared `.pd-tabsdrop` takes over above 700px, so
       these rules are what shows on a phone and before JS runs. */
    .sc-tabs { display:flex; gap:2px; }
    .sc-tab { border:0; background:transparent; color:var(--pd-muted); font:inherit;
      font-size:var(--pd-fs-sm); font-weight:700; padding:0 12px; height:34px; cursor:pointer;
      border-bottom:2px solid transparent; }
    .sc-tab:hover { color:var(--pd-ink); }
    .sc-tab.active { color:var(--pd-red); border-bottom-color:var(--pd-red); }

    /* ---- The hover readout --------------------------------------------------------------------
       Owner 2026-09-10: *"when hovering over data, pls show the contents like POC, amount."*

       ⚠️ The plot is the positioning context, so the readout travels with the chart and needs no
       scroll listener. ⚠️ `pointer-events:none` on the readout itself is load-bearing: without it
       the panel sits over the very hit band that opened it, the band gets a mouseleave the moment
       the panel appears, and the readout flickers on and off as you move.
       ------------------------------------------------------------------------------------------ */
    .sc-plot { position:relative; }
    .sc-hit { fill:transparent; cursor:pointer; }
    .sc-hit:hover { fill:var(--pd-red); fill-opacity:.045; }
    .sc-hit:focus-visible { fill:var(--pd-red); fill-opacity:.09; outline:none; }
    .sc-guide { stroke:var(--pd-muted); stroke-width:1; stroke-dasharray:3 3; opacity:.75;
      pointer-events:none; }
    .sc-tip { position:absolute; z-index:5; min-width:196px; max-width:270px; pointer-events:none;
      background:var(--pd-card); border:1px solid var(--pd-line); border-radius:var(--pd-radius-md);
      box-shadow:var(--pd-shadow-lg); padding:9px 11px 10px; font-size:var(--pd-fs-sm);
      color:var(--pd-ink); }
    .sc-tip-h { font-weight:800; font-size:var(--pd-fs-base); display:flex; align-items:baseline;
      justify-content:space-between; gap:8px; }
    .sc-tip-h small { font-size:var(--pd-fs-micro); font-weight:500; color:var(--pd-muted); }
    /* A section label, not a heading — it separates cumulative from periodic from money, which
       are three different questions about one period and get read as one number otherwise. */
    .sc-tip-sec { margin:7px 0 3px; font-size:var(--pd-fs-micro); font-weight:700;
      text-transform:uppercase; letter-spacing:.05em; color:var(--pd-muted);
      border-top:1px solid var(--pd-line); padding-top:5px; }
    .sc-tip-r { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
      line-height:1.6; }
    .sc-tip-r .k { color:var(--pd-muted); }
    .sc-tip-r .v { font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
    /* The same three colours as the curve and the bars — one key for the whole card. */
    .sc-tip-r.is-act .v { color:var(--pd-red); }
    .sc-tip-r.is-fc .v { color:var(--pd-red); opacity:.72; }
    .sc-tip-r.is-ok .v { color:var(--pd-ok-text); }
    .sc-tip-r.is-bad .v { color:var(--pd-bad-text); }
    .sc-tip-dim { color:var(--pd-muted); font-weight:500; }
    .sc-tip-none { margin-top:7px; padding-top:5px; border-top:1px solid var(--pd-line);
      font-size:var(--pd-fs-micro); color:var(--pd-muted); line-height:1.45; }
    .sc-tip-cta { margin-top:7px; font-size:var(--pd-fs-micro); font-weight:700; color:var(--pd-red); }
    .sc-lg-hint { color:var(--pd-muted); font-style:italic; }

    /* ---- The trade breakdown -----------------------------------------------------------------
       Reuses `.sc-sheet` rather than defining a third table: the manual sheet already establishes
       the sticky head, the frozen first column and the numeric alignment this needs. */
    .sc-bd-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .sc-bd-head h3 { margin:0; }
    .sc-bd td.k { min-width:180px; }
    .sc-bd td.k .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
      background:var(--pd-red); margin-right:7px; }
    .sc-bd td.k small { display:block; font-size:var(--pd-fs-micro); color:var(--pd-muted);
      font-weight:500; margin-left:15px; }
    .sc-bd td.is-act { color:var(--pd-red); font-weight:700; }
    .sc-bd tbody tr.sc-bd-empty td { color:var(--pd-muted); font-style:italic; }
    .sc-per-row td { color:var(--pd-muted); }
    .sc-per-row td:first-child { color:var(--pd-muted); font-weight:500; }

    /* Does the curve read this sheet? ⚠️ Stated, because the tab and the mode are separate and a
       planner can otherwise fill this in for an hour without the chart moving. */
    .sc-srcbar { margin-bottom:10px; font-size:var(--pd-fs-sm); }
    .sc-srcon { color:var(--pd-ok-text); }
    .sc-srcoff { display:inline-flex; align-items:center; gap:9px; flex-wrap:wrap;
      color:var(--pd-bad-text); }
    @media (max-width:700px) {
      .sc-tip { max-width:min(270px, 78vw); }
      .sc-bd { min-width:640px; }
    }
    /* ---- The manual matrix: trades down, months across --------------------------------------
       Owner 2026-09-10: *"the months are plotted as columns and the trades are plotted as rows."*

       ⚠️⚠️ A FROZEN CORNER, and both halves are needed. Thirty-six month columns are wider than
       any screen, so the trade name has to stay put while you scroll right (or you are typing
       into an unlabelled cell), and the month has to stay put while you scroll down (or you are
       typing into an unlabelled column). `position:sticky` on the first cell of every row and on
       the header, with the corner cell sticky in BOTH axes and a higher z-index so it is not
       painted over by either.
       ⚠️ The wrapper scrolls, not the page: `overflow:auto` on the wrapper is what gives sticky
       something to be sticky WITHIN. Without it the cells stick to the viewport and drift out of
       the table entirely.
       ------------------------------------------------------------------------------------------ */
    .sc-matrixwrap { max-height:min(58vh, 520px); overflow:auto; border:1px solid var(--pd-line);
      border-radius:var(--pd-radius-md); background:var(--pd-card); }
    .sc-matrix { border-collapse:separate; border-spacing:0; font-size:var(--pd-fs-sm); }
    .sc-matrix th, .sc-matrix td { padding:3px 6px; border-bottom:1px solid var(--pd-line);
      border-right:1px solid var(--pd-line); white-space:nowrap; text-align:right; }
    .sc-matrix thead th { position:sticky; top:0; z-index:2; background:var(--pd-bg);
      font-size:var(--pd-fs-micro); font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; color:var(--pd-muted); border-bottom:2px solid var(--pd-line); }
    .sc-matrix th.mo { min-width:52px; text-align:center; line-height:1.15; }
    .sc-matrix th.mo small { display:block; font-size:9px; font-weight:500; opacity:.75; }
    /* The trade column: sticky left, and the corner sticky in both axes. */
    .sc-matrix .k { position:sticky; left:0; z-index:1; background:var(--pd-card);
      text-align:left; min-width:186px; max-width:186px; font-weight:700;
      border-right:2px solid var(--pd-line); overflow:hidden; text-overflow:ellipsis; }
    .sc-matrix thead .k { z-index:3; background:var(--pd-bg); }
    .sc-matrix tfoot .k { z-index:3; }
    .sc-matrix .k .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
      background:var(--pd-red); margin-right:7px; }
    .sc-matrix .k small { display:block; margin-left:15px; font-size:var(--pd-fs-micro);
      color:var(--pd-muted); font-weight:500; }
    /* The month the data date falls in, marked once down the whole column. */
    .sc-matrix th.now, .sc-matrix td.now { background:var(--pd-red-light); }
    .sc-matrix tbody tr:hover td:not(.k) { background:var(--pd-bg); }

    .sc-matrix tfoot td { position:sticky; bottom:0; z-index:2; background:var(--pd-card);

    /* ---- The live preview above the sheet ------------------------------------------------------
       ⚠️ Given its own bordered block rather than dropped straight into the card: it is the same
       chart the Curve tab shows, and without a frame around it the sheet below reads as part of

       Owner 2026-09-11: *"can you make the curve smaller for the manual POC entry. And make it
       aesthetically pleasing."*
       ⚠️⚠️ SMALLER IS A DIFFERENT CHART, NOT A SCALED-DOWN ONE. The obvious move — cap the height
       and let the viewBox shrink — takes the type down with it: at the height this needed, the
       11px axis labels land at about 7px and the legend swatches become dashes. So the compact
       pass changes the DRAWING (a shorter plot box, three gridlines instead of five, tighter
       padding) and leaves every font at a real size. The furniture below shrinks on its own terms.

    .sc-svg-sm .sc-ylab, .sc-svg-sm .sc-xlab { font-size:10px; }

    .sc-svg-sm .sc-planned, .sc-svg-sm .sc-forecast { stroke-width:1.6; }

    .sc-legend-sm .sw { width:14px; margin-right:5px; }
    .sc-legend-sm .sw-today { width:3px; height:10px; }
    .sc-axisnote-sm { font-size:var(--pd-fs-micro); margin-top:5px; line-height:1.5; }
    /* ⚠️ Unsaved edits are marked in the BAD colour, not a neutral one: the curve above is drawn
       from them, so the state is "this chart is not what the database holds" — which is a warning,
       not a status. */
    .sc-unsaved { font-size:var(--pd-fs-xs); font-weight:700; color:var(--pd-bad-text);
      background:var(--pd-bad-bg); padding:2px 8px; border-radius:var(--pd-radius-pill);
      border:1px solid var(--pd-bad-line); }
    .sc-unsaved-inline { color:var(--pd-bad-text); }
    @media (max-width:700px) {
      .sc-matrix .k { min-width:132px; max-width:132px; }
      .sc-matrixwrap { max-height:60vh; }
    }
    .sc-note { font-size:var(--pd-fs-sm); color:var(--pd-muted); margin-top:8px; }
    .sc-loading { position:fixed; inset:0; background:rgba(20,20,20,.4); display:flex; align-items:center; justify-content:center; gap:12px; z-index:var(--pd-z-loading); color:#fff; font-weight:700; }
    .sc-spin { width:36px; height:36px; border:4px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:sc-spin .8s linear infinite; }
    @keyframes sc-spin { to { transform:rotate(360deg); } }
    @media (max-width:820px) { .sc-title-txt { display:none; } .sc-fc { font-size:0; } .sc-fc .pd-input { width:130px; } }
  
      /* ---- Mobile & tablet (2026-07-23) --------------------------------
         Shared chrome (topbar wrap, sheet modals, 16px inputs, 44px targets)
         comes from dashboard.css.

         CHARTS: every SVG here already uses viewBox + width:100%, so it
         *scales* — but scaling a ~900-unit-wide chart into ~350px shrinks its
         9.5px labels to under 4px, i.e. unreadable. So below 700px the chart
         keeps a legible minimum width and its card scrolls horizontally
         instead of shrinking further. Do not "fix" this by dropping the
         min-width — that restores the unreadable version.
         ------------------------------------------------------------------ */
      @media (max-width: 700px) {
        /* ⚠️ `.sc-seg` is this module's own copy of the segmented control, so it never
           inherited the 44px that dashboard.css gives `.pd-seg > button` at this width.

        .sc-seg button { min-height: var(--pd-tap); }
        .sc-card { overflow-x: auto; }

        /* ⚠️ This module's frozen label column has NO declared width — it sizes to its content,
           so a long label makes the frozen zone arbitrarily wide and the data columns start
           off-screen. That is the same failure Manpower and Equipment hit with fixed 190/150px
           columns, just data-dependent instead of hard-coded. Capped at the 132px the rest of

           ⚠️ NOT measured live: this table sits behind a view I could not reach signed in, so
           unlike the Manpower/Equipment numbers this is the pattern applied, not a fix to an
           observed width. A cap can only narrow, so it cannot make the current state worse. */
        .sc-table th:first-child, .sc-table td:first-child {
          max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sc-kpis { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .sc-fc { flex-wrap: wrap; gap: 8px; }
        .sc-topbar-tools { flex-wrap: wrap; }
      }

<script>
(function () {
  'use strict';
  var TABLE = 'project_schedule', pid = null, rows = [], agg = null, forecastFinish = null, fcManual = false;
  // ⚠️ THE COST BASIS IS THE PROJECT SCHEDULE'S COST LOADING, READ THROUGH ONE COLUMN.
  // Cost Loading writes `project_schedule.planned_cost`; this curve weights each activity by that
  // figure instead of by its duration. There is no second store, no export step and no sync: load
  // the cost there, switch the weighting here, and the curve is the cost curve. Owner 2026-08-25:
  // *"the process of cost-loading… should translate or link to the s-curve module, based on the
  // cost-loaded activities and in relation to the schedule."*
  // ⚠️ Duration stays the DEFAULT. A project with no loading (or a half-finished one) must not
  // silently open on a money curve built from a handful of priced activities.
  var basis = 'dur';
  function basisKey() { return 'sc_basis_' + pid; }
  /* ==========================================================================================
     WHICH TRADES ARE ON THE CURVE.
     Owner 2026-09-10: *"add a periodic bar chart, and then a mode at the top to filter the
     trades being displayed. And then later on a filter for General Requirements vs Measured
     Works (Site Works, Structural, Architectural, MEPF etc)."*

     ⚠️⚠️ THE TRADE IS `work_type`, AND THAT IS THE SHELL'S OWN CONVENTION, not a new one
     invented here. The dashboard's programme panel already groups this same table by
     `work_type` (APP_CONFIG's project-schedule dash: `groupSpan, group: 'work_type'`), so a
     second rule here would put two screens' trade lists at odds over one schedule.
     ⚠️ Project Schedule's own `workOf()` additionally walks the WBS tree when the field is
     blank. That walk is NOT copied here — ~30 lines of tree ancestry duplicated into a second
     module is exactly what this module's engine comment forbids, and it would need the whole
     `wbs_nodes` table fetched alongside the schedule. The cost of not copying it is stated
     rather than hidden: activities with no `work_type` land in one honest bucket, the filter
     says how many they are, and the note names where to set it.
     ⚠️ EMPTY MEANS ALL. A project gains a trade — a re-push, a new branch — and a stored "every
     trade ticked" would silently exclude the new one while the control claimed everything was on.
     Same rule, and the same reason, as the vertical stacking's chip row.
     ========================================================================================== */
  var UNTRADED = 'No trade set';
  var trSel = [];                 // selected trades; [] = every trade
  var trScope = 'all';            // 'all' | 'gr' = General Requirements | 'mw' = Measured Works
  /* ⚠️ GENERAL REQUIREMENTS IS MATCHED, NOT LISTED. Preliminaries arrive spelled a dozen ways
     ("General Requirements", "General Requirement", "Gen. Requirements") and a hard list would
     silently drop a project that spells it differently into Measured Works, overstating measured
     progress — the one number this split exists to isolate. Keyword, case-insensitive, the same
     way Progress Photos matches its own trade vocabulary onto this column. */
  function isGR(t) { return /general\s*requirement/i.test(String(t || '')); }
  function tradeOf(r) { var t = String((r && r.work_type) || '').trim(); return t || UNTRADED; }
  // Every trade present, in the schedule's own first-seen order — which is the builder's order,
  // since a push walks the trades in sequence. ⚠️ Not alphabetical: "Architectural" before
  // "Site Works" reads as a sort, not as a sequence of works.
  function tradesIn(list) {
    var out = [], seen = {};
    list.forEach(function (r) { if (PDScurve.isWbs(r)) return; var t = tradeOf(r); if (!seen[t]) { seen[t] = 1; out.push(t); } });
    return out;
  }
  /* Does this row pass the two filters? ⚠️ `UNTRADED` passes NEITHER 'gr' nor 'mw', and that is
     deliberate: an activity whose trade nobody has set is UNKNOWN, not measured. Counting it as
     Measured Works would fold unclassified work into the figure a claim is built on. The chip row
     offers it by name so it can still be looked at on its own. */
  function rowPasses(r) {
    var t = tradeOf(r);
    if (trSel.length && trSel.indexOf(t) < 0) return false;
    if (trScope === 'gr' && !isGR(t)) return false;
    if (trScope === 'mw' && (isGR(t) || t === UNTRADED)) return false;
    return true;
  }
  function anyTradeFilter() { return !!(trSel.length || trScope !== 'all'); }
  // Which shape the chart draws. Owner: *"currently there is cumulative. I want you to add a
  // periodic bar chart."* Both, by default — the bars say what happens in a month, the lines say
  // where the project stands, and reading one against the other is the whole point.
  var chartMode = 'both';         // 'cum' | 'per' | 'both'
  /* Which SCREEN. ⚠️ Separate from `mode`: the tab is where the planner is, the mode is where the
     CURVE's numbers come from. They are deliberately independent — entering next quarter's forecast
     while still reading the schedule-derived curve is a normal thing to want, and coupling them
     would silently switch what the chart is claiming the moment somebody opened the sheet. */
  var view = 'curve';             // 'curve' | 'manual'
  function viewKey() { return 'sc_view_' + pid; }
  function switchView(v) {
    view = (v === 'manual') ? 'manual' : 'curve';
    try { localStorage.setItem(viewKey(), view); } catch (e) {}
    var pc = document.getElementById('sc-pane-curve'), pm = document.getElementById('sc-pane-manual');
    if (pc) pc.hidden = (view !== 'curve');
    if (pm) pm.hidden = (view !== 'manual');
    document.querySelectorAll('.sc-tabs [data-view]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.view === view);
      b.setAttribute('aria-selected', b.dataset.view === view ? 'true' : 'false');
    });
    /* ⚠️ NOTHING re-syncs the dropdown trigger here, and that is not an omission:
       tabsToDropdown() watches the real buttons' class attribute with a MutationObserver, so
       toggling .active above IS the re-sync. Calling into it would be a second mechanism for
       one job, and the two would drift the first time either changed. */
    /* ⚠️ The sheet needs BOTH the manual rows (from the two new tables) and the activities (to
       weight the trades), and the landing view may hold neither. Fetched on arrival rather than at
       load, so a planner who never opens this tab never pays for it. */
    if (view === 'manual' && !manMissing && (!MAN || !rowsLoaded)) {
      showLoading();
      loadManual().then(function () { hideLoading(); ensureRows(function () { render(); }); },
                        function () { hideLoading(); render(); });
      return;
    }
    render();
  }
  var UID = null, profile = null;
  function sb() { return AppAuth.getSB(); }
  function pd(v) { if (!v) return null; var m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; return new Date(+m[1], +m[2]-1, +m[3]); }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fcKey() { return 'sc_fc_' + pid; }
  function plannedFinishDate() { var mx = null; rows.forEach(function (a) { if (a.activity_type === 'WBS Summary') return; var e = pd(a.end_date); if (e && (!mx || e > mx)) mx = e; }); return mx; }
  function esc(s) { return Fmt.esc(s); }
  function showLoading() { var e = document.getElementById('sc-loading'); if (e) e.style.display = 'flex'; }
  function hideLoading() { var e = document.getElementById('sc-loading'); if (e) e.style.display = 'none'; }

  // ===== live collaboration (presence + live refresh) =======================
  // S-Curve is a READ-ONLY analytics view derived from project_schedule, so there
  // is no editing cursor. It gets: presence (who's viewing this project's curve)
  // and a LIVE refresh — when someone edits the schedule elsewhere, the curve
  // recomputes. Schedule edits can arrive in bursts (bulk import / global change),
  // so remote changes are coalesced into one debounced reload.
  var _collab = null, _reloadTimer = null;
  function _selfName() { return (profile && (profile.name || profile.email)) || 'Someone'; }
  function joinCollab() {
    if (!window.PDCollab) return;
    if (_collab) { _collab.leave(); _collab = null; }
    if (!pid) { renderPresence([]); return; }
    _collab = PDCollab.join({
      key: 'scurve:' + pid, table: TABLE, projectId: pid,
      self: { id: UID, name: _selfName() },
      onPresence: function (members) { renderPresence(members); },
      onSelection: function () {},
      onRemoteChange: function () {
        if (_reloadTimer) clearTimeout(_reloadTimer);
        _reloadTimer = setTimeout(function () { _reloadTimer = null; load(); }, 400);
      }
    });
  }
  function renderPresence(members) { var el = document.getElementById('sc-presence'); if (el) el.innerHTML = window.PDCollab ? PDCollab.avatarsHTML(members || []) : ''; }

  async function loadProjects() {
    var projects = await PDb.getProjects();
    var sel = document.getElementById('sc-project');
    pid = sessionStorage.getItem('pd_project') || (projects[0] && projects[0].id) || null;
    sel.innerHTML = '<option value="">— Select project —</option>' + projects.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === pid ? ' selected' : '') + '>' + esc(p.name || p.id) + '</option>';
    }).join('');
    UI.enhanceProjectSelect(sel);   // shared searchable project picker
    if (pid) load().then(joinCollab);
  }
  /* ==========================================================================================
     ⚠️⚠️ THE RPC AGGREGATE HAS NO TRADE DIMENSION, so a trade filter cannot be served from it.
     `schedule_scurve_agg` returns pre-summed MONTH buckets — one row per month for the whole
     project — and there is no trade in them to filter by. Serving a "Structural only" curve from
     it would draw the whole project's curve under a Structural label.

     So the fast path is KEPT for the view that can use it (unfiltered, duration-weighted,
     automatic) and the per-row fetch is paid for the moment a filter or Manual mode needs it —
     once, then held. The alternative considered and rejected: always fetch rows, which would cost
     every planner a 16k–40k-row download to serve a filter most of them never touch.
     ========================================================================================== */
  var rowsLoaded = false;
  async function fetchRows() {
    var out = [], last = null;
    while (true) {
      var q = sb().from(TABLE)
        .select('id,activity_type,start_date,end_date,duration_days,percent_complete,actual_start,actual_finish,planned_cost,cost_curve,work_type')
        .eq('project_id', pid).order('id', { ascending: true }).limit(1000);
      if (last) q = q.gt('id', last);
      var r1 = await q; if (r1.error) throw r1.error;
      var b = r1.data || []; out = out.concat(b);
      if (b.length < 1000) break; last = b[b.length - 1].id;
    }
    return out;
  }
  // Called by every control that needs per-activity data. Renders once the rows are in.
  async function ensureRows(then) {
    if (rowsLoaded && rows.length) { if (then) then(); return; }
    showLoading();
    try {
      rows = await fetchRows(); rowsLoaded = true;
      if (window.PDSync) PDSync.cachePut('sc:' + pid, { agg: agg, rows: rows });
    } catch (e) {
      UI.toast('Could not load the activities this needs: ' + (e.message || e), 'error');
    }
    hideLoading();
    if (then) then();
  }
  async function load() {
    if (!pid) { rows = []; agg = null; render(); return; }
    // The weighting is remembered PER PROJECT: one project is cost-loaded and one is not, and a
    // global preference would open the second on an empty money curve.
    try { basis = localStorage.getItem(basisKey()) === 'cost' ? 'cost' : 'dur'; } catch (e) { basis = 'dur'; }
    // ⚠️ The MODE is remembered per project too, for the same reason the weighting is: one job is
    // manually curved and another is not, and a global preference would open the second on an
    // empty sheet. ⚠️ Reset per load so switching projects cannot carry the previous one's sheet.
    try { mode = localStorage.getItem(modeKey()) === 'manual' ? 'manual' : 'auto'; } catch (e) { mode = 'auto'; }
    // ⚠️ Both remembered PER PROJECT, like the weighting and the mode: one job is read quarterly
    // and another monthly, and a global preference would open the second at the wrong grain.
    try { var _pv = localStorage.getItem('sc_period_' + pid); period = (_pv === 'quarter' || _pv === 'year') ? _pv : 'month'; } catch (e) { period = 'month'; }
    try { view = localStorage.getItem(viewKey()) === 'manual' ? 'manual' : 'curve'; } catch (e) { view = 'curve'; }
    // ⚠️ Reset with the project — a breakdown open on the previous project's Q3 is meaningless here.
    bdOpen = null; _costCo = null; _costCoKey = ''; _trSeries = null; _trSeriesKey = '';
    MAN = null; manMissing = false; manDirty = {};
    try { var _mk = localStorage.getItem('sc_mankind_' + pid); manKind = (_mk === 'actual' || _mk === 'forecast') ? _mk : 'planned'; } catch (e) { manKind = 'planned'; }

    showLoading();
    rows = []; agg = null;
