  <style>
    /* ---- Uniform module chrome (matches every other module). Keep in sync.
       2026-08-30: modules gained a persistent sidebar (MODULE_CONTRACT.md) —
       .pd-content no longer forces width:100%; the shared `.pd-content
       { flex:1; min-width:0 }` rule in dashboard.css already sizes it
       correctly next to `.pd-sidebar` in the `.pd-app` flex row. ---- */
    .pd-topbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px; }
    .pd-topbar #user-bar { margin-left:10px; padding-left:10px; border-left:1px solid var(--pd-line); flex:none; }
    .pd-topbar #pd-theme-toggle { width:34px; height:34px; padding:0; margin-left:4px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
    .sc-title { flex:0 1 auto; min-width:0; display:flex; align-items:center; overflow:hidden; margin:0; }
    .sc-title .sc-title-txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sc-title-ico { color:var(--pd-red); vertical-align:-3px; margin-right:4px; }
    /* Project context — borderless until hover */
    .sc-projctx { display:flex; align-items:center; min-width:0; flex:0 1 auto; }
    .sc-project { max-width:260px; min-width:120px; height:34px; font-weight:600; font-size:13px; background:transparent; border-color:transparent; }
    .sc-project:hover, .sc-project:focus { background:var(--pd-card); border-color:var(--pd-line); }
    /* Tool cluster beside the profile */
    .sc-topbar-tools { display:flex; align-items:center; gap:4px; margin-left:auto; flex-wrap:wrap; }
    .sc-topbar-tools .pd-btn { height:34px; width:34px; padding:0; font-size:13px; display:inline-flex; align-items:center; justify-content:center; background:transparent; border-color:transparent; }
    .sc-topbar-tools .pd-btn:hover { background:var(--pd-bg); border-color:var(--pd-line); }
    .sc-topbar-tools .pd-btn.is-active { background:var(--pd-red); border-color:var(--pd-red); color:#fff; }
    .sc-topbar-tools .pd-btn.sc-tb-labeled { width:auto; padding:0 12px; gap:6px; }
    .sc-tb-sep { width:1px; align-self:stretch; margin:5px 3px; background:var(--pd-line); }
    /* Forecast-finish control lives in the tool cluster */
    .sc-fc { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--pd-muted); white-space:nowrap; flex:none; }
    .sc-fc .pd-input { height:34px; width:150px; font-size:13px; }
    .sc-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
    .sc-kpi { background:var(--pd-card); border:1px solid var(--pd-line); border-radius:8px; padding:14px 16px; }
    .sc-kpi-l { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--pd-muted); margin-bottom:5px; }
    .sc-kpi-v { font-size:22px; font-weight:700; } .sc-kpi-s { font-size:12px; color:var(--pd-muted); margin-top:2px; }
    .sc-ok { color:var(--pd-ok); } .sc-bad { color:var(--pd-bad); }
    .sc-card { background:var(--pd-card); border:1px solid var(--pd-line); border-radius:var(--pd-radius); padding:16px; margin-bottom:18px; }
    .sc-card h3 { margin:0 0 12px; font-size:15px; }
    .sc-svg { width:100%; height:auto; display:block; }
    .sc-grid { stroke:var(--pd-line); stroke-width:1; }
    .sc-ylab { fill:var(--pd-muted); font-size:11px; text-anchor:end; }
    .sc-xlab { fill:var(--pd-muted); font-size:11px; text-anchor:middle; }
    .sc-planned { fill:none; stroke:var(--pd-dark); stroke-width:2; }
    html.pd-dark .sc-planned { stroke:#c7ccd1; }
    .sc-earned { fill:none; stroke:var(--pd-red); stroke-width:2.5; }
    .sc-today { stroke:var(--pd-red); stroke-width:1.5; stroke-dasharray:4 3; }
    .sc-today-lab { fill:var(--pd-red); font-size:10px; font-weight:700; }
    .sc-forecast { fill:none; stroke:var(--pd-red); stroke-width:2; stroke-dasharray:7 5; }
    /* Weighting switch — what an activity is WORTH on the curve: its duration, or the money the
       Project Schedule's Cost Loading put on it. */
    .sc-seg { display:inline-flex; border:1px solid var(--pd-line); border-radius:8px; overflow:hidden; }
    .sc-seg button { border:0; background:var(--pd-card); color:var(--pd-ink); font:inherit; font-size:12px;
      font-weight:600; padding:0 10px; height:32px; cursor:pointer; }
    .sc-seg button + button { border-left:1px solid var(--pd-line); }
    .sc-seg button:hover { background:var(--pd-bg); }
    .sc-seg button.on { background:var(--pd-red); color:#fff; }
    .sw-forecast { width:18px; height:0; border-top:2px dashed var(--pd-red); }
    .sc-legend { display:flex; flex-wrap:wrap; gap:18px; margin-top:12px; font-size:12px; color:var(--pd-muted); }
    .sc-lg { display:inline-flex; align-items:center; }
    .sw { display:inline-block; width:18px; height:3px; margin-right:6px; }
    .sw-planned { background:var(--pd-dark); } html.pd-dark .sw-planned { background:#c7ccd1; }
    .sw-earned { background:var(--pd-red); } .sw-today { background:var(--pd-red); width:3px; height:12px; }
    .sc-empty { text-align:center; padding:40px; color:var(--pd-muted); }
    .sc-table { width:100%; border-collapse:collapse; font-size:13px; }
    .sc-table th { background:var(--pd-bg); padding:8px 12px; text-align:right; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--pd-muted); border-bottom:2px solid var(--pd-line); }
    .sc-table th, .sc-table td { white-space:nowrap; }
    .sc-table th:first-child, .sc-table td:first-child { text-align:left; position:sticky; left:0; z-index:1; font-weight:700; }
    .sc-table td:first-child { background:var(--pd-card); }
    .sc-table th:first-child { background:var(--pd-bg); }
    .sc-table td { padding:7px 12px; border-bottom:1px solid var(--pd-line); text-align:right; }
    .sc-fc-row td { color:var(--pd-red); font-style:italic; }
    .sc-fc-row td:first-child { color:var(--pd-red); }
    .sc-note { font-size:12px; color:var(--pd-muted); margin-top:8px; }
    .sc-loading { position:fixed; inset:0; background:rgba(20,20,20,.4); display:flex; align-items:center; justify-content:center; gap:12px; z-index:999; color:#fff; font-weight:600; }
    .sc-spin { width:36px; height:36px; border:4px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:sc-spin .8s linear infinite; }
    @keyframes sc-spin { to { transform:rotate(360deg); } }
    @media (max-width:820px) { .sc-title-txt { display:none; } .sc-fc { font-size:0; } .sc-fc .pd-input { width:130px; } }
  
      /* ---- Mobile & tablet (2026-07-23) --------------------------------
         Shared chrome (topbar wrap, sheet modals, 16px inputs, 44px targets)
         comes from dashboard.css.

         CHARTS: every SVG here already uses viewBox + width:100%, so it
         *scales* — but scaling a ~900-unit-wide chart into ~350px shrinks its
         9.5px labels to under 4px, i.e. unreadable. So below 700px the chart
         keeps a legible minimum width and its card scrolls horizontally
         instead of shrinking further. Do not "fix" this by dropping the
         min-width — that restores the unreadable version.
         ------------------------------------------------------------------ */
      @media (max-width: 700px) {
        .sc-card { overflow-x: auto; }
        .sc-svg { min-width: 560px; }
        .sc-table { min-width: 520px; }
        .sc-kpis { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .sc-fc { flex-wrap: wrap; gap: 8px; }
        .sc-topbar-tools { flex-wrap: wrap; }
      }
    </style>

<div class="pd-app">

      </div>

</div>
<div class="sc-loading" id="sc-loading" style="display:none;"><div class="sc-spin"></div><span>Loading schedule…</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/config.js?v=20260902a"></script>
<script src="../../assets/js/auth.js?v=20260901b"></script>
<script src="../../assets/js/db.js?v=20260901d"></script>
<script src="../../assets/js/program.js?v=20260827a"></script>
<script src="../../assets/js/scurve.js?v=20260901a"></script>
<script src="../../assets/js/ui.js?v=20260902c"></script>
<script src="../../assets/js/icons.js?v=20260903a"></script>
<script src="../../assets/js/offline.js?v=20260812b"></script>
<script src="../../assets/js/collab.js?v=20260812b"></script>
<script>
(function () {
  'use strict';
  var TABLE = 'project_schedule', pid = null, rows = [], agg = null, forecastFinish = null, fcManual = false;
  // ⚠️ THE COST BASIS IS THE PROJECT SCHEDULE'S COST LOADING, READ THROUGH ONE COLUMN.
  // Cost Loading writes `project_schedule.planned_cost`; this curve weights each activity by that
  // figure instead of by its duration. There is no second store, no export step and no sync: load
  // the cost there, switch the weighting here, and the curve is the cost curve. Owner 2026-08-25:
  // *"the process of cost-loading… should translate or link to the s-curve module, based on the
  // cost-loaded activities and in relation to the schedule."*
  // ⚠️ Duration stays the DEFAULT. A project with no loading (or a half-finished one) must not
  // silently open on a money curve built from a handful of priced activities.
  var basis = 'dur';
  function basisKey() { return 'sc_basis_' + pid; }
  var UID = null, profile = null;
  function sb() { return AppAuth.getSB(); }
  function pd(v) { if (!v) return null; var m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; return new Date(+m[1], +m[2]-1, +m[3]); }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fcKey() { return 'sc_fc_' + pid; }
  function plannedFinishDate() { var mx = null; rows.forEach(function (a) { if (a.activity_type === 'WBS Summary') return; var e = pd(a.end_date); if (e && (!mx || e > mx)) mx = e; }); return mx; }
  function esc(s) { return Fmt.esc(s); }
  function showLoading() { var e = document.getElementById('sc-loading'); if (e) e.style.display = 'flex'; }
  function hideLoading() { var e = document.getElementById('sc-loading'); if (e) e.style.display = 'none'; }

  // ===== live collaboration (presence + live refresh) =======================
  // S-Curve is a READ-ONLY analytics view derived from project_schedule, so there
  // is no editing cursor. It gets: presence (who's viewing this project's curve)
  // and a LIVE refresh — when someone edits the schedule elsewhere, the curve
  // recomputes. Schedule edits can arrive in bursts (bulk import / global change),
  // so remote changes are coalesced into one debounced reload.
  var _collab = null, _reloadTimer = null;
  function _selfName() { return (profile && (profile.name || profile.email)) || 'Someone'; }
  function joinCollab() {
    if (!window.PDCollab) return;
    if (_collab) { _collab.leave(); _collab = null; }
    if (!pid) { renderPresence([]); return; }
    _collab = PDCollab.join({
      key: 'scurve:' + pid, table: TABLE, projectId: pid,
      self: { id: UID, name: _selfName() },
      onPresence: function (members) { renderPresence(members); },
      onSelection: function () {},
      onRemoteChange: function () {
        if (_reloadTimer) clearTimeout(_reloadTimer);
        _reloadTimer = setTimeout(function () { _reloadTimer = null; load(); }, 400);
      }
    });
  }
  function renderPresence(members) { var el = document.getElementById('sc-presence'); if (el) el.innerHTML = window.PDCollab ? PDCollab.avatarsHTML(members || []) : ''; }

  async function loadProjects() {
    var projects = await PDb.getProjects();
    var sel = document.getElementById('sc-project');
    pid = sessionStorage.getItem('pd_project') || (projects[0] && projects[0].id) || null;
    sel.innerHTML = '<option value="">— Select project —</option>' + projects.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === pid ? ' selected' : '') + '>' + esc(p.name || p.id) + '</option>';
    }).join('');
    UI.enhanceProjectSelect(sel);   // shared searchable project picker
    if (pid) load().then(joinCollab);
  }
  async function load() {
    if (!pid) { rows = []; agg = null; render(); return; }
    // The weighting is remembered PER PROJECT: one project is cost-loaded and one is not, and a
    // global preference would open the second on an empty money curve.
    try { basis = localStorage.getItem(basisKey()) === 'cost' ? 'cost' : 'dur'; } catch (e) { basis = 'dur'; }
    showLoading();
    rows = []; agg = null;
    // FAST PATH: the shared server-side monthly aggregate — the browser gets ~1 row per
    // month instead of every leaf activity (16k–40k on large schedules). Falls back to a
    // lean, keyset-paginated row fetch when the RPC isn't deployed yet.
    // ⚠️ The RPC aggregate is duration-only by construction (it returns pre-summed month buckets and
    // knows nothing about money), so the COST basis deliberately skips it and pays for the per-row
    // fetch. Trying to serve a cost curve from a duration aggregate is how a chart ends up labelled
    // in pesos while plotting days.
    try {
      if (basis !== 'cost') {
        var r = await sb().rpc('schedule_scurve_agg', { p_id: pid });
        if (!r.error && r.data && r.data.months) agg = r.data;
      }
    } catch (e) { agg = null; }
    if (!agg) {
      try {
        var last = null;
        while (true) {
          var q = sb().from(TABLE)
            .select('id,activity_type,start_date,end_date,duration_days,percent_complete,actual_start,actual_finish,planned_cost,cost_curve')
            .eq('project_id', pid).order('id', { ascending: true }).limit(1000);
          if (last) q = q.gt('id', last);
          var r1 = await q; if (r1.error) throw r1.error;
          var b = r1.data || []; rows = rows.concat(b);
          if (b.length < 1000) break; last = b[b.length - 1].id;
        }
      } catch (e) {
        hideLoading();
        // Offline / fetch failed: render the last-cached curve so it still opens.
        if (window.PDSync) {
          var c = await PDSync.cacheGet('sc:' + pid);
          if (c && c.rows) { agg = c.rows.agg || null; rows = c.rows.rows || []; }
        }
        if (!agg && !rows.length) { UI.toast('Load failed: ' + (e.message || e), 'error'); return; }
        var sv0 = null; try { var s0 = localStorage.getItem(fcKey()); if (s0) sv0 = pd(s0); } catch (er) {}
        fcManual = !!sv0; forecastFinish = sv0 || null; render(); return;
      }
    }
    hideLoading();
    if (window.PDSync) PDSync.cachePut('sc:' + pid, { agg: agg, rows: rows });   // offline read-cache
    // Forecast finish is performance-based (auto) unless the user has pinned a date for this
    // project; a saved value = manual override. The input is filled in render() with the
    // effective date (auto or manual) once the SPI-based projection is computed.
    var saved = null; try { var sv = localStorage.getItem(fcKey()); if (sv) saved = pd(sv); } catch (e) {}
    fcManual = !!saved; forecastFinish = saved || null;
    render();
  }

  // ⚠️ THE CURVE MATHS IS NO LONGER IN THIS FILE (2026-09-01). Two bases, the per-activity
  // spread curve, the SPI forecast and the month walk all moved to assets/js/scurve.js so the
  // DASHBOARD could draw the same curve; copying ~150 lines onto a second screen is how two
  // screens come to disagree about one project's progress. Read the engine there.
  // What stays HERE is the one thing that is genuinely this module's: the RPC branch.
  // `schedule_scurve_agg` returns pre-summed month buckets and is far faster than a per-row
  // fetch on a large schedule, but it is duration-only by construction — so the cost basis
  // deliberately skips it and lets the engine walk the rows.
  // The server aggregate, reshaped into the same {TOT, plannedAt, actualAt, …} contract the
  // shared engine consumes. Cumulative planned (pd) + actual (ad) at each month END, with a
  // 0-point prepended at the schedule start so sub-month values interpolate linearly.
  function rpcSeries() {
    var start = pd(agg.minDate);
    var pts = [{ t: +start, pd: 0, ad: 0 }];
    agg.months.forEach(function (mm) {
      var y = +String(mm.key).slice(0, 4), mo = +String(mm.key).slice(5, 7);
      pts.push({ t: +new Date(y, mo, 0), pd: +mm.pd || 0, ad: +mm.ad || 0 });
    });
    function interp(f, t) {
      if (t <= pts[0].t) return 0;
      var last = pts[pts.length - 1]; if (t >= last.t) return last[f];
      for (var i = 1; i < pts.length; i++) {
        if (t <= pts[i].t) { var a = pts[i - 1], b = pts[i]; var r = (b.t - a.t) ? (t - a.t) / (b.t - a.t) : 0; return a[f] + (b[f] - a[f]) * r; }
      }
      return last[f];
    }
    if (!(+agg.totDur > 0) || !start) return null;
    return {
      TOT: +agg.totDur, overallDone: +agg.doneDur || 0,
      minDate: start, plannedEnd: pd(agg.maxDate), nAct: agg.nAct || 0,
      plannedAt: function (D) { return interp('pd', +D); },
      actualAt: function (D) { return interp('ad', +D); }
    };
  }

  // ⚠️⚠️ THE SPREAD CURVE now lives in the shared engine, and this is the resolution of a
  // problem the old comment here described at length. Owner 2026-08-26: *"there should be a step
  // wherein the manner of distribution of an activity is defined… bell curve, front loaded, back
  // loaded, linear… in order to give a more accurate projection."* Cost Loading's "Spread over
  // time" step writes `project_schedule.cost_curve`; the engine reads it.
  // ⚠️ It used to be TRANSCRIBED here rather than shared — a second copy of `curveCdf` held to
  // the schedule module's copy by an assertion script, because a module could not reach into
  // another module's closure. assets/js/scurve.js is a shared asset, so there is now ONE copy and
  // nothing to hold in agreement. Do not re-transcribe it.
  // ⚠️ Reports the MIX rather than a single word. A schedule is routinely part-curved, and a note
  // reading "bell" over a project where three activities out of 300 are bell-shaped would be a
  // confident wrong answer about the whole curve. All-linear says so explicitly, and names where the
  // shape is set — otherwise "linear" reads as a property of the project rather than an unmade choice.
  function shapeNote(sh) { return PDScurve.shapeNote(sh); }
  function peso(n) {
    if (n == null || !isFinite(n)) return '—';
    if (Math.abs(n) >= 1e9) return '₱' + (Math.round(n / 1e8) / 10) + 'B';
    if (Math.abs(n) >= 1e6) return '₱' + (Math.round(n / 1e5) / 10) + 'M';
    if (Math.abs(n) >= 1e3) return '₱' + (Math.round(n / 100) / 10) + 'K';
    return '₱' + Math.round(n);
  }
  // Delegates to the shared engine; the module supplies only what is module-specific — which
  // basis is selected, whether the planner has pinned a forecast finish, and the RPC series.
  function compute() {
    var series = (basis !== 'cost' && agg && agg.months && agg.months.length) ? rpcSeries() : null;
    return PDScurve.compute(rows, {
      basis: basis,
      forecastFinish: fcManual && forecastFinish ? forecastFinish : null,
      series: series
    });
  }

  function render() {
    var d = compute(); renderKpis(d); renderChart(d); renderTable(d);
    var h = document.getElementById('sc-cardh');
    if (h) h.textContent = (basis === 'cost' ? 'Cost S-Curve — Planned Value vs Earned Value (cumulative %)'
                                             : 'Project S-Curve — Planned vs Actual (cumulative %)');
    document.querySelectorAll('#sc-weight [data-w]').forEach(function (b) { b.classList.toggle('on', b.dataset.w === basis); });
    // reflect the effective forecast finish (auto SPI-based, or the manual override) in the input
    var fi = document.getElementById('sc-forecast'); if (fi && !d.empty && d.fcFinish) fi.value = iso(d.fcFinish);
  }

  function renderKpis(d) {
    var host = document.getElementById('sc-kpis');
    if (d.empty) { host.innerHTML = ''; return; }
    function k(l, v, sub, cls) { return '<div class="sc-kpi"><div class="sc-kpi-l">' + l + '</div><div class="sc-kpi-v ' + (cls || '') + '">' + v + '</div>' + (sub ? '<div class="sc-kpi-s">' + sub + '</div>' : '') + '</div>'; }
    var r1 = function (x) { return Math.round(x * 10) / 10; };
    var v = r1(d.variance);
    // ⚠️ On the cost basis the SUBTITLES carry the pesos while the big figure stays a percentage:
    // the curve is a percentage-of-total curve either way, and swapping the headline to a peso
    // amount would make "Schedule Variance ... pp" read as money too.
    var m = d.money;
    host.innerHTML =
      k(m ? 'Cost loaded' : 'Overall Progress', r1(d.overallPct) + '%',
        m ? (peso(d.TOT) + ' on ' + d.priced + ' of ' + d.activities + ' activities') : (d.activities + ' activities')) +
      k(m ? 'Planned value to date' : 'Planned to date', r1(d.plannedPct) + '%',
        m ? peso(d.plannedC[d.ti]) + ' should be spent' : 'Where the plan says we should be') +
      k(m ? 'Earned value to date' : 'Actual to date', r1(d.actualPct) + '%',
        m ? peso(d.actualC[d.ti]) + ' earned' : 'Physical progress achieved') +
      k(m ? 'Cost-weighted variance' : 'Schedule Variance', (v > 0 ? '+' : '') + v + ' pp',
        (m ? peso(d.actualC[d.ti] - d.plannedC[d.ti]) + ' vs plan · ' : '') + (v >= 0 ? 'On / ahead of plan' : 'Behind plan'),
        v >= 0 ? 'sc-ok' : 'sc-bad');
  }

  function renderChart(d) {
    var host = document.getElementById('sc-chart');
    // ⚠️ NOT named `basis` — that is now the module-level weighting flag, and shadowing it here
    // would make the note element win inside this function.
    var basisNote = document.getElementById('sc-basis');
    if (d.empty) {
      // The cost basis with no loading is its own message, with the way out named.
      host.innerHTML = '<div class="sc-empty">' + (d.noCost
        ? 'No cost is loaded on this schedule yet — none of its ' + d.nAct + ' activities carries a Planned IBB, so there is no money to curve.<br>' +
          'Load it in <b>Project Schedule → Cost Loading</b> (enlist → assign → distribute → apply), then come back. ' +
          'Meanwhile, <b>Duration</b> weighting works now.'
        : (pid ? 'This project has no dated activities. Import or add a schedule first.' : 'Select a project.')) + '</div>';
      basisNote.textContent = ''; return;
    }
    basisNote.textContent = (d.money
      ? 'Progress weighted by the COST loaded on each activity (' + peso(d.TOT) + ' across ' + d.priced + ' of ' + d.activities +
        ' activities' + (d.priced < d.activities ? ' — the other ' + (d.activities - d.priced) + ' carry no cost and count for nothing here' : '') +
        '), spread over each activity\'s dates ' + shapeNote(d.shapes) + '. '
      : 'Progress weighted by activity duration across ' + d.activities + ' activities. ') +
      'Solid = planned & actual (to data date). Red dashed = forecast to finish — ' +
      (d.manual ? 'pinned to ' + iso(d.fcFinish) : 'performance-based (SPI ' + (Math.round(d.spi * 100) / 100) + ', auto finish ' + iso(d.autoFc) + ')') +
      '; it follows the plan’s shape from the actual point up to 100%. Set a date to override, clear it to auto-forecast.';
    var W = 1000, H = 340, padL = 40, padR = 16, padT = 16, padB = 40, n = d.months.length, maxV = d.TOT || 1;
    function x(i) { return padL + (n <= 1 ? 0 : (i / (n - 1)) * (W - padL - padR)); }
    function y(v) { return padT + (1 - (v / maxV)) * (H - padT - padB); }
    var grid = '';
    [0, .25, .5, .75, 1].forEach(function (p) { var yy = y(maxV * p); grid += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" class="sc-grid"/><text x="' + (padL - 6) + '" y="' + (yy + 3) + '" class="sc-ylab">' + Math.round(p * 100) + '%</text>'; });
    var xlab = '';
    d.months.forEach(function (mo, i) { if (mo.getMonth() === 0 || i === 0) xlab += '<text x="' + x(i) + '" y="' + (H - padB + 16) + '" class="sc-xlab">' + mo.getFullYear() + '</text>'; });
    var pl = d.plannedC.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
    var ac = []; d.actualC.forEach(function (v, i) { if (i <= d.ti) ac.push(x(i) + ',' + y(v)); });
    // Forecast to finish: red dashed line from the actual point at the data date
    // up to 100% at the manual forecast-finish date (mapped precisely on the axis).
    function xAt(D) {
      var m0 = d.months[0];
      var fi = (D.getFullYear() - m0.getFullYear()) * 12 + (D.getMonth() - m0.getMonth()) + (D.getDate() - 1) / new Date(D.getFullYear(), D.getMonth() + 1, 0).getDate();
      fi = Math.max(0, Math.min(n - 1, fi));
      return padL + (n <= 1 ? 0 : fi / (n - 1) * (W - padL - padR));
    }
    // Forecast to finish: an S-CURVE (not a straight line) following the SHAPE of the remaining
    // planned work, time-stretched to the (SPI-based) forecast finish and scaled from the actual%
    // at the data date up to 100%. So it starts on the actual point and mirrors the plan's ramp.
    var fc = '';
    if (d.fcFinish && d.actualC[d.ti] < d.TOT) {
      var dd = today(), rem = d.TOT - d.plannedC[d.ti];
      var plSpan = +d.plannedEnd - +dd, fcSpan = +d.fcFinish - +dd;
      var pts = [x(d.ti) + ',' + y(d.actualC[d.ti])];
      if (rem > 0.0001 && plSpan > 0 && fcSpan > 0) {
        for (var j = d.ti + 1; j < d.months.length; j++) {
          var mDate = d.months[j]; if (mDate > d.plannedEnd) break;   // month first-of, matches x(j)
          var timeFrac = Math.min(1, (+mDate - +dd) / plSpan);
          var valFrac = Math.min(1, Math.max(0, (d.plannedC[j] - d.plannedC[d.ti]) / rem));
          var fdate = new Date(+dd + timeFrac * fcSpan);
          pts.push(xAt(fdate) + ',' + y(d.actualC[d.ti] + valFrac * (d.TOT - d.actualC[d.ti])));
        }
      }
      pts.push(xAt(d.fcFinish) + ',' + y(d.TOT));   // land exactly on 100% at the forecast finish
      fc = '<polyline class="sc-forecast" points="' + pts.join(' ') + '"/>';
    }
    var tx = x(d.ti);
    var todayL = '<line x1="' + tx + '" y1="' + padT + '" x2="' + tx + '" y2="' + (H - padB) + '" class="sc-today"/><text x="' + (tx + 4) + '" y="' + (padT + 10) + '" class="sc-today-lab">Data date</text>';
    host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="sc-svg">' + grid + todayL +
      '<polyline class="sc-planned" points="' + pl + '"/>' + fc + (ac.length ? '<polyline class="sc-earned" points="' + ac.join(' ') + '"/>' : '') + xlab + '</svg>' +
      '<div class="sc-legend"><span class="sc-lg"><span class="sw sw-planned"></span> Planned progress</span><span class="sc-lg"><span class="sw sw-earned"></span> Actual progress</span><span class="sc-lg"><span class="sw sw-forecast"></span> Forecast to finish</span><span class="sc-lg"><span class="sw sw-today"></span> Data date (today)</span></div>';
  }

  function renderTable(d) {
    var wrap = document.getElementById('sc-tablewrap');
    if (!wrap) return;
    if (d.empty) { wrap.innerHTML = '<div class="sc-empty">No data.</div>'; return; }
    var MABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    // Transposed: months across the top, one row each for Planned & Actual POC.
    var head = '<th>POC</th>' + d.months.map(function (mo) {
      return '<th>' + MABBR[mo.getMonth()] + " '" + String(mo.getFullYear()).slice(2) + '</th>';
    }).join('');
    var planned = '<td>' + (d.money ? 'Planned value %' : 'Planned %') + '</td>' + d.months.map(function (mo, i) {
      var p = d.TOT ? Math.round(d.plannedC[i] / d.TOT * 1000) / 10 : 0;
      return '<td>' + p + '%</td>';
    }).join('');
    var actual = '<td>' + (d.money ? 'Earned value %' : 'Actual %') + '</td>' + d.months.map(function (mo, i) {
      var a = (i <= d.ti && d.TOT) ? Math.round(d.actualC[i] / d.TOT * 1000) / 10 : null;
      return '<td>' + (a != null ? a + '%' : '—') + '</td>';
    }).join('');
    // Forecast % row — only when a forecast series exists (project not complete + a finish set).
    var fcArr = d.forecastC || [];
    var hasForecast = fcArr.some(function (v) { return v != null; });
    var forecast = '';
    if (hasForecast) {
      forecast = '<td>Forecast %</td>' + d.months.map(function (mo, i) {
        var f = (fcArr[i] != null && d.TOT) ? Math.round(fcArr[i] / d.TOT * 1000) / 10 : null;
        return '<td class="sc-fc-cell">' + (f != null ? f + '%' : '—') + '</td>';
      }).join('');
    }
    wrap.innerHTML = '<table class="sc-table"><thead><tr>' + head + '</tr></thead><tbody><tr>' +
      planned + '</tr><tr>' + actual + '</tr>' +
      (hasForecast ? '<tr class="sc-fc-row">' + forecast + '</tr>' : '') +
      '</tbody></table>';
  }

  AppAuth.requireLogin(function (user, prof) {
    UID = user.id; profile = prof;
    UI.renderUserBar(prof);
    UI.initShell();
    var pname = sessionStorage.getItem('pd_project_name') || sessionStorage.getItem('pd_project') || '';
    UI.renderNav(document.getElementById('side-nav'), 'project', {
      active: 's-curve', base: '../../', pname: pname, modules: APP_CONFIG.MODULES,
    });
    document.getElementById('sc-project').onchange = function (e) { pid = e.target.value || null; if (pid) sessionStorage.setItem('pd_project', pid); load().then(joinCollab); };
    document.getElementById('sc-refresh').onclick = function () { load(); };
    // ⚠️ Switching TO cost re-loads: the duration path may have been served by the RPC aggregate,
    // which carries no `planned_cost`, so the rows simply are not in memory yet. Switching back is a
    // repaint — the rows we already hold answer both.
    document.querySelectorAll('#sc-weight [data-w]').forEach(function (b) {
      b.onclick = function () {
        if (basis === b.dataset.w) return;
        basis = b.dataset.w;
        try { localStorage.setItem(basisKey(), basis); } catch (e) {}
        if (basis === 'cost' && !rows.length) load(); else render();
      };
    });
    document.getElementById('sc-forecast').onchange = function (e) {
      var v = e.target.value;
      // Set a date to pin (override) the forecast finish; clear it to revert to the auto SPI forecast.
      if (v) { fcManual = true; forecastFinish = pd(v); } else { fcManual = false; forecastFinish = null; }
      try { if (v) localStorage.setItem(fcKey(), v); else localStorage.removeItem(fcKey()); } catch (er) {}
      render();
    };
    document.getElementById('sc-tabletoggle').onclick = function () {
      var card = document.getElementById('sc-tablecard');
      var show = card.style.display === 'none';
      card.style.display = show ? '' : 'none';
      // icon-only tool: reflect state via title + active fill, not a text relabel
      this.title = show ? 'Hide data table' : 'Show data table';
      this.classList.toggle('is-active', show);
    };
    loadProjects();
  });
})();
</script>
</body>
</html>
