<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon-icon.png?v=20260903a" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png?v=20260830b" />
  <script src="../../assets/js/theme.js?v=20260812b"></script>
  <title>Minutes of Meeting · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260903a" />
  <link rel="stylesheet" href="module.css?v=20260903d" />
</head>
<body>
  <div class="pd-app">
    <!-- Persistent module sidebar (uniform across the suite — see MODULE_CONTRACT.md
         §"Sidebar"). Contents are mode='project', rendered by UI.renderNav below. -->
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="../../assets/img/logo-white.png" alt="Megawide Construction">Planners Dashboard<small>Planning Suite</small></div>
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>EPC &middot; PMO &middot; Planning Suite</div>
    </aside>
    <div class="pd-content">
      <div class="pd-topbar">
        <h1 class="il-title" style="margin:0;">
          <span class="il-title-ico" data-ico="calendar" data-ico-size="20"></span>
          <span class="il-title-txt">Minutes of Meeting</span>
        </h1>
        <div class="il-projctx">
          <select class="pd-select il-project" id="il-project" title="Project"></select>
        </div>

        <!-- Item 1: "no need for the meeting label — have a dropdown with 2
             choices: Meetings and Meetings Dashboard." UI.tabsToDropdown()
             converts these two (now-hidden) buttons into that one trigger,
             which is also what makes the static "Minutes of Meeting" title
             text beside it disappear where there's room (see wire() in
             module.js for why that has to be conditional, not a bare hide).
             Wired once in module.js's wire(); .active synced on every
             render() via syncTopTabs(). -->
        <!-- ⚠️ MEETINGS FIRST, and it is the landing tab (module.js `_momTab`
             defaults to 'meetings' to match) — a strip whose first entry is
             not where the module opens reads as a bug. -->
        <div class="il-tabs" role="tablist">
          <button class="il-tab active" data-tab="meetings">Meetings</button>
          <button class="il-tab" data-tab="dashboard">Meetings Dashboard</button>
        </div>

        <!-- Tool cluster beside the profile. Filter / download / "+ Add meeting"
             used to live in the in-page toolbar row above the meetings list
             (momBrowseFilterBarHTML); they are static here now, one instance
             each, and module.js's syncTopbarTools() shows/hides + wires them
             per whatever is currently on screen (List/Calendar browse, the
             Meetings Dashboard, or a single meeting/series — which has none of
             this and hides all three). See module.js `wire()`/`syncTopbarTools`. -->
        <div class="il-topbar-tools">
          <button class="pd-btn pd-filttoggle" id="il-mom-tb-filter" title="Search and filter" aria-label="Search and filter" hidden>
            <span data-ico="filter" data-ico-size="16"></span></button>
          <div class="il-icondd" id="il-mom-tb-export" hidden>
            <button type="button" class="pd-btn il-icondd-btn" title="Export the meeting list" aria-label="Export the meeting list">
              <span data-ico="download" data-ico-size="16"></span></button>
            <div class="il-icondd-menu" hidden>
              <button type="button" class="il-icondd-item" data-val="html">HTML</button>
              <button type="button" class="il-icondd-item" data-val="pdf">PDF</button>
              <button type="button" class="il-icondd-item" data-val="xlsx">Excel</button>
            </div>
          </div>
          <button class="pd-btn pd-btn-primary" id="il-mom-tb-add" hidden>+ Add meeting</button>
          <button class="pd-btn" id="il-refresh" title="Reload">
            <span data-ico="refresh" data-ico-size="16"></span></button>
        </div>
        <div id="il-presence" title="People viewing this project"></div>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <!-- One root: module.js swaps its whole content between the List/Calendar
             browse views and the single-meeting Detail editor. See renderBrowse() /
             renderDetail() in module.js. -->
        <div id="il-mom-view"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Minutes of Meeting PDF export. Same library and version the standalone mom-app
       uses, so the exported sheet is byte-for-byte the same layout engine. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Item 8: Excel export for a single meeting and for the meeting list
       (SheetJS — the same library/version this suite's other Excel
       importers/exporters already use, e.g. progress-photos). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Item 8: PowerPoint export for a single meeting (pptxgenjs — the same
       library/version already loaded by progress-photos' PPR export). -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="../../assets/js/config.js?v=20260902a"></script>
  <script src="../../assets/js/auth.js?v=20260901b"></script>
  <script src="../../assets/js/db.js?v=20260901d"></script>
  <script src="../../assets/js/program.js?v=20260827a"></script>
  <script src="../../assets/js/ui.js?v=20260902c"></script>
  <script src="../../assets/js/icons.js?v=20260903a"></script>
  <script src="../../assets/js/offline.js?v=20260812b"></script>
  <script src="../../assets/js/collab.js?v=20260812b"></script>
  <script src="../../assets/js/autosave.js?v=20260812b"></script>
  <script src="module.js?v=20260903d"></script>
  <script>
    // "Meetings" ▾ / "Meetings Dashboard" ▾ as a Project-Schedule-style
    // dropdown instead of two plain tab buttons — module.js's wire() calls
    // this too (harmless: the second call is a no-op, guarded by
    // tabsToDropdown's own tabs.__pdTabsDrop check), but wire() only runs
    // once AppAuth.requireLogin's callback fires below, and by then the flat
    // Meetings/Meetings Dashboard button row had already been sitting fully
    // visible for however long the two network round-trips inside
    // requireLogin (auth.getSession + a profile fetch) took — "the module
    // name appears for a few seconds before being hidden" (2026-09-03 bug
    // report). Bound to DOMContentLoaded HERE instead — see the full note in
    // risk-register/index.html for why NOT to call UI.initModuleTopbar()
    // explicitly/early (it breaks theme.js's own topbar injection, which
    // relies on running before it via DOMContentLoaded listener registration
    // order — a THIRD listener, registered after theirs, preserves that).
    (function () {
      function go() { if (window.UI && UI.tabsToDropdown) UI.tabsToDropdown('.il-tabs'); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
      else go();
    })();
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      UI.initShell();
      var pname = sessionStorage.getItem('pd_project_name') || sessionStorage.getItem('pd_project') || '';
      UI.renderNav(document.getElementById('side-nav'), 'project', {
        active: 'minutes-of-meeting', base: '../../', pname: pname, modules: APP_CONFIG.MODULES,
      });
      MinutesOfMeeting.init(user, profile);
    });
  </script>
</body>
</html>
