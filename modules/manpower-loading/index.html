        '<label class="mp-checks" style="margin-top:12px;display:flex;">' +
          '<input type="checkbox" id="mp-d-take"> <span id="mp-d-takelbl"></span></label>' +
        '<p class="mp-note" style="margin-top:10px;">The derivation owns only the months it writes. A month you type over becomes yours and is never overwritten again &mdash; and switching series moves the derivation rather than leaving two.</p>' +
      '</div>' +
      '<div class="pd-modal-footer">' +
        '<button class="pd-btn" id="mp-d-cancel">Cancel</button>' +
        '<button class="pd-btn pd-btn-primary" id="mp-d-go">Derive</button>' +
      '</div>', { noBackdropClose: true });
    var g = function (id) { return m.el.querySelector('#' + id); };
    function refresh() {
      var k = g('mp-d-ser').value, take = g('mp-d-take').checked;
      var p = derivePlan(k, take), base = derivePlan(k, false), sk = p.skip;
      g('mp-d-takelbl').innerHTML = base.kept
        ? 'Also replace the <b>' + base.kept + '</b> month(s) somebody typed by hand'
        : 'Also replace months typed by hand <span class="mp-note">(there are none)</span>';
      g('mp-d-hint').innerHTML = (k === 'actual')
        ? 'Actual stops at the cut-off (' + (CUTOFF ? esc(monLabel(CUTOFF)) : 'this month') + '). A contract running past it has not reported those months yet.'
        : 'A forward series fills the whole contract span. Open-ended contracts are skipped.';
      g('mp-d-count').textContent = p.rows.length
        ? p.rows.length + ' month(s) would change.'
        : 'Nothing would change — the grid already matches the contracts.';
      var nn = [];
      if (sk.tbh) nn.push('<li><b>' + sk.tbh + '</b> TBH slot(s) excluded — nobody is deployed against an unfilled slot. They drive the vacancy figure instead.</li>');
      if (sk.noPos) nn.push('<li><b>' + sk.noPos + '</b> profile(s) are not linked to a position.</li>');
      if (sk.noStart) nn.push('<li><b>' + sk.noStart + '</b> profile(s) have no contract start date.</li>');
      if (sk.openEnded) nn.push('<li><b>' + sk.openEnded + '</b> open-ended profile(s) skipped — projecting them to the project&rsquo;s last month would invent a commitment.</li>');
      if (sk.outside) nn.push('<li><b>' + sk.outside + '</b> month(s) fall outside the schedule&rsquo;s axis; written, not dropped.</li>');
      if (base.kept) nn.push('<li><b>' + base.kept + '</b> hand-typed month(s) ' +
        (take ? '<b>will be REPLACED</b> — untick above to keep them.' : 'left untouched.') + '</li>');
      g('mp-d-notes').innerHTML = nn.join('');
    }
    g('mp-d-ser').onchange = refresh;
    g('mp-d-take').onchange = refresh;
    refresh();
    g('mp-d-x').onclick = m.close;
    g('mp-d-cancel').onclick = m.close;
    g('mp-d-go').onclick = async function () {
      var k = g('mp-d-ser').value, take = g('mp-d-take').checked;
      deriveKeySet(k);
      m.close();
      await deriveFromContracts(k, false, take);
    };
  }

  // ---- Positions register ---------------------------------------------------------------
  function renderRegister() {
    var el = document.getElementById('mp-reg'); if (!el) return;
    if (!POS.length) {
      el.innerHTML = '<tbody><tr><td><div class="mp-empty">No positions yet. Use <b>Seed</b> for the standard organisation chart, or <b>+ Add position</b> for one line.</div></td></tr></tbody>';
      return;
    }
    var cutIso = CUTOFF ? mkey(CUTOFF) : null;
    var h = ['<thead><tr><th>Code</th><th>Position</th><th>Workforce</th><th>Rank</th>' +
      '<th class="num">Req. now</th><th class="num">Actual now</th><th class="num">Filled</th><th class="num">Peak req.</th>' +
      '<th class="num">Rate / month</th><th></th></tr></thead><tbody>'];
    var lastKey = null;
    POS.forEach(function (p) {
      var key = (p.workforce || '') + ' · ' + (p.department || '—');
      if (key !== lastKey) { lastKey = key; h.push('<tr class="mp-grp"><td colspan="10">' + esc(key) + '</td></tr>'); }
      var peak = 0;
      SPAN.months.forEach(function (m) { var v = govOf(p, m.iso); if (v != null && v > peak) peak = v; });
      var req = cutIso ? govOf(p, cutIso) : null;
      var act = cutIso ? qtyOf(p, cutIso, 'actual') : null;
      var fil = ROSTER.length ? filledCount(p.id, cutIso) : null;
      var short = (req != null && fil != null) ? Math.max(0, req - fil) : null;
      h.push('<tr>' +
        '<td><b>' + esc(p.code || '—') + '</b></td>' +
        '<td><b>' + esc(p.position_title) + '</b>' + (p.remarks ? '<div class="mp-note">' + esc(p.remarks) + '</div>' : '') + '</td>' +
        '<td><span class="mp-badge' + (p.workforce === 'Skilled' ? ' mp-skill' : '') + '">' + esc(p.workforce || 'Staff') + '</span></td>' +
        '<td>' + esc(p.job_rank || '—') + '</td>' +
        '<td class="num">' + (req == null ? '—' : fnum(req)) + '</td>' +
        '<td class="num">' + (act == null ? '—' : fnum(act)) + '</td>' +
        '<td class="num">' + (fil == null ? '<span class="mp-note">no roster</span>'
          : fnum(fil) + (short ? ' <span class="mp-badge mp-vac">' + short + ' open</span>' : ' <span class="mp-badge mp-fill">full</span>')) + '</td>' +
        '<td class="num">' + (peak ? fnum(peak) : '—') + '</td>' +
        '<td class="num">' + (num(p.monthly_rate) == null ? '—' : moneyShort(num(p.monthly_rate))) + '</td>' +
        '<td><div class="mp-actions">' +
          '<button class="mp-btn-sm" data-months="' + p.id + '">Months</button>' +
          '<button class="mp-btn-sm" data-edit="' + p.id + '">Edit</button>' +
          '<button class="mp-btn-sm" data-del="' + p.id + '">Delete</button>' +
        '</div></td></tr>');
    });
    h.push('</tbody>');
    el.innerHTML = h.join('');
    el.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { openForm(posById(b.dataset.edit)); }; });
    el.querySelectorAll('[data-months]').forEach(function (b) { b.onclick = function () { openMonths(posById(b.dataset.months)); }; });
    el.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { delPosition(posById(b.dataset.del)); }; });
  }
  function posById(id) { for (var i = 0; i < POS.length; i++) if (String(POS[i].id) === String(id)) return POS[i]; return null; }
  function posTitle(id) { var p = posById(id); return p ? p.position_title : ''; }

  // A proposed code: the title's initials plus the next free number, which is the numbering
  // every project already uses on paper. It is a suggestion in an editable field, not a rule.
  function initialsOf(t) {
    var w = String(t || '').replace(/[^A-Za-z ]/g, ' ').split(/\s+/).filter(Boolean);
    if (!w.length) return 'MP';
    if (w.length === 1) return w[0].slice(0, 2).toUpperCase();
    return (w[0].charAt(0) + w[1].charAt(0)).toUpperCase();
  }
  function nextCode(title) {
    var pfx = initialsOf(title);
    var used = {};
    POS.forEach(function (p) { used[String(p.code || '').trim().toLowerCase()] = 1; });
    for (var n = 1; n < 999; n++) {
      var c = pfx + '-' + String(n).padStart(2, '0');
      if (!used[c.toLowerCase()]) return c;
    }
    return pfx + '-' + Date.now().toString(36).slice(-3).toUpperCase();
  }
  function codeClash(code, exceptId) {
    var c = String(code || '').trim().toLowerCase();
    if (!c) return null;
    for (var i = 0; i < POS.length; i++) {
      if (exceptId && String(POS[i].id) === String(exceptId)) continue;
      if (String(POS[i].code || '').trim().toLowerCase() === c) return POS[i];
    }
    return null;
  }
  function selOpts(list, cur) {
    return list.map(function (x) { return '<option' + (String(x) === String(cur || '') ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
  }

  function openForm(p) {
    p = p || null;
    var defCode = p ? '' : '';
    var depts = deptOptions();
    STAFF_SEED.concat(SKILLED_SEED).forEach(function (d) { if (depts.indexOf(d[0]) < 0) depts.push(d[0]); });
    if (p && p.department && depts.indexOf(p.department) < 0) depts.push(p.department);
    var m = UI.modal(
      '<div class="pd-modal-header"><h2>' + (p ? 'Edit position' : 'Add position') + '</h2>' +
      '<button class="pd-modal-close" id="mp-x">&times;</button></div>' +
      '<div class="pd-modal-body"><div class="mp-form-grid" style="padding:4px 0 8px;">' +
        '<div class="pd-field"><label>Position code</label>' +
          '<input class="pd-input" id="f-code" value="' + esc(p ? p.code : defCode) + '" placeholder="FE-01">' +
          '<span class="mp-note">Unique on this project. Two lines can share a TITLE; the code is what tells them apart.</span></div>' +
        '<div class="pd-field"><label>Position title</label>' +
          '<input class="pd-input" id="f-title" value="' + esc(p && p.position_title) + '" placeholder="e.g. Field Engineer"></div>' +
        '<div class="pd-field"><label>Workforce</label><select class="pd-select" id="f-work">' + selOpts(WORKFORCES, p && p.workforce || 'Staff') + '</select></div>' +
        '<div class="pd-field"><label>Department</label><select class="pd-select" id="f-dept">' + selOpts(depts, p && p.department) + '</select></div>' +
        '<div class="pd-field"><label>Rank</label><select class="pd-select" id="f-rank"><option value="">—</option>' + selOpts(RANKS, p && p.job_rank) + '</select></div>' +
        '<div class="pd-field"><label>Cost per head-month</label>' +
          '<input class="pd-input" id="f-rate" type="number" step="any" min="0" value="' + esc(p && p.monthly_rate != null ? p.monthly_rate : '') + '">' +
          '<span class="mp-note">Used only to derive a cost curve when payroll has not been typed for the month.</span></div>' +
        '<div class="pd-field mp-form-full"><label>Remarks</label>' +
          '<input class="pd-input" id="f-rem" value="' + esc(p && p.remarks) + '"></div>' +
      '</div></div>' +
      '<div class="pd-modal-footer">' +
        '<button class="pd-btn" id="mp-cancel">Cancel</button>' +
        '<button class="pd-btn pd-btn-primary" id="mp-save">' + (p ? 'Save' : 'Add position') + '</button>' +
      '</div>', { noBackdropClose: true });
    var g = function (id) { return m.el.querySelector('#' + id); };
    // A new line proposes a code the moment there is a title to derive one from; an edit
    // never overwrites the code the planner already has.
    if (!p) {
      g('f-title').oninput = function () {
        if (g('f-code').dataset.touched) return;
        g('f-code').value = g('f-title').value.trim() ? nextCode(g('f-title').value) : '';
      };
      g('f-code').oninput = function () { g('f-code').dataset.touched = '1'; };
    }
    g('mp-x').onclick = m.close;
    g('mp-cancel').onclick = m.close;
    g('mp-save').onclick = async function () {
      var title = g('f-title').value.trim();
      if (!title) { UI.toast('A position needs a title.', 'error'); return; }
      var code = g('f-code').value.trim();
      var clash = codeClash(code, p && p.id);
      // ⚠️ Checked here as well as by the unique index: the index answers with a raw
      // PostgREST message, and "FE-01 is already used by Field Engineer" is the only version
      // a planner can act on.
      if (clash) { UI.toast('Code ' + code + ' is already used by ' + clash.position_title + '.', 'error'); return; }
      var payload = {
        code: code || null,
        position_title: title,
        workforce: g('f-work').value,
        department: g('f-dept').value,
        job_rank: g('f-rank').value || null,
        monthly_rate: num(g('f-rate').value),
        remarks: g('f-rem').value.trim() || null
      };
      var res;
      if (p) {
        res = await tolerantWrite(payload, function (x) { return sb().from('manpower_positions').update(x).eq('id', p.id); });
      } else {
        payload.project_id = pid;
        payload.created_by = user && user.id;
        payload.sort_order = POS.length;
        res = await tolerantWrite(payload, function (x) { return sb().from('manpower_positions').insert(x).select(); });
      }
      if (!res.ok) { UI.toast('Could not save: ' + (res.error && res.error.message), 'error'); return; }
      reportDropped(res.dropped);
      m.close();
      UI.toast(p ? 'Position updated.' : 'Position added.', 'ok');
      load();
    };
  }

  async function delPosition(p) {
    if (!p) return;
    var n = Object.keys(LOAD[p.id] || {}).length;
    var people = ROSTER.filter(function (r) { return String(r.position_id) === String(p.id); }).length;
    if (!confirm('Delete ' + (p.code ? p.code + ' — ' : '') + p.position_title + '?\n\n' +
      'This also deletes its ' + n + ' month(s) of loading.' +
      (people ? '\n' + people + ' roster entry(ies) will be left without a position.' : ''))) return;
    if (await persist(sb().from('manpower_positions').delete().eq('id', p.id), 'Could not delete')) {
      UI.toast('Position deleted.', 'ok');

  }

  // The per-position month sheet — the same numbers as the grid, typed down a column instead
  // of across a row, which is how a planner filling a new position actually works.
  function openMonths(p) {
    if (!p) return;
    var months = SPAN.months;
    var m = UI.modal(
      '<div class="pd-modal-header"><h2>' + esc((p.code ? p.code + ' — ' : '') + p.position_title) + '</h2>' +
      '<button class="pd-modal-close" id="mp-mx-x">&times;</button></div>' +
      '<div class="pd-modal-body"><table class="mp-mon-tbl"><thead><tr><th>Month</th>' +
        SERIES.map(function (s) { return '<th>' + esc(s.short) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        months.map(function (mo) {
          return '<tr><td>' + monLabel(mo.d) + '</td>' + SERIES.map(function (s) {
            var v = qtyOf(p, mo.iso, s.k);
            return '<td><input type="number" step="any" min="0" data-per="' + mo.iso + '" data-ser="' + s.k + '" value="' + (v == null ? '' : v) + '"></td>';
          }).join('') + '</tr>';
        }).join('') +
      '</tbody></table></div>' +
      '<div class="pd-modal-footer">' +
        '<button class="pd-btn" id="mp-mx-cancel">Cancel</button>' +
        '<button class="pd-btn pd-btn-primary" id="mp-mx-save">Save months</button>' +
      '</div>', { noBackdropClose: true });
    var g = function (id) { return m.el.querySelector('#' + id); };
    g('mp-mx-x').onclick = m.close;
    g('mp-mx-cancel').onclick = m.close;
    g('mp-mx-save').onclick = async function () {
      var byPer = {};
      m.el.querySelectorAll('input[data-per]').forEach(function (inp) {
        var per = inp.dataset.per;
        (byPer[per] = byPer[per] || {})[SER_BY_K[inp.dataset.ser].col] = num(inp.value);
      });
      // ⚠️ Only the months that actually CHANGED are written. Saving all of them would touch
      // every updated_at — the column the register's "last updated" reading comes from — and
      // would turn one typo into 40 writes.
      var jobs = [], changed = 0;
      Object.keys(byPer).forEach(function (per) {
        var want = byPer[per], cur = (LOAD[p.id] || {})[per];
        var diff = false;
        SERIES.forEach(function (s) {
          var a = cur ? num(cur[s.col]) : null, b = want[s.col];
          if (a !== b) diff = true;
        });
        if (!diff) return;
        changed++;
        if (cur) jobs.push({ kind: 'u', id: cur.id, per: per, payload: want });
        else {
          var allNull = SERIES.every(function (s) { return want[s.col] == null; });
          if (allNull) { changed--; return; }
          var row = { project_id: pid, position_id: p.id, period: per, source: 'hand', created_by: user && user.id };
          SERIES.forEach(function (s) { row[s.col] = want[s.col]; });
          jobs.push({ kind: 'i', per: per, payload: row });
        }
      });
      if (!jobs.length) { m.close(); UI.toast('Nothing changed.', 'ok'); return; }
      showLoading('Saving ' + changed + ' month(s)…');
      var failed = 0;
      for (var i = 0; i < jobs.length; i++) {
        var j = jobs[i], r;
        if (j.kind === 'u') r = await tolerantWrite(j.payload, (function (id) { return function (x) { return sb().from('manpower_loading').update(x).eq('id', id); }; })(j.id));
        else r = await tolerantWrite(j.payload, function (x) { return sb().from('manpower_loading').insert(x).select(); });
        if (!r.ok) failed++;
        else reportDropped(r.dropped);
      }
      hideLoading();
      m.close();
      if (failed) UI.toast(failed + ' of ' + jobs.length + ' month(s) could not be saved.', 'error');
      else UI.toast(changed + ' month(s) saved.', 'ok');
      load();
    };
  }

  // ---- Seed the organisation chart ------------------------------------------------------
  function openSeed() {
    var have = {};
    POS.forEach(function (p) { have[(p.workforce || '') + '|' + (p.position_title || '').trim().toLowerCase()] = 1; });
    function block(title, seed, work, note) {
      var rows = [];
      seed.forEach(function (d) {
        rows.push('<div class="dept">' + esc(d[0]) + '</div>');
        d[1].forEach(function (t) {
          var key = work + '|' + t[0].toLowerCase();
          var already = !!have[key];
          rows.push('<label><input type="checkbox" data-seed="' + esc(work + '|' + d[0] + '|' + t[0] + '|' + t[1]) + '"' +
            (already ? ' disabled' : ' checked') + '>' + esc(t[0]) + (already ? ' <span class="mp-note">(already on this project)</span>' : '') + '</label>');
        });
      });
      return '<div class="mp-form-sec">' + esc(title) + '</div>' +
        (note ? '<p class="mp-note" style="margin:6px 0 0;">' + note + '</p>' : '') +
        '<div class="mp-seedgrid">' + rows.join('') + '</div>';
    }
    var m = UI.modal(
      '<div class="pd-modal-header"><h2>Seed the organisation chart</h2>' +
      '<button class="pd-modal-close" id="mp-s-x">&times;</button></div>' +
      '<div class="pd-modal-body">' +
        '<p class="mp-note">These become ordinary position lines you can rename, re-rank or delete. Nothing is loaded into any month — that is the grid&rsquo;s job.</p>' +
        '<div class="mp-seg" id="mp-s-which" style="margin-top:10px;">' +
          '<button data-w="Staff" class="active">Staff</button><button data-w="Skilled">Skilled</button>' +
        '</div>' +
        '<div id="mp-s-staff">' + block('Staff — direct staffing', STAFF_SEED, 'Staff', '') + '</div>' +
        '<div id="mp-s-skilled" style="display:none;">' + block('Skilled workers', SKILLED_SEED, 'Skilled',
          '&#9888; <b>Provisional list.</b> The skilled-worker reference report has not been supplied yet, so these trades are taken from the staff report&rsquo;s own demobilisation summary plus the usual rest of a building job. Correct them here, or delete and re-seed once the real list arrives.') + '</div>' +
      '</div>' +
      '<div class="pd-modal-footer">' +
        '<button class="pd-btn" id="mp-s-cancel">Cancel</button>' +
        '<button class="pd-btn pd-btn-primary" id="mp-s-save">Add selected</button>' +
      '</div>', { noBackdropClose: true });
    var g = function (id) { return m.el.querySelector('#' + id); };
    m.el.querySelectorAll('#mp-s-which button').forEach(function (b) {
      b.onclick = function () {
        m.el.querySelectorAll('#mp-s-which button').forEach(function (x) { x.classList.toggle('active', x === b); });
        g('mp-s-staff').style.display = b.dataset.w === 'Staff' ? '' : 'none';
        g('mp-s-skilled').style.display = b.dataset.w === 'Skilled' ? '' : 'none';
      };
    });
    // ⚠️ Codes are allocated against a list that GROWS as the batch is built, not against POS
    // alone. Two seeded rows whose titles share initials ("Safety Advisor" / "Safety Officer")
    // would otherwise both be handed SA-01, and the unique index would refuse the insert with a
    // raw constraint error for a button nobody typed into.
    function nextCodeWith(title, taken) {
      var pfx = initialsOf(title), used = {};
      POS.forEach(function (p) { used[String(p.code || '').trim().toLowerCase()] = 1; });
      taken.forEach(function (c) { used[String(c).toLowerCase()] = 1; });
      for (var n = 1; n < 999; n++) {
        var c = pfx + '-' + String(n).padStart(2, '0');
        if (!used[c.toLowerCase()]) return c;
      }
      return pfx + '-' + Date.now().toString(36).slice(-3).toUpperCase();
    }
    g('mp-s-x').onclick = m.close;
    g('mp-s-cancel').onclick = m.close;
    g('mp-s-save').onclick = async function () {
      var picks = [];
      m.el.querySelectorAll('input[data-seed]:checked:not(:disabled)').forEach(function (c) { picks.push(c.dataset.seed.split('|')); });
      if (!picks.length) { UI.toast('Nothing selected.', 'error'); return; }
      var taken = [];
      var rows = picks.map(function (x, i) {
        var code = nextCodeWith(x[2], taken);
        taken.push(code);
        return { project_id: pid, code: code, workforce: x[0], department: x[1], position_title: x[2],
                 job_rank: x[3], sort_order: POS.length + i, created_by: user && user.id };
      });
      showLoading('Adding ' + rows.length + ' position(s)…');
      var r = await sb().from('manpower_positions').insert(rows).select();
      // ⚠️ The batch insert cannot go through tolerantWrite (that works on ONE payload), so the
      // missing-column retry is done here by hand — and only for a missing column. Losing a
      // 26-row seed to one unmigrated field would be the same defect the equipment module was
      // fixed for.
      if (r.error) {
        var col = missingColumn(r.error);
        if (!col) { hideLoading(); UI.toast('Could not seed: ' + r.error.message, 'error'); return; }
        rows.forEach(function (row) { delete row[col]; });
        var r2 = await sb().from('manpower_positions').insert(rows).select();
        if (r2.error) { hideLoading(); UI.toast('Could not seed: ' + r2.error.message, 'error'); return; }
        reportDropped([col]);
      }
      hideLoading();
      m.close();
      UI.toast(rows.length + ' position(s) added.', 'ok');
      load();
    };
  }

  // ---- Roster ---------------------------------------------------------------------------
  function isTBH(r) { return TBH_RE.test(r.employee_name || ''); }
  function rosterVisible() {
    var q = rSearch.trim().toLowerCase();
    return ROSTER.filter(function (r) {
      var p = r.position_id ? posById(r.position_id) : null;
      if (rWork && (!p || p.workforce !== rWork)) return false;
      if (!q) return true;
      return (String(r.employee_name || '') + ' ' + (p ? p.position_title : '')).toLowerCase().indexOf(q) >= 0;
    });
  }
  // What this profile's contract duration actually contributes, stated per row — the number the
  // derivation acts on, so a profile that contributes nothing says why rather than looking normal.
  function rosterMonthsCell(r) {
    if (isTBH(r)) return '<span class="mp-note">vacancy</span>';
    if (!r.position_id) return '<span class="mp-note">no position</span>';
    var sp = profileSpanLabel(r);
    if (!sp) return '<span class="mp-note">no start</span>';
    if (!sp.months) return '<span class="mp-note">open-ended</span>';
    return fnum(sp.months);
  }

  function renderRoster() {
    var el = document.getElementById('mp-roster'); if (!el) return;
    var rows = rosterVisible();
    var kp = document.getElementById('mp-roster-kpis');
    var cutIso = CUTOFF ? mkey(CUTOFF) : null;
    var onboard = rows.filter(function (r) { return !isTBH(r); }).length;
    var tbh = rows.filter(isTBH).length;
    var ending = rows.filter(function (r) {
      if (!r.contract_end) return false;
      var e = mFloor(pd_(r.contract_end));
      if (!e || !CUTOFF) return false;
      var lim = new Date(CUTOFF.getFullYear(), CUTOFF.getMonth() + 3, 1);
      return e >= CUTOFF && e < lim;
    }).length;
    var noPos = rows.filter(function (r) { return !r.position_id; }).length;
    if (kp) {
      function k(v, l, cls) { return '<div class="mp-kpi"><div class="mp-kpi-v' + (cls ? ' ' + cls : '') + '">' + v + '</div><div class="mp-kpi-l">' + l + '</div></div>'; }
      kp.innerHTML = k(rows.length, 'Roster entries') + k(onboard, 'People on board') +
        k(tbh, 'Slots marked TBH', tbh ? 'mp-bad' : '') +
        k(ending, 'Contracts ending in 3 months', ending ? 'mp-bad' : '') +
        k(noPos, 'Not linked to a position', noPos ? 'mp-bad' : '');
    }
    var note = document.getElementById('mp-roster-note');
    if (note) note.textContent = CUTOFF ? ('Fill counted as of ' + monLabel(CUTOFF)) : '';
    if (!ROSTER.length) {
      el.innerHTML = '<tbody><tr><td><div class="mp-empty">No roster yet. <b>+ Add person</b> records who is actually filling each position — that is what turns a requirement into a vacancy.</div></td></tr></tbody>';
      renderDemob();
      return;
    }
    var h = ['<thead><tr><th>#</th><th>Name</th><th>Position</th><th>Status</th><th>Allocation</th>' +
      '<th>Hired</th><th>Contract</th><th class="num">Months</th><th>Remarks</th><th></th></tr></thead><tbody>'];
    rows.forEach(function (r, i) {
      var p = r.position_id ? posById(r.position_id) : null;
      var ce = pd_(r.contract_end);
      var ended = ce && CUTOFF && mFloor(ce) < CUTOFF;
      h.push('<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td><b>' + esc(r.employee_name) + '</b>' + (isTBH(r) ? ' <span class="mp-badge mp-vac">unfilled</span>' : '') +
          (ended ? ' <span class="mp-badge">demobilised</span>' : '') + '</td>' +
        '<td>' + (p ? esc((p.code ? p.code + ' · ' : '') + p.position_title) +
          (p.workforce === 'Skilled' ? ' <span class="mp-badge mp-skill">Skilled</span>' : '')
          : '<span class="mp-note">not linked</span>') + '</td>' +
        '<td>' + esc(r.employee_status || '—') + '</td>' +
        '<td>' + esc(r.allocation || '—') + '</td>' +
        '<td>' + (r.date_hired ? esc(Fmt.date ? Fmt.date(r.date_hired) : r.date_hired) : '—') + '</td>' +
        '<td>' + (r.contract_start || r.contract_end
            ? esc((r.contract_start ? (Fmt.date ? Fmt.date(r.contract_start) : r.contract_start) : '?') + ' → ' +
                  (r.contract_end ? (Fmt.date ? Fmt.date(r.contract_end) : r.contract_end) : 'open'))
            : '—') + '</td>' +
        '<td class="num">' + rosterMonthsCell(r) + '</td>' +
        '<td>' + esc(r.remarks || '') + '</td>' +
        '<td><div class="mp-actions">' +
          '<button class="mp-btn-sm" data-redit="' + r.id + '">Edit</button>' +
          '<button class="mp-btn-sm" data-rdel="' + r.id + '">Delete</button>' +
        '</div></td></tr>');
    });
    h.push('</tbody>');
    el.innerHTML = h.join('');
    el.querySelectorAll('[data-redit]').forEach(function (b) { b.onclick = function () { openRosterForm(rosterById(b.dataset.redit)); }; });
    el.querySelectorAll('[data-rdel]').forEach(function (b) { b.onclick = function () { delRoster(rosterById(b.dataset.rdel)); }; });
    renderDemob();
  }
  function rosterById(id) { for (var i = 0; i < ROSTER.length; i++) if (String(ROSTER[i].id) === String(id)) return ROSTER[i]; return null; }

  // The DEMOB summary the reference workbook keeps on its own sheet: how many heads come off
  // contract in each month, and which positions they are. ⚠️ Rows with no contract end are
  // reported as "open-ended", never folded into a month — a blank end date is an unanswered
  // question, and putting it in the last month would invent a demobilisation.
  function renderDemob() {
    var host = document.getElementById('mp-demob'); if (!host) return;
    var rows = rosterVisible().filter(function (r) { return !isTBH(r); });
    var byMonth = {}, open = 0;
    rows.forEach(function (r) {
      var e = pd_(r.contract_end);
      if (!e) { open++; return; }
      var iso = mkey(mFloor(e));
      (byMonth[iso] = byMonth[iso] || []).push(r);
    });
    var keys = Object.keys(byMonth).sort();
    if (!keys.length) {
      host.innerHTML = '<div class="mp-note">No contract end dates recorded' + (open ? ' — ' + open + ' entr(ies) are open-ended.' : '.') + '</div>';
      return;
    }
    var h = ['<table class="mp-table"><thead><tr><th>Contract end</th><th class="num">Heads</th><th>Positions</th></tr></thead><tbody>'];
    keys.forEach(function (iso) {
      var list = byMonth[iso], by = {};
      list.forEach(function (r) { var t = r.position_id ? posTitle(r.position_id) : 'not linked'; by[t] = (by[t] || 0) + 1; });
      h.push('<tr><td><b>' + monLabel(pd_(iso)) + '</b></td><td class="num">' + list.length + '</td><td>' +
        Object.keys(by).sort().map(function (t) { return esc(t) + ' × ' + by[t]; }).join(', ') + '</td></tr>');
    });
    h.push('</tbody></table>');
    if (open) h.push('<div class="mp-note" style="padding:8px 2px 0;">' + open + ' entr(ies) have no contract end date and are not counted above.</div>');
    host.innerHTML = h.join('');
  }

  function openRosterForm(r) {

        '<div class="pd-field"><label>Date hired (in project)</label><input class="pd-input" id="r-hired" type="date" value="' + esc(r && r.date_hired || '') + '"></div>' +
        '<div class="pd-field"><label>Rank</label><select class="pd-select" id="r-rank"><option value="">—</option>' + selOpts(RANKS, r && r.job_rank) + '</select></div>' +
        '<div class="mp-form-sec mp-form-full">Contract duration</div>' +
        '<div class="pd-field mp-form-full" style="margin-bottom:0;"><span class="mp-note">This is what puts the profile on the project: it adds <b>one head</b> to its position for every month the contract spans, and the grid is derived from that rather than typed twice.</span></div>' +
        '<div class="pd-field"><label>Contract start</label><input class="pd-input" id="r-cs" type="date" value="' + esc(r && r.contract_start || '') + '"></div>' +
        '<div class="pd-field"><label>Contract end</label><input class="pd-input" id="r-ce" type="date" value="' + esc(r && r.contract_end || '') + '">' +
          '<span class="mp-note">Blank = open-ended. An open-ended profile still counts toward Actual up to the cut-off, but is never projected forward.</span></div>' +
        '<div class="pd-field mp-form-full"><label>Months</label>' +
          '<div class="mp-linkrow"><input class="pd-input" id="r-mos" type="number" min="1" step="1" style="max-width:110px;" placeholder="e.g. 12">' +
            '<button type="button" class="pd-btn" id="r-mos-go" style="height:34px;">Set end date from start</button></div>' +
          '<span class="mp-dur" id="r-dur"></span></div>' +

      '</div>', { noBackdropClose: true });
    var g = function (id) { return m.el.querySelector('#' + id); };
    // The live readout is what makes "the profile considers its contract duration" visible: it
    // names the months this profile will contribute before anything is saved.
    function syncDur() {
      var el = g('r-dur'); if (!el) return;
      var draft = { contract_start: g('r-cs').value || null, contract_end: g('r-ce').value || null,
                    employee_name: g('r-name').value, position_id: g('r-pos').value || null };
      var sp = profileSpanLabel(draft);
      if (!sp) { el.innerHTML = '<small>Set a contract start to see the months this profile covers.</small>'; return; }
      var head = sp.months ? (sp.months + ' month' + (sp.months === 1 ? '' : 's') + ' · ' + sp.from + ' – ' + sp.to)
                           : ('Open-ended · from ' + sp.from);
      var why = [];
      if (isTBH(draft)) why.push('TBH — counted as a vacancy, never as a deployed head.');
      else if (!draft.position_id) why.push('Not linked to a position, so there is no line to add it to.');
      else if (!sp.months) why.push('Counts toward Actual up to the cut-off; not projected forward without an end date.');
      else why.push('Adds 1 head to ' + esc(posTitle(draft.position_id) || 'its position') + ' for each of those months.');
      el.innerHTML = esc(head) + '<small>' + why.join(' ') + '</small>';
    }
    ['r-cs', 'r-ce', 'r-name', 'r-pos'].forEach(function (id) {
      var el = g(id); if (!el) return;
      el.oninput = syncDur; el.onchange = syncDur;
    });
    g('r-mos-go').onclick = function () {
      var n = num(g('r-mos').value), s = pd_(g('r-cs').value);
      if (!s) { UI.toast('Set the contract start first.', 'error'); return; }
      if (!n || n < 1) { UI.toast('Enter how many months the contract runs.', 'error'); return; }
      // ⚠️ n months INCLUSIVE of the start month, ending on that month's last day — a 12-month
      // contract from 1 Jan ends 31 Dec, not 1 Jan the next year. Off by one here silently adds
      // a month of headcount to every profile it touches.
      var end = new Date(s.getFullYear(), s.getMonth() + n, 0);
      g('r-ce').value = end.getFullYear() + '-' + String(end.getMonth() + 1).padStart(2, '0') + '-' + String(end.getDate()).padStart(2, '0');
      syncDur();
    };
    syncDur();
    g('mp-r-x').onclick = m.close;
    g('mp-r-cancel').onclick = m.close;
    g('mp-r-save').onclick = async function () {

      if (!name) { UI.toast('A manpower profile needs a name (or TBH for an unfilled slot).', 'error'); return; }
      var cs = g('r-cs').value || null, ce = g('r-ce').value || null;
      if (cs && ce && ce < cs) { UI.toast('The contract ends before it starts.', 'error'); return; }
      var payload = {
        employee_name: name,
        position_id: g('r-pos').value || null,
        employee_status: g('r-status').value || null,
        allocation: g('r-alloc').value || null,
        job_rank: g('r-rank').value || null,
        date_hired: g('r-hired').value || null,
        contract_start: cs,
        contract_end: ce,
        remarks: g('r-rem').value.trim() || null
      };
      var res;
      if (r) res = await tolerantWrite(payload, function (x) { return sb().from('manpower_roster').update(x).eq('id', r.id); });
      else {
        payload.project_id = pid; payload.created_by = user && user.id;
        res = await tolerantWrite(payload, function (x) { return sb().from('manpower_roster').insert(x).select(); });
      }
      if (!res.ok) { UI.toast('Could not save: ' + (res.error && res.error.message), 'error'); return; }
      reportDropped(res.dropped);
      m.close();
      UI.toast(r ? 'Manpower profile updated.' : 'Manpower profile added.', 'ok');
      await load();
      // ⚠️ Re-derives ONLY once a derivation already exists. The first one has to be the
      // planner's explicit act — which series it writes into is a decision, and silently
      // filling the grid the first time somebody adds a person would be a surprise.
      if (hasDerived()) await deriveFromContracts(DERIVE_KEY, true);
    };
  }
  async function delRoster(r) {
    if (!r) return;
    if (!confirm('Remove ' + r.employee_name + ' from the roster?')) return;
    if (await persist(sb().from('manpower_roster').delete().eq('id', r.id), 'Could not delete')) {

  }

  // ---- Portfolio ------------------------------------------------------------------------
  // The reason the module exists at portfolio level: one month, every project the user can
  // open, ranked by how short of its own requirement it is — so a head can be moved from the
  // project that has spare to the one that is starving.
  //
  // ⚠️ TWO reads for the whole portfolio, not one per project. `.in('project_id', ids)` is
  // chunked at 100 ids because the id list travels in the URL and a portfolio of several
  // hundred projects would otherwise build a request long enough to be refused by a proxy —
  // which fails as an opaque network error, not as a message anyone can act on.
  async function loadPortfolio() {
    if (portReading) return;
    portReading = true;
    var ids = PROJECTS.map(function (p) { return p.id; });
    var iso = mkey(portAsOf || CUTOFF || mFloor(new Date()));
    showLoading('Reading ' + ids.length + ' project(s)…');
    try {
      var posRows = [], loadRows = [];
      for (var i = 0; i < ids.length; i += 100) {
        var chunk = ids.slice(i, i + 100);
        posRows = posRows.concat(await PDb.selectAll('manpower_positions',
          (function (c) { return function (q) { return q.in('project_id', c); }; })(chunk),
          'id,project_id,workforce,department,position_title'));
        loadRows = loadRows.concat(await PDb.selectAll('manpower_loading',
          (function (c) { return function (q) { return q.in('project_id', c).eq('period', iso); }; })(chunk),
          'position_id,project_id,planned_qty,approved_qty,forecast_qty,actual_qty'));
      }
      var posById2 = {};
      posRows.forEach(function (p) { posById2[p.id] = p; });
      var by = {};
      PROJECTS.forEach(function (p) {
        by[p.id] = { id: p.id, name: p.name || p.id, lines: 0, req: 0, act: 0, hasReq: false, hasAct: false,
                     staff: { req: 0, act: 0, has: false }, skilled: { req: 0, act: 0, has: false } };
      });
      posRows.forEach(function (p) { if (by[p.project_id]) by[p.project_id].lines++; });
      loadRows.forEach(function (r) {
        var b = by[r.project_id]; if (!b) return;
        var p = posById2[r.position_id]; if (!p) return;
        var w = (p.workforce === 'Skilled') ? 'skilled' : 'staff';
        if (portWork && p.workforce !== portWork) return;
        var a = num(r.approved_qty), pl = num(r.planned_qty);
        var req = a != null ? a : pl;
        var act = num(r.actual_qty);
        if (req != null) { b.req += req; b.hasReq = true; b[w].req += req; b[w].has = true; }
        if (act != null) { b.act += act; b.hasAct = true; b[w].act += act; b[w].has = true; }
      });
      PORT = { iso: iso, rows: Object.keys(by).map(function (k) { return by[k]; }) };
    } catch (err) {
      if (/manpower_positions|manpower_loading|schema cache/i.test(err.message || '')) {
        PORT = { iso: iso, rows: [], missing: true };
      } else {
        UI.toast('Could not read the portfolio: ' + (err.message || err), 'error');
        PORT = null;
      }
    }
    hideLoading();
    portReading = false;
    renderPortfolio();
  }

  function renderPortfolio() {
    var tbl = document.getElementById('mp-p-tbl'), kp = document.getElementById('mp-p-kpis'),
        note = document.getElementById('mp-p-note');
    if (!tbl) return;
    if (note) note.textContent = PORT ? ('As of ' + monLabel(pd_(PORT.iso)) + ' · ' + PORT.rows.length + ' project(s) readable') :
      'Press "Read every project" — this is the only view that queries outside the selected project.';
    if (!PORT) {
      tbl.innerHTML = '<tbody><tr><td><div class="mp-empty">Nothing read yet.</div></td></tr></tbody>';
      if (kp) kp.innerHTML = '';
      return;
    }
    if (PORT.missing) {
      tbl.innerHTML = '<tbody><tr><td><div class="mp-empty">The manpower tables do not exist yet. Run <b>' + MP_MIGRATION + '</b> in the Supabase SQL editor.</div></td></tr></tbody>';
      if (kp) kp.innerHTML = '';
      return;
    }
    // Projects with no requirement in this month are reported separately, never as 0% filled —
    // "no manpower plan for this month" and "planned nobody" are different facts, and ranking
    // the first as the most critical would bury the projects that really are short.
    var live = PORT.rows.filter(function (r) { return r.hasReq && r.req > 0; });
    var quiet = PORT.rows.filter(function (r) { return !(r.hasReq && r.req > 0); });
    live.forEach(function (r) {
      r.gap = r.hasAct ? (r.act - r.req) : null;
      r.fill = r.hasAct ? (r.act / r.req) : null;
    });
    // Ranked by fill: the emptiest project first. Projects that have not reported an actual
    // for the month sort after the ones that have — an unknown is not a crisis.
    live.sort(function (a, b) {
      if ((a.fill == null) !== (b.fill == null)) return a.fill == null ? 1 : -1;
      if (a.fill == null) return String(a.name).localeCompare(String(b.name));
      return a.fill - b.fill;
    });
    var totReq = 0, totAct = 0, nShort = 0, nSpare = 0, biggest = null;
    live.forEach(function (r) {
      totReq += r.req; if (r.hasAct) totAct += r.act;
      if (r.gap != null && r.gap < 0) { nShort++; if (!biggest || r.gap < biggest.gap) biggest = r; }
      if (r.gap != null && r.gap > 0) nSpare++;
    });
    if (kp) {
      function k(v, l, cls) { return '<div class="mp-kpi"><div class="mp-kpi-v' + (cls ? ' ' + cls : '') + '">' + v + '</div><div class="mp-kpi-l">' + l + '</div></div>'; }
      kp.innerHTML =
        k(live.length, 'Projects with a plan this month') +
        k(fnum(totReq), 'Total requirement') +
        k(fnum(totAct), 'Total deployed') +
        k(totReq ? Math.round(totAct / totReq * 100) + '%' : '—', 'Portfolio fill rate', totReq && (totAct / totReq) < 0.85 ? 'mp-bad' : '') +
        k(nShort, 'Projects short', nShort ? 'mp-bad' : '') +
        k(nSpare, 'Projects with spare', nSpare ? 'mp-good' : '') +
        k(biggest ? fnum(-biggest.gap) : '—', biggest ? ('Worst shortfall · ' + biggest.name) : 'Worst shortfall', biggest ? 'mp-bad' : '');
    }
    var h = ['<thead><tr><th>#</th><th>Project</th><th class="num">Requirement</th><th class="num">Deployed</th>' +
      '<th class="num">Variance</th><th>Fill</th><th class="num">Staff (req / act)</th><th class="num">Skilled (req / act)</th><th>Read</th></tr></thead><tbody>'];
    live.forEach(function (r, i) {
      var pctN = r.fill == null ? null : Math.round(r.fill * 100);
      var sev = r.fill == null ? '' : (r.fill < 0.8 ? 'crit' : (r.fill < 0.95 ? 'warn' : 'ok'));
      var barCol = r.fill == null ? 'var(--pd-line)' : (r.fill < 0.8 ? 'var(--pd-bad)' : (r.fill < 0.95 ? 'var(--pd-warn)' : 'var(--pd-ok)'));
      h.push('<tr' + (String(r.id) === String(pid) ? ' style="outline:2px solid var(--pd-red);outline-offset:-2px;"' : '') + '>' +
        '<td>' + (i + 1) + '</td>' +
        '<td><b>' + esc(r.name) + '</b><div class="mp-note">' + r.lines + ' position line(s)</div></td>' +
        '<td class="num">' + fnum(r.req) + '</td>' +
        '<td class="num">' + (r.hasAct ? fnum(r.act) : '<span class="mp-note">not reported</span>') + '</td>' +
        '<td class="num mp-sev ' + sev + '">' + (r.gap == null ? '—' : (r.gap > 0 ? '+' : '') + fnum(r.gap)) + '</td>' +
        '<td><div class="mp-bar"><i style="width:' + (pctN == null ? 0 : Math.min(100, pctN)) + '%;background:' + barCol + '"></i></div>' +
          '<div class="mp-note mp-sev ' + sev + '">' + (pctN == null ? 'unknown' : pctN + '%') + '</div></td>' +
        '<td class="num">' + (r.staff.has ? fnum(r.staff.req) + ' / ' + fnum(r.staff.act) : '—') + '</td>' +
        '<td class="num">' + (r.skilled.has ? fnum(r.skilled.req) + ' / ' + fnum(r.skilled.act) : '—') + '</td>' +
        '<td><button class="mp-btn-sm" data-open="' + esc(r.id) + '">Open</button></td></tr>');
    });
    if (quiet.length) {
      h.push('<tr class="mp-grp"><td colspan="9">No manpower plan for ' + esc(monLabel(pd_(PORT.iso))) + ' — ' + quiet.length + ' project(s)</td></tr>');
      quiet.forEach(function (r) {
        // ⚠️ THREE different reasons a project has no plan, and they send the reader to three
        // different places. Collapsing them into "no quantity is recorded" is wrong the moment a
        // project has reported an actual — the quantity IS there, it is the REQUIREMENT that is
        // missing, and a planner told otherwise goes looking for the wrong thing entirely.
        var why = !r.lines
          ? 'No positions recorded at all.'
          : (r.hasAct
              ? r.lines + ' position line(s), and ' + fnum(r.act) + ' deployed — but no planned or approved requirement for this month to measure against.'
              : r.lines + ' position line(s) exist, but no requirement is recorded for this month.');
        h.push('<tr><td></td><td>' + esc(r.name) + '</td><td colspan="6" class="mp-note">' + why +
          '</td><td><button class="mp-btn-sm" data-open="' + esc(r.id) + '">Open</button></td></tr>');
      });
    }
    h.push('</tbody>');
    tbl.innerHTML = h.join('');
    tbl.querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function () {
        var sel = document.getElementById('mp-project');
        sel.value = b.dataset.open;
        // ⚠️ Dispatched, not called: the shared project picker wraps the select and listens
        // for the event, so assigning .value alone would leave its own button showing the old
        // project's name while the module loaded a different one.
        sel.dispatchEvent(new Event('change'));
        var tab = document.querySelector('.mp-tab[data-view="loading"]');
        if (tab) switchView('loading', tab);
      };
    });
  }

  function exportXlsx() {

    XLSX.utils.book_append_sheet(wb, ws, 'Manpower Loading');

    ROSTER.forEach(function (r) {

      rr.push([r.employee_name, p ? (p.code || '') : '', p ? p.position_title : '', p ? (p.workforce || '') : '',
        r.employee_status || '', r.allocation || '', r.job_rank || '',
        r.date_hired || '', r.contract_start || '', r.contract_end || '', r.remarks || '']);
    });

  // Import the module's own export back. ⚠️ Round-trip only, and the dialog says so: this
  // reads the sheet THIS module writes, not the HRD workbook — that one carries a merged
  // header block and a year band above the month row, and a reader that guessed at them
  // would import a project's headcount into the wrong months without ever failing.
  //
  // ⚠️ Matched on CODE first and only then on department + title. A code is the thing a
  // planner keeps stable; a title gets re-typed ("QA/QC Engineer" vs "QAQC Engineer") and
  // matching on it alone silently creates a duplicate position line.
  function importXlsx(file) {
    var fr = new FileReader();
    fr.onload = async function () {
      var wb;
      try { wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' }); }
      catch (e) { UI.toast('Could not read that file: ' + e.message, 'error'); return; }
      var sh = wb.Sheets['Manpower Loading'] || wb.Sheets[wb.SheetNames[0]];
      if (!sh) { UI.toast('No sheet found in that workbook.', 'error'); return; }
      var aoa = XLSX.utils.sheet_to_json(sh, { header: 1, raw: true });
      if (!aoa.length) { UI.toast('That sheet is empty.', 'error'); return; }
      var head = aoa[0].map(function (x) { return String(x == null ? '' : x).trim(); });
      if (head[4] !== 'Series') {
        UI.toast('That is not a Manpower Loading export — export one first, fill it in, then import it back.', 'error');
        return;
      }
      // Month columns, resolved from the header text against the axis we actually have.
      var colIso = {};
      for (var c = 5; c < head.length; c++) {
        var mm = /^([A-Za-z]{3})\w*\s+(\d{4})$/.exec(head[c]);
        if (!mm) continue;
        var mi = MON3.map(function (x) { return x.toLowerCase(); }).indexOf(mm[1].toLowerCase());
        if (mi < 0) continue;
        colIso[c] = mkey(new Date(+mm[2], mi, 1));
      }
      var shortToKey = {};
      SERIES.forEach(function (s) { shortToKey[s.short.toLowerCase()] = s.k; });
      var byCode = {}, byTitle = {};
      POS.forEach(function (p) {
        if (p.code) byCode[String(p.code).trim().toLowerCase()] = p;
        byTitle[(String(p.department || '') + '|' + String(p.position_title || '')).trim().toLowerCase()] = p;
      });
      var jobs = {}, phases = {}, unknown = {}, skipped = 0;
      for (var r = 1; r < aoa.length; r++) {
        var row = aoa[r] || [];
        var title = String(row[3] == null ? '' : row[3]).trim();
        var ser = String(row[4] == null ? '' : row[4]).trim().toLowerCase();
        if (title === 'PROJECT PHASE') {
          for (var pc in colIso) if (row[pc] != null && String(row[pc]).trim() !== '') phases[colIso[pc]] = String(row[pc]).trim();
          continue;
        }
        // Derived rows in the export — never imported back, or a department total would be
        // written on top of the positions that produced it.
        if (!title || /\(total\)$/i.test(title) || title === 'OVERALL' || title === 'COST') continue;
        var k = shortToKey[ser];
        if (!k) { skipped++; continue; }
        var code = String(row[0] == null ? '' : row[0]).trim().toLowerCase();
        var dept = String(row[2] == null ? '' : row[2]).trim();
        var p2 = (code && byCode[code]) || byTitle[(dept + '|' + title).toLowerCase()];
        if (!p2) { unknown[(row[0] ? row[0] + ' · ' : '') + title] = 1; continue; }
        for (var cc in colIso) {
          var raw = row[cc];
          if (raw === undefined) continue;                       // column absent on this row
          var v = (raw === null || String(raw).trim() === '') ? null : num(raw);
          if (v === null && String(raw).trim() !== '') continue;  // unparseable — leave the stored value alone
          var iso = colIso[cc];
          var cur = (LOAD[p2.id] || {})[iso];
          var had = cur ? num(cur[SER_BY_K[k].col]) : null;
          if (had === v) continue;
          var key = p2.id + '|' + iso;
          (jobs[key] = jobs[key] || { posId: p2.id, iso: iso, cur: cur || null, set: {} }).set[SER_BY_K[k].col] = v;
        }
      }
      var jobList = Object.keys(jobs).map(function (x) { return jobs[x]; });
      var unk = Object.keys(unknown);
      var msg = jobList.length + ' month cell group(s) to write' +
        (Object.keys(phases).length ? ', ' + Object.keys(phases).length + ' phase label(s)' : '') +
        (unk.length ? '.\n\n' + unk.length + ' row(s) match no position on this project and will be SKIPPED:\n  ' + unk.slice(0, 8).join('\n  ') + (unk.length > 8 ? '\n  …' : '') : '.') +
        (skipped ? '\n\n' + skipped + ' row(s) had an unrecognised Series label and were skipped.' : '');
      if (!jobList.length && !Object.keys(phases).length) { UI.toast('Nothing in that file differs from what is already stored.', 'ok'); return; }
      if (!confirm('Import into ' + (projName() || pid) + '?\n\n' + msg)) return;
      showLoading('Importing…');
      var failed = 0, done = 0;
      for (var i = 0; i < jobList.length; i++) {
        var j = jobList[i], res;
        if (j.cur) res = await tolerantWrite(j.set, (function (id) { return function (x) { return sb().from('manpower_loading').update(x).eq('id', id); }; })(j.cur.id));
        else {
          var ins = { project_id: pid, position_id: j.posId, period: j.iso, source: 'hand', created_by: user && user.id };
          for (var kk in j.set) ins[kk] = j.set[kk];
          res = await tolerantWrite(ins, function (x) { return sb().from('manpower_loading').insert(x).select(); });
        }
        if (res.ok) done++; else failed++;
      }
      var pk = Object.keys(phases);
      for (var q = 0; q < pk.length; q++) {
        if (phaseOf(pk[q]) === phases[pk[q]]) continue;
        await setMonthFieldQuiet(pk[q], 'phase', phases[pk[q]]);
      }
      hideLoading();
      if (failed) UI.toast(done + ' written, ' + failed + ' failed.', 'error');
      else UI.toast(done + ' month group(s) imported.', 'ok');
      load();
    };
    fr.readAsArrayBuffer(file);
  }
  // Same write as setMonthField without the repaint — the import repaints once at the end.
  async function setMonthFieldQuiet(iso, col, v) {
    var cur = MONTHS[iso], patch = {};
    patch[col] = v;
    if (cur) { var r = await tolerantWrite(patch, function (x) { return sb().from('manpower_months').update(x).eq('id', cur.id); }); return r.ok; }
    var row = { project_id: pid, period: iso, created_by: user && user.id };
    row[col] = v;
    var r2 = await tolerantWrite(row, function (x) { return sb().from('manpower_months').insert(x).select(); });
    if (r2.ok && r2.data && r2.data[0]) MONTHS[iso] = r2.data[0];
    return r2.ok;
  }

  function syncFilters() {
    var d = document.getElementById('mp-f-dept');

      d.innerHTML = '<option value="">All departments</option>' +
        deptOptions().map(function (x) { return '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
      // ⚠️ A filter whose stored value has since been deleted must RESET, not silently narrow
      // the whole view to a department that no longer exists. A <select> whose value is not
      // among its options reports the first option instead — this app has lost a stored value
      // that way three times.
      if (cur && d.value !== cur) { fDept = ''; d.value = ''; }
    }
    var w = document.getElementById('mp-f-work'); if (w && w.value !== fWork) w.value = fWork;
    var sc = document.getElementById('mp-show-cost'); if (sc) sc.checked = showCost;
    var pm = document.getElementById('mp-p-month');
    if (pm && !pm.value && portAsOf) pm.value = portAsOf.getFullYear() + '-' + String(portAsOf.getMonth() + 1).padStart(2, '0');
  }
  function switchView(v, btn) {
    view = v;
    document.querySelectorAll('.mp-tab').forEach(function (b) { b.classList.toggle('active', b === btn); });
    ['loading', 'register', 'roster', 'portfolio'].forEach(function (k) {
      var el = document.getElementById('mp-view-' + k); if (el) el.style.display = (k === v ? 'block' : 'none');
    });
    // The add button means a different thing on each tab; on Portfolio it means nothing at
    // all, because that tab writes to no project.
    var add = document.getElementById('mp-add');
    if (add) add.style.display = (v === 'portfolio') ? 'none' : '';
    var drv = document.getElementById('mp-derive');
    if (drv) drv.style.display = (v === 'portfolio') ? 'none' : '';
    var seed = document.getElementById('mp-seed');
    if (seed) seed.style.display = (v === 'portfolio' || v === 'roster') ? 'none' : '';
    // ⚠️ The portfolio is NOT read automatically on the way in. It is the only view that
    // queries every project the user can open, and firing several hundred rows of read every
    // time somebody clicks a tab is a cost nobody asked for. The button says so.
  }

  // ---- Init -----------------------------------------------------------------------------
  async function init(u, prof) {
    user = u; profile = prof;
    UI.renderUserBar(prof);
    if (UI.initModuleTopbar) UI.initModuleTopbar();
    document.querySelectorAll('.mp-tab').forEach(function (b) { b.onclick = function () { switchView(b.dataset.view, b); }; });
    document.querySelectorAll('#mp-detail button').forEach(function (b) {
      b.onclick = function () {
        detail = b.dataset.det;
        document.querySelectorAll('#mp-detail button').forEach(function (x) { x.classList.toggle('active', x === b); });
        renderAll();
      };
    });
    document.querySelectorAll('#mp-mode button').forEach(function (b) {
      b.onclick = function () {
        mode = b.dataset.mode;
        document.querySelectorAll('#mp-mode button').forEach(function (x) { x.classList.toggle('active', x === b); });
        renderAll();
      };
    });
    document.getElementById('mp-f-work').onchange = function (e) { fWork = e.target.value; renderAll(); };
    document.getElementById('mp-f-dept').onchange = function (e) { fDept = e.target.value; renderAll(); };
    document.getElementById('mp-show-cost').onchange = function (e) { showCost = e.target.checked; renderAll(); };
    // The primary action adds a MANPOWER PROFILE everywhere. A position is the requirement and
    // is added from the Positions tab; the profile is the thing with a contract duration, and
    // it is what the day-to-day work of this module actually is.
    document.getElementById('mp-add').onclick = function () {
      if (!pid) { UI.toast('Pick a project first.', 'error'); return; }
      openRosterForm(null);
    };
    document.getElementById('mp-add-position').onclick = function () {
      if (!pid) { UI.toast('Pick a project first.', 'error'); return; }
      openForm(null);
    };
    document.getElementById('mp-derive').onclick = function () {
      if (!pid) { UI.toast('Pick a project first.', 'error'); return; }
      if (!POS.length) { UI.toast('Add or seed the positions first — a profile has to fill one.', 'error'); return; }
      if (!ROSTER.length) { UI.toast('No manpower profiles yet — use + Add manpower to record one.', 'error'); return; }
      openDerive();
    };
    document.getElementById('mp-add-person').onclick = function () {
      if (!pid) { UI.toast('Pick a project first.', 'error'); return; }
      openRosterForm(null);
    };
    document.getElementById('mp-seed').onclick = function () { if (!pid) { UI.toast('Pick a project first.', 'error'); return; } openSeed(); };
    document.getElementById('mp-refresh').onclick = function () { load(true); };
    document.getElementById('mp-export').onclick = exportXlsx;
    var fileIn = document.createElement('input');
    fileIn.type = 'file'; fileIn.accept = '.xlsx,.xls'; fileIn.style.display = 'none';
    document.body.appendChild(fileIn);
    fileIn.onchange = function () { if (fileIn.files && fileIn.files[0]) importXlsx(fileIn.files[0]); };
    document.getElementById('mp-import').onclick = function () {
      if (!pid) { UI.toast('Pick a project first.', 'error'); return; }
      if (!POS.length) { UI.toast('Add or seed the positions first — the import matches rows to positions that already exist.', 'error'); return; }
      fileIn.value = ''; fileIn.click();
    };
    document.getElementById('mp-r-search').oninput = function (e) { rSearch = e.target.value; renderRoster(); };
    document.getElementById('mp-r-work').onchange = function (e) { rWork = e.target.value; renderRoster(); };
    document.getElementById('mp-p-work').onchange = function (e) { portWork = e.target.value; if (PORT) loadPortfolio(); };
    document.getElementById('mp-p-month').onchange = function (e) {
      var v = e.target.value;
      var mm = /^(\d{4})-(\d{2})$/.exec(v || '');
      portAsOf = mm ? new Date(+mm[1], +mm[2] - 1, 1) : (CUTOFF || mFloor(new Date()));
      if (PORT) loadPortfolio();
    };
    document.getElementById('mp-p-run').onclick = function () { loadPortfolio(); };

    var sel = document.getElementById('mp-project');
    var projects = await PDb.getProjects();
    projects = projects.filter(function (p) { return AppAuth.canAccessProject(prof, p.id); });
    PROJECTS = projects;
    sel.innerHTML = projects.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name || p.id) + '</option>'; }).join('');
    var saved = sessionStorage.getItem('pd_project');
    if (saved && projects.some(function (p) { return p.id === saved; })) sel.value = saved;
    pid = sel.value || null;
    if (UI.enhanceProjectSelect) UI.enhanceProjectSelect(sel);
    sel.onchange = function () {
      pid = sel.value || null;
      try { sessionStorage.setItem('pd_project', pid || ''); } catch (_e) {}
      fDept = ''; rSearch = '';
      var rs = document.getElementById('mp-r-search'); if (rs) rs.value = '';
      load(true);
    };
    await load(true);
  }

  AppAuth.requireLogin(init);
})();
</script>
</body>
</html>
