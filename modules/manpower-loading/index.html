<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png" />
  <script src="../../assets/js/theme.js?v=20260812b"></script>
  <title>Manpower Loading · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260827a" />
  <style>
    /* Uniform sidebar-less chrome — same shell as Equipment Loading. */
    .pd-content { width:100%; }
    .pd-topbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px; }
    .pd-topbar #user-bar { margin-left:10px; padding-left:10px; border-left:1px solid var(--pd-line); flex:none; }
    .pd-topbar #pd-theme-toggle { width:34px; height:34px; padding:0; margin-left:4px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
    .mp-modback { width:36px; height:36px; padding:0; flex:none; display:inline-flex; align-items:center; justify-content:center; }
    .mp-title { flex:0 1 auto; min-width:0; display:flex; align-items:center; overflow:hidden; font-size:17px; margin:0; }
    .mp-title .mp-title-txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mp-title-ico { color:var(--pd-red); vertical-align:-3px; margin-right:6px; }
    .mp-projctx { display:flex; align-items:center; min-width:0; flex:0 1 auto; }
    .mp-project { max-width:230px; min-width:120px; height:34px; font-weight:600; font-size:13px; background:transparent; border-color:transparent; }
    .mp-project:hover, .mp-project:focus { background:var(--pd-card); border-color:var(--pd-line); }
    .mp-topbar-tools { display:flex; align-items:center; gap:6px; margin-left:auto; flex-wrap:wrap; }
    .mp-topbar-tools .pd-btn.mp-tb-labeled { height:34px; padding:0 12px; gap:6px; background:var(--pd-red); border-color:var(--pd-red); color:#fff; }
    .mp-topbar-tools .pd-btn.mp-tb-labeled:hover { filter:brightness(.94); }
    .mp-tb-sep { width:1px; align-self:stretch; margin:5px 3px; background:var(--pd-line); }
    @media (max-width:900px) { .mp-title-txt { display:none; } }

    .mp-tabs { display:flex; border-bottom:2px solid var(--pd-line); }
    .mp-tab { padding:8px 16px; cursor:pointer; font-weight:600; font-size:13px; color:var(--pd-muted);
      border:none; border-bottom:2px solid transparent; margin-bottom:-2px; background:none;
      display:inline-flex; align-items:center; gap:6px; }
    .mp-tab.active { color:var(--pd-red); border-bottom-color:var(--pd-red); }

    .mp-card { background:var(--pd-card); border:1px solid var(--pd-line); border-radius:var(--pd-radius);
      box-shadow:var(--pd-shadow); padding:14px 16px; margin-bottom:16px; }
    .mp-card > h3 { margin:0 0 10px; font-size:14px; }
    .mp-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .mp-kpi { background:var(--pd-card); border:1px solid var(--pd-line); border-radius:8px; padding:13px 16px; }
    .mp-kpi-v { font-size:22px; font-weight:800; line-height:1; }
    .mp-kpi-v.mp-bad { color:var(--pd-bad); }
    .mp-kpi-v.mp-good { color:var(--pd-ok); }
    .mp-kpi-l { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--pd-muted); margin-top:6px; }
    .mp-note { font-size:12px; color:var(--pd-muted); }
    .mp-warn { font-size:12.5px; color:#8A5300; background:#FFF0D9; border:1px solid #F0D9A8;
      border-radius:8px; padding:9px 12px; margin-bottom:14px; }
    .mp-empty { text-align:center; padding:40px; color:var(--pd-muted); }

    .mp-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px;
      background:var(--pd-card); border:1px solid var(--pd-line); border-radius:var(--pd-radius); padding:8px 12px; }
    .mp-controls .pd-select, .mp-controls .pd-input { height:34px; font-size:13px; max-width:230px; }
    .mp-filt-ico { color:var(--pd-muted); flex:none; }
    .mp-seg { display:inline-flex; border:1px solid var(--pd-line); border-radius:8px; overflow:hidden; }
    .mp-seg button { border:0; background:var(--pd-card); color:var(--pd-ink); padding:6px 13px;
      font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
    .mp-seg button + button { border-left:1px solid var(--pd-line); }
    .mp-seg button.active { background:var(--pd-red); color:#fff; }
    .mp-checks { display:inline-flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; }
    .mp-checks label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
    .mp-checks .sw { width:12px; height:12px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.14); }

    /* ---- Manpower curve ------------------------------------------------------------------
       The HRD "Manpower Curve" sheet: a grey PLANNED column per month with the ACTUAL in
       front of it, and the approved (B1) / forecast revisions drawn as LINES over the top —
       which is how the source sheet reads, and the only way four series fit a 48px month. */
    /* ⚠️ Bled out by the card's own 16px side padding. The matrix card is padding:0, so
       without this every column sits 16px right of its own matrix column. Same trap the
       equipment chart hit and measured. */
    .mp-chartwrap { overflow-x:auto; margin-left:-16px; margin-right:-16px; }
    .mp-chart { display:block; }
    .mp-legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:8px; font-size:12px; color:var(--pd-muted); }
    .mp-lg { display:inline-flex; align-items:center; gap:6px; }
    .mp-lg .sw { width:14px; height:14px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.12); }
    .mp-lg .ln { width:18px; height:0; border-top:2.5px solid currentColor; display:inline-block; }

    /* ---- Loading matrix ------------------------------------------------------------------
       ⚠️ table-layout:fixed and NO min-width:100%. With auto layout the browser widens every
       column to fill the pane and the chart above lines up with nothing — measured on the
       equipment matrix (label columns 211/118 against a declared 150/84). The three widths
       below are duplicated as MX_C1 / MX_C2 / MX_CELL in the script and CANNOT be read back
       at render time (the table may not be laid out on the first paint). Change one, change
       the other. */
    .mp-mxwrap { overflow:auto; max-height:70vh; }
    .mp-mx { border-collapse:collapse; font-size:12px; table-layout:fixed; width:max-content; }
    .mp-mx th, .mp-mx td { padding:5px 0; border-bottom:1px solid var(--pd-line); text-align:center; white-space:nowrap; }
    .mp-mx th:not(.mp-c1):not(.mp-c2), .mp-mx td:not(.mp-c1):not(.mp-c2) { width:48px; min-width:48px; max-width:48px; }
    .mp-mx thead th { position:sticky; top:0; z-index:2; background:var(--pd-bg); font-size:10.5px;
      text-transform:uppercase; letter-spacing:.03em; color:var(--pd-muted); }
    .mp-mx thead tr.mp-mx-yr th { font-weight:800; color:var(--pd-ink); border-bottom:1px solid var(--pd-line); }
    .mp-mx thead tr.mp-mx-mo th { border-bottom:2px solid var(--pd-line); }
    .mp-mx th.mp-c1, .mp-mx td.mp-c1 { position:sticky; left:0; z-index:1; text-align:left;
      background:var(--pd-card); font-weight:700; width:190px; min-width:190px; max-width:190px;
      padding-left:9px; padding-right:9px; overflow:hidden; text-overflow:ellipsis; }
    .mp-mx th.mp-c2, .mp-mx td.mp-c2 { position:sticky; left:190px; z-index:1; text-align:left;
      background:var(--pd-card); font-weight:600; color:var(--pd-muted); width:96px; min-width:96px; max-width:96px;
      padding-left:9px; padding-right:9px; font-size:11px; }
    .mp-mx thead th.mp-c1, .mp-mx thead th.mp-c2 { z-index:3; background:var(--pd-bg); }
    .mp-mx tr.mp-r-actual td:not(.mp-c1):not(.mp-c2) { background:var(--pd-red-light); }
    .mp-mx tr.mp-r-total td { font-weight:800; border-top:2px solid var(--pd-line); }
    .mp-mx tr.mp-r-total td.mp-c1, .mp-mx tr.mp-r-total td.mp-c2 { background:var(--pd-card); }
    .mp-mx tr.mp-r-grp td.mp-c1 { color:var(--pd-ink); }
    .mp-mx td.mp-out { background:var(--pd-bg); color:var(--pd-muted); }
    .mp-mx td.mp-neg { color:var(--pd-bad); font-weight:700; }
    .mp-mx td.mp-pos { color:var(--pd-ok); font-weight:700; }
    .mp-mx .mp-cut { box-shadow:inset 2px 0 0 var(--pd-red), inset -2px 0 0 var(--pd-red); }
    .mp-mx td.mp-edit { cursor:cell; }
    .mp-mx td.mp-edit:hover { outline:2px solid var(--pd-red); outline-offset:-2px; }
    .mp-mx td.mp-phase { font-size:10.5px; color:var(--pd-muted); overflow:hidden; text-overflow:ellipsis; }
    /* A month the contract-duration derivation wrote. Marked, never locked: a planner may
       correct a reported month, and taking the cell over is how they say so — the next derive
       then leaves it alone. Locking it would refuse an edit the data legitimately needs. */
    .mp-mx td.mp-derived { position:relative; }
    .mp-mx td.mp-derived::after { content:''; position:absolute; left:3px; top:3px; width:4px; height:4px;
      border-radius:50%; background:var(--pd-red); opacity:.55; }
    .mp-drift { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .mp-dur { display:block; margin-top:6px; font-size:12px; font-weight:700; color:var(--pd-ink); }
    .mp-dur small { display:block; font-weight:500; color:var(--pd-muted); margin-top:2px; }
    .mp-derivebox { border:1px solid var(--pd-line); border-radius:8px; padding:10px 12px; margin-top:4px; }
    .mp-derivebox ul { margin:6px 0 0; padding-left:18px; font-size:12.5px; color:var(--pd-muted); }
    .mp-linkrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .mp-mx input.mp-cellin { width:56px; height:24px; padding:0 4px; font:inherit; font-size:12px;
      text-align:center; border:1px solid var(--pd-red); border-radius:4px; background:var(--pd-card); color:var(--pd-ink); }
    .mp-mx input.mp-cellin.wide { width:80px; text-align:left; }
    .mp-mx td.mp-cost { font-size:11px; }

    /* ---- Tables (register / roster / portfolio) ------------------------------------------ */
    .mp-table { width:100%; border-collapse:collapse; font-size:13px; }
    .mp-table th { background:var(--pd-bg); padding:9px 12px; text-align:left; font-size:11px; font-weight:700;
      text-transform:uppercase; letter-spacing:.04em; color:var(--pd-muted); border-bottom:2px solid var(--pd-line); white-space:nowrap; }
    .mp-table th.num, .mp-table td.num { text-align:right; }
    .mp-table td { padding:8px 12px; border-bottom:1px solid var(--pd-line); vertical-align:top; }
    .mp-table tr:hover td { background:var(--pd-bg); }
    .mp-table tr.mp-grp td { background:var(--pd-bg); font-weight:800; font-size:11.5px;
      text-transform:uppercase; letter-spacing:.04em; color:var(--pd-ink); }
    .mp-badge { font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--pd-bg); display:inline-block; }
    .mp-badge.mp-skill { background:#EAF2FF; color:#2F6FBF; }
    /* ⚠️ NOT var(--pd-red) on var(--pd-red-light). That pairing measures 3.60:1 — the very
       number the equipment module's picked-icon button was fixed for — and this badge carries
       11px text, which needs 4.5:1. Darkened to 6.4:1. */
    .mp-badge.mp-vac { background:var(--pd-red-light); color:#A81F17; }
    .mp-badge.mp-fill { background:#E7F7EE; color:#1B7F4B; }
    /* ⚠️ The dark rules MUST restate the text colour, not only the tint. Darkening the
       background while leaving the light theme's ink measured 2.98:1 (skilled) and 2.86:1
       (filled) on an 11px badge — under the 4.5:1 that size needs. Same defect the equipment
       module's picked-icon button had at 3.60:1. Measured after: 6.7:1 and 8.1:1. */
    html.pd-dark .mp-badge.mp-skill { background:#16273D; color:#7FB0F0; }
    html.pd-dark .mp-badge.mp-fill { background:#12301F; color:#6FD79B; }
    html.pd-dark .mp-badge.mp-vac { color:#FF9A93; }
    .mp-actions { display:flex; gap:5px; }
    .mp-btn-sm { padding:3px 9px; font-size:11px; border-radius:5px; border:1px solid var(--pd-line);
      background:var(--pd-card); color:var(--pd-ink); cursor:pointer; }
    .mp-btn-sm:hover { border-color:var(--pd-red); color:var(--pd-red); }
    .mp-dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:-1px; }

    /* Fill bar — one glance per project in the portfolio table. */
    .mp-bar { position:relative; height:8px; border-radius:5px; background:var(--pd-line); overflow:hidden; min-width:70px; }
    .mp-bar > i { position:absolute; left:0; top:0; bottom:0; border-radius:5px; }
    .mp-sev { font-weight:800; }
    .mp-sev.crit { color:var(--pd-bad); }
    .mp-sev.warn { color:var(--pd-warn); }
    .mp-sev.ok   { color:var(--pd-ok); }

    /* Modal form */
    .mp-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; align-content:start; }
    .mp-form-full { grid-column:1 / -1; }
    .mp-form-sec { grid-column:1 / -1; font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.05em; color:var(--pd-red); margin:12px 0 -2px; padding-top:10px; border-top:1px solid var(--pd-line); }
    .mp-mon-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
    .mp-mon-tbl th { text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--pd-muted);
      padding:6px 8px; border-bottom:2px solid var(--pd-line); position:sticky; top:0; background:var(--pd-card); }
    .mp-mon-tbl td { padding:4px 8px; border-bottom:1px solid var(--pd-line); }
    .mp-mon-tbl input { width:72px; height:28px; padding:0 6px; font:inherit; font-size:12.5px;
      border:1px solid var(--pd-line); border-radius:5px; background:var(--pd-card); color:var(--pd-ink); }
    .mp-seedgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px 14px;
      max-height:320px; overflow:auto; padding:4px 2px; }
    .mp-seedgrid label { display:flex; align-items:center; gap:7px; font-size:12.5px; }
    .mp-seedgrid .dept { grid-column:1 / -1; font-size:10.5px; font-weight:800; text-transform:uppercase;
      letter-spacing:.05em; color:var(--pd-muted); margin-top:8px; }

    .mp-loading { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center;
      justify-content:center; gap:10px; color:#fff; font-size:14px; z-index:9999; }
    .mp-spin { width:22px; height:22px; border:3px solid rgba(255,255,255,.35); border-top-color:#fff;
      border-radius:50%; animation:mp-spin .8s linear infinite; }
    @keyframes mp-spin { to { transform:rotate(360deg); } }

    /* Below 700px the chart keeps a legible minimum width and scrolls rather than shrinking its
       labels to nothing — the rule every charting module here follows. */
    @media (max-width: 700px) {
      .mp-chart { min-width: 640px; }
      .mp-kpis { grid-template-columns: repeat(2, 1fr); gap:8px; }
      .mp-form-grid { grid-template-columns:1fr; }
      .mp-controls .pd-select, .mp-controls .pd-input { max-width:100%; }
      /* ⚠️ The shared CSS raises inputs and .pd-btn to 44px on a phone but knows nothing about
         these three. Measured at 20px (row actions), 30px (segments) and 33px (tabs) before —
         a row action you cannot reliably hit is a row action that is not there. */
      .mp-btn-sm { min-height:44px; padding:3px 12px; }
      .mp-seg button { min-height:44px; }
      .mp-tab { min-height:44px; }
    }
  </style>
</head>
<body>
<div class="pd-app">
  <div class="pd-content">
    <div class="pd-topbar">
      <a class="pd-btn mp-modback" href="../../modules.html" title="Back to modules"><span data-ico="arrowLeft" data-ico-size="18"></span></a>
      <h1 class="mp-title">
        <span class="mp-title-ico" data-ico="users" data-ico-size="20"></span>
        <span class="mp-title-txt">Manpower Loading</span>
      </h1>
      <div class="mp-projctx">
        <select class="pd-select mp-project" id="mp-project" title="Project"></select>
      </div>
      <div class="mp-tabs" role="tablist">
        <button class="mp-tab active" data-view="loading">Loading</button>
        <button class="mp-tab" data-view="register">Positions</button>
        <button class="mp-tab" data-view="roster">Roster</button>
        <button class="mp-tab" data-view="portfolio">Portfolio</button>
      </div>
      <div class="mp-topbar-tools">
        <button class="pd-btn pd-btn-primary mp-tb-labeled" id="mp-add" title="Add a manpower profile — a person or a budgeted slot, with its contract duration">+ Add manpower</button>
        <button class="pd-btn" id="mp-derive" title="Derive the monthly deployment from every profile's contract duration"><span data-ico="users" data-ico-size="16"></span></button>
        <button class="pd-btn" id="mp-seed" title="Seed the standard organisation chart">Seed</button>
        <span class="mp-tb-sep"></span>
        <button class="pd-btn" id="mp-import" title="Import a filled loading sheet"><span data-ico="upload" data-ico-size="16"></span></button>
        <button class="pd-btn" id="mp-export" title="Export to Excel"><span data-ico="download" data-ico-size="16"></span></button>
        <button class="pd-btn" id="mp-refresh" title="Refresh"><span data-ico="refresh" data-ico-size="16"></span></button>
      </div>
      <div id="user-bar"></div>
    </div>
    <div class="pd-main">
      <div id="mp-migrate" class="mp-warn" style="display:none;"></div>
      <div id="mp-drift" class="mp-warn mp-drift" style="display:none;"></div>

      <!-- LOADING -->
      <div id="mp-view-loading">
        <div class="mp-controls">
          <span class="mp-filt-ico" data-ico="filter" data-ico-size="15"></span>
          <label for="mp-f-work" style="font-size:12.5px;">Workforce</label>
          <select class="pd-select" id="mp-f-work">
            <option value="">Staff + Skilled</option>
            <option value="Staff">Staff only</option>
            <option value="Skilled">Skilled only</option>
          </select>
          <label for="mp-f-dept" style="font-size:12.5px;">Department</label>
          <select class="pd-select" id="mp-f-dept"><option value="">All departments</option></select>
          <span class="mp-seg" id="mp-detail">
            <button data-det="dept" class="active">By department</button>
            <button data-det="pos">By position</button>
          </span>
          <span class="mp-seg" id="mp-mode">
            <button data-mode="head" class="active">Headcount</button>
            <button data-mode="cost">Cost</button>
          </span>
          <span class="mp-note" id="mp-span-note" style="margin-left:auto;"></span>
        </div>
        <div class="mp-controls" style="margin-top:-8px;">
          <span class="mp-note" style="font-weight:700;">Series</span>
          <span class="mp-checks" id="mp-series"></span>
          <span class="mp-checks" style="margin-left:auto;">
            <label><input type="checkbox" id="mp-show-cost"> Show cost rows in the grid</label>
          </span>
        </div>
        <div class="mp-kpis" id="mp-kpis"></div>
        <div class="mp-card">
          <h3 id="mp-chart-title">Manpower Curve</h3>
          <div class="mp-chartwrap" id="mp-chart"></div>
          <div class="mp-legend" id="mp-chart-legend"></div>
        </div>
        <div class="mp-card" style="padding:0;overflow:hidden;">
          <div class="mp-mxwrap" id="mp-matrix"></div>
        </div>
      </div>

      <!-- POSITIONS -->
      <div id="mp-view-register" style="display:none;">
        <div class="mp-controls">
          <button class="pd-btn pd-btn-primary" id="mp-add-position" style="height:34px;">+ Add position</button>
          <span class="mp-tb-sep"></span>
          <span class="mp-note">A <b>position</b> is the requirement — how many heads the job needs. A <b>manpower profile</b> is the person or budgeted slot filling it, and its contract duration is what puts them on the project in a given month.</span>
        </div>
        <div class="mp-card" style="padding:0;overflow:auto;">
          <table class="mp-table" id="mp-reg"></table>
        </div>
      </div>

      <!-- ROSTER -->
      <div id="mp-view-roster" style="display:none;">
        <div class="mp-controls">
          <button class="pd-btn pd-btn-primary" id="mp-add-person" style="height:34px;">+ Add manpower profile</button>
          <span class="mp-tb-sep"></span>
          <label for="mp-r-search" style="font-size:12.5px;">Find</label>
          <input class="pd-input" id="mp-r-search" placeholder="name or position">
          <label for="mp-r-work" style="font-size:12.5px;">Workforce</label>
          <select class="pd-select" id="mp-r-work">
            <option value="">Staff + Skilled</option>
            <option value="Staff">Staff only</option>
            <option value="Skilled">Skilled only</option>
          </select>
          <span class="mp-note" id="mp-roster-note" style="margin-left:auto;"></span>
        </div>
        <div class="mp-kpis" id="mp-roster-kpis"></div>
        <div class="mp-card" style="padding:0;overflow:auto;">
          <table class="mp-table" id="mp-roster"></table>
        </div>
        <div class="mp-card">
          <h3>Demobilisation — heads coming off contract</h3>
          <div id="mp-demob"></div>
        </div>
      </div>

      <!-- PORTFOLIO -->
      <div id="mp-view-portfolio" style="display:none;">
        <div class="mp-controls">
          <span class="mp-filt-ico" data-ico="barChart" data-ico-size="15"></span>
          <label for="mp-p-month" style="font-size:12.5px;">As of</label>
          <input class="pd-input" id="mp-p-month" type="month" style="max-width:160px;">
          <label for="mp-p-work" style="font-size:12.5px;">Workforce</label>
          <select class="pd-select" id="mp-p-work">
            <option value="">Staff + Skilled</option>
            <option value="Staff">Staff only</option>
            <option value="Skilled">Skilled only</option>
          </select>
          <button class="pd-btn" id="mp-p-run" style="height:34px;"><span data-ico="refresh" data-ico-size="15"></span> Read every project</button>
          <span class="mp-note" id="mp-p-note" style="margin-left:auto;"></span>
        </div>
        <div class="mp-kpis" id="mp-p-kpis"></div>
        <div class="mp-card" style="padding:0;overflow:auto;">
          <table class="mp-table" id="mp-p-tbl"></table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="mp-loading" id="mp-loading" style="display:none;"><div class="mp-spin"></div><span id="mp-loading-msg">Loading…</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../../assets/js/config.js?v=20260828b"></script>
<script src="../../assets/js/auth.js?v=20260814a"></script>
<script src="../../assets/js/db.js?v=20260827c"></script>
<script src="../../assets/js/program.js?v=20260827a"></script>
<script src="../../assets/js/ui.js?v=20260824a"></script>
<script src="../../assets/js/icons.js?v=20260813a"></script>
<script>
// ============================================================================
// Manpower Loading (per project) — the HRD Manpower Report as a live module.
//
// The register says WHAT POSITIONS the project needs; manpower_loading says how
// many heads of each are planned / approved / forecast / actually deployed each
// MONTH; the roster says WHO is filling them and when their contract ends.
//
// ⚠️ The month axis is TIED TO THE PROJECT SCHEDULE, not typed here — same rule
// as Equipment Loading. It runs from the earliest activity start to the latest
// finish, WBS-Summary rows excluded (they carry stale imported dates that
// nothing recomputes; one was 337 days out, which would stretch the axis by a
// year). The note under the controls always says which source the axis came from.
//
// ⚠️ FOUR series, and which one GOVERNS is a rule, not a preference:
// requirement = approved (B1) if the month has one, else planned (B0). Forecast
// is "for approval" and deliberately never governs — reporting an unapproved
// number as the requirement is how a project reads as fully staffed against a
// plan nobody signed.
//
// ⚠️ Actuals after the cut-off month are left BLANK, not zero. "Not reported"
// and "nobody on site" are different facts, and drawing them the same makes
// every future month read as a shortfall.
// ============================================================================
(function () {
  var user = null, profile = null, pid = null;
  var PROJECTS = [];              // projects this user can open
  var POS = [];                   // manpower_positions for this project
  var LOAD = {};                  // position_id -> { 'YYYY-MM-01': row }
  var ROSTER = [];                // manpower_roster for this project
  var MONTHS = {};                // 'YYYY-MM-01' -> manpower_months row (phase + costs)
  var SPAN = null;                // { start, end, months[], source }
  var CUTOFF = null;              // data date, month-floored
  var needsMigration = false;
  var view = 'loading', detail = 'dept', mode = 'head';
  var fWork = '', fDept = '', rWork = '', rSearch = '';
  var showCost = false;
  var DERIVE_KEY = 'actual';      // which series the contract-duration derivation owns
  var PORT = null;                // portfolio rows, once read
  var portAsOf = null;            // Date, month-floored
  var portWork = '';
  var portReading = false;

  // The four bands of the source sheet. `col` is the headcount column, `cost` the
  // project-month cost column that pairs with it.
  var SERIES = [
    { k: 'planned',  col: 'planned_qty',  cost: 'planned_cost',  label: 'Planned (B0)',  short: 'Planned',  color: '#9A9A9A', draw: 'bar'  },
    { k: 'approved', col: 'approved_qty', cost: 'approved_cost', label: 'Approved (B1)', short: 'Approved', color: '#2F6FBF', draw: 'line' },
    { k: 'forecast', col: 'forecast_qty', cost: 'forecast_cost', label: 'Forecast',      short: 'Forecast', color: '#F59E0B', draw: 'dash' },
    { k: 'actual',   col: 'actual_qty',   cost: 'actual_cost',   label: 'Actual',        short: 'Actual',   color: '#EE3124', draw: 'bar'  }
  ];
  var SER_BY_K = {}; SERIES.forEach(function (s) { SER_BY_K[s.k] = s; });
  // Planned + Actual on by default: they are what a monthly report is read for, and four
  // bands per position turns the grid into something nobody scrolls.
  var shown = { planned: true, approved: false, forecast: false, actual: true };

  var WORKFORCES = ['Staff', 'Skilled'];
  var RANKS = ['Managerial', 'Supervisory', 'Rank & File', 'Skilled', 'Helper'];
  var EMP_STATUS = ['Full-time', 'Part-time', 'Project-based', 'Agency'];
  var ALLOCATIONS = ['FULL-TIME', 'SHARED'];
  // A name that means "this slot is not filled yet". The masterlist really does carry these
  // as rows, and counting them as people is how a project reports itself fully staffed.
  var TBH_RE = /^\s*(tbh|tba|tbd|vacant|vacancy|open|for hiring|unfilled|n\/?a|-{1,2})\s*$/i;

  // ⚠️ The chart's left pad IS the matrix's two label columns and its bar pitch IS the
  // matrix's month-cell width, so a column sits directly over the month it reports. These
  // three numbers are duplicated in the CSS above and cannot be derived from it at render
  // time — the table may not be laid out on the first paint.
  var MX_C1 = 190, MX_C2 = 96, MX_CELL = 48;

  var MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---- The standard organisation chart --------------------------------------------------
  // Read off the HRD reference report (QHL706 Manpower Report - Staff v4). Every project
  // starts from the same table of organisation, so typing 26 rows by hand on every new job
  // is work the module can simply not ask for. It is a SEED, not a schema: the departments
  // and titles are ordinary editable text once they land.
  var STAFF_SEED = [
    ['OFFICE',            [['Area Manager', 'Managerial'], ['Project Manager', 'Managerial']]],
    ['PLANNING',          [['Planning Engineer', 'Rank & File']]],
    ['COMMERCIAL',        [['Office Manager', 'Supervisory'], ['QS Engineer', 'Rank & File'], ['Accounting Assistant', 'Rank & File'], ['Documentation Assistant', 'Rank & File'], ['Warehouseman', 'Rank & File']]],
    ['TECHNICAL',         [['Technical Officer', 'Supervisory'], ['Design Architect', 'Rank & File'], ['MEPF Design Engineer', 'Rank & File']]],
    ['STRUCTURAL',        [['Construction Manager', 'Managerial'], ['Project Superintendent', 'Supervisory'], ['Field Engineer', 'Rank & File']]],
    ['LINE & GRADE',      [['Survey Engineer', 'Rank & File'], ['Assistant Surveyor', 'Rank & File'], ['Survey Aide', 'Rank & File']]],
    ['QUALITY ASSURANCE', [['QA/QC Supervisor', 'Supervisory'], ['QA/QC Engineer', 'Rank & File']]],
    ['ARCHITECTURAL',     [['Finishing Supervisor', 'Supervisory'], ['Finishing Architect / Engineer', 'Rank & File']]],
    ['MEPF',              [['MEPF Supervisor', 'Supervisory'], ['MEPF Engineer', 'Rank & File']]],
    ['SAFETY',            [['Safety Advisor', 'Supervisory'], ['Safety Officer', 'Rank & File'], ['Project Nurse', 'Rank & File']]],
    ['HR',                [['HR Assistant', 'Rank & File']]]
  ];
  // ⚠️ PROVISIONAL. The skilled-worker reference report has not been supplied yet; these
  // trades are the ones the staff report's own demobilisation summary names (carpenter,
  // foreman, steelman, painter, sealant applicator, tilesetter, site driver) plus the usual
  // rest of a building job. The seed dialog says so, so nobody mistakes it for the official
  // trade list. Replace this array when the real report arrives.
  var SKILLED_SEED = [
    ['SUPERVISION',   [['Foreman', 'Supervisory'], ['Leadman', 'Supervisory']]],
    ['STRUCTURAL',    [['Steelman', 'Skilled'], ['Carpenter', 'Skilled'], ['Mason', 'Skilled'], ['Scaffolder', 'Skilled'], ['Welder', 'Skilled']]],
    ['ARCHITECTURAL', [['Tilesetter', 'Skilled'], ['Painter', 'Skilled'], ['Sealant Applicator', 'Skilled'], ['Plasterer', 'Skilled'], ['Drywall Installer', 'Skilled']]],
    ['MEPF',          [['Electrician', 'Skilled'], ['Plumber', 'Skilled'], ['Pipefitter', 'Skilled'], ['Tinsmith', 'Skilled']]],
    ['SUPPORT',       [['Heavy Equipment Operator', 'Skilled'], ['Rigger', 'Skilled'], ['Site Driver', 'Skilled'], ['Helper / Laborer', 'Helper']]]
  ];

  function sb() { return AppAuth.getSB(); }
  function esc(s) { return Fmt.esc(s == null ? '' : String(s)); }
  function showLoading(m) { var e = document.getElementById('mp-loading'); var t = document.getElementById('mp-loading-msg'); if (t) t.textContent = m || 'Loading…'; if (e) e.style.display = 'flex'; }
  function hideLoading() { var e = document.getElementById('mp-loading'); if (e) e.style.display = 'none'; }
  function num(v) { if (v == null || v === '') return null; var n = +v; return isFinite(n) ? n : null; }
  function fnum(n) { return (n == null || !isFinite(n)) ? '' : (Math.round(n * 100) / 100).toLocaleString(); }
  function pd_(v) { if (!v) return null; var m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function mFloor(d) { return d ? new Date(d.getFullYear(), d.getMonth(), 1) : null; }
  function mkey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }
  function monLabel(d) { return MON3[d.getMonth()] + ' ' + d.getFullYear(); }
  function moneyShort(v) {
    if (v == null || !isFinite(v)) return '—';
    if (Fmt.moneyShort) return Fmt.moneyShort(v);
    return Fmt.money ? Fmt.money(v) : String(Math.round(v));
  }

  // ---- Month axis, from the project schedule --------------------------------------------
  // ⚠️ Two tiny indexed reads, not a paged scan: a project has up to 40k activities and a
  // plain read is capped at 1000 rows anyway, so asking the server for the first and last
  // date is both correct and cheap. Falls back to the cached rollup on `projects`, then to a
  // 12-month window around today — and the note under the controls always says which.
  async function loadSpan() {
    var s = null, e = null, src = 'the project schedule';
    try {
      var a = await sb().from('project_schedule').select('start_date')
        .eq('project_id', pid).neq('activity_type', 'WBS Summary')
        .not('start_date', 'is', null).order('start_date', { ascending: true }).limit(1);
      var b = await sb().from('project_schedule').select('end_date')
        .eq('project_id', pid).neq('activity_type', 'WBS Summary')
        .not('end_date', 'is', null).order('end_date', { ascending: false }).limit(1);
      if (!a.error && a.data && a.data[0]) s = pd_(a.data[0].start_date);
      if (!b.error && b.data && b.data[0]) e = pd_(b.data[0].end_date);
    } catch (_e) {}
    if (!s || !e) {
      var p = PROJECTS.filter(function (x) { return x.id === pid; })[0];
      if (p && p.schedule_start && p.schedule_finish) { s = pd_(p.schedule_start); e = pd_(p.schedule_finish); src = 'the project record'; }
    }
    if (!s || !e) {
      var t = new Date(); s = new Date(t.getFullYear(), t.getMonth() - 3, 1); e = new Date(t.getFullYear(), t.getMonth() + 9, 1);
      src = 'a default window — this project has no schedule yet';
    }
    if (e < s) e = s;
    var months = [], c = mFloor(s), stop = mFloor(e), guard = 0;
    while (c <= stop && guard++ < 600) { months.push({ d: new Date(c), iso: mkey(c) }); c = new Date(c.getFullYear(), c.getMonth() + 1, 1); }
    SPAN = { start: mFloor(s), end: stop, months: months, source: src };
  }

  // The data date is the Project Schedule's, shared through the same per-project key Cash
  // Flow and Equipment Loading already read — so "as of" means the same date everywhere.
  function loadCutoff() {
    var v = null;
    try { v = localStorage.getItem('ps_datadate_' + pid); } catch (_e) {}
    CUTOFF = mFloor(pd_(v) || new Date());
  }

  // ---- Data -----------------------------------------------------------------------------
  async function load(reset) {
    if (!pid) { POS = []; LOAD = {}; ROSTER = []; MONTHS = {}; await loadSpan(); renderAll(); return; }
    if (reset) showLoading('Loading manpower…');
    needsMigration = false;
    try {
      POS = await PDb.selectAll('manpower_positions', function (q) { return q.eq('project_id', pid); });
      sortPositions();
      var rows = await PDb.selectAll('manpower_loading', function (q) { return q.eq('project_id', pid); });
      LOAD = {};
      rows.forEach(function (r) { (LOAD[r.position_id] = LOAD[r.position_id] || {})[String(r.period).slice(0, 10)] = r; });
      ROSTER = await PDb.selectAll('manpower_roster', function (q) { return q.eq('project_id', pid); });
      ROSTER.sort(function (a, b) { return String(a.employee_name || '').localeCompare(String(b.employee_name || '')); });
      var mm = await PDb.selectAll('manpower_months', function (q) { return q.eq('project_id', pid); });
      MONTHS = {};
      mm.forEach(function (r) { MONTHS[String(r.period).slice(0, 10)] = r; });
    } catch (err) {
      // A missing table means the migration has not been run. Name the file and keep the
      // module usable (empty) rather than throwing a raw PostgREST message at the planner.
      if (/manpower_positions|manpower_loading|manpower_roster|manpower_months|schema cache/i.test(err.message || '')) {
        needsMigration = true; POS = []; LOAD = {}; ROSTER = []; MONTHS = {};
      } else { UI.toast('Could not load manpower: ' + (err.message || err), 'error'); }
    }
    await loadSpan();
    loadCutoff();
    deriveKeyLoad();
    if (!portAsOf) portAsOf = CUTOFF;
    hideLoading();
    renderAll();
  }

  // Departments in the seed's own order first (that IS the org chart's order), then anything
  // the project has invented, alphabetically. Sorting departments alphabetically would put
  // HR above the Project Manager on every printout.
  function deptRank(d) {
    var i = STAFF_SEED.findIndex(function (x) { return x[0] === d; });
    if (i >= 0) return i;
    var j = SKILLED_SEED.findIndex(function (x) { return x[0] === d; });
    return j >= 0 ? 100 + j : 900;
  }
  function sortPositions() {
    POS.sort(function (a, b) {
      var aw = WORKFORCES.indexOf(a.workforce), bw = WORKFORCES.indexOf(b.workforce);
      if (aw < 0) aw = 9; if (bw < 0) bw = 9;
      if (aw !== bw) return aw - bw;
      var ad = deptRank(a.department), bd = deptRank(b.department);
      if (ad !== bd) return ad - bd;
      if (ad === 900 && a.department !== b.department) return String(a.department || '').localeCompare(String(b.department || ''));
      if ((a.sort_order || 0) !== (b.sort_order || 0)) return (a.sort_order || 0) - (b.sort_order || 0);
      return String(a.position_title || '').localeCompare(String(b.position_title || ''));
    });
  }

  // ⚠️ A save must not be all-or-nothing when a column is missing. PostgREST answers an
  // unmigrated column with PGRST204 and REJECTS THE WHOLE ROW — which on the equipment
  // module lost every field a planner had just typed. This drops the column PostgREST named,
  // retries, and reports which fields were not stored plus the file to run.
  // ⚠️ Deliberately only for a MISSING COLUMN: a constraint violation, an RLS refusal or a
  // bad value must still fail loudly, or a save would silently discard real data.
  var MP_MIGRATION = 'migrations/2026-08-27-manpower-loading.sql';
  function missingColumn(err) {
    var m = /Could not find the '([^']+)' column/i.exec((err && err.message) || '');
    return m ? m[1] : null;
  }
  async function tolerantWrite(payload, run) {
    var p = {}, k;
    for (k in payload) if (Object.prototype.hasOwnProperty.call(payload, k)) p[k] = payload[k];
    var dropped = [];
    for (var attempt = 0; attempt < 12; attempt++) {
      var res = await run(p);
      if (!res || !res.error) return { ok: true, data: res && res.data, dropped: dropped };
      var col = missingColumn(res.error);
      if (!col || !(col in p)) return { ok: false, error: res.error, dropped: dropped };
      delete p[col];
      dropped.push(col);
    }
    return { ok: false, error: new Error('too many missing columns'), dropped: dropped };
  }
  var mpPendingMig = false;
  function reportDropped(dropped) {
    if (!dropped || !dropped.length) return;
    mpPendingMig = true;
    renderMigrateBanner();
    UI.toast('Saved, but ' + dropped.length + ' field(s) were not stored (' + dropped.join(', ') +
      ') — run ' + MP_MIGRATION + ' in the Supabase SQL editor.', 'error');
  }
  async function persist(job, msg) {
    try { var r = await job; if (r && r.error) throw r.error; return true; }
    catch (err) { UI.toast((msg || 'Save failed') + ': ' + (err.message || err), 'error'); return false; }
  }

  // ---- Reading a month ------------------------------------------------------------------
  function rowOf(p, iso) { return (LOAD[p.id] || {})[iso] || null; }
  function qtyOf(p, iso, k) { var r = rowOf(p, iso); return r ? num(r[SER_BY_K[k].col]) : null; }
  // ⚠️ THE GOVERNING REQUIREMENT, and it is computed PER POSITION before it is summed.
  // Summing approved and planned separately and then picking one would under-report a
  // project where some lines are revised and others are not — which is every project
  // mid-revision.
  function govOf(p, iso) {
    var r = rowOf(p, iso); if (!r) return null;
    var a = num(r.approved_qty); if (a != null) return a;
    return num(r.planned_qty);
  }
  function visiblePositions() {
    return POS.filter(function (p) {
      if (fWork && p.workforce !== fWork) return false;
      if (fDept && p.department !== fDept) return false;
      return true;
    });
  }
  function deptOptions() {
    var seen = {}, out = [];
    POS.forEach(function (p) {
      var d = (p.department || '').trim(); if (!d || seen[d]) return; seen[d] = 1; out.push(d);
    });
    out.sort(function (a, b) { return deptRank(a) - deptRank(b) || a.localeCompare(b); });
    return out;
  }

  function blankCell() {
    return { planned: 0, approved: 0, forecast: 0, actual: 0, gov: 0,
             has: { planned: false, approved: false, forecast: false, actual: false, gov: false },
             cost: { planned: 0, approved: 0, forecast: 0, actual: 0, gov: 0 },
             costHas: { planned: false, approved: false, forecast: false, actual: false, gov: false } };
  }
  // One pass over (positions × months) producing every series the chart, the grid, the KPIs
  // and the export need — so no two of them can disagree about a month's total.
  function aggregate() {
    var items = visiblePositions(), months = SPAN.months;
    var byDept = {}, depts = [], total = {};
    months.forEach(function (m) { total[m.iso] = blankCell(); });
    items.forEach(function (p) {
      var d = (p.department || '—');
      if (!byDept[d]) { byDept[d] = {}; depts.push(d); months.forEach(function (m) { byDept[d][m.iso] = blankCell(); }); }
      var rate = num(p.monthly_rate);
      months.forEach(function (m) {
        var dc = byDept[d][m.iso], tc = total[m.iso];
        SERIES.forEach(function (s) {
          var v = qtyOf(p, m.iso, s.k);
          if (v == null) return;
          dc[s.k] += v; dc.has[s.k] = true; tc[s.k] += v; tc.has[s.k] = true;
          if (rate != null) { dc.cost[s.k] += rate * v; dc.costHas[s.k] = true; tc.cost[s.k] += rate * v; tc.costHas[s.k] = true; }
        });
        var g = govOf(p, m.iso);
        if (g != null) {
          dc.gov += g; dc.has.gov = true; tc.gov += g; tc.has.gov = true;
          if (rate != null) { dc.cost.gov += rate * g; dc.costHas.gov = true; tc.cost.gov += rate * g; tc.costHas.gov = true; }
        }
      });
    });
    depts.sort(function (a, b) { return deptRank(a) - deptRank(b) || a.localeCompare(b); });
    return { items: items, depts: depts, byDept: byDept, total: total };
  }

  // A month's cost for one series. Typed payroll wins; otherwise rate × headcount, and the
  // caller is told which so the screen can say so rather than implying a figure came off a
  // payslip when it came off a rate card.
  // ⚠️ A TYPED cost is for the WHOLE PROJECT — it cannot be narrowed by the department or
  // workforce filter, so while a filter is on the derived figure is used instead. Showing a
  // project-wide payroll total against one department's headcount is the kind of number that
  // ends up in a report.
  function filtered() { return !!(fWork || fDept); }
  function costOf(ag, iso, k) {
    if (!filtered()) {
      var mr = MONTHS[iso];
      var typed = mr ? num(mr[SER_BY_K[k] ? SER_BY_K[k].cost : (k + '_cost')]) : null;
      if (typed != null) return { v: typed, derived: false };
    }
    var c = ag.total[iso];
    if (c && c.costHas[k]) return { v: c.cost[k], derived: true };
    return { v: null, derived: true };
  }
  function anyTypedCost() {
    for (var k in MONTHS) if (Object.prototype.hasOwnProperty.call(MONTHS, k)) {
      var r = MONTHS[k];
      if (num(r.planned_cost) != null || num(r.approved_cost) != null || num(r.forecast_cost) != null || num(r.actual_cost) != null) return true;
    }
    return false;
  }
  function phaseOf(iso) { var r = MONTHS[iso]; return r ? (r.phase || '') : ''; }

  // ---- KPIs -----------------------------------------------------------------------------
  function renderKpis(ag) {
    var host = document.getElementById('mp-kpis'); if (!host) return;
    var cutIso = CUTOFF ? mkey(CUTOFF) : null;
    var t = cutIso && ag.total[cutIso] ? ag.total[cutIso] : null;
    var req = t && t.has.gov ? t.gov : null;
    var act = t && t.has.actual ? t.actual : null;
    var gap = (req != null && act != null) ? (act - req) : null;
    var fill = (req && act != null) ? (act / req) : null;
    var peak = 0, peakM = '';
    SPAN.months.forEach(function (m) { var x = ag.total[m.iso]; if (x.has.gov && x.gov > peak) { peak = x.gov; peakM = MON3[m.d.getMonth()] + ' ' + String(m.d.getFullYear()).slice(2); } });
    var vac = vacancyNow(ag);
    function k(v, l, cls) { return '<div class="mp-kpi"><div class="mp-kpi-v' + (cls ? ' ' + cls : '') + '">' + v + '</div><div class="mp-kpi-l">' + l + '</div></div>'; }
    host.innerHTML =
      k(ag.items.length, 'Position lines') +
      k(req == null ? '—' : fnum(req), 'Requirement this month') +
      k(act == null ? '—' : fnum(act), 'Actual this month') +
      k(gap == null ? '—' : (gap > 0 ? '+' : '') + fnum(gap), 'Variance vs requirement', gap != null && gap < 0 ? 'mp-bad' : (gap != null && gap > 0 ? 'mp-good' : '')) +
      k(fill == null ? '—' : Math.round(fill * 100) + '%', 'Fill rate', fill != null && fill < 0.85 ? 'mp-bad' : '') +
      k(peak ? fnum(peak) : '—', 'Peak requirement' + (peakM ? ' · ' + peakM : '')) +
      k(vac == null ? '—' : fnum(vac), 'Unfilled slots (roster)', vac ? 'mp-bad' : '');
    var note = document.getElementById('mp-span-note');
    if (note) {
      note.textContent = SPAN.months.length + ' months (' + monLabel(SPAN.start) + ' – ' + monLabel(SPAN.end) +
        ') from ' + SPAN.source + (CUTOFF ? ' · cut-off ' + monLabel(CUTOFF) : '');
    }
  }
  // Requirement at the cut-off minus the people actually on the roster for it. Returns null
  // when there is no roster at all — a project that has not typed one has an UNKNOWN number
  // of vacancies, not zero.
  function filledCount(posId, atIso) {
    var n = 0;
    ROSTER.forEach(function (r) {
      if (String(r.position_id) !== String(posId)) return;
      if (TBH_RE.test(r.employee_name || '')) return;
      if (atIso && r.contract_end) { var e = mFloor(pd_(r.contract_end)); if (e && mkey(e) < atIso) return; }
      if (atIso && r.contract_start) { var s = mFloor(pd_(r.contract_start)); if (s && mkey(s) > atIso) return; }
      n++;
    });
    return n;
  }
  function vacancyNow(ag) {
    if (!ROSTER.length) return null;
    var cutIso = CUTOFF ? mkey(CUTOFF) : null;
    var items = ag.items, total = 0, any = false;
    items.forEach(function (p) {
      var req = cutIso ? govOf(p, cutIso) : null;
      if (req == null) return;
      any = true;
      total += Math.max(0, req - filledCount(p.id, cutIso));
    });
    return any ? total : null;
  }

  // ---- Chart ----------------------------------------------------------------------------
  // ⚠️ Bars for Planned and Actual, LINES for Approved and Forecast — which is how the source
  // sheet reads it, and the only arrangement in which four series fit a 48px month column
  // without one hiding another.
  function renderChart(ag) {
    var host = document.getElementById('mp-chart'); if (!host) return;
    var months = SPAN.months;
    if (!months.length || !ag.items.length) {
      host.innerHTML = '<div class="mp-empty">' + (ag.items.length ? 'No months in the project schedule yet.'
        : 'No positions yet — use <b>Seed</b> to drop in the standard organisation chart, or <b>+ Add position</b>.') + '</div>';
      renderChartLegend();
      return;
    }
    var padL = MX_C1 + MX_C2, padR = 12, padT = 26, padB = 46;
    var bw = MX_CELL;
    var W = padL + padR + months.length * bw, H = 330;
    var ph = H - padT - padB;
    var costMode = (mode === 'cost');

    // Values to plot, per series, per month. In cost mode these are ACCUMULATED costs — the
    // sheet's "ACCM." rows — because a monthly cost column and a headcount column on the same
    // axis is two different quantities sharing a scale.
    var val = {}, running = {};
    SERIES.forEach(function (s) { val[s.k] = {}; running[s.k] = 0; });
    months.forEach(function (m) {
      SERIES.forEach(function (s) {
        if (costMode) {
          var c = costOf(ag, m.iso, s.k);
          if (c.v != null) running[s.k] += c.v;
          // ⚠️ A running total is only meaningful once the series has started; before its
          // first reported month it is left null rather than drawn flat along zero.
          val[s.k][m.iso] = (running[s.k] === 0 && c.v == null) ? null : running[s.k];
        } else {
          var cell = ag.total[m.iso];
          val[s.k][m.iso] = cell.has[s.k] ? cell[s.k] : null;
        }
      });
    });

    var max = 0;
    months.forEach(function (m) {
      SERIES.forEach(function (s) {
        if (!shown[s.k]) return;
        var v = val[s.k][m.iso];
        // Actuals past the cut-off are not reported; they must not set the scale.
        if (v != null && !(s.k === 'actual' && CUTOFF && m.iso > mkey(CUTOFF))) max = Math.max(max, v);
      });
    });
    if (max <= 0) max = 1;
    var step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    var y = function (v) { return padT + ph - (v / top) * ph; };
    var s = [];
    for (var g = 0; g <= top + 1e-9; g += step) {
      s.push('<line x1="' + padL + '" y1="' + y(g).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y(g).toFixed(1) + '" stroke="var(--pd-line)" stroke-dasharray="3 3"/>');
      s.push('<text x="' + (padL - 6) + '" y="' + (y(g) + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="var(--pd-muted)">' + (costMode ? moneyShort(g) : g) + '</text>');
    }
    var cutIso = CUTOFF ? mkey(CUTOFF) : null;
    months.forEach(function (m, i) {
      var x = padL + i * bw, cx = x + bw / 2;
      if (cutIso && m.iso === cutIso) s.push('<rect x="' + x + '" y="' + padT + '" width="' + bw + '" height="' + ph + '" fill="rgba(22,163,74,.18)"/>');
      if (!costMode) {
        var pbw = Math.max(6, bw * 0.56), abw = Math.max(5, bw * 0.34);
        var pv = shown.planned ? val.planned[m.iso] : null;
        if (pv != null && pv > 0) {
          s.push('<rect x="' + (cx - pbw / 2).toFixed(1) + '" y="' + y(pv).toFixed(1) + '" width="' + pbw.toFixed(1) +
            '" height="' + (padT + ph - y(pv)).toFixed(1) + '" fill="#9A9A9A" rx="1"/>');
        }
        var av = shown.actual ? val.actual[m.iso] : null;
        var futureA = cutIso && m.iso > cutIso;
        if (av != null && av > 0 && !futureA) {
          s.push('<rect x="' + (cx - abw / 2 + pbw * 0.10).toFixed(1) + '" y="' + y(av).toFixed(1) + '" width="' + abw.toFixed(1) +
            '" height="' + (padT + ph - y(av)).toFixed(1) + '" fill="#EE3124" rx="1"/>');
          s.push('<text x="' + cx.toFixed(1) + '" y="' + (y(av) - 5).toFixed(1) + '" text-anchor="middle" font-size="10" font-weight="700" fill="var(--pd-ink)">' + fnum(av) + '</text>');
        }
        if (shown.planned && pv != null) s.push('<text x="' + cx.toFixed(1) + '" y="' + (padT + ph + 13) + '" text-anchor="middle" font-size="9.5" fill="var(--pd-muted)">' + fnum(pv) + '</text>');
      }
      s.push('<text x="' + cx.toFixed(1) + '" y="' + (padT + ph + 27) + '" text-anchor="middle" font-size="9.5" fill="var(--pd-muted)">' + MON3[m.d.getMonth()] + '</text>');
      if (m.d.getMonth() === 0 || i === 0) s.push('<text x="' + cx.toFixed(1) + '" y="' + (padT + ph + 39) + '" text-anchor="middle" font-size="9" font-weight="700" fill="var(--pd-ink)">' + m.d.getFullYear() + '</text>');
    });

    // Lines. In cost mode EVERY shown series is a line (they are accumulations); in headcount
    // mode only the two revision series are, because bars already carry plan and actual.
    SERIES.forEach(function (ser) {
      if (!shown[ser.k]) return;
      if (!costMode && ser.draw === 'bar') return;
      var pts = [], dots = [];
      months.forEach(function (m, i) {
        var v = val[ser.k][m.iso];
        if (v == null) return;
        if (ser.k === 'actual' && cutIso && m.iso > cutIso) return;   // not reported yet
        var cx = padL + i * bw + bw / 2;
        pts.push(cx.toFixed(1) + ',' + y(v).toFixed(1));
        dots.push('<circle cx="' + cx.toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.6" fill="' + ser.color + '"/>');
      });
      if (pts.length > 1) {
        s.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + ser.color + '" stroke-width="2.2"' +
          (ser.draw === 'dash' ? ' stroke-dasharray="6 4"' : '') + ' stroke-linejoin="round"/>');
      }
      s.push(dots.join(''));
    });
    s.push('<line x1="' + padL + '" y1="' + (padT + ph) + '" x2="' + (W - padR) + '" y2="' + (padT + ph) + '" stroke="var(--pd-line)"/>');
    host.innerHTML = '<svg class="mp-chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" role="img" aria-label="Manpower curve per month">' + s.join('') + '</svg>';

    var title = document.getElementById('mp-chart-title');
    if (title) title.textContent = costMode ? 'Manpower Cost Curve (accumulated)' : 'Manpower Curve';
    renderChartLegend();
    syncScrollers();
  }
  function renderChartLegend() {
    var el = document.getElementById('mp-chart-legend'); if (!el) return;
    var costMode = (mode === 'cost');
    var parts = SERIES.filter(function (s) { return shown[s.k]; }).map(function (s) {
      var asBar = !costMode && s.draw === 'bar';
      return '<span class="mp-lg" style="color:' + s.color + '">' +
        (asBar ? '<span class="sw" style="background:' + s.color + '"></span>'
               : '<span class="ln"' + (s.draw === 'dash' ? ' style="border-top-style:dashed"' : '') + '></span>') +
        '<span style="color:var(--pd-muted)">' + esc(s.label) + '</span></span>';
    });
    parts.push('<span class="mp-lg"><span class="sw" style="background:rgba(22,163,74,.35);"></span>Cut-off month</span>');
    if (costMode) {
      parts.push('<span class="mp-lg">' + (anyTypedCost() && !filtered()
        ? 'Costs typed per month where available, otherwise rate × headcount.'
        : 'Costs derived as monthly rate × headcount' + (filtered() ? ' (a typed project cost cannot be split by this filter).' : ' — no month has a typed cost yet.')) + '</span>');
    }
    el.innerHTML = parts.join('');
  }
  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }
  // ⚠️ One-way-at-a-time guard: assigning scrollLeft fires the other box's scroll event, which
  // would assign back and fight the user's own scroll (a stutter on a mouse, a refusal to move
  // on a trackpad).
  var _syncing = false;
  function syncScrollers() {
    var a = document.getElementById('mp-chart'), b = document.getElementById('mp-matrix');
    if (!a || !b || a._mpSynced) return;
    a._mpSynced = b._mpSynced = true;
    function link(from, to) {
      from.addEventListener('scroll', function () {
        if (_syncing) return;
        _syncing = true; to.scrollLeft = from.scrollLeft;
        requestAnimationFrame(function () { _syncing = false; });
      });
    }
    link(a, b); link(b, a);
  }

  // ---- Matrix ---------------------------------------------------------------------------
  function renderMatrix(ag) {
    var host = document.getElementById('mp-matrix'); if (!host) return;
    var months = SPAN.months;
    if (!months.length) { host.innerHTML = '<div class="mp-empty">No months to show.</div>'; return; }
    var cutIso = CUTOFF ? mkey(CUTOFF) : null;
    var yr = [], run = null;
    months.forEach(function (m) {
      var y = m.d.getFullYear();
      if (!run || run.y !== y) { run = { y: y, n: 0 }; yr.push(run); }
      run.n++;
    });
    var h = ['<table class="mp-mx"><thead>'];
    h.push('<tr class="mp-mx-yr"><th class="mp-c1"></th><th class="mp-c2"></th>' +
      yr.map(function (r) { return '<th colspan="' + r.n + '">' + r.y + '</th>'; }).join('') + '</tr>');
    h.push('<tr class="mp-mx-mo"><th class="mp-c1">' + (detail === 'pos' ? 'Position' : 'Department') + '</th><th class="mp-c2">Series</th>' +
      months.map(function (m) { return '<th' + (m.iso === cutIso ? ' class="mp-cut"' : '') + '>' + MON3[m.d.getMonth()] + '</th>'; }).join('') + '</tr>');
    h.push('</thead><tbody>');

    // Phase band — project-month, so it is editable in every mode. The source sheet's
    // "Indicate PHASE of Project" row, which is what makes a headcount dip readable.
    h.push('<tr><td class="mp-c1">Project phase</td><td class="mp-c2">&nbsp;</td>' +
      months.map(function (m) {
        return '<td class="mp-phase mp-edit' + (m.iso === cutIso ? ' mp-cut' : '') + '" data-phase="' + m.iso +
          '" title="' + esc(phaseOf(m.iso) || 'Click to set the phase') + '">' + esc(phaseOf(m.iso)) + '</td>';
      }).join('') + '</tr>');

    var live = SERIES.filter(function (s) { return shown[s.k]; });
    if (!live.length) h.push('<tr><td class="mp-c1">—</td><td class="mp-c2">&nbsp;</td><td colspan="' + months.length + '" style="text-align:left;padding-left:10px;color:var(--pd-muted)">No series selected. Tick at least one above.</td></tr>');

    function bandRows(label, get, editId, cls) {
      live.forEach(function (ser, idx) {
        h.push('<tr class="' + (cls || '') + (ser.k === 'actual' ? ' mp-r-actual' : '') + '">');
        if (idx === 0) h.push('<td class="mp-c1" rowspan="' + live.length + '">' + label + '</td>');
        h.push('<td class="mp-c2">' + esc(ser.short) + '</td>');
        months.forEach(function (m) {
          var v = get(m.iso, ser.k);
          // Actuals after the cut-off are not "zero", they are not yet reported — the sheet
          // leaves them blank and so does this, or every future month reads as a shortfall.
          var future = ser.k === 'actual' && cutIso && m.iso > cutIso;
          var c = [];
          if (m.iso === cutIso) c.push('mp-cut');
          if (future) c.push('mp-out');
          if (editId) c.push('mp-edit');
          // A dot marks a month the contract-duration derivation wrote, so a planner can tell a
          // derived figure from one somebody typed before deciding to change it.
          var drv = editId && ownedSeries((rowOf({ id: editId }, m.iso) || {}).source) === ser.k;
          if (drv) c.push('mp-derived');
          h.push('<td class="' + c.join(' ') + '"' +
            (drv ? ' title="Derived from contract durations on the roster — type over it to take this month over."' : '') +
            (editId ? ' data-pos="' + esc(editId) + '" data-per="' + m.iso + '" data-ser="' + ser.k + '"' : '') +
            '>' + (future ? '' : (v == null ? '' : fnum(v))) + '</td>');
        });
        h.push('</tr>');
      });
    }

    if (detail === 'pos') {
      var lastDept = null;
      ag.items.forEach(function (p) {
        var d = p.department || '—';
        if (d !== lastDept) {
          lastDept = d;
          h.push('<tr class="mp-r-grp"><td class="mp-c1">' + esc(d) + '</td><td class="mp-c2">&nbsp;</td>' +
            months.map(function (m) { return '<td' + (m.iso === cutIso ? ' class="mp-cut"' : '') + '></td>'; }).join('') + '</tr>');
        }
        var label = (p.code ? '<b>' + esc(p.code) + '</b> ' : '') + esc(p.position_title) +
          (p.workforce === 'Skilled' ? ' <span class="mp-badge mp-skill">Skilled</span>' : '');
        bandRows(label, function (iso, k) { return qtyOf(p, iso, k); }, p.id);
      });
    } else {
      ag.depts.forEach(function (d) {
        var label = '<span class="mp-dot" style="background:' + deptColor(d) + '"></span>' + esc(d);
        bandRows(label, function (iso, k) {
          var c = ag.byDept[d][iso];
          return c.has[k] ? c[k] : null;
        }, null);
      });
    }

    // Overall + the requirement and the variance it produces.
    h.push('</tbody><tbody>');
    var mark = h.length;
    bandRows('Overall', function (iso, k) { var t = ag.total[iso]; return t.has[k] ? t[k] : null; }, null);
    for (var i = mark; i < h.length; i++) h[i] = h[i].replace('<tr class="', '<tr class="mp-r-total ');
    h.push('<tr class="mp-r-total"><td class="mp-c1">Requirement</td><td class="mp-c2">B1 else B0</td>' +
      months.map(function (m) {
        var t = ag.total[m.iso];
        return '<td' + (m.iso === cutIso ? ' class="mp-cut"' : '') + '>' + (t.has.gov ? fnum(t.gov) : '') + '</td>';
      }).join('') + '</tr>');
    h.push('<tr class="mp-r-total"><td class="mp-c1">Variance</td><td class="mp-c2">Actual − req.</td>' +
      months.map(function (m) {
        var t = ag.total[m.iso];
        var future = cutIso && m.iso > cutIso;
        if (future || !t.has.gov || !t.has.actual) return '<td class="mp-out' + (m.iso === cutIso ? ' mp-cut' : '') + '"></td>';
        var v = t.actual - t.gov;
        var c = v < 0 ? 'mp-neg' : (v > 0 ? 'mp-pos' : '');
        return '<td class="' + c + (m.iso === cutIso ? ' mp-cut' : '') + '">' + (v > 0 ? '+' : '') + fnum(v) + '</td>';
      }).join('') + '</tr>');

    if (showCost) {
      h.push('</tbody><tbody>');
      SERIES.forEach(function (ser) {
        h.push('<tr class="mp-r-total"><td class="mp-c1">' + (ser === SERIES[0] ? 'Cost' : '&nbsp;') + '</td>' +
          '<td class="mp-c2">' + esc(ser.short) + '</td>' +
          months.map(function (m) {
            var c = costOf(ag, m.iso, ser.k);
            var editable = !filtered();
            var cls = ['mp-cost'];
            if (m.iso === cutIso) cls.push('mp-cut');
            if (editable) cls.push('mp-edit');
            if (c.v != null && c.derived) cls.push('mp-out');
            return '<td class="' + cls.join(' ') + '"' +
              (editable ? ' data-cost="' + ser.k + '" data-per="' + m.iso + '"' : '') +
              ' title="' + (c.v == null ? 'no figure' : (c.derived ? 'derived: monthly rate × headcount' : 'typed for this month')) + '">' +
              (c.v == null ? '' : moneyShort(c.v)) + '</td>';
          }).join('') + '</tr>');
      });
    }
    h.push('</tbody></table>');
    host.innerHTML = h.join('');
    wireMatrixEdit(host);
    syncScrollers();
  }
  // A stable colour per department, so the same department is the same colour on every
  // project without a lookup table anybody has to maintain.
  var DEPT_PALETTE = ['#EE3124', '#2F6FBF', '#1B7F4B', '#B4610F', '#6B3FA0', '#0E7C86', '#A8322D', '#4A5C6A', '#8A6D1F', '#3C7D3C'];
  function deptColor(d) {
    var s = String(d || ''), n = 0;
    for (var i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) >>> 0;
    return DEPT_PALETTE[n % DEPT_PALETTE.length];
  }

  function wireMatrixEdit(host) {
    // Headcount cells — only in "By position" mode. A department row is a roll-up of several
    // positions, so there would be no way to know which position a typed number belonged to.
    host.querySelectorAll('td.mp-edit[data-pos]').forEach(function (td) {
      td.onclick = function () { cellEdit(td, false, function (v) { setQty(td.dataset.pos, td.dataset.per, td.dataset.ser, v); }); };
    });
    host.querySelectorAll('td.mp-edit[data-cost]').forEach(function (td) {
      td.onclick = function () { cellEdit(td, false, function (v) { setMonthField(td.dataset.per, SER_BY_K[td.dataset.cost].cost, v); }); };
    });
    host.querySelectorAll('td.mp-edit[data-phase]').forEach(function (td) {
      td.onclick = function () { cellEdit(td, true, function (v) { setMonthField(td.dataset.phase, 'phase', v); }); };
    });
  }
  function cellEdit(td, isText, commitFn) {
    if (td.querySelector('input')) return;
    var was = td.textContent.trim();
    td.innerHTML = '<input class="mp-cellin' + (isText ? ' wide' : '') + '" type="' + (isText ? 'text' : 'number') + '"' +
      (isText ? '' : ' step="any" min="0"') + ' value="' + esc(was) + '">';
    var inp = td.querySelector('input'); inp.focus(); inp.select();
    var done = false;
    function commit(save) {
      if (done) return; done = true;
      if (!save) { td.textContent = was; return; }
      commitFn(isText ? (inp.value.trim() || null) : num(inp.value));
    }
    inp.onblur = function () { commit(true); };
    inp.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
    };
  }

  // One (position, month) upsert. ⚠️ Blank CLEARS the value rather than storing 0 — "not
  // reported" and "nobody deployed" are different facts and the grid draws them differently.
  async function setQty(posId, iso, k, v) {
    var col = SER_BY_K[k].col;
    var cur = (LOAD[posId] || {})[iso];
    var ok;
    if (cur) {
      var patch = {}; patch[col] = v;
      // ⚠️ Only the column the planner is actually editing changes hands. A row can carry a
      // contract-derived actual beside a hand-typed plan, and `source` is per ROW — so blanket
      // 'hand' here would silently orphan the derivation's ownership of the other column and the
      // next re-derive would stop maintaining it.
      patch.source = (ownedSeries(cur.source) === k) ? 'hand' : (cur.source || 'hand');
      var r1 = await tolerantWrite(patch, function (p) { return sb().from('manpower_loading').update(p).eq('id', cur.id); });
      ok = r1.ok;
      // ⚠️ `source` has to be mirrored into the in-memory row too, not just written. Without it
      // the cell keeps its derived marker and the next derive still counts it as owned — so a
      // hand correction would be silently overwritten until the page happened to reload.
      if (ok) { cur[col] = v; cur.source = patch.source; reportDropped(r1.dropped); }
      else UI.toast('Could not save: ' + (r1.error && r1.error.message), 'error');
    } else {
      var row = { project_id: pid, position_id: posId, period: iso, source: 'hand', created_by: user && user.id };
      row[col] = v;
      var r2 = await tolerantWrite(row, function (p) { return sb().from('manpower_loading').insert(p).select(); });
      if (!r2.ok) { UI.toast('Could not save: ' + (r2.error && r2.error.message), 'error'); ok = false; }
      else { (LOAD[posId] = LOAD[posId] || {})[iso] = r2.data[0]; reportDropped(r2.dropped); ok = true; }
    }
    if (ok) renderAll();
  }
  // The project-month row: phase, and the four typed costs. Upserted the same way.
  async function setMonthField(iso, col, v) {
    var cur = MONTHS[iso];
    var ok;
    if (cur) {
      var patch = {}; patch[col] = v;
      var r1 = await tolerantWrite(patch, function (p) { return sb().from('manpower_months').update(p).eq('id', cur.id); });
      ok = r1.ok;
      if (ok) { cur[col] = v; reportDropped(r1.dropped); }
      else UI.toast('Could not save: ' + (r1.error && r1.error.message), 'error');
    } else {
      var row = { project_id: pid, period: iso, created_by: user && user.id };
      row[col] = v;
      var r2 = await tolerantWrite(row, function (p) { return sb().from('manpower_months').insert(p).select(); });
      if (!r2.ok) { UI.toast('Could not save: ' + (r2.error && r2.error.message), 'error'); ok = false; }
      else { MONTHS[iso] = r2.data[0]; reportDropped(r2.dropped); ok = true; }
    }
    if (ok) renderAll();
  }

  // ---- Contract-driven deployment -------------------------------------------------------
  // A manpower profile is a PERSON (or a budgeted TBH slot) with a contract duration, and that
  // duration is what puts them on the project in a given month — the same relationship an
  // equipment item's schedule link has to its monthly quantities. So the months are DERIVED
  // from the contract rather than typed, and re-deriving after a contract moves is one click.
  //
  // ⚠️ The derived months are WRITTEN into manpower_loading, not computed at render time. The
  // chart, the grid, the export, the portfolio and the dashboard tile all read that one table;
  // a second invisible source of headcount would make them disagree the moment anything read
  // the table directly. Same call the equipment sync made.
  var MAX_DERIVE_MONTHS = 600;

  function deriveKeyLoad() {
    DERIVE_KEY = 'actual';
    try { var v = localStorage.getItem('mp_derive_' + pid); if (v && SER_BY_K[v]) DERIVE_KEY = v; } catch (_e) {}
  }
  function deriveKeySet(k) {
    DERIVE_KEY = k;
    try { localStorage.setItem('mp_derive_' + pid, k); } catch (_e) {}
  }
  // 'roster:actual' → 'actual'. Anything else — a planner's 'hand', an import, null — owns
  // nothing, which is what makes a hand correction survive the next re-derive.
  function ownedSeries(src) {
    var m = /^roster:([a-z]+)$/.exec(String(src || ''));
    return (m && SER_BY_K[m[1]]) ? m[1] : null;
  }
  function monthsBetween(a, b) {
    var out = [], c = mFloor(a), stop = mFloor(b), guard = 0;
    while (c <= stop && guard++ < MAX_DERIVE_MONTHS) { out.push(mkey(c)); c = new Date(c.getFullYear(), c.getMonth() + 1, 1); }
    return out;
  }
  // The months one profile is on the project for, for the series being derived.
  function profileMonths(r, k) {
    var s = pd_(r.contract_start);
    if (!s) return [];
    var e = r.contract_end ? mFloor(pd_(r.contract_end)) : null;
    if (k === 'actual') {
      // ⚠️ Actual stops at the cut-off, always. A contract running to December does not report
      // December's deployment — "not yet reported" and "nobody was there" are different facts,
      // and every other surface in this module already draws them differently.
      var lim = CUTOFF || mFloor(new Date());
      var end = (e && e < lim) ? e : lim;
      return monthsBetween(s, end);
    }
    // ⚠️ A forward series fills the whole contract — but an OPEN-ENDED contract is SKIPPED, not
    // run to the end of the schedule. "No end date recorded" is an unanswered question, and
    // projecting it to the project's last month invents a commitment nobody made.
    if (!e) return [];
    return monthsBetween(s, e);
  }
  function profileSpanLabel(r) {
    var s = pd_(r && r.contract_start), e = pd_(r && r.contract_end);
    if (!s) return null;
    var n = e ? monthsBetween(s, e).length : null;
    return { months: n, from: monLabel(mFloor(s)), to: e ? monLabel(mFloor(e)) : null };
  }

  // One pass over the roster producing { position_id -> { iso -> heads } }, plus everything it
  // could NOT answer — reported on screen rather than silently dropped, because a profile that
  // contributes nothing looks identical to one that was never entered.
  function deriveMap(k) {
    var map = {}, skip = { tbh: 0, noPos: 0, noStart: 0, openEnded: 0, outside: 0 };
    ROSTER.forEach(function (r) {
      // ⚠️ TBH is excluded from EVERY series, not just actual. It is a budgeted-but-unfilled
      // slot, so nobody is deployed — and adding it to a planned series would double-count it
      // against the requirement the planner already typed. The vacancy figure is where it counts.
      if (isTBH(r)) { skip.tbh++; return; }
      if (!r.position_id) { skip.noPos++; return; }
      if (!r.contract_start) { skip.noStart++; return; }
      if (k !== 'actual' && !r.contract_end) { skip.openEnded++; return; }
      // ⚠️ One profile is ONE head, whatever its allocation says. 'SHARED' records that a person
      // works across projects but records no fraction, and turning that into 0.5 would be
      // inventing precision nobody entered. Type the month by hand to say otherwise.
      profileMonths(r, k).forEach(function (iso) {
        // ⚠️ Months outside the schedule's axis are NOT clipped away. The axis is the project
        // schedule's, the contract is HR's; a contract reaching past it means the two disagree,
        // and silently dropping those months hides exactly that.
        if (SPAN && (iso < mkey(SPAN.start) || iso > mkey(SPAN.end))) skip.outside++;
        (map[r.position_id] = map[r.position_id] || {})[iso] = ((map[r.position_id] || {})[iso] || 0) + 1;
      });
    });
    return { map: map, skip: skip };
  }

  // What a derive would change, without writing anything — shared by the dialog's preview, the
  // drift banner and the write itself, so the three can never disagree about the count.
  // takeOver: replace months a planner typed as well. ⚠️ OFF everywhere by default and never
  // implied — it is the one setting that can destroy entered data, so it is an explicit tick with
  // the count of what it would replace printed next to it.
  function derivePlan(k, takeOver) {
    var col = SER_BY_K[k].col;
    var d = deriveMap(k), map = d.map;
    var slots = {}, kept = 0;
    function slot(posId, iso) {
      var key = posId + '|' + iso;
      if (!slots[key]) slots[key] = { project_id: pid, position_id: posId, period: iso, created_by: user && user.id };
      return slots[key];
    }
    // 1) Release every cell this derivation currently owns. The covered ones are re-set below,
    //    so the net effect on an unchanged month is nothing — and a month that fell out of a
    //    shortened contract is cleared rather than left asserting a head who has demobilised.
    Object.keys(LOAD).forEach(function (posId) {
      Object.keys(LOAD[posId]).forEach(function (iso) {
        var own = ownedSeries(LOAD[posId][iso].source);
        if (!own) return;
        var s = slot(posId, iso);
        s[SER_BY_K[own].col] = null;
        s.source = null;
      });
    });
    // 2) Write the covered months.
    Object.keys(map).forEach(function (posId) {
      Object.keys(map[posId]).forEach(function (iso) {
        var cur = (LOAD[posId] || {})[iso];
        // ⚠️ A hand-typed number survives. The derivation overwrites only a cell it already owns
        // or an empty one — the equipment sync's rule, and the reason a planner's correction is
        // not thrown away by the next re-derive.
        if (cur && num(cur[col]) != null && ownedSeries(cur.source) !== k) {
          kept++;
          if (!takeOver) return;
        }
        var s = slot(posId, iso);
        s[col] = map[posId][iso];
        s.source = 'roster:' + k;
      });
    });
    // 3) Drop the no-ops, or every re-derive would rewrite the whole grid and touch every
    //    updated_at — the column the register's "last updated" reading comes from.
    var rows = [];
    Object.keys(slots).forEach(function (key) {
      var s = slots[key], cur = (LOAD[s.position_id] || {})[s.period];
      var diff = false;
      SERIES.forEach(function (ser) {
        if (!(ser.col in s)) return;
        var was = cur ? num(cur[ser.col]) : null;
        if (was !== s[ser.col]) diff = true;
      });
      if ((cur ? (cur.source || null) : null) !== (s.source || null)) diff = true;
      if (diff) rows.push(s);
    });
    return { rows: rows, skip: d.skip, kept: kept, series: k, takeOver: !!takeOver };
  }
  function hasDerived() {
    for (var p in LOAD) for (var i in LOAD[p]) if (ownedSeries(LOAD[p][i].source)) return true;
    return false;
  }

  // ⚠️ ONE round-trip per 400 months, not one per month. A real project is ~27 positions over
  // ~18 months, and a row-at-a-time write is 486 sequential requests. Upsert keys on the
  // (position_id, period) unique index, so it can only ever land on the intended row.
  async function tolerantWriteRows(rows, run) {
    var work = rows.map(function (r) { var c = {}, k; for (k in r) c[k] = r[k]; return c; });
    var dropped = [];
    for (var attempt = 0; attempt < 12; attempt++) {
      var res = await run(work);
      if (!res || !res.error) return { ok: true, dropped: dropped };
      var col = missingColumn(res.error);
      if (!col) return { ok: false, error: res.error, dropped: dropped };
      var found = false;
      work.forEach(function (r) { if (col in r) { delete r[col]; found = true; } });
      if (!found) return { ok: false, error: res.error, dropped: dropped };
      dropped.push(col);
    }
    return { ok: false, error: new Error('too many missing columns'), dropped: dropped };
  }

  async function deriveFromContracts(k, silent, takeOver) {
    if (!pid) return false;
    var plan = derivePlan(k, takeOver);
    if (!plan.rows.length) { if (!silent) UI.toast('Already up to date — every month matches its contracts.', 'ok'); return true; }
    if (!silent) showLoading('Deriving ' + plan.rows.length + ' month(s) from contract durations…');
    var failed = 0, dropped = [];
    for (var i = 0; i < plan.rows.length; i += 400) {
      var chunk = plan.rows.slice(i, i + 400);
      var res = await tolerantWriteRows(chunk, function (w) {
        return sb().from('manpower_loading').upsert(w, { onConflict: 'position_id,period' }).select();
      });
      if (!res.ok) { failed += chunk.length; if (!silent) UI.toast('Could not derive: ' + (res.error && res.error.message), 'error'); break; }
      res.dropped.forEach(function (c) { if (dropped.indexOf(c) < 0) dropped.push(c); });
    }
    if (!silent) hideLoading();
    if (dropped.length) reportDropped(dropped);
    if (!failed && !silent) {
      UI.toast(plan.rows.length + ' month(s) derived from contract durations.' +
        (plan.kept ? (plan.takeOver ? ' ' + plan.kept + ' hand-typed month(s) replaced.'
                                    : ' ' + plan.kept + ' hand-typed month(s) left untouched.') : ''), 'ok');
    }
    await load();
    return !failed;
  }

  // ⚠️ Read-only, and it never re-derives by itself. A derivation that fired on its own would
  // overwrite a grid someone is part-way through explaining — so it reports and offers a button.
  function renderDrift() {
    var el = document.getElementById('mp-drift'); if (!el) return;
    if (!pid || needsMigration || !hasDerived()) { el.style.display = 'none'; el.innerHTML = ''; return; }
    var plan = derivePlan(DERIVE_KEY);
    if (!plan.rows.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'flex';
    el.innerHTML = '<span><b>' + plan.rows.length + ' month(s)</b> no longer match the contract durations on the roster' +
      ' — a contract was added, moved or shortened since this was last derived.</span>' +
      '<button class="pd-btn" id="mp-drift-go" style="height:30px;">Re-derive now</button>';
    var b = document.getElementById('mp-drift-go');
    if (b) b.onclick = function () { deriveFromContracts(DERIVE_KEY, false); };
  }

  function openDerive() {
    var plan = derivePlan(DERIVE_KEY), s = plan.skip;
    var notes = [];
    if (s.tbh) notes.push('<li><b>' + s.tbh + '</b> TBH slot(s) are excluded — nobody is deployed against an unfilled slot, and counting them would double-count the requirement. They drive the vacancy figure instead.</li>');
    if (s.noPos) notes.push('<li><b>' + s.noPos + '</b> profile(s) are not linked to a position, so there is no line to add them to.</li>');
    if (s.noStart) notes.push('<li><b>' + s.noStart + '</b> profile(s) have no contract start date.</li>');
    if (s.openEnded) notes.push('<li><b>' + s.openEnded + '</b> profile(s) are open-ended. A forward series is not projected to the end of the schedule — that would invent a commitment. Give them an end date, or derive to Actual.</li>');
    if (s.outside) notes.push('<li><b>' + s.outside + '</b> month(s) fall outside the schedule&rsquo;s own axis. They are still written, not dropped — the contract and the programme disagree, and hiding it would hide that.</li>');
    if (plan.kept) notes.push('<li><b>' + plan.kept + '</b> hand-typed month(s) will be left exactly as they are.</li>');
    var m = UI.modal(
      '<div class="pd-modal-header"><h2>Derive months from contract durations</h2>' +
      '<button class="pd-modal-close" id="mp-d-x">&times;</button></div>' +
      '<div class="pd-modal-body">' +
        '<p class="mp-note">Every manpower profile adds <b>one head</b> to its position for each month its contract spans. This writes those months into the grid, so the curve follows the roster instead of being typed twice.</p>' +
        '<div class="pd-field" style="margin-top:12px;"><label>Write into which series</label>' +
          '<select class="pd-select" id="mp-d-ser">' +
            SERIES.map(function (x) { return '<option value="' + x.k + '"' + (x.k === DERIVE_KEY ? ' selected' : '') + '>' + esc(x.label) + '</option>'; }).join('') +
          '</select>' +
          '<span class="mp-note" id="mp-d-hint"></span></div>' +
        '<div class="mp-derivebox"><b id="mp-d-count"></b>' +
          '<ul id="mp-d-notes"></ul></div>' +
