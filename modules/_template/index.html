<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png?v=20260830b" />
  <script src="../../assets/js/theme.js?v=20260812b"></script>
  <title>Module Template · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260831b" />
  <link rel="stylesheet" href="module.css" />
</head>
<body>
  <div class="pd-app">
    <!-- Persistent module sidebar (uniform across the suite — see MODULE_CONTRACT.md
         §"Sidebar"). Copy this block verbatim; only `active` in the UI.renderNav call
         below changes per module. Contents are rendered by UI.renderNav, NOT this
         static markup — #side-nav starts empty and is filled once profile/project
         are known. -->
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="../../assets/img/logo-white.png" alt="Megawide Construction">Planners Dashboard<small>Module Template</small></div>
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>EPC &middot; PMO &middot; Planning Suite</div>
    </aside>
    <div class="pd-content">
      <!-- Uniform top bar (see MODULE_CONTRACT.md "Uniform top bar"): a flat list of
           children, split by ui.js's initModuleTopbar() into a permanent two-row
           layout — row 1 (identity: icon + project selector + theme + avatar) is the
           same on every module; row 2 (this module's own tabs + action buttons) is
           yours. No back button — the browser's own Back covers it. -->
      <div class="pd-topbar">
        <h1 class="tpl-title" style="margin:0;">
          <span class="tpl-title-ico" data-ico="box" data-ico-size="20"></span>
          <span class="tpl-title-txt">Module Template</span>
        </h1>
        <div class="tpl-projctx">
          <select class="pd-select tpl-project" id="tpl-project" title="Project"></select>
        </div>
        <div class="tpl-tabs" role="tablist">
          <button class="tpl-tab active" data-view="list">Records</button>
        </div>
        <div class="tpl-topbar-tools">
          <button class="pd-btn pd-btn-primary" id="btn-add">+ Add record</button>
        </div>
        <div id="user-bar"></div>
      </div>
      <div class="pd-main">
        <div class="pd-card" style="padding:0;overflow:auto;">
          <table class="pd-table" id="records"></table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/config.js?v=20260828b"></script>
  <script src="../../assets/js/auth.js?v=20260814a"></script>
  <script src="../../assets/js/db.js?v=20260827c"></script>
  <script src="../../assets/js/program.js?v=20260827a"></script>
  <script src="../../assets/js/ui.js?v=20260831a"></script>
  <script src="../../assets/js/icons.js?v=20260830c"></script>
  <script src="module.js"></script>
  <script>
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      UI.initShell();
      var pname = sessionStorage.getItem('pd_project_name') || sessionStorage.getItem('pd_project') || '';
      UI.renderNav(document.getElementById('side-nav'), 'project', {
        active: '_template', base: '../../', pname: pname, modules: APP_CONFIG.MODULES,
      });
      MyModule.init(user, profile);
    });
  </script>
</body>
</html>
