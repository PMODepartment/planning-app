<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png" />
  <script src="../../assets/js/theme.js?v=20260812b"></script>
  <title>Progress Photos · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260827a" />
  <link rel="stylesheet" href="module.css?v=20260829g" />
</head>
<body>
  <div class="pd-app">
    <!-- Sidebar-less shell (matches Project Schedule / Cash Flow / Drawing Register) -->
    <div class="pd-content">
      <div class="pd-topbar">
        <a class="pd-btn pp-modback" href="../../modules.html" title="Back to modules">
          <span data-ico="arrowLeft" data-ico-size="18"></span></a>
        <h1 class="pp-title" style="margin:0;">
          <span class="pp-title-ico" data-ico="camera" data-ico-size="20"></span>
          <span class="pp-title-txt" id="pp-screen-title">Gallery</span>
        </h1>
        <div class="pp-projctx">
          <select class="pd-select pp-project" id="pp-project" title="Project"></select>
        </div>

        <!-- Top-level screens. Gallery, Presentations, Plans (Batch C,
             2026-08-29: Rounds removed per owner feedback; 360°/3D folded
             into Gallery as media types rather than separate tabs — their
             screens/code stay in the file, just no longer reachable as a
             top-level tab, since a capture now lives in the unified feed). -->
        <div class="pp-tabs" role="tablist">
          <button class="pp-tab active" data-screen="photos">Gallery</button>
          <button class="pp-tab" data-screen="ppr">Presentations</button>
          <button class="pp-tab" data-screen="bim">Plans</button>
        </div>

        <!-- Tool cluster beside the profile: one labelled primary action per
             screen, everything else icon-only (Drawing Register / Cash Flow). -->
        <div class="pp-topbar-tools" id="pp-topbar-tools">
          <!-- Photos-screen tools -->
          <button class="pd-btn pd-btn-primary pp-tb-labeled" id="pp-add" title="Upload photos">+ Add photos</button>
          <span class="pp-tb-sep" id="pp-sep-photos"></span>
          <button class="pd-btn" id="pp-refresh" title="Reload photos">
            <span data-ico="refresh" data-ico-size="16"></span></button>
          <!-- PPR-screen tools -->
          <button class="pd-btn pd-btn-primary pp-tb-labeled" id="ppr-new" title="Create a presentation" style="display:none;">+ New Presentation</button>
          <button class="pd-btn" id="ppr-templates" title="Report templates (Section 5)" style="display:none;">
            <span data-ico="layers" data-ico-size="16"></span></button>
          <button class="pd-btn pd-btn-primary pp-tb-labeled" id="ppr-tmpl-new" title="Create a report template" style="display:none;">+ New template</button>
          <button class="pd-btn pp-tb-labeled" id="ppr-back" title="Back to the presentation list" style="display:none;">
            <span data-ico="arrowLeft" data-ico-size="16"></span> Presentations list</button>
          <!-- 360°/3D capture (folded into Gallery, 2026-08-29 feedback — no
               longer their own tabs; these buttons now show on the Gallery
               screen itself, same as every other Gallery tool). -->
          <button class="pd-btn pp-tb-labeled" id="pano-new" title="Capture a 360° panorama" style="display:none;">+ Capture 360&deg;</button>
          <button class="pd-btn pp-tb-labeled" id="pano-compare-btn" title="Compare two captures over time" style="display:none;">Compare over time</button>
          <button class="pd-btn pp-tb-labeled" id="recon-new" title="Request a 3D reconstruction" style="display:none;">+ Request 3D scan</button>
          <!-- Floor Plan screen tools -->
          <button class="pd-btn pd-btn-primary pp-tb-labeled" id="bim-new" title="Upload a floor plan" style="display:none;">+ Upload floor plan</button>
          <button class="pd-btn pp-tb-labeled" id="bim-place" title="Toggle pin-placement mode" style="display:none;">Place pin</button>
        </div>
        <!-- Offline capture queue — visible on every screen (Rounds captures queue too) -->
        <button class="pd-btn pp-syncbtn" id="pp-sync" title="Sync photos captured while offline" hidden>
          <span data-ico="refresh" data-ico-size="14"></span> <span id="pp-sync-n">0</span> pending — Sync now</button>
        <div id="pp-presence" title="People viewing this project"></div>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <!-- ================= Photos Database ================= -->
        <div id="pp-screen-photos">
          <div class="pp-filters">
            <span class="pp-filt-ico" data-ico="filter" data-ico-size="15"></span>
            <input class="pd-input pp-search" id="pp-f-search" placeholder="Search description, trade, works, location…" />
            <label class="pp-datefield">Captured
              <input class="pd-input" type="date" id="pp-f-from" title="Filter by capture start" /></label>
            <label class="pp-datefield">to
              <input class="pd-input" type="date" id="pp-f-to" title="Filter by capture end" /></label>
            <select class="pd-select" id="pp-f-trade"><option value="">Filter by Trade</option></select>
            <select class="pd-select" id="pp-f-works"><option value="">Filter by Works</option></select>
            <div class="pp-locfilters" id="pp-f-loclevels"></div>
            <label class="ppr-allloc"><input type="checkbox" id="pp-f-archived" /> Show archived</label>
            <button class="pp-clear" id="pp-clearfilters" title="Clear all filters" hidden>
              <span data-ico="x" data-ico-size="14"></span>Clear filters</button>
          </div>
          <!-- Count + display mode, using the shared .pd-viewtoggle component -->
          <div class="pp-listbar">
            <span class="pp-countbar" id="pp-count"></span>
            <div class="pd-viewtoggle" role="tablist">
              <button class="pd-vt active" data-view="list" title="List view">
                <span data-ico="listView" data-ico-size="15"></span></button>
              <button class="pd-vt" data-view="gallery" title="Gallery view">
                <span data-ico="gridView" data-ico-size="15"></span></button>
            </div>
          </div>
          <!-- Batch select (18-item list follow-up item 5): hidden until at
               least one tile is selected; module.js fills in the count and
               wires the three actions. -->
          <div class="pp-selbar" id="pp-selbar" hidden>
            <span id="pp-selcount"></span>
            <button class="pd-btn pd-btn-sm" id="pp-sel-download">Download</button>
            <button class="pd-btn pd-btn-sm" id="pp-sel-addppr">Add to Presentation</button>
            <button class="pd-btn pd-btn-sm" id="pp-sel-archive">Archive</button>
            <button class="pd-btn pd-btn-sm" id="pp-sel-clear">Clear</button>
          </div>
          <div id="pp-view"></div>
          <!-- 360° panoramas + 3D scans, folded into the Gallery screen
               (2026-08-29 feedback) rather than kept as separate tabs. This
               strip lists what's already captured; pano.js/recon.js's own
               capture flows are unchanged and reached via the "+ Capture
               360°"/"+ Request 3D scan" buttons in the topbar above. -->
          <div id="pp-media-strip"></div>
        </div>

        <!-- ================= PPR Presentations ================= -->
        <div id="pp-screen-ppr" hidden>
          <div class="pp-filters" id="ppr-listbar">
            <span class="pp-filt-ico" data-ico="filter" data-ico-size="15"></span>
            <label class="pp-datefield">Presentation date
              <input class="pd-input" type="date" id="ppr-f-from" title="Filter by presentation date start" /></label>
            <label class="pp-datefield">to
              <input class="pd-input" type="date" id="ppr-f-to" title="Filter by presentation date end" /></label>
            <label class="ppr-allloc"><input type="checkbox" id="ppr-f-archived" /> Show archived</label>
            <button class="pp-clear" id="ppr-clearfilters" title="Clear all filters" hidden>
              <span data-ico="x" data-ico-size="14"></span>Clear filters</button>
          </div>
          <div class="pp-listbar" id="ppr-countbar">
            <span class="pp-countbar" id="ppr-count"></span>
          </div>
          <div id="ppr-view"></div>
          <!-- Report Templates (brief Section 5 / Phase 2) — a management view
               reached from the Presentations screen, since running one produces an
               ordinary presentation rather than being its own kind of record. -->
          <div id="ppr-tmpl-wrap" hidden><div id="ppr-tmpl-view"></div></div>
        </div>

        <!-- ================= Panoramic Capture (brief Section 6 / Phase 3) ================= -->
        <div id="pp-screen-pano" hidden>
          <div id="pano-view"></div>
        </div>

        <!-- ================= 3D Reconstruction Requests (brief 6A / Phase 4) ================= -->
        <div id="pp-screen-recon" hidden>
          <div id="recon-view"></div>
        </div>

        <!-- ================= Floor Plan overlay (brief 6B / Phase 5) ================= -->
        <div id="pp-screen-bim" hidden>
          <div id="bim-view"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen photo viewer (the Power Apps expand button) -->
  <div class="pp-lightbox" id="pp-lightbox" hidden>
    <div class="pp-lb-tools" id="pp-lb-tools">
      <button class="pp-lb-tool" id="pp-lb-download" title="Download"><span data-ico="download" data-ico-size="16"></span></button>
      <button class="pp-lb-tool" id="pp-lb-edit" title="Edit details"><span data-ico="pencil" data-ico-size="16"></span></button>
      <button class="pp-lb-tool pp-lb-tool-danger" id="pp-lb-delete" title="Delete"><span data-ico="trash" data-ico-size="16"></span></button>
    </div>
    <button class="pp-lb-close" id="pp-lb-close" title="Close (Esc)">×</button>
    <button class="pp-lb-btn pp-lb-prev" id="pp-lb-prev" title="Previous (←)">‹</button>
    <img class="pp-lb-img" id="pp-lb-img" alt="" />
    <button class="pp-lb-btn pp-lb-next" id="pp-lb-next" title="Next (→)">›</button>
    <div class="pp-lb-cap" id="pp-lb-cap"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Report export libraries (brief Section 5): both loaded exactly as this
       app's other feature libraries are (SheetJS/html2pdf.js elsewhere) — a
       single pinned-version <script> tag, no build step. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <!-- Panoramic capture (brief Section 6 / Phase 3): OpenCV.js for client-side
       feature-matching/stitching (WASM, ~10MB — loaded only on this module's
       page, never blocks any other module), Three.js for the 360° viewer.
       Both pinned versions, verified to resolve before committing to them. -->
  <script src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <!-- 3D Reconstruction viewer (brief 6A / Phase 4): the official Three.js
       r128 PLYLoader (classic global THREE.PLYLoader), same pinned Three.js
       revision as the 360° viewer above — one version of THREE for the page. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
  <script src="../../assets/js/config.js?v=20260828b"></script>
  <script src="../../assets/js/auth.js?v=20260814a"></script>
  <script src="../../assets/js/db.js?v=20260827c"></script>
  <script src="../../assets/js/program.js?v=20260827a"></script>
  <script src="../../assets/js/ui.js?v=20260824a"></script>
  <script src="../../assets/js/icons.js?v=20260813a"></script>
  <script src="../../assets/js/offline.js?v=20260812b"></script>
  <script src="../../assets/js/collab.js?v=20260812b"></script>
  <script src="../../assets/js/autosave.js?v=20260812b"></script>
  <script src="module.js?v=20260829g"></script>
  <script src="ppr.js?v=20260829e"></script>
  <script src="pano.js?v=20260829d"></script>
  <script src="recon.js?v=20260829d"></script>
  <script src="bim.js?v=20260829a"></script>
  <script>
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      ProgressPhotos.init(user, profile);
      PPR.init(user, profile);
      PANO.init(user, profile);
      RECON.init(user, profile);
      BIM.init(user, profile);

      document.getElementById('pp-lb-close').onclick = ProgressPhotos._closeLightbox;
      document.getElementById('pp-lb-prev').onclick  = function () { ProgressPhotos._stepLightbox(-1); };
      document.getElementById('pp-lb-next').onclick  = function () { ProgressPhotos._stepLightbox(1); };

      // Top-level screen switch (Photos / PPRs) — each screen owns its own tools.
      var PHOTO_TOOLS = ['pp-add', 'pp-sep-photos', 'pp-refresh'];
      function show(ids, on) {
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.style.display = on ? '' : 'none';
        });
      }
      function setScreen(s) {
        // Rounds is gone entirely (2026-08-29 feedback: "Rounds can be
        // removed"), and 360°/3D no longer have their own tabs either
        // ("360 and 3D should be incorporated in the Gallery") — Gallery is
        // now the only screen besides Presentations and Plans, so a stale
        // `pp_screen` value from before this change (e.g. 'rounds') must NOT
        // reach here: ProgressPhotos.renderRounds() no longer exists, and
        // calling it would throw and break the whole page load for anyone
        // who had Rounds open when this shipped. The restore-list below
        // filters that out before setScreen is ever called with it.
        var isPpr = s === 'ppr', isBim = s === 'bim';
        var isPhotos = !isPpr && !isBim;
        document.getElementById('pp-screen-photos').hidden = !isPhotos;
        document.getElementById('pp-screen-ppr').hidden = !isPpr;
        document.getElementById('pp-screen-bim').hidden = !isBim;
        document.getElementById('pp-screen-title').textContent =
          isPpr ? 'Presentations' : isBim ? 'Plans' : 'Gallery';
        show(PHOTO_TOOLS, isPhotos);
        // Each module re-asserts its own tools' visibility (role + inner screen).
        PPR._syncTools(isPpr);
        // pano.js/recon.js's own screens (#pp-screen-pano/#pp-screen-recon)
        // stay in the DOM, permanently hidden — their load()/render() both
        // bail out early if their host div is missing, and PANO.ensureLoaded/
        // RECON.ensureLoaded (called from ProgressPhotos.load()) depend on
        // that div existing to populate panoramas/requests for the media
        // strip below. Their capture buttons now show on Gallery itself.
        PANO._syncTools(isPhotos);
        RECON._syncTools(isPhotos);
        BIM._syncTools(isBim);
        if (isPhotos) ProgressPhotos._syncChrome();
        Array.prototype.forEach.call(document.querySelectorAll('.pp-tab[data-screen]'), function (b) {
          b.classList.toggle('active', b.dataset.screen === s);
        });
        try { localStorage.setItem('pp_screen', s); } catch (e) {}
      }
      Array.prototype.forEach.call(document.querySelectorAll('.pp-tab[data-screen]'), function (b) {
        b.onclick = function () { setScreen(b.dataset.screen); };
      });
      var saved = 'photos';
      try { saved = localStorage.getItem('pp_screen') || 'photos'; } catch (e) {}
      setScreen(['ppr', 'bim'].indexOf(saved) >= 0 ? saved : 'photos');
    });
  </script>
</body>
</html>
