<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon-icon.png?v=20260903a" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png?v=20260830b" />
  <script src="../../assets/js/theme.js?v=20260812b"></script>
  <title>Progress Photos · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260903a" />
  <link rel="stylesheet" href="module.css?v=20260902g" />
</head>
<body>
  <div class="pd-app">
    <!-- Persistent module sidebar (uniform across the suite — see MODULE_CONTRACT.md
         §"Sidebar"). Contents are mode='project', rendered by UI.renderNav below. -->
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="../../assets/img/logo-white.png" alt="Megawide Construction">Planners Dashboard<small>Planning Suite</small></div>
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>EPC &middot; PMO &middot; Planning Suite</div>
    </aside>
    <div class="pd-content">
      <div class="pd-topbar">
        <!-- The standalone "Progress Photos" <h1> is gone (owner feedback):
             it duplicated the module's own name in the secondary top bar
             (.pd-modulebar — see initModuleTopbar in ui.js) for no reason,
             since the tab strip right below it already names the module as
             its first tab. -->
        <div class="pp-projctx">
          <select class="pd-select pp-project" id="pp-project" title="Project"></select>
        </div>

        <!-- Top-level screens: Progress Photos (formerly "Gallery"),
             Presentations, Floor Plans (formerly "Plans") — internal
             data-screen values (photos/ppr/bim) are unchanged, only the
             user-facing labels renamed. Rounds removed per owner feedback
             (Batch C, 2026-08-29); 360°/3D folded into Progress Photos as
             media types rather than separate tabs — their screens/code stay
             in the file, just no longer reachable as a top-level tab, since
             a capture now lives in the unified feed. -->
        <div class="pp-tabs" role="tablist">
          <button class="pp-tab active" data-screen="photos">Progress Photos</button>
          <button class="pp-tab" data-screen="ppr">Presentations</button>
          <button class="pp-tab" data-screen="bim">Floor Plans</button>
        </div>
        <!-- Templates-screen-only "back to list" now (ppr.js/syncTools).
             The slide/presentation editor carries its OWN back button
             instead, rendered first inside .ppr-slidehead (owner feedback:
             Back Button > Presentation Details > action buttons) — a
             topbar breadcrumb sitting well above that content read as
             detached from what it was navigating away from. -->
        <!-- Item 9 (current round): label shortened to "Back" (the arrow
             already carried the direction). -->
        <button class="pp-crumbback" id="ppr-back" title="Back to the presentation list" style="display:none;">
          <span data-ico="arrowLeft" data-ico-size="14"></span> Back</button>

        <!-- Tool cluster beside the profile: one labelled primary action per
             screen, everything else icon-only (Drawing Register / Cash Flow). -->
        <div class="pp-topbar-tools" id="pp-topbar-tools">
          <!-- Photos-screen tools. One "+ Add media" button covers photo/video/
               360°/3D (via its own type picker in the upload modal) — the
               separate Capture 360° / Compare over time / Request 3D scan
               buttons that used to sit here are REMOVED (owner feedback,
               2026-08-29: "I only need the add media button... just one add
               media to cover"). Their capture flows still exist in pano.js/
               recon.js (openCaptureModal/openCompareModal/openRequestForm) —
               they're simply unreachable from the UI now, the same "on hold"
               treatment the Add-media type picker already gives 360°/3D.
               Existing captures still show and open from the media strip
               below the grid. -->
          <!-- Item 2: a compact search box + funnel toggle in the topbar,
               replacing the old always-open filter row. Clicking the funnel
               (or the search box, via focus) reveals the rest of the filters
               (date range / trade / works / location / archived) in the
               docked panel below. -->
          <div class="pp-topsearch" id="pp-topsearch-wrap">
            <input class="pd-input" id="pp-topsearch" placeholder="Search photos…" />
          </div>
          <button class="pp-topfilttoggle" id="pp-topfilttoggle" title="More filters">
            <span data-ico="filter" data-ico-size="16"></span></button>
          <!-- Fifth round item 1: "+ Add media" is now a dropdown choosing
               the media type UP FRONT (Photo/Video/360°/3D-on-hold), rather
               than deciding it inside the modal after files may already be
               staged — the very ambiguity that let a staged photo survive a
               later switch to Video. Picking Photo/Video opens the same
               upload modal pre-set to that type.
               ⚠️ 2026-09-02 owner feedback item 1: "the 360 photo feature is
               quite buggy — let's discontinue it for now." 360° is disabled/
               greyed out here the same way 3D already is, rather than removed
               — the capture flow in pano.js is untouched (shelved, not
               deleted), so re-enabling it later is a one-line change (drop
               `disabled`, restore `data-addtype="360"`), matching how 3D
               reconstruction was already put on hold in this same menu. -->
          <div class="pp-addmenu-wrap" id="pp-addmenu-wrap">
            <button class="pd-btn pd-btn-primary pp-tb-labeled" id="pp-add" title="Upload photos, video, or other media">
              + Add media <span data-ico="chevronDown" data-ico-size="12"></span></button>
            <div class="pp-addmenu" id="pp-addmenu" hidden>
              <button type="button" class="pp-addmenu-item" data-addtype="photo">
                <span data-ico="camera" data-ico-size="15"></span> Photo</button>
              <button type="button" class="pp-addmenu-item" data-addtype="video">
                <span data-ico="video" data-ico-size="15"></span> Video</button>
              <button type="button" class="pp-addmenu-item" disabled title="360° capture is on hold">
                <span data-ico="compass" data-ico-size="15"></span> 360°</button>
              <button type="button" class="pp-addmenu-item" disabled title="3D reconstruction is on hold">
                <span data-ico="box" data-ico-size="15"></span> 3D</button>
            </div>
          </div>
          <span class="pp-tb-sep" id="pp-sep-photos"></span>
          <button class="pd-btn" id="pp-refresh" title="Reload photos">
            <span data-ico="refresh" data-ico-size="16"></span></button>
          <!-- Selection-mode tools (item 3): replace the row above the moment
               a photo is selected, instead of a separate always-rendered box
               further down the page. module.js's syncChrome() toggles both
               groups together so exactly one is ever visible.
               Owner feedback (item 2): icons instead of words, to compress
               the row — each still carries its label as a title tooltip.
               Delete (item 1) joins the cluster; deleting checks whether any
               selected photo is used in a presentation and warns first. -->
          <span class="pp-selcount-tb" id="pp-selcount" style="display:none;"></span>
          <button class="pd-btn pd-btn-sm" id="pp-sel-download" title="Download" style="display:none;">
            <span data-ico="download" data-ico-size="15"></span></button>
          <button class="pd-btn pd-btn-sm" id="pp-sel-addppr" title="Add to Presentation" style="display:none;">
            <span data-ico="layers" data-ico-size="15"></span></button>
          <button class="pd-btn pd-btn-sm" id="pp-sel-archive" title="Archive" style="display:none;">
            <span data-ico="archive" data-ico-size="15"></span></button>
          <button class="pd-btn pd-btn-sm pd-btn-danger" id="pp-sel-delete" title="Delete" style="display:none;">
            <span data-ico="trash" data-ico-size="15"></span></button>
          <!-- PPR-screen tools. Item 2 parity: a funnel toggle reveals the
               same collapsed-by-default filter panel (#ppr-listbar shares
               the .pp-filters class, so the CSS/behaviour is identical —
               there's no free-text field to search on this screen, just the
               date range + archived toggle). -->
          <button class="pp-topfilttoggle" id="ppr-topfilttoggle" title="More filters" style="display:none;">
            <span data-ico="filter" data-ico-size="16"></span></button>
          <button class="pd-btn pd-btn-primary pp-tb-labeled" id="ppr-new" title="Create a presentation" style="display:none;">+ New Presentation</button>
          <button class="pd-btn" id="ppr-templates" title="Report templates (Section 5)" style="display:none;">
            <span data-ico="layers" data-ico-size="16"></span></button>
          <button class="pd-btn pd-btn-primary pp-tb-labeled" id="ppr-tmpl-new" title="Create a report template" style="display:none;">+ New template</button>
          <!-- PPR multi-select batch actions (item 14) — same swap-in pattern as
               the Gallery's own selection tools: replace "+ New Presentation"
               the moment 1+ rows are checked, restored by
               PPR._syncSelChrome() the moment the selection empties. -->
          <span class="pp-selcount-tb" id="ppr-selcount" style="display:none;"></span>
          <button class="pd-btn pd-btn-sm pp-tb-labeled" id="ppr-sel-download" style="display:none;">Download</button>
          <button class="pd-btn pd-btn-sm pp-tb-labeled" id="ppr-sel-archive" style="display:none;">Archive</button>
          <button class="pd-btn pd-btn-sm pp-tb-labeled" id="ppr-sel-merge" style="display:none;" title="Merge the selected presentations into one (needs 2 or more)">Merge…</button>
          <!-- Floor Plan screen tools. "Place pin" is REMOVED here (item 27:
               pin placement now happens every time a photo is added, via the
               Add Media modal's own in-photo cone widget — see bim.js's
               pinFieldHTML/wirePinField). The Plans screen is upload/browse
               only. -->
          <button class="pd-btn pd-btn-primary pp-tb-labeled" id="bim-new" title="Upload a floor plan" style="display:none;">+ Upload floor plan</button>
        </div>
        <!-- Offline capture queue — visible on every screen (Rounds captures queue too) -->
        <button class="pd-btn pp-syncbtn" id="pp-sync" title="Sync photos captured while offline" hidden>
          <span data-ico="refresh" data-ico-size="14"></span> <span id="pp-sync-n">0</span> pending — Sync now</button>
        <div id="pp-presence" title="People viewing this project"></div>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <!-- ================= Photos Database ================= -->
        <div id="pp-screen-photos">
          <!-- Filters (item 2, 2026-08-30): the panel is closed by default at
               EVERY viewport size now — opened via the topbar's search box /
               funnel toggle (#pp-topsearch / #pp-topfilttoggle), wired in
               module.js. The in-panel #pp-filttoggle button + free-text
               #pp-f-search stay in the DOM for the phone-width fallback and
               for any code that still reads #pp-f-search's value, but the
               VISIBLE search control planners type into now lives in the
               topbar. -->
          <div class="pp-filters" id="pp-filters">
            <button type="button" class="pp-filttoggle" id="pp-filttoggle" title="Show/hide filters">
              <span data-ico="filter" data-ico-size="15"></span> Filters</button>
            <div class="pp-filters-body" id="pp-filters-body">
              <span class="pp-filt-ico" data-ico="filter" data-ico-size="15"></span>
              <!-- The free-text search box now lives in the topbar
                   (#pp-topsearch, item 2) — this hidden input keeps
                   filters.search bound for any code path still reading it by
                   id, but is never shown; the topbar is the one search box a
                   planner types into. -->
              <input class="pd-input pp-search" id="pp-f-search" placeholder="Search description, trade, works, location…" hidden />
              <label class="pp-datefield">Captured
                <input class="pd-input" type="date" id="pp-f-from" title="Filter by capture start" /></label>
              <label class="pp-datefield">to
                <input class="pd-input" type="date" id="pp-f-to" title="Filter by capture end" /></label>
              <select class="pd-select" id="pp-f-trade"><option value="">Trade</option></select>
              <select class="pd-select" id="pp-f-works"><option value="">Works</option></select>
              <div class="pp-locfilters" id="pp-f-loclevels"></div>
              <label class="ppr-allloc"><input type="checkbox" id="pp-f-archived" /> Show archived</label>
              <button class="pp-clear" id="pp-clearfilters" title="Clear all filters" hidden>
                <span data-ico="x" data-ico-size="14"></span>Clear filters</button>
            </div>
          </div>
          <!-- Count + display mode + grouping, using the shared .pd-viewtoggle
               component. Group-by is now ONE control shared by List and
               Gallery (item 6) — previously List always grouped by Trade and
               Gallery had its own separate Month/Year/Location/Activity
               picker; Year and Activity are dropped, Month/Trade/Location
               apply identically to whichever view is active. -->
          <div class="pp-listbar">
            <span class="pp-countbar" id="pp-count"></span>
            <label class="pp-groupby">Group by
              <select class="pd-select" id="pp-groupby">
                <option value="none">None</option>
                <option value="month">Month captured</option>
                <option value="trade">Trade</option>
                <option value="location">Location</option>
              </select>
            </label>
            <!-- Tile size — Gallery/Tile view only (module.js toggles this
                 field's display); the icons either side just label the
                 slider's ends, not their own buttons. Default is 1/3 (see
                 gallerySizeScale in module.js). -->
            <label class="pp-tilesizefield" title="Tile size">
              <span data-ico="gridView" data-ico-size="12"></span>
              <input type="range" id="pp-tilesize" min="0.2" max="2" step="0.05" value="0.3333" />
              <span data-ico="gridView" data-ico-size="18"></span>
            </label>
            <!-- Fifth round item 7: markup now shows by default on every
                 tile that has any; this is the one shared switch to hide it
                 (the lightbox's own markup-toggle button drives and reflects
                 the SAME preference, see openLightbox/markupGlobalVisible). -->
            <button class="pd-btn pp-mkvistoggle" id="pp-mkvistoggle" title="Show/hide markup on photo tiles">
              <span data-ico="eye" data-ico-size="15"></span> Markup</button>
            <!-- Slow-loading fix for OLDER photos: a real thumbnail file is
                 generated + stored (thumb_url) for every NEW upload since
                 the 2026-08-30 round (see thumbUrlOf()/uploadThumbnailFor()
                 in module.js) — but that never reached photos captured
                 BEFORE that shipped, which still load full-resolution on
                 every request. This one-click backfill (planner+ only,
                 hidden when nothing needs it) generates + stores real,
                 small preview files for those older rows too, so the app
                 fetches a small file for them from now on instead of
                 recomputing/re-downloading the full original every time. -->
            <button class="pd-btn" id="pp-genthumbs" title="" style="display:none;">
              <span data-ico="refresh" data-ico-size="14"></span> Generate thumbnails</button>
            <span class="pp-genthumbs-prog" id="pp-genthumbs-prog" style="display:none;"></span>
            <!-- Item 3: Tile (Gallery) is the DEFAULT view (module.js's own
                 `view = 'gallery'`), so its button leads the group — List
                 moves to second place. -->
            <div class="pd-viewtoggle" role="tablist">
              <button class="pd-vt active" data-view="gallery" title="Tile view">
                <span data-ico="gridView" data-ico-size="15"></span></button>
              <button class="pd-vt" data-view="list" title="List view">
                <span data-ico="listView" data-ico-size="15"></span></button>
              <!-- Item 16 — Plan moves here from the Plans tab (which keeps
                   only "all plans", item 15). ⚠️ Round-2 item 7 (2026-09-02)
                   REMOVES Stack view entirely (owner: "remove stack view for
                   the photos") — its button, and every renderStackView/
                   wireStackView/stackGrid/mostRecentAsOf function it alone
                   drove, are gone; see module.js's own retirement comment. -->
              <button class="pd-vt" data-view="plan" title="Plan view — floor plan with photos clustered by location">
                <span data-ico="compass" data-ico-size="15"></span></button>
            </div>
          </div>
          <!-- 360° panoramas + 3D scans render INSIDE #pp-view now (items
               6/8, current round) -- merged into the same date/trade/location
               grouping as ordinary photos via mergedRows(), not a separate
               strip below the grid. pano.js/recon.js's own capture flows are
               unchanged and reached via the "+ Capture 360°"/"+ Request 3D
               scan" buttons in the topbar above; opening/editing one from the
               grid dispatches to PANO.open/RECON.openById or this module's
               own openMediaKindEditor, per tile kind. -->
          <div id="pp-view"></div>
        </div>

        <!-- ================= PPR Presentations ================= -->
        <div id="pp-screen-ppr" hidden>
          <div class="pp-filters" id="ppr-listbar">
            <span class="pp-filt-ico" data-ico="filter" data-ico-size="15"></span>
            <label class="pp-datefield">Presentation date
              <input class="pd-input" type="date" id="ppr-f-from" title="Filter by presentation date start" /></label>
            <label class="pp-datefield">to
              <input class="pd-input" type="date" id="ppr-f-to" title="Filter by presentation date end" /></label>
            <select class="pd-select" id="ppr-f-reporttype" title="Filter by report type">
              <option value="">Report Type: All</option>
              <option value="internal">Internal</option>
              <option value="client">External (Client)</option>
            </select>
            <label class="ppr-allloc"><input type="checkbox" id="ppr-f-archived" /> Show archived</label>
            <button class="pp-clear" id="ppr-clearfilters" title="Clear all filters" hidden>
              <span data-ico="x" data-ico-size="14"></span>Clear filters</button>
          </div>
          <div class="pp-listbar" id="ppr-countbar">
            <span class="pp-countbar" id="ppr-count"></span>
          </div>
          <div id="ppr-view"></div>
          <!-- Report Templates (brief Section 5 / Phase 2) — a management view
               reached from the Presentations screen, since running one produces an
               ordinary presentation rather than being its own kind of record. -->
          <div id="ppr-tmpl-wrap" hidden><div id="ppr-tmpl-view"></div></div>
        </div>

        <!-- ================= Panoramic Capture (brief Section 6 / Phase 3) ================= -->
        <div id="pp-screen-pano" hidden>
          <div id="pano-view"></div>
        </div>

        <!-- ================= 3D Reconstruction Requests (brief 6A / Phase 4) ================= -->
        <div id="pp-screen-recon" hidden>
          <div id="recon-view"></div>
        </div>

        <!-- ================= Floor Plan overlay (brief 6B / Phase 5) ================= -->
        <div id="pp-screen-bim" hidden>
          <div id="bim-view"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen photo viewer (the Power Apps expand button) -->
  <div class="pp-lightbox" id="pp-lightbox" hidden>
    <div class="pp-lb-tools" id="pp-lb-tools">
      <button class="pp-lb-tool" id="pp-lb-download" title="Download"><span data-ico="download" data-ico-size="16"></span></button>
      <!-- Round-2 item 3 (2026-09-02): the Zoom out/in buttons that used to
           sit here are GONE — "instead of zoom buttons in the image pop-up,
           have a magnifier instead" (see .pp-lb-magnifier below, and
           wireLightboxMagnifier in module.js). -->
      <!-- Owner feedback (item 5): markup/adjust are icon-only now, matching
           every other lightbox tool — the text labels these carried (added
           when Markup was one bare icon among five and easy to miss) are
           gone; the title attribute still names each tool on hover.
           ⚠️ The markup SHOW/HIDE toggle itself is NOT duplicated here — it
           already lives in the right-hand tools cluster below
           (#pp-lb-markuptoggle, owner feedback item 6); a second element
           with the same id would be an invisible duplicate-DOM-id bug. -->
      <button class="pp-lb-tool" id="pp-lb-markupedit" title="Add or edit markup on this photo — pencil, shapes, icons, text">
        <span data-ico="palette" data-ico-size="16"></span></button>
      <button class="pp-lb-tool" id="pp-lb-adjustedit" title="Adjust exposure, brightness, contrast and sharpness">
        <span data-ico="sliders" data-ico-size="16"></span></button>
      <button class="pp-lb-tool" id="pp-lb-edit" title="Edit details"><span data-ico="pencil" data-ico-size="16"></span></button>
      <button class="pp-lb-tool pp-lb-tool-danger" id="pp-lb-delete" title="Delete"><span data-ico="trash" data-ico-size="16"></span></button>
    </div>
    <!-- Owner feedback (item 6): show/hide Key Plan and show/hide Markup move
         to their own cluster on the RIGHT, immediately to the left of the
         close button — everything else stays in the left-hand tool cluster
         above. Item 4 (11-item round): key-plan is shown/hidden per photo in
         paintLightbox() (only when BIM.pinInfoFor resolves a pin for the item
         currently open); Item 7 (markup toggle) is the shared show/hide-
         markup-on-tiles preference. -->
    <div class="pp-lb-tools-right" id="pp-lb-tools-right">
      <button class="pp-lb-tool" id="pp-lb-keyplan" title="Show/hide key plan" style="display:none"><span data-ico="mapPin" data-ico-size="16"></span></button>
      <button class="pp-lb-tool" id="pp-lb-markuptoggle" title="Show/hide markup"><span data-ico="eye" data-ico-size="16"></span></button>
    </div>
    <button class="pp-lb-close" id="pp-lb-close" title="Close (Esc)">×</button>
    <button class="pp-lb-btn pp-lb-prev" id="pp-lb-prev" title="Previous (←)">‹</button>
    <div class="pp-lb-imgwrap" id="pp-lb-imgwrap">
      <img class="pp-lb-img" id="pp-lb-img" alt="" />
      <video class="pp-lb-img" id="pp-lb-video" controls playsinline hidden></video>
      <canvas class="pp-lb-markup" id="pp-lb-markup-canvas"></canvas>
      <!-- Round-2 item 3: the magnifier lens — hidden until the pointer moves
           over the photo (wireLightboxMagnifier in module.js). -->
      <div class="pp-lb-magnifier" id="pp-lb-magnifier"></div>
      <!-- Item 4: the key-plan corner overlay, top-right, sized to 1/8 of the
           photo by paintKeyPlanOverlay(). Item 7 (owner feedback): it must
           always include the pin itself and, when recorded, the camera-
           facing direction cone — not just the bare plan image — so it's a
           small stage (img + pin + cone), not a lone <img>. -->
      <div class="pp-lb-kpoverlay" id="pp-lb-keyplan-overlay" hidden>
        <img id="pp-lb-keyplan-overlay-img" alt="Key plan" />
        <span class="pp-lb-kpoverlay-pin" id="pp-lb-keyplan-overlay-pin" hidden></span>
        <span class="pp-lb-kpoverlay-cone" id="pp-lb-keyplan-overlay-cone" hidden></span>
        <!-- Round-2 item 4: drag the bottom-left corner to temporarily resize
             the overlay (wireLightboxKpResizeDrag in module.js) — the box is
             pinned top/right, so only the width changes; the <img>'s own
             natural aspect ratio keeps the height following. -->
        <div class="pp-lb-kpoverlay-resize" id="pp-lb-keyplan-resize" title="Drag to resize"></div>
      </div>
    </div>
    <button class="pp-lb-btn pp-lb-next" id="pp-lb-next" title="Next (→)">›</button>
    <div class="pp-lb-cap" id="pp-lb-cap"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Report export libraries (brief Section 5): both loaded exactly as this
       app's other feature libraries are (SheetJS/html2pdf.js elsewhere) — a
       single pinned-version <script> tag, no build step. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <!-- Panoramic capture (brief Section 6 / Phase 3): OpenCV.js for client-side
       feature-matching/stitching (WASM, ~10MB — loaded only on this module's
       page, never blocks any other module), Three.js for the 360° viewer.
       Both pinned versions, verified to resolve before committing to them. -->
  <script src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <!-- 3D Reconstruction viewer (brief 6A / Phase 4): the official Three.js
       r128 PLYLoader (classic global THREE.PLYLoader), same pinned Three.js
       revision as the 360° viewer above — one version of THREE for the page. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
  <script src="../../assets/js/config.js?v=20260902a"></script>
  <script src="../../assets/js/auth.js?v=20260901b"></script>
  <script src="../../assets/js/db.js?v=20260901d"></script>
  <script src="../../assets/js/program.js?v=20260827a"></script>
  <script src="../../assets/js/ui.js?v=20260902c"></script>
  <script src="../../assets/js/icons.js?v=20260902f"></script>
  <script src="../../assets/js/offline.js?v=20260812b"></script>
  <script src="../../assets/js/collab.js?v=20260812b"></script>
  <script src="../../assets/js/autosave.js?v=20260812b"></script>
  <script src="module.js?v=20260902g"></script>
  <script src="ppr.js?v=20260902g"></script>
  <script src="pano.js?v=20260901d"></script>
  <script src="recon.js?v=20260830b"></script>
  <script src="bim.js?v=20260902g"></script>
  <script>
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      UI.initShell();
      var pname = sessionStorage.getItem('pd_project_name') || sessionStorage.getItem('pd_project') || '';
      UI.renderNav(document.getElementById('side-nav'), 'project', {
        active: 'progress-photos', base: '../../', pname: pname, modules: APP_CONFIG.MODULES,
      });
      // Item 6: Gallery/Presentations/Plans as a Project-Schedule-style
      // dropdown instead of a flat tab row.
      UI.tabsToDropdown('.pp-tabs');
      // ⚠️ Each sub-module's init() is isolated in its own try/catch. Before
      // this, a throw anywhere in ProgressPhotos.init()/PPR.init()/etc. (e.g.
      // a project load failing, or any future bug in one file) aborted every
      // init() call AND the tab-wiring/setScreen() block below it, since none
      // of this ran inside a try — the module.js's own openModal() recursion
      // bug (2026-08-30) demonstrated exactly how one un-caught throw upstream
      // can silently strand the whole page's interactive state. Isolating each
      // init() call means a failure in, say, BIM.init() can no longer prevent
      // PPR's or the top-level screen switch's setup from running — and it is
      // reported instead of silently vanishing into the console.
      function safeInit(fn, label) {
        try { fn(); } catch (e) { console.error('[progress-photos] ' + label + ' init failed:', e); }
      }
      safeInit(function () { ProgressPhotos.init(user, profile); }, 'ProgressPhotos');
      safeInit(function () { PPR.init(user, profile); }, 'PPR');
      safeInit(function () { PANO.init(user, profile); }, 'PANO');
      safeInit(function () { RECON.init(user, profile); }, 'RECON');
      safeInit(function () { BIM.init(user, profile); }, 'BIM');

      if (document.getElementById('pp-lb-close')) document.getElementById('pp-lb-close').onclick = ProgressPhotos._closeLightbox;
      if (document.getElementById('pp-lb-prev')) document.getElementById('pp-lb-prev').onclick  = function () { ProgressPhotos._stepLightbox(-1); };
      if (document.getElementById('pp-lb-next')) document.getElementById('pp-lb-next').onclick  = function () { ProgressPhotos._stepLightbox(1); };

      // Top-level screen switch (Photos / PPRs) — each screen owns its own tools.
      // ⚠️ 'pp-addmenu-wrap' (not just 'pp-add', the button inside it) — the
      // "+ Add media" DROPDOWN (#pp-addmenu) is an absolutely-positioned
      // SIBLING of the button, not a child, so hiding only the button left
      // an already-open dropdown floating on top of every other screen with
      // no visible trigger (see ProgressPhotos._leavePhotosScreen, which
      // also force-closes it). Hiding the whole wrap hides both regardless
      // of the dropdown's own open/closed state.
      var PHOTO_TOOLS = ['pp-add', 'pp-addmenu-wrap', 'pp-sep-photos', 'pp-refresh', 'pp-topsearch-wrap', 'pp-topfilttoggle'];
      var curScreen = 'photos', histScreen = null;
      function show(ids, on) {
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.style.display = on ? '' : 'none';
        });
      }
      function setScreen(s) {
        curScreen = s;
        // Rounds is gone entirely (2026-08-29 feedback: "Rounds can be
        // removed"), and 360°/3D no longer have their own tabs either
        // ("360 and 3D should be incorporated in the Gallery") — Gallery is
        // now the only screen besides Presentations and Plans, so a stale
        // `pp_screen` value from before this change (e.g. 'rounds') must NOT
        // reach here: ProgressPhotos.renderRounds() no longer exists, and
        // calling it would throw and break the whole page load for anyone
        // who had Rounds open when this shipped. The restore-list below
        // filters that out before setScreen is ever called with it.
        var isPpr = s === 'ppr', isBim = s === 'bim';
        var isPhotos = !isPpr && !isBim;
        document.getElementById('pp-screen-photos').hidden = !isPhotos;
        document.getElementById('pp-screen-ppr').hidden = !isPpr;
        document.getElementById('pp-screen-bim').hidden = !isBim;
        // There is no module title element any more (removed per owner
        // feedback — it duplicated the module's own name, which the first
        // tab now carries directly: "Progress Photos"). The .pp-tab active
        // state is the only place a screen's name is ever shown.
        // ⚠️ Every one of these four calls is now isolated. Before, a throw
        // in ANY of them (e.g. PPR._syncTools reading `screen` before PPR.init
        // ever ran, because safeInit() above swallowed an earlier failure)
        // aborted setScreen() partway through — and since `show(PHOTO_TOOLS,
        // isPhotos)` had already run but PPR._syncTools/BIM._syncTools had
        // not, the Gallery's own "+ Add media" would be correctly shown while
        // "+ New Presentation"/"+ Upload floor plan" were left showing
        // whatever they last were (their initial inline `display:none` is
        // safe on first load, but NOT safe after switching screens once).
        // Wrapping each call means one module's bug can never leave another
        // module's topbar button stuck in the wrong screen's state.
        function safeSync(fn, label) {
          try { fn(); } catch (e) { console.error('[progress-photos] ' + label + ' syncTools failed:', e); }
        }
        safeSync(function () { show(PHOTO_TOOLS, isPhotos); }, 'Gallery tools');
        // Each module re-asserts its own tools' visibility (role + inner screen).
        safeSync(function () { PPR._syncTools(isPpr); }, 'PPR');
        // pano.js/recon.js's own screens (#pp-screen-pano/#pp-screen-recon)
        // stay in the DOM, permanently hidden — their load()/render() both
        // bail out early if their host div is missing, and PANO.ensureLoaded/
        // RECON.ensureLoaded (called from ProgressPhotos.load()) depend on
        // that div existing to populate panoramas/requests for the media
        // strip below. Their own capture-button toggling (PANO._syncTools/
        // RECON._syncTools) is no longer called — the buttons it targets
        // (#pano-new/#pano-compare-btn/#recon-new) were removed from this
        // page (2026-08-29 feedback item 2); calling it would just be a
        // harmless no-op, but there is nothing left for it to do.
        safeSync(function () { BIM._syncTools(isBim); }, 'BIM');
        // ⚠️ Audit fix: a batch selection made on Gallery used to survive a
        // tab switch — its selection-only toolbar (count/Download/Add to
        // Presentation/Archive) stayed visible on top of whichever screen
        // opened next, and the checkboxes stayed silently checked in memory
        // for a planner who had moved on and forgotten what was selected.
        safeSync(function () { if (isPhotos) ProgressPhotos._syncChrome(); else ProgressPhotos._leavePhotosScreen(); }, 'Gallery chrome');
        Array.prototype.forEach.call(document.querySelectorAll('.pp-tab[data-screen]'), function (b) {
          b.classList.toggle('active', b.dataset.screen === s);
        });
        try { localStorage.setItem('pp_screen', s); } catch (e) {}
      }
      Array.prototype.forEach.call(document.querySelectorAll('.pp-tab[data-screen]'), function (b) {
        b.onclick = function () { setScreen(b.dataset.screen); if (histScreen) histScreen.push(); };
      });
      var saved = 'photos';
      try { saved = localStorage.getItem('pp_screen') || 'photos'; } catch (e) {}
      setScreen(['ppr', 'bim'].indexOf(saved) >= 0 ? saved : 'photos');
      // Browser Back/Forward steps through the top-level screen (Gallery /
      // Presentations / Plans) instead of leaving the module straight to the
      // launcher — the app-wide history-state pattern (MODULE_CONTRACT.md
      // §"Browser Back..."). Deliberately scoped to just this one switch, not
      // every in-page view this module has (List/Gallery/Plan/Stack, the PPR
      // slide editor, the Plans pan/zoom state, …) — those are read from/
      // written to their own localStorage keys already and wiring all of them
      // into the URL is a separate, larger pass on a file this actively
      // developed elsewhere the same day.
      histScreen = UI.bindHistoryState({
        key: 'pp_screen',
        get: function () { return { s: curScreen }; },
        apply: function (state) { setScreen(state.s); }
      });
    });
  </script>
