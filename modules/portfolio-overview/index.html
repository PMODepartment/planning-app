<!-- ⚠️ BACK, and deliberately. This page dropped the curve engine on 2026-09-16 (g) when the

<script>
(function () {
  'use strict';
  var PROJ = [], GH = [], ghById = {};
  var groupMode = 'grouphead', statusFilter = '', behindOnly = false, query = '';
  var projSel = {};   // {projectId: true} for checked projects — empty object = no filter (all projects)
  var sortCol = 'name', sortDir = 1, collapsed = {};
  var view = 'overview';   // 'overview' | 'scurve' | 'cashflow'

  function sb() { return AppAuth.getSB(); }
  function esc(s) { return Fmt.esc(s); }
  function num(v) { return Number(v) || 0; }
  function pd(v) { if (!v) return null; var m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }

  // ---- group head (the flat tag that replaced the workspace tree) ----
  // Same resolver as dashboard.html and projects.html. No ancestry to walk:
  // Workspace and Program grouping are gone because those levels no longer
  // exist — group head IS the portfolio's structure now.
  function groupHead(p) {
    if (!p || !p.group_head_id) return null;
    var g = ghById[p.group_head_id];
    return g ? g.name : p.group_head_id;
  }

  // ---- derived per-project fields ----
  function progressOf(p) { return p.schedule_progress != null ? Math.max(0, Math.min(100, num(p.schedule_progress))) : null; }
  function isOverdue(p) { var f = pd(p.forecast_finish || p.schedule_finish || p.end_date); var pr = progressOf(p); return !!(f && f < today() && (pr == null || pr < 100)); }
  function isBehind(p) {
    // slipped vs baseline finish, or overdue-and-incomplete
    var sf = pd(p.schedule_finish), ff = pd(p.forecast_finish);
    if (sf && ff && sf > ff) return true;
    return isOverdue(p);
  }
  function health(p) { if (progressOf(p) == null) return 'none'; return isBehind(p) ? 'behind' : 'ontrack'; }
  var HEALTH = { ontrack: { label: 'On Track', color: '#1f8f4e' }, behind: { label: 'Behind', color: '#C42127' }, none: { label: 'No Schedule', color: '#9a9a9a' } };
  function variance(p) { return num(p.estimated_cost) - num(p.original_budget); }

  /* ── PARENT PROJECT (consolidating contract packages) ───────────────────────
     Owner, 2026-08-27: *"Avesta Residences Tower 1 and General Requirements (AVR101)
     and Avesta Residences Towers 2-7 (AVR102) reported to be of the same project but
     treated as separate… Let's just consolidate the two into a portfolio view, similar
     to how procurement dashboard works."*

     Ported from the Procurement dashboard, which solved this first (wpm/index.html,
     `_progKey` / `_progLabel` / `_progTotals`). The key is the LEADING LETTERS of the
     project code — AVR101 and AVR102 both key to AVR — overridable per project by a
     `program` column if one is ever added.

     ⚠️ THE PREFIX IS NOT A GUESS. It is the convention every project id in this
        portfolio already follows (AVR101, BAU101, GPR101, SLN101, SLT101), so this needs
        no data entry to start working. A project whose prefix is unique simply forms a
        group of one and reads exactly as it does today.
     ⚠️ IT IS A ROLLUP, NOT A MERGE, and that is the whole design. The alternative — one
        Planners project "Avesta" holding AVR101/AVR102 as `packages` rows — is what
        produced the AVR101 › {AVR101, AVR102} nesting, and it breaks the cross-app link:
        `push-packages` resolves ONE downstream project per Planners project
        (cash_flow_settings.wpm_project_id), while WPM and Engineering each hold AVR101
        and AVR102 as separate projects. Keeping the rows separate keeps that 1:1. */
  /* ⚠️ ONE DEFINITION, IN assets/js/program.js. This screen solved the rollup
     first and carried a private copy; the owner then asked for the same
     grouping app-wide ("let's do a global approach for this in the planning-app
     first"), so the copy is gone rather than left beside the shared helper —
     two screens disagreeing about which projects are "the same project" is the
     exact confusion this exists to end. See program.js for the prefix rule, the
     shared-name label and why this is a rollup and not a merge. */
  function progKey(p) { return PDProgram.keyOf(p); }
  function progLabel(key, plist) { return PDProgram.labelOf(key, plist); }

  function groupKeyOf(p) {
    if (groupMode === 'grouphead') { return groupHead(p) || '(No group head)'; }
    if (groupMode === 'program') { return progKey(p); }
    if (groupMode === 'status') { return (p.status || 'active'); }
    return 'All Projects';
  }
  /* The key groups; this names. They differ only in program mode, where the key is the
     code prefix (AVR) and the name is the shared title (Avesta Residences). Collapse
     state and sorting stay on the KEY, so a rename never loses a collapsed group. */
  function groupDisplayOf(key, plist) {
    return groupMode === 'program' ? progLabel(key, plist) : key;
  }

  function projSelCount() { return Object.keys(projSel).length; }
  function filtered() {
    var q = query.trim().toLowerCase();
    return PROJ.filter(function (p) {
      if (projSelCount() && !projSel[p.id]) return false;
      if (statusFilter && (p.status || 'active') !== statusFilter) return false;
      if (behindOnly && !isBehind(p)) return false;
      if (q) { var hay = ((p.name || '') + ' ' + (p.id || '') + ' ' + (groupHead(p) || '')).toLowerCase(); if (hay.indexOf(q) === -1) return false; }
      return true;
    });
  }

  /* ==========================================================================
     THE OVERVIEW IS A DECISION SURFACE, NOT A REGISTER
     ==========================================================================
     It used to report LEVELS — eight cards, a donut and a bar chart. "Portfolio
     Progress 10%" is a level; "8 percentage points behind plan" is a decision. The
     shape here is the one the Contracts portfolio view arrived at on 2026-09-15 (q):
     a strip of exposures, then projects RANKED by how much attention they need, then
     the register kept underneath because the page is also used to find one project.

     ⚠️⚠️ THE FIRST PAINT COSTS NOTHING AND IS NOT WAITED FOR. Everything below renders
     from PROJ, which is already in memory; the four reads that enrich it land
     independently and repaint as they arrive. A landing page that blocks on four
     round trips is the defect this module just spent two commits removing.
     ⚠️ Each read owns its own slice and its own error. One failing does not blank the
     others, and every block says which of its inputs is missing rather than printing
     a confident zero. */
  var ovX = { ids: null, status: null, claims: null, ms: null, iss: null, curve: null, err: {} };
  var _ovGen = 0;

  function ovReset() { ovX = { ids: null, status: null, claims: null, ms: null, iss: null, curve: null, err: {} }; }

  async function loadOverview(force) {
    var ids = scopedProjectIds();
    if (!force && ovX.ids && ovX.ids.join(',') === ids.join(',')) return;
    var gen = ++_ovGen;
    ovReset(); ovX.ids = ids;
    if (!ids.length) { renderAll(); return; }

    function settle(key, p, shape) {
      return p.then(function (v) { if (gen === _ovGen) { ovX[key] = shape ? shape(v) : v; renderAll(); } })
              .catch(function (e) { if (gen === _ovGen) { ovX.err[key] = e; renderAll(); } });
    }

    /* ⚠️ `schedule_scurve_status` is ONE pass per project with no month series — see
       migrations/2026-09-15-scurve-status-per-project.sql for why this is not an
       extension of the curve RPC. Absent (un-migrated) it degrades: the behind-plan
       column and card say so by name instead of showing a wrong number. */
    settle('status', sb().rpc('schedule_scurve_status', { p_ids: ids }).then(function (r) {
      if (r.error) throw r.error;
      var by = {};
      (r.data || []).forEach(function (row) { by[row.project_id] = row; });
      return by;
    }));

    settle('claims', PDb.selectAll('contracts_claims', function (q) { return q.in('project_id', ids); }));

    settle('ms', PDb.selectAll('project_schedule', function (q) {
      return q.in('project_id', ids).or('activity_type.ilike.%milestone%,program_milestone.is.true');
    }, 'id,project_id,activity_name,activity_type,program_milestone,start_date,end_date,actual_finish,percent_complete'));

    /* ⚠⚠ ONE AGGREGATE CALL PER PROJECT, through the SHARED fan-out in PDScurve — never
       `schedule_scurve_agg_multi`. That one CROSS JOINs its month series against its leaf
       activities, so the cost is combinatorial in the project count; it was cancelled at the ~8s
       statement_timeout (57014) the first time a planner opened the portfolio S-Curve on
       2026-09-16, and this is the LANDING PAGE. The fan-out is the same SQL with one id, which is
       the shape `project_schedule_proj_id_idx` exists for.
       ⚠ One project failing does not fail the chart — `failed` is collected and counted, and the
       rest still draw. ⚠ The merge's carry-forward is what stops the curve dipping every time a
       project completes; it lives in PDScurve beside the fan-out. */
    settle('curve', (async function () {
      var r = await PDScurve.fanOutAgg(function (id) {
        return sb().rpc('schedule_scurve_agg', { p_id: id });
      }, ids, {});
      var merged = PDScurve.mergeAggs(r.aggs);
      return { curve: merged ? PDScurve.computeFromAgg(merged) : { empty: true },
               drawn: r.aggs.length, failed: r.failed.length };
    })());

    settle('iss', PDb.selectAll('issues_lessons', function (q) { return q.in('project_id', ids); },
      'id,project_id,status,priority'));
  }

  /* ---- per-project derivations ------------------------------------------ */
  /* ⚠️ Behind plan is (actual − planned) as a share of the project's own duration
     weight, so a big project and a small one are on the same scale. NEGATIVE is
     behind. ⚠️ Measured AS OF TODAY; the S-Curve tab's own strip snaps to the end of
     the current month because its curve is monthly, so the two can differ by a few
     points inside one month. Stated in the note rather than left to be discovered. */
  function behindPP(p) {
    var r = ovX.status && ovX.status[p.id];
    if (!r || !(+r.tot_dur > 0)) return null;
    return ((+r.done_dur - +r.planned_dur) / +r.tot_dur) * 100;
  }
  /* Days the live programme runs past the finish this page DISPLAYS.
     ⚠️ `forecast_finish || end_date` — the same rule the table's Forecast Finish column,
     its sort and projects.html all use. `isBehind` still reads the bare forecast_finish
     and so never tests a project with only a contract date; that asymmetry is the owner's
     open decision, and this column deliberately does not pretend it is settled. */
  function slipDays(p) {
    var sf = pd(p.schedule_finish), cf = pd(p.forecast_finish || p.end_date);
    if (!sf || !cf) return null;
    return Math.round((sf - cf) / 86400000);
  }
  function claimsOf(pid) {
    if (!ovX.claims) return null;
    var rows = ovX.claims.filter(function (r) { return r.project_id === pid; });
    var cash = rows.filter(function (r) { return PDClaims.typeOf(r) !== PDClaims.T_EOT; });
    var eots = PDClaims.ofType(rows, PDClaims.T_EOT);
    var pend = PDClaims.pendingValue(cash, 'eval_amount', 'sub_amount');
    var shortf = PDClaims.shortfallOf(cash, 'sub_amount', 'approved_amount');
    var agg = PDClaims.agingBuckets(cash, ['eval_amount', 'sub_amount']);
    return { exposure: pend + shortf, oldest: agg.oldest,
             eotDays: PDClaims.pendingValue(eots, 'eval_days', 'sub_days') };
  }
  function openIssues(pid) {
    if (!ovX.iss) return null;
    return ovX.iss.filter(function (r) {
      return r.project_id === pid && String(r.status || '').toLowerCase() !== 'closed';
    }).length;
  }

  /* ⚠️⚠️ THE RANK IS AN ORDERING OVER SIGNALS, NEVER A SINGLE SCORE. Days, money and
     counts are not commensurable, and a made-up composite number would present them as
     if they were — this page already carries THREE different progress weightings and
     does not need a fourth invented quantity. So: how many of five signals are raised,
     then the worst slip in days, then the name. The note under the table says exactly
     that, because a ranked list with an unexplained order is not a decision surface. */
  function flagsOf(p) {
    var f = [], bp = behindPP(p), sl = slipDays(p), cl = claimsOf(p.id), oi = openIssues(p.id);
    if (bp != null && bp <= -5) f.push('behind plan');
    if (sl != null && sl > 0) f.push('past its committed finish');
    if (isOverdue(p)) f.push('overdue');
    if (variance(p) > 0) f.push('over budget');
    if (cl && cl.exposure > 0) f.push('unrecovered exposure');
    return f;
  }
  function rankSort(a, b) {
    var fa = flagsOf(a).length, fb = flagsOf(b).length;
    if (fa !== fb) return fb - fa;
    var sa = slipDays(a) || 0, sb2 = slipDays(b) || 0;
    if (sa !== sb2) return sb2 - sa;
    return (a.name || a.id).localeCompare(b.name || b.id);
  }

  function ppCell(p) {
    var v = behindPP(p);
    if (v == null) return '<span class="po-dash">—</span>';
    var t = (v > 0 ? '+' : '') + v.toFixed(1) + ' pp';
    return '<span class="' + (v <= -5 ? 'po-bad' : v < 0 ? 'po-warn' : 'po-ok') + '">' + t + '</span>';
  }
  function slipCell(p) {
    var v = slipDays(p);
    if (v == null) return '<span class="po-dash">—</span>';
    if (v <= 0) return '<span class="po-ok">' + v + 'd</span>';
    return '<span class="' + (v > 30 ? 'po-bad' : 'po-warn') + '">+' + v + 'd</span>';
  }
  function expCell(p) {
    var c = claimsOf(p.id);
    if (!c) return '<span class="po-dash">' + (ovX.err.claims ? '?' : '…') + '</span>';
    if (!c.exposure) return '<span class="po-dash">—</span>';
    return '<span class="' + (c.oldest > 90 ? 'po-bad' : c.oldest > 60 ? 'po-warn' : '') + '">' +
      Fmt.moneyShort(c.exposure) + '</span>';
  }
  function issCell(p) {
    var n = openIssues(p.id);
    if (n == null) return '<span class="po-dash">' + (ovX.err.iss ? '?' : '…') + '</span>';
    return n ? String(n) : '<span class="po-dash">—</span>';
  }

  function renderRank(list) {
    var host = document.getElementById('po-rank');
    var cnt = document.getElementById('po-rank-count');
    var note = document.getElementById('po-ranknote');
    if (!host) return;
    var sorted = list.slice().sort(rankSort);
    var flagged = sorted.filter(function (p) { return flagsOf(p).length; }).length;
    cnt.textContent = flagged ? flagged + ' of ' + sorted.length + ' need attention'
                              : sorted.length ? 'nothing is flagged' : '';
    if (!sorted.length) {
      host.innerHTML = '<tbody><tr><td class="po-empty">No projects match the current filters.</td></tr></tbody>';
      note.textContent = ''; return;
    }
    var head = '<thead><tr><th>Project</th><th>Behind plan</th><th>Past committed finish</th>' +
      '<th class="num">Budget variance</th><th class="num">Unrecovered exposure</th>' +
      '<th class="num">Open issues</th></tr></thead>';
    var body = sorted.map(function (p) {
      var f = flagsOf(p);
      return '<tr class="po-row" data-pick="' + esc(p.id) + '" title="' +
        esc(f.length ? f.join(' · ') : 'nothing flagged') + '">' +
        '<td><span class="po-proj-name"><span class="po-health" style="background:' +
          HEALTH[health(p)].color + ';"></span>' + esc(p.name || p.id) + '</span></td>' +
        '<td>' + ppCell(p) + '</td>' +
        '<td>' + slipCell(p) + '</td>' +
        '<td class="num">' + varCell(p) + '</td>' +
        '<td class="num">' + expCell(p) + '</td>' +
        '<td class="num">' + issCell(p) + '</td></tr>';
    }).join('');
    host.innerHTML = head + '<tbody>' + body + '</tbody>';
    host.querySelectorAll('.po-row[data-pick]').forEach(function (r) {
      r.onclick = function () { openProject(r.dataset.pick); };
    });

    var measured = list.filter(function (p) { return behindPP(p) != null; }).length;
    note.innerHTML = 'Ordered by how many of five signals are raised — behind plan, past its ' +
      'committed finish, overdue, over budget, unrecovered exposure — then by the worst slip in ' +
      'days. <b>Projects with nothing flagged are still listed, at the bottom</b>, showing dashes ' +
      'rather than zeros. Days, money and counts stay in their own columns: there is no combined ' +
      'score, because they are not the same kind of quantity. ' +
      (ovX.status
        ? '<b>Behind plan</b> is measured as of today over ' + measured + ' of ' + list.length +
          ' project(s); the S-Curve tab snaps to the end of the current month, so the two can ' +
          'differ slightly inside one month.'
        : ovX.err.status
          // ⚠️ The advice belongs HERE, not in PDb.errText: this screen carries the project
          //    filter it names. The module pages that share that helper do not.
          ? '<b>Behind plan</b> is unavailable — ' + esc(PDb.errText(ovX.err.status)) +
            (/timeout/.test(PDb.errText(ovX.err.status)) ? '; narrow the project filter and try again' : '') + '.'
          : '<b>Behind plan</b> is still loading.');
  }

  /* ⚠️ What the page could NOT see. The old strip did this for ONE figure (it reported
     whether its progress number was weighted or a plain mean, and over how many
     projects); this generalises it, because every figure above is only as good as the
     inputs that reached it. ⚠️ A comment naming a function that has been deleted is
     worse than none, so it describes the behaviour rather than citing the old name. */
  function renderCoverage(list) {
    var el = document.getElementById('po-coverage');
    if (!el) return;
    if (!list.length) { el.textContent = ''; return; }
    var noRollup = list.filter(function (p) { return !p.schedule_updated_at; }).length;
    var stale = list.filter(function (p) {
      if (!p.schedule_updated_at) return false;
      return (Date.now() - new Date(p.schedule_updated_at).getTime()) > 30 * 86400000;
    }).length;
    var noBudget = list.filter(function (p) { return !(num(p.original_budget) > 0); }).length;
    var bits = [];
    if (noRollup) bits.push('<b>' + noRollup + '</b> carry no schedule roll-up at all');
    if (stale) bits.push('<b>' + stale + '</b> were last rolled up more than 30 days ago');
    if (noBudget) bits.push('<b>' + noBudget + '</b> carry no original budget');
    Object.keys(ovX.err).forEach(function (k) {
      bits.push('the ' + ({ status: 'behind-plan', claims: 'commercial', ms: 'milestone',
                            iss: 'issues' }[k] || k) + ' read failed');
    });
    el.innerHTML = bits.length
      ? 'Of the ' + list.length + ' project(s) in scope, ' + bits.join('; ') +
        ' — so the figures above are computed over what is there, not over all of them.'
      : 'All ' + list.length + ' project(s) in scope carry a schedule roll-up and a budget.';
  }

  /* ⚠️⚠️ FOUR FIGURES, EACH TRIGGERING A DIFFERENT ACTION — replacing eight cards of
     which four restated money the portfolio has not captured. Anything that cannot be
     computed says so; a computed 0 and an absent figure are different statements, and
     printing them the same way is what made the old strip read as broken. */
  function renderKPIs(list) {
    var host = document.getElementById('po-kpis');
    if (!host) return;

    /* 1 · Behind plan — the one number this page exists to show. Weighted by duration
       across the whole scope, so a 16,000-activity tower is not one vote beside a
       fit-out. ⚠️ NEGATIVE is behind. */
    var tot = 0, plan = 0, done = 0, measured = 0;
    list.forEach(function (p) {
      var r = ovX.status && ovX.status[p.id];
      if (!r || !(+r.tot_dur > 0)) return;
      tot += +r.tot_dur; plan += +r.planned_dur; done += +r.done_dur; measured++;
    });
    var pp = tot > 0 ? ((done - plan) / tot) * 100 : null;
    var ppTxt = pp == null ? (ovX.err.status ? 'unavailable' : measured || !ovX.status ? '…' : '—')
                           : (pp > 0 ? '+' : '') + pp.toFixed(1) + ' pp';
    var ppCls = pp == null ? '' : pp <= -5 ? 'pd-kpi-bad' : pp < 0 ? 'pd-kpi-warn' : 'pd-kpi-ok';
    var ppSub = ovX.err.status ? 'run migrations/2026-09-15-scurve-status-per-project.sql'
              : pp == null ? 'no project in scope reports a dated schedule'
              : 'duration-weighted across ' + measured + ' of ' + list.length + ' project(s), as of today';

    /* 2 · Money — one card where there were four, and it says "not captured" rather
       than printing four dashes that read as a broken page. */
    var orig = list.reduce(function (a, p) { return a + num(p.original_budget); }, 0);
    var est = list.reduce(function (a, p) { return a + num(p.estimated_cost); }, 0);
    var over = list.filter(function (p) { return variance(p) > 0; }).length;
    var haveMoney = orig || est;
    var vr = est - orig;
    var moneyTxt = haveMoney ? (vr > 0 ? '+' : '') + Fmt.moneyShort(vr) : 'not captured';
    var moneySub = haveMoney
      ? Fmt.moneyShort(orig) + ' budget · ' + Fmt.moneyShort(est) + ' estimated · ' + over + ' over'
      : 'no project in scope carries a budget figure';

    /* 3 · Commercial exposure. ⚠️ MONEY AND DAYS ARE NEVER ADDED — the rule PDClaims
       already enforces; the EOT figure rides in the sub-line as its own quantity. */
    var exposure = null, oldest = 0, eotDays = 0, nExp = 0;
    if (ovX.claims) {
      exposure = 0;
      list.forEach(function (p) {
        var c = claimsOf(p.id); if (!c) return;
        exposure += c.exposure; eotDays += c.eotDays || 0;
        if (c.exposure > 0) nExp++;
        if (c.oldest > oldest) oldest = c.oldest;
      });
    }
    var expTxt = ovX.err.claims ? 'unavailable' : exposure == null ? '…'
               : exposure ? Fmt.moneyShort(exposure) : '—';
    var expSub = ovX.err.claims ? 'the commercial read failed'
               : exposure == null ? 'reading the register…'
               : exposure ? nExp + ' project(s) · oldest pending ' + (oldest || 0) + 'd' +
                            (eotDays ? ' · ' + eotDays + 'd EOT pending' : '')
                          : 'nothing outstanding across the portfolio';

    /* 4 · What lands next. ⚠️ Overdue is called out SEPARATELY rather than folded into
       the count — "6 due" and "6 due, 4 of them already late" are different facts. */
    var due = null, overdue = 0;
    if (ovX.ms) {
      var t = today(), in30 = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 30);
      var inScope = {}; list.forEach(function (p) { inScope[p.id] = 1; });
      due = 0;
      ovX.ms.forEach(function (r) {
        if (!inScope[r.project_id]) return;
        if (r.actual_finish || num(r.percent_complete) >= 100) return;
        var d = pd(r.end_date || r.start_date); if (!d) return;
        if (d < t) { overdue++; due++; } else if (d <= in30) due++;
      });
    }
    var dueTxt = ovX.err.ms ? 'unavailable' : due == null ? '…' : String(due);
    var dueSub = ovX.err.ms ? 'the milestone read failed'
               : due == null ? 'reading milestones…'
               : overdue ? overdue + ' already overdue' : 'none overdue';

    host.innerHTML =
      UI.kpi('Behind plan', ppTxt, { cls: ppCls, sub: ppSub }) +
      UI.kpi('Budget variance', moneyTxt, { cls: haveMoney && vr > 0 ? 'pd-kpi-bad' : '', sub: moneySub }) +
      UI.kpi('Unrecovered exposure', expTxt,
             { cls: exposure ? (oldest > 90 ? 'pd-kpi-bad' : 'pd-kpi-warn') : '', sub: expSub }) +
      UI.kpi('Milestones due in 30 days', dueTxt,
             { cls: overdue ? 'pd-kpi-bad' : '', sub: dueSub });
  }


  // ---- grouped, sortable portfolio table ----
  var COLS = [
    { k: 'name', label: 'Project', num: false },
    { k: 'id', label: 'ID', num: false },
    { k: 'status', label: 'Status', num: false },
    { k: 'progress', label: 'Schedule', num: false },
    { k: 'ffin', label: 'Forecast Finish', num: false },
    { k: 'orig', label: 'Original', num: true },
    { k: 'est', label: 'Estimated', num: true },
    { k: 'var', label: 'Variance', num: true }
  ];
  function sortVal(p, k) {
    switch (k) {
      case 'name': return (p.name || p.id || '').toLowerCase();
      case 'id': return (p.id || '').toLowerCase();
      case 'status': return (p.status || 'active');
      case 'progress': return progressOf(p) == null ? -1 : progressOf(p);
      case 'ffin': return +(pd(p.forecast_finish || p.end_date) || 0);
      case 'orig': return num(p.original_budget);
      case 'est': return num(p.estimated_cost);
      case 'var': return variance(p);
    }
    return 0;
  }
  function statusPill(s) { s = (s || 'active').toLowerCase(); return '<span class="pd-pill ' + (s === 'archived' ? 'pd-pill-muted' : 'pd-pill-ok') + '">' + esc(s.charAt(0).toUpperCase() + s.slice(1)) + '</span>'; }
  function schedCell(p) { var v = progressOf(p); if (v == null) return '<span style="color:var(--pd-muted);">—</span>'; return '<div class="po-sched"><div class="bar"><div style="width:' + v + '%;"></div></div><span>' + v + '%</span></div>'; }
  function varCell(p) { if (num(p.original_budget) === 0 && num(p.estimated_cost) === 0) return '—'; var v = variance(p); return '<span class="' + (v > 0 ? 'po-var-up' : v < 0 ? 'po-var-dn' : '') + '">' + Fmt.moneyShort(v) + '</span>'; }
  function projRow(p) {
    return '<tr class="po-row" data-pick="' + esc(p.id) + '">' +
      '<td><span class="po-proj-name"><span class="po-health" style="background:' + HEALTH[health(p)].color + ';"></span><span class="ic">' + Icons.svg('project', 15) + '</span>' + esc(p.name || p.id) + '</span></td>' +
      '<td><code>' + esc(p.id) + '</code></td>' +
      '<td>' + statusPill(p.status) + '</td>' +
      '<td>' + schedCell(p) + '</td>' +
      '<td>' + Fmt.date(p.forecast_finish || p.end_date) + '</td>' +
      '<td class="num">' + (p.original_budget != null ? Fmt.moneyShort(p.original_budget) : '—') + '</td>' +
      '<td class="num">' + (p.estimated_cost != null ? Fmt.moneyShort(p.estimated_cost) : '—') + '</td>' +
      '<td class="num">' + varCell(p) + '</td></tr>';
  }
  /* A group's combined schedule progress.
     ⚠️ WEIGHTED BY ACTIVITY COUNT, never a plain mean of the members' percentages —
        which is the whole reason this rollup is worth having. Avesta's AVR101 carries
        ~4,393 activities and AVR102 far fewer; averaging "60%" and "10%" to 35% describes
        no real project. Same principle as the Procurement dashboard's note on award rate:
        *"a 2-WP package at 100% and a 200-WP package at 10% is not 55%."*
     ⚠️ Falls back to the unweighted mean ONLY when no member reports an activity count,
        and the cell says which method it used rather than presenting the two alike. */
  function groupProgress(plist) {
    var m = plist.filter(function (p) { return progressOf(p) != null; });
    if (!m.length) return null;
    var wsum = m.reduce(function (a, p) { return a + num(p.schedule_activities); }, 0);
    if (wsum > 0) {
      var acc = m.reduce(function (a, p) { return a + progressOf(p) * num(p.schedule_activities); }, 0);
      return { pct: Math.round(acc / wsum), how: 'Weighted by activity count (' + wsum.toLocaleString('en-US') + ' activities)' };
    }
    return { pct: Math.round(m.reduce(function (a, p) { return a + progressOf(p); }, 0) / m.length),
             how: 'Unweighted mean of ' + m.length + ' project(s) — no activity counts recorded' };
  }
  function subtotal(name, plist) {
    var orig = plist.reduce(function (a, p) { return a + num(p.original_budget); }, 0);
    var est = plist.reduce(function (a, p) { return a + num(p.estimated_cost); }, 0);
    var pr = groupProgress(plist);
    var open = !collapsed[name];
    // In program mode the members ARE the contract packages of one development, so they
    // are counted as packages; every other mode is counting projects.
    var unit = groupMode === 'program'
      ? plist.length + ' package' + (plist.length === 1 ? '' : 's')
      : String(plist.length);
    return '<tr class="po-grp" data-grp="' + esc(name) + '"><td colspan="3"><span class="po-grp-name"><span class="po-caret">' + (open ? '▾' : '▸') + '</span>' + esc(groupDisplayOf(name, plist)) + ' <span style="color:var(--pd-muted);font-weight:400;">(' + esc(unit) + ')</span></span></td>' +
      // ⚠ CELL COUNT: colspan 3 (Project/ID/Status) + Schedule + 1 filler (Forecast
      //   Finish) + 3 money = 8, matching COLS now that Group Head is gone.
      '<td' + (pr ? ' title="' + esc(pr.how) + '"' : '') + '>' + (pr ? pr.pct + '%' : '—') + '</td><td></td>' +
      '<td class="num">' + (orig ? Fmt.moneyShort(orig) : '—') + '</td><td class="num">' + (est ? Fmt.moneyShort(est) : '—') + '</td>' +
      '<td class="num">' + ((orig || est) ? Fmt.moneyShort(est - orig) : '—') + '</td></tr>';
  }
  function renderTable(list) {
    var head = '<thead><tr>' + COLS.map(function (c) {
      return '<th class="' + (c.num ? 'num' : '') + '" data-sort="' + c.k + '">' + esc(c.label) + (sortCol === c.k ? '<span class="po-sort-ind">' + (sortDir < 0 ? '▼' : '▲') + '</span>' : '') + '</th>';
    }).join('') + '</tr></thead>';
    var sorted = list.slice().sort(function (a, b) { var x = sortVal(a, sortCol), y = sortVal(b, sortCol); return x < y ? -sortDir : x > y ? sortDir : 0; });
    var body = '';
    if (!sorted.length) { body = '<tr><td colspan="8" class="po-empty">No projects match the current filters.</td></tr>'; }
    else if (groupMode === 'none') { body = sorted.map(projRow).join(''); }
    else {
      var groups = {}, order = [];
      sorted.forEach(function (p) { var k = groupKeyOf(p); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(p); });
      order.sort();
      body = order.map(function (k) { return subtotal(k, groups[k]) + (collapsed[k] ? '' : groups[k].map(projRow).join('')); }).join('');
    }
    // grand total
    var gOrig = list.reduce(function (a, p) { return a + num(p.original_budget); }, 0), gEst = list.reduce(function (a, p) { return a + num(p.estimated_cost); }, 0);
    if (sorted.length) body += '<tr class="po-tot-row"><td colspan="3">TOTAL (' + sorted.length + ')</td><td></td><td></td>' +
      '<td class="num">' + (gOrig ? Fmt.moneyShort(gOrig) : '—') + '</td><td class="num">' + (gEst ? Fmt.moneyShort(gEst) : '—') + '</td><td class="num">' + ((gOrig || gEst) ? Fmt.moneyShort(gEst - gOrig) : '—') + '</td></tr>';
    var t = document.getElementById('po-table');
    t.innerHTML = head + '<tbody>' + body + '</tbody>';
    t.querySelectorAll('th[data-sort]').forEach(function (th) { th.onclick = function () { var k = th.dataset.sort; if (sortCol === k) sortDir = -sortDir; else { sortCol = k; sortDir = 1; } renderTable(filtered()); }; });
    t.querySelectorAll('.po-grp[data-grp]').forEach(function (g) { g.onclick = function () { var k = g.dataset.grp; collapsed[k] = !collapsed[k]; renderTable(filtered()); }; });
    t.querySelectorAll('.po-row[data-pick]').forEach(function (r) { r.onclick = function () { openProject(r.dataset.pick); }; });
  }

  function openProject(id) {
    var p = PROJ.find(function (x) { return x.id === id; }); if (!p) return;
    sessionStorage.setItem('pd_project', p.id);
    sessionStorage.setItem('pd_project_name', p.name || p.id);
    sessionStorage.setItem('pd_group_head', p.group_head_id || '');
    location.href = '../../dashboard.html';
  }

  // ---- multi-select project filter (checklist dropdown) ----
  var pfQuery = '';
  /* Every project keyed by its program, programs of 2+ first. This is what makes the
     consolidation usable BEYOND the overview table: the project filter scopes the S-curve,
     Cash Flow, Equipment, Milestones and Resources tabs too, so ticking one parent project
     puts both of its packages into every one of them at once. */
  function programGroups() { return PDProgram.groups(PROJ); }

  function projFilterLabel() {
    var n = projSelCount();
    if (!n) return 'All projects';
    if (n === 1) { var p = PROJ.find(function (x) { return projSel[x.id]; }); return p ? (p.name || p.id) : '1 project'; }
    // Exactly one whole parent project selected reads as that project, not as a count —
    // "Avesta Residences (2 packages)" is the answer to "what am I looking at?".
    var whole = programGroups().filter(function (g) {
      return g.members.length > 1 && g.members.every(function (p) { return projSel[p.id]; });
    });
    if (whole.length === 1 && whole[0].members.length === n) {
      return whole[0].label + ' (' + n + ' packages)';
    }
    return n + ' projects';
  }
  function renderProjFilterList() {
    var q = pfQuery.trim().toLowerCase();
    var match = function (p) { return !q || ((p.name || '') + ' ' + p.id).toLowerCase().indexOf(q) !== -1; };
    var host = document.getElementById('po-projfilter-list');
    var groups = programGroups().map(function (g) {
      // A search that matches the PARENT name keeps all its packages — searching
      // "Avesta" must not hide AVR102 just because its own name reads "Towers 2-7".
      var keep = (q && g.label.toLowerCase().indexOf(q) !== -1) ? g.members : g.members.filter(match);
      return { key: g.key, label: g.label, members: keep };
    }).filter(function (g) { return g.members.length; });
    if (!groups.length) { host.innerHTML = '<div class="po-pf-empty">No projects match.</div>'; return; }
    host.innerHTML = groups.map(function (g) {
      var one = g.members.length === 1;
      // A program of one is not a group — rendering a parent header above a single
      // package invents a hierarchy that is not there, which is the very thing being fixed.
      if (one) {
        var p = g.members[0];
        return '<label><input type="checkbox" data-pf="' + esc(p.id) + '"' + (projSel[p.id] ? ' checked' : '') + '> ' + esc(p.name || p.id) + '</label>';
      }
      var all = g.members.every(function (p) { return projSel[p.id]; });
      var some = !all && g.members.some(function (p) { return projSel[p.id]; });
      return '<label class="po-pf-prog"><input type="checkbox" data-pf-prog="' + esc(g.key) + '"' +
          (all ? ' checked' : '') + (some ? ' data-ind="1"' : '') + '> <strong>' + esc(g.label) + '</strong>' +
          '<span class="po-pf-count">' + g.members.length + ' packages</span></label>' +
        g.members.map(function (p) {
          return '<label class="po-pf-child"><input type="checkbox" data-pf="' + esc(p.id) + '"' + (projSel[p.id] ? ' checked' : '') + '> ' +
            '<span>' + esc(p.name || p.id) + '</span><code>' + esc(p.id) + '</code></label>';
        }).join('');
    }).join('');
    // Indeterminate is a property, not an attribute — it cannot be set in the markup above.
    host.querySelectorAll('input[data-ind]').forEach(function (cb) { cb.indeterminate = true; });
    var after = function () {
      document.getElementById('po-projfilter-label').textContent = projFilterLabel();
      renderProjFilterList();   // repaint so a parent's tick state follows its packages
      renderCurrent();
    };
    host.querySelectorAll('input[data-pf]').forEach(function (cb) {
      cb.onchange = function () {
        if (cb.checked) projSel[cb.dataset.pf] = true; else delete projSel[cb.dataset.pf];
        after();
      };
    });
    host.querySelectorAll('input[data-pf-prog]').forEach(function (cb) {
      cb.onchange = function () {
        var g = groups.filter(function (x) { return x.key === cb.dataset.pfProg; })[0];
        if (!g) return;
        g.members.forEach(function (p) { if (cb.checked) projSel[p.id] = true; else delete projSel[p.id]; });
        after();
      };
    });
  }
  function wireProjFilter() {
    var wrap = document.getElementById('po-projfilter-wrap'), menu = document.getElementById('po-projfilter-menu');
    document.getElementById('po-projfilter-btn').onclick = function (e) {
      e.stopPropagation();
      var open = menu.classList.toggle('open');
      if (open) { renderProjFilterList(); document.getElementById('po-projfilter-search').focus(); }
    };
    document.getElementById('po-projfilter-search').oninput = function (e) { pfQuery = e.target.value; renderProjFilterList(); };
    menu.querySelector('[data-act="all"]').onclick = function () {
      PROJ.forEach(function (p) { projSel[p.id] = true; });
      document.getElementById('po-projfilter-label').textContent = projFilterLabel();
      renderProjFilterList(); renderCurrent();
    };
    menu.querySelector('[data-act="none"]').onclick = function () {
      projSel = {};
      document.getElementById('po-projfilter-label').textContent = projFilterLabel();
      renderProjFilterList(); renderCurrent();
    };
    document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) menu.classList.remove('open'); });
  }

  /* ⚠️ Paints from PROJ only — never fetches. `loadOverview` owns the reads and calls
     back into here as each lands, so the first paint is instant and a slow or failing
     read degrades one block instead of holding the page. */
  /* ======================= D5 — what lands next =====================================
     The next 30 / 60 / 90 days of milestones across every project in scope, overdue first.
     ⚠⚠ NO READ OF ITS OWN. `ovX.ms` is already fetched for the strip's own 30-day figure, so
        this list and that number cannot disagree about which milestones exist — and adding a
        second read of the same table is how two blocks on one page start contradicting
        each other.
     ⚠ The Milestones view stays: that one is a month CALENDAR you navigate, this answers
       "what is coming at me" without navigating. Different questions, both worth having. */
  function renderLookahead(list) {
    var host = document.getElementById('po-look'), note = document.getElementById('po-look-note');
    if (!host) return;
    if (ovX.err.ms) { host.innerHTML = '<div class="po-empty">The milestone read failed, so this list is not drawn.</div>'; note.textContent = 'unavailable'; return; }
    if (!ovX.ms) { host.innerHTML = '<div class="po-empty">Reading milestones\u2026</div>'; note.textContent = ''; return; }

    var nameOf = {}; list.forEach(function (p) { nameOf[p.id] = p.name || p.id; });
    var t = today(), t0 = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    var rows = [], undated = 0;
    ovX.ms.forEach(function (r) {
      if (!nameOf[r.project_id]) return;                                 // outside the current scope
      if (r.actual_finish || num(r.percent_complete) >= 100) return;     // already achieved
      var d = pd(r.end_date || r.start_date);
      /* ⚠⚠ An undated milestone is COUNTED, never dropped: "nothing falls due" and "nobody has
         dated this one" are opposite facts, and only the second is a reason to go and look. */
      if (!d) { undated++; return; }
      var days = Math.round((d - t0) / 86400000);
      if (days > 90) return;
      rows.push({ days: days, proj: nameOf[r.project_id],
                  name: r.activity_name || '(unnamed)', prog: !!r.program_milestone });
    });
    rows.sort(function (a, b) { return a.days - b.days; });   // overdue first, then by date

    var BUCKETS = [
      { label: 'Overdue',      cls: 'po-bad',  test: function (r) { return r.days < 0; } },
      { label: 'Next 30 days', cls: 'po-warn', test: function (r) { return r.days >= 0 && r.days <= 30; } },
      { label: '31 – 60 days', cls: '',      test: function (r) { return r.days > 30 && r.days <= 60; } },
      { label: '61 – 90 days', cls: '',      test: function (r) { return r.days > 60 && r.days <= 90; } }
    ];
    var CAP = 6, html = '', shown = 0;
    BUCKETS.forEach(function (b) {
      var got = rows.filter(b.test);
      if (!got.length) return;
      shown += got.length;
      html += '<div class="po-look-grp"><div class="po-look-head ' + b.cls + '">' + b.label +
              ' <span class="po-mut">' + got.length + '</span></div>';
      got.slice(0, CAP).forEach(function (r) {
        html += '<div class="po-look-row">' +
          '<span class="po-look-when ' + (r.days < 0 ? 'po-bad' : '') + '">' +
            (r.days < 0 ? Math.abs(r.days) + 'd late' : r.days === 0 ? 'today' : 'in ' + r.days + 'd') + '</span>' +
          '<span class="po-look-name">' + esc(r.name) +
            (r.prog ? ' <span class="po-ms-prog">program</span>' : '') + '</span>' +
          '<span class="po-look-proj">' + esc(r.proj) + '</span></div>';
      });
      /* ⚠ A cap whose only signal is a "+" is one a planner cannot act on — say how many, and
         where the rest are. */
      if (got.length > CAP)
        html += '<div class="po-look-more">' + (got.length - CAP) +
                ' more in this window — the Milestones view lists them all.</div>';
      html += '</div>';
    });
    host.innerHTML = html || '<div class="po-empty">Nothing falls due in the next 90 days for the projects in scope.</div>';
    note.innerHTML = shown + ' in the next 90 days' +
      (undated ? ' · <span class="po-warn">' + undated + ' undated</span>, so they cannot be placed' : '');
  }

  /* ======================= D4 — the portfolio curve ==================================
     ⚠⚠ IT DRAWS FROM `PDScurve`, THE SAME ENGINE THE S-CURVE MODULE USES. This page carried a
     hand-copied copy of that maths until 2026-09-10 (z1), and the "Overall Progress ≡ Actual to
     date" bug then had to be reasoned about in three places. There is one copy now.
     ⚠ The line stops at the data date (`ti`): every month after it is MODELLED, not recorded, and
     drawing a confident actual line into the future is the one thing this chart may not do. */
  function miniChart(opts) {
    var W = 680, H = 170, padL = 34, padR = 8, padT = 10, padB = 20;
    var n = opts.n;
    if (!n) return '<div class="po-empty">Nothing to draw.</div>';
    function x(i) { return padL + (n === 1 ? 0 : (i / (n - 1)) * (W - padL - padR)); }
    function y(v) { return padT + (1 - (v / 100)) * (H - padT - padB); }
    function poly(vals, cls) {
      var pts = [], run = [];
      vals.forEach(function (v, i) {
        if (v == null) { if (run.length) { pts.push(run); run = []; } return; }
        run.push(x(i).toFixed(1) + ',' + y(v).toFixed(1));
      });
      if (run.length) pts.push(run);
      return pts.map(function (r) { return '<polyline class="' + cls + '" points="' + r.join(' ') + '" />'; }).join('');
    }
    var grid = [0, 25, 50, 75, 100].map(function (v) {
      return '<line class="po-tr-grid" x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) + '" />' +
             '<text class="po-tr-ax" x="' + (padL - 5) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>';
    }).join('');
    var marks = '';
    if (opts.ti != null && opts.ti >= 0 && opts.ti < n) {
      marks = '<line class="po-tr-now" x1="' + x(opts.ti) + '" y1="' + padT + '" x2="' + x(opts.ti) + '" y2="' + (H - padB) + '" />';
      if (opts.actual && opts.actual[opts.ti] != null)
        marks += '<circle class="po-tr-mark" cx="' + x(opts.ti) + '" cy="' + y(opts.actual[opts.ti]) + '" r="3.5" />';
    }
    var lbl = (opts.labels || []).map(function (t, i) {
      return t ? '<text class="po-tr-ax" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(t) + '</text>' : '';
    }).join('');
    return '<svg class="po-tr-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">' +
      grid + marks + poly(opts.planned, 'po-tr-plan') + poly(opts.actual, 'po-tr-act') + lbl + '</svg>';
  }

  function renderTrends() {
    var host = document.getElementById('po-tr-sc'), note = document.getElementById('po-tr-note');
    if (!host) return;
    if (ovX.err.curve) { host.innerHTML = '<div class="po-empty">The schedule roll-up could not be read, so the curve is not drawn.</div>'; note.textContent = 'unavailable'; return; }
    if (!ovX.curve) { host.innerHTML = '<div class="po-empty">Reading the schedule roll-up\u2026</div>'; note.textContent = ''; return; }
    var c = ovX.curve.curve;
    if (!c || c.empty) {
      host.innerHTML = '<div class="po-empty">No project in scope carries a baselined schedule, so there is no curve to draw.</div>';
      note.textContent = ''; return;
    }
    var TOT = c.TOT || 1;
    var planned = c.plannedC.map(function (v) { return v / TOT * 100; });
    /* ⚠ null, not 0, past the data date — a zero would draw a line crashing to the floor. */
    var actual = c.actualC.map(function (v, i) { return i <= c.ti ? v / TOT * 100 : null; });
    var every = Math.max(1, Math.ceil(c.months.length / 8));
    var labels = c.months.map(function (m, i) {
      return (i % every === 0) ? moLabelLocal(m) : '';
    });
    host.innerHTML = miniChart({ n: c.months.length, planned: planned, actual: actual,
                                 ti: c.ti, labels: labels }) +
      '<div class="po-tr-legend">' +
        '<span><i class="po-tr-sw po-tr-sw-plan"></i>Planned</span>' +
        '<span><i class="po-tr-sw po-tr-sw-act"></i>Actual</span>' +
        '<span class="po-mut">duration-weighted</span>' +
      '</div>';
    /* ⚠ The variance is stated in PERCENTAGE POINTS, and labelled as a variance rather than as
       progress — the two are routinely confused and only one of them is a decision. */
    var v = c.variance;
    note.innerHTML = c.plannedPct.toFixed(1) + '% planned to date \u00b7 ' + c.actualPct.toFixed(1) + '% actual \u00b7 ' +
      '<span class="' + (v < 0 ? 'po-bad' : 'po-ok') + '">' + (v >= 0 ? '+' : '') + v.toFixed(1) + ' pts</span>' +
      ' \u00b7 ' + ovX.curve.drawn + ' project(s) drawn' +
      (ovX.curve.failed ? ' \u00b7 <span class="po-warn">' + ovX.curve.failed + ' could not be read</span>' : '');
  }
  function moLabelLocal(d) {
    var MA = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return MA[d.getMonth()] + " '" + String(d.getFullYear()).slice(2);
  }

  function renderAll() {
    var list = filtered();
    renderKPIs(list); renderRank(list); renderTrends(); renderLookahead(list); renderTable(list); renderCoverage(list);
  }

  /* ⚠️⚠️ ANYTHING THAT CHANGES `filtered()` MUST COME THROUGH HERE, NOT `renderAll()`.
     renderAll() paints the OVERVIEW pane only. The scope control's own note below says it
     "scopes EVERY view" — it never did: the twelve other views each have their own
     load<View>() and none was called, so narrowing the filter while standing on the
     S-Curve updated the button label, repainted a hidden pane, and left the previous
     load's "across 21 project(s)" on screen. That is the defect the owner reported.
     ⚠️ The Overview repaints IMMEDIATELY (it is free — it reads PROJ from memory); only the
     network-bound view load is debounced, so ticking five projects is one fetch, not five. */
  var _viewLoadT = null;
  function renderCurrent() {
    renderAll();
    if (_viewLoadT) clearTimeout(_viewLoadT);
    _viewLoadT = setTimeout(function () {
      _viewLoadT = null;
      var f = viewLoaders()[view];
      if (f) f(true);
    }, 250);
  }

  /* ⚠️⚠️ ONE FUNNEL, NOW FOR THREE VIEWS. There used to be two filter surfaces on screen at
     once: the scope picker in its own bar, and immediately below it the Overview's toolbar
     with a SECOND funnel and a SECOND search box, with nothing stating the relationship.
     Two of the three remaining views carry a filter panel; the button is hidden on the third
     rather than sitting there doing nothing.
     ⚠️ The Equipment panel left with the Equipment view (2026-09-16) and its filter row is
     opened directly by `PortfolioDash.mount` instead — a module has no funnel button to bind.
     ⚠️ `UI.wireFilterToggle` re-binds the button's onclick each call, which is exactly what
     lets one button serve N panels — and it re-syncs the has-active dot for the panel it is
     now pointed at, so the "something is filtered" signal follows the view. */
  var FILTER_PANEL = { overview: 'po-toolbar-fields', stakeholders: 'po-sh-fields' };
  var _filt = {};
  function syncFilterBtn(v) {
    var btn = document.getElementById('po-filter');
    if (!btn) return;
    /* ⚠️ Close every OTHER view's panel first. One button cannot un-toggle a panel it is no
       longer pointed at, so a panel left open would still be open the next time that view
       came round — with the funnel showing no sign of it. */
    Object.keys(_filt).forEach(function (k) { if (k !== v && _filt[k]) _filt[k].close(); });
    var id = FILTER_PANEL[v], panel = id ? document.getElementById(id) : null;
    btn.hidden = !panel;
    if (panel) _filt[v] = UI.wireFilterToggle(btn, panel);
  }

  /* ⚠️ Refresh is IMMEDIATE, never debounced. renderCurrent()'s 250ms wait exists so that
     ticking five projects costs one fetch; a planner who presses Refresh has asked for it
     now, and making them wait a further quarter second for no reason reads as a dead button. */
  function refreshCurrent() {
    if (_viewLoadT) { clearTimeout(_viewLoadT); _viewLoadT = null; }
    renderAll();
    var f = viewLoaders()[view];
    if (f) f(true);
  }

  /* ⚠️ ONE list of "which loader belongs to which view", read by BOTH switchView() and
     renderCurrent(). Two copies is how a view gets added to one and forgotten in the other.
     A function (not a var) so hoisting makes it safe to call from anywhere in this IIFE. */
  function viewLoaders() {
    /* ⚠️ The Overview has a loader NOW — it did not before, because it had nothing to
       read. Its four enrichment reads go through the same list, so the project filter
       re-runs them exactly as it re-runs any other view's. */
    return { overview: loadOverview, milestones: loadMilestones,
             stakeholders: loadStakeholders };
  }

  /* ⚠️⚠️ THE PORTFOLIO S-CURVE, CASH FLOW, RESOURCES AND EQUIPMENT VIEWS ARE GONE FROM THIS
     FILE — they are `assets/js/portfolio-dash.js`, mounted by s-curve / cash-flow /
     resource-loading / equipment-loading when each is opened portfolio-wide (2026-09-16).
     ⚠️ THESE TWO HELPERS STAYED, and they are the only part of that block that did: the
     Overview, the Milestone calendar and the Stakeholder Map all ask which projects are in
     scope, and the shared layer answers the same question its own way (every project the
     planner can see, no in-page filter). Two callers, one definition each side. */
  function scopedProjectIds() { return filtered().map(function (p) { return p.id; }); }
  function scopeLabel(ids) { return ids.length === PROJ.length ? 'all ' + PROJ.length + ' projects' : ids.length + ' of ' + PROJ.length + ' projects'; }

  /* ⚠️⚠️ THIS PAGE CARRIED TWO PRIVATE KPI CARDS AND IGNORED THE SHARED ONE. `.po-kpi2` was
     value weight 700 against the shared 800, radius `md` against `lg`, padding 14/16 against
     16/18 — so the S-Curve, Milestones and Cash Flow strips did not match the Overview's, and
     neither matched the rest of the app. The 2026-09-10 (w2) pass converged five modules onto
     `.pd-kpi` and this page was not among them.
     ⚠️ The SIGNATURE is unchanged, which is the whole point: all 40 call sites converge without
     being touched, so there is no chance of catching some and missing others.
     ⚠️ The token maps to the shared SEMANTIC VARIANT rather than an inline colour — the variant
     tints the accent bar as well as the value, and `dashboard.css` has measured those three for
     contrast at this type size. An unrecognised token still falls back to an inline colour, so
     no caller can silently lose its meaning. */
  var KPI_VARIANT = { '--pd-ok': 'pd-kpi-ok', '--pd-warn': 'pd-kpi-warn', '--pd-bad': 'pd-kpi-bad' };
  function kpi2(l, v, cls) {
    var variant = cls ? KPI_VARIANT[cls] : '';
    var val = (variant || !cls) ? v : '<span style="color:var(' + cls + ');">' + v + '</span>';
    return UI.kpi(l, val, variant ? { cls: variant } : {});
  }
  // Shared by the seven register-style tabs below (Risk / Stakeholders / Issues / Meetings /
  // Contracts / Photos / Productivity) — one clipped-text and one status-pill helper instead of
  // seven near-identical copies.
  function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function statePill(label, tone) { return '<span class="pd-pill pd-pill-' + (tone || 'muted') + '">' + esc(label) + '</span>'; }



  // ================= Stakeholder DIRECTORY (portfolio-level authoring) ========
  // Owner: "By Portfolio Overview and accessing the stakeholder map, planners can
  // create stakeholders from this and assign it to different projects."
  // ⚠️ This tab used to be READ-ONLY — a search box and a table over the
  //    stakeholder_map MIRROR, with no way to create or assign anything. The mirror
  //    view is kept (it answers "who is on which project"); the Directory view is
  //    the portfolio-level master list the owner asked for.
  // ⚠️ Every identity decision goes through the SHARED PDStakeholders, never a copy.
  var shView = 'directory';          // 'directory' | 'byproject' | 'health'
  var dirRows = null, dirUse = {}, dirErr = '', dirSel = null, dirUnlinked = 0;

  function dirOn() { return !!window.PDStakeholders; }

  async function loadDirectory(force) {
    if (dirRows && !force) return dirRows;
    dirErr = '';
    try {
      dirRows = await PDb.selectAll('stakeholders', function (q) { return q.order('name'); });
    } catch (e) {
      // ⚠️ A missing table is not an error to shout about — it means the migration
      //    has not been run on this deployment, and the mirror view still works.
      dirRows = [];
      dirErr = PDStakeholders.missingTable(e)
        ? 'The shared directory table is not present on this database yet.'
        : ((e && e.message) || String(e));
    }
    // usage: which projects each person is on. ⚠️ Read from the FULL map, not the
    // project-filtered one — "on N projects" is a fact about the person, and
    // narrowing it to the current filter would make the same person read 3 on one
    // screen and 1 on another.
    dirUse = {};
    try {
      // ⚠ Read the WHOLE map, not only the linked rows: the rows with a NULL
      //   stakeholder_id are register entries made before the directory existed, and
      //   counting them is the Health view's "loose ends". One read answers both.
      var all = await PDb.selectAll('stakeholder_map');
      dirUnlinked = (all || []).filter(function (r) { return !r.stakeholder_id; }).length;
      (all || []).forEach(function (r) {
        if (!r.stakeholder_id) return;
        (dirUse[r.stakeholder_id] = dirUse[r.stakeholder_id] || []).push(r.project_id);
      });
      Object.keys(dirUse).forEach(function (k) {
        dirUse[k] = dirUse[k].filter(function (v, i, a) { return v && a.indexOf(v) === i; });
      });
    } catch (e) { /* usage is a nicety; the list is the point */ }
    return dirRows;
  }

  function dirVisible() {
    var q = shQuery.trim().toLowerCase();
    return (dirRows || []).filter(function (p) {
      if (!q) return true;
      return ((p.name || '') + ' ' + (p.organization || '') + ' ' + (p.role_title || '') + ' ' +
              (p.nickname || '') + ' ' + (p.email || '')).toLowerCase().indexOf(q) !== -1;
    });
  }

  function dirRender() {
    var host = document.getElementById('po-sh-table');
    var list = dirVisible();
    var multi = list.filter(function (p) { return (dirUse[p.id] || []).length > 1; }).length;
    var unassigned = (dirRows || []).filter(function (p) { return !(dirUse[p.id] || []).length; }).length;
    document.getElementById('po-sh-kpis').innerHTML =
      kpi2('People', String((dirRows || []).length)) +
      kpi2('On more than one project', String(multi)) +
      // ⚠ A person on no project is the actionable state this screen exists to
      //   surface — they were added and never assigned. Counted, not hidden.
      kpi2('On no project', String(unassigned), unassigned ? '--pd-bad' : null) +
      kpi2('Showing', String(list.length));

    if (dirErr) {
      document.getElementById('po-dir-universe').innerHTML =
        '<div class="po-empty">' + esc(dirErr) + '</div>';
      host.parentNode.style.display = 'none';
      return;
    }
    dirRenderUniverse();
  }

  // The LIST layout: the same banded groups, drawn as table sections.
  function dirRenderList(groups) {
    var host = document.getElementById('po-sh-table');
    var flat = groups.reduce(function (a, g) { return a.concat(g.items); }, []);
    var head = '<thead><tr><th>Name</th><th>Organization</th><th>Role</th><th>Sector</th>' +
               '<th class="num">Projects</th><th></th></tr></thead>';
    var body = flat.length ? groups.map(function (g) {
      // ⚠ One header row per band, with the SAME colspan as the table has columns (6).
      return (g.key === '' ? '' :
        '<tr class="po-dir-listband"><td colspan="6">' + esc(g.key) +
        '<span>' + g.items.length + '</span></td></tr>') +
      g.items.map(function (p) {
      var n = (dirUse[p.id] || []).length;
      return '<tr class="po-row" data-person="' + esc(p.id) + '">' +
        '<td><b>' + esc(p.name || '(unnamed)') + '</b>' +
          (p.nickname ? ' <span class="po-dir-nick">“' + esc(p.nickname) + '”</span>' : '') + '</td>' +
        '<td>' + esc(p.organization || '—') + '</td>' +
        '<td>' + esc(p.role_title || '—') + '</td>' +
        '<td>' + esc(p.category || '—') + '</td>' +
        // ⚠ 0 is a real, actionable state — a person in the directory on no project —
        //   so it is shown as 0 rather than an em dash that reads as "unknown".
        '<td class="num">' + n + '</td>' +
        '<td class="po-dir-act"><button type="button" class="pd-btn pd-btn-sm" data-open="' + esc(p.id) + '">Open</button></td>' +
      '</tr>';
      }).join('');
    }).join('') : '<tr><td colspan="6" class="po-empty">' +
        (dirRows && dirRows.length ? 'No one matches that search.'
          : 'The directory is empty. Add a person, or open a project’s Stakeholder Map — saving there adds them here.') +
      '</td></tr>';
    host.innerHTML = head + '<tbody>' + body + '</tbody>';
    host.querySelectorAll('[data-open]').forEach(function (b) {
      // ⚠️ This button is the MANAGE route (assign to projects, merge a duplicate).
      //    It stays a dialog on purpose: both act on the directory around the person
      //    rather than on the person, so leaving the list to do them is the wrong shape.
      b.onclick = function (e) { e.stopPropagation(); openPersonPanel(b.dataset.open); };
    });
    host.querySelectorAll('.po-row[data-person]').forEach(function (r) {
      r.onclick = function () { openPerson(r.dataset.person); };
    });
  }

  // ---- Directory HEALTH -----------------------------------------------------
  // The second half of the adoption: "a dashboard page that can also be adopted."
  // ⚠️⚠️ IT IS BUILT FROM OUR OWN DATA AND ADDS NO QUERY. Every figure below is
  //    derived from `dirRows` (the directory) and `dirUse` (the map) that the
  //    Directory view has already loaded, so switching to this view costs nothing
  //    and can never disagree with the list beside it.
  // ⚠️ It reports; it does not clean. Nothing here writes — a duplicate is opened
  //    through the SAME person panel that already owns merging, rather than this
  //    view growing a second merge path that could drift from it.

  function dirTop(list, keyOf, blank, limit) {
    var by = {};
    list.forEach(function (p) {
      var k = (keyOf(p) || '').trim() || blank;
      by[k] = (by[k] || 0) + 1;
    });
    var out = Object.keys(by).map(function (k) { return { key: k, n: by[k] }; });
    // ⚠️ Ties break on the NAME, so two organisations with the same count do not
    //    swap places between renders and read as data changing under the planner.
    out.sort(function (a, b) { return b.n - a.n || a.key.localeCompare(b.key); });
    return limit ? out.slice(0, limit) : out;
  }

  // Pure: rows in, figures out. No DOM, no globals, so it can be executed.
  function dirHealth(rows, use, unlinked) {
    rows = rows || [];
    var S = window.PDStakeholders;
    var total = rows.length;
    var onNo = 0, onMulti = 0, haveTotal = 0, ofEach = 0;
    var fieldHave = {};
    (S ? S.COMPLETENESS_FIELDS : []).forEach(function (f) { fieldHave[f] = 0; });

    rows.forEach(function (p) {
      var n = ((use || {})[p.id] || []).length;
      if (!n) onNo++; else if (n > 1) onMulti++;
      if (S) {
        var c = S.completeness(p);
        haveTotal += c.have; ofEach = c.of;
        S.COMPLETENESS_FIELDS.forEach(function (f) {
          var v = p[f];
          if (v != null && String(v).trim() !== '') fieldHave[f]++;
        });
      }
    });

    // per project, from the map we already hold
    var perProj = {};
    Object.keys(use || {}).forEach(function (sid) {
      (use[sid] || []).forEach(function (pid) { perProj[pid] = (perProj[pid] || 0) + 1; });
    });
    var projects = Object.keys(perProj).map(function (id) {
      return { key: projNameOf(id), id: id, n: perProj[id] };
    }).sort(function (a, b) { return b.n - a.n || a.key.localeCompare(b.key); });

    // ⚠️ The scan itself lives in the SHARED PDStakeholders, blocked so it does not
    //    score every pair — my first cut here scored all of them and measured **2.3
    //    seconds** of blocked main thread at 900 people. It refuses rather than
    //    answering partially when even the blocked candidate set is too large.
    var dup = S ? S.duplicatePairs(rows) : { pairs: [], scanned: false, considered: 0 };

    return {
      total: total,
      onNo: onNo,
      onMulti: onMulti,
      pct: total && ofEach ? haveTotal / (total * ofEach) : 0,
      fields: (S ? S.COMPLETENESS_FIELDS : []).map(function (f) {
        return { key: f, n: fieldHave[f], pct: total ? fieldHave[f] / total : 0 };
      }).sort(function (a, b) { return a.n - b.n || a.key.localeCompare(b.key); }),
      sectors: dirTop(rows, function (p) { return p.category; }, 'No sector'),
      orgs: dirTop(rows, function (p) { return p.organization; }, 'No organisation', 8),
      // ⚠ the TRUE distinct count, so the panel can say "5 distinct" when it is
      //   showing all five rather than claiming a "top 5" that truncates nothing.
      orgTotal: dirTop(rows, function (p) { return p.organization; }, 'No organisation').length,
      projects: projects,
      dupes: dup.pairs,
      dupScanned: dup.scanned,
      dupConsidered: dup.considered,
      unlinked: unlinked || 0
    };
  }

  function dirBars(items, max, opts) {
    opts = opts || {};
    if (!items.length) return '<p class="po-hl-none">' + esc(opts.empty || 'Nothing to show.') + '</p>';
    return '<div class="po-hl-bars">' + items.map(function (it) {
      var w = max ? Math.max(2, Math.round((it.n / max) * 100)) : 0;
      return '<div class="po-hl-bar' + (opts.warn && opts.warn(it) ? ' is-warn' : '') + '">' +
        '<span class="po-hl-k" title="' + esc(it.key) + '">' + esc(it.key) + '</span>' +
        '<span class="po-hl-t"><i style="width:' + w + '%"></i></span>' +
        '<span class="po-hl-n">' + (opts.fmt ? opts.fmt(it) : it.n) + '</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  function dirPanel(title, sub, body) {
    return '<section class="po-hl-panel"><h3>' + esc(title) +
      (sub ? '<em>' + esc(sub) + '</em>' : '') + '</h3>' + body + '</section>';
  }

  function dirRenderHealth() {
    var wrap = document.getElementById('po-dir-health');
    if (dirErr) { wrap.innerHTML = '<div class="po-empty">' + esc(dirErr) + '</div>'; return; }
    var h = dirHealth(dirRows, dirUse, dirUnlinked);
    if (!h.total) {
      wrap.innerHTML = '<div class="po-empty">The directory is empty, so there is no health to report. ' +
        'Add a person, or open a project’s Stakeholder Map — saving there adds them here.</div>';
      return;
    }
    var pctTxt = Math.round(h.pct * 100) + '%';

    document.getElementById('po-sh-kpis').innerHTML =
      kpi2('People', String(h.total)) +
      kpi2('Profile completeness', pctTxt, h.pct < 0.5 ? '--pd-bad' : null) +
      kpi2('On no project', String(h.onNo), h.onNo ? '--pd-bad' : null) +
      kpi2('Possible duplicates', h.dupScanned ? String(h.dupes.length) : '—',
           h.dupScanned && h.dupes.length ? '--pd-bad' : null);

    var maxField = h.total;
    var maxSec = h.sectors.length ? h.sectors[0].n : 0;
    var maxOrg = h.orgs.length ? h.orgs[0].n : 0;
    var maxPrj = h.projects.length ? h.projects[0].n : 0;

    var dupBody;
    if (!h.dupScanned) {
      dupBody = '<p class="po-hl-none">' + h.total + ' people leaves ' +
        h.dupConsidered.toLocaleString() + ' pairs still worth comparing, which is more than this ' +
        'scan will do in one go — so it has not been run, rather than freezing the tab or ' +
        'answering over part of the directory. The duplicate warning still fires while you type ' +
        'in <strong>+ Add person</strong>.</p>';
    } else if (!h.dupes.length) {
      dupBody = '<p class="po-hl-none">No two people in the directory score as the same person.</p>';
    } else {
      dupBody = '<div class="po-hl-dups">' + h.dupes.slice(0, 25).map(function (d) {
        return '<button type="button" class="po-hl-dup" data-dup="' + esc(d.a.id) + '">' +
          '<span class="po-hl-dn">' + esc(d.a.name || '(unnamed)') + '</span>' +
          '<span class="po-hl-dv">vs</span>' +
          '<span class="po-hl-dn">' + esc(d.b.name || '(unnamed)') + '</span>' +
          '<em>' + esc(d.why || '') + '</em>' +
          '<span class="po-hl-ds">' + d.score.toFixed(2) + '</span>' +
        '</button>';
      }).join('') +
      (h.dupes.length > 25 ? '<p class="po-hl-none">' + (h.dupes.length - 25) +
        ' more below these.</p>' : '') + '</div>' +
      '<p class="po-hl-note">Opens the person, where <strong>Merge</strong> lives. ' +
      'Nothing on this screen changes a record.</p>';
    }

    wrap.innerHTML =
      '<p class="po-dir-lead">Everything here is read from the directory already on screen — ' +
      'no extra query, and nothing on this view writes.</p>' +
      '<div class="po-hl-grid">' +
        dirPanel('Possible duplicates', h.dupScanned ? h.dupes.length + ' found' : 'not scanned', dupBody) +
        dirPanel('Profile completeness', pctTxt + ' overall · least-filled first',
          dirBars(h.fields, maxField, {
            fmt: function (it) { return it.n + ' / ' + h.total; },
            warn: function (it) { return it.pct < 0.34; }
          })) +
        dirPanel('By sector', h.sectors.length + ' distinct',
          dirBars(h.sectors, maxSec, { warn: function (it) { return it.key === 'No sector'; } })) +
        dirPanel('Organisations',
          h.orgTotal > h.orgs.length ? 'top ' + h.orgs.length + ' of ' + h.orgTotal
                                     : h.orgTotal + ' distinct',
          dirBars(h.orgs, maxOrg, { warn: function (it) { return it.key === 'No organisation'; } })) +
        dirPanel('People per project', h.projects.length + ' with anyone mapped',
          dirBars(h.projects, maxPrj, { empty: 'Nobody is assigned to a project yet.' })) +
        dirPanel('Loose ends', 'what to fix next',
          '<div class="po-hl-bars">' +
            '<div class="po-hl-bar' + (h.onNo ? ' is-warn' : '') + '">' +
              '<span class="po-hl-k">On no project</span>' +
              '<span class="po-hl-t"><i style="width:' + (h.total ? Math.round(h.onNo / h.total * 100) : 0) + '%"></i></span>' +
              '<span class="po-hl-n">' + h.onNo + '</span></div>' +
            '<div class="po-hl-bar">' +
              '<span class="po-hl-k">On more than one</span>' +
              '<span class="po-hl-t"><i style="width:' + (h.total ? Math.round(h.onMulti / h.total * 100) : 0) + '%"></i></span>' +
              '<span class="po-hl-n">' + h.onMulti + '</span></div>' +
            '<div class="po-hl-bar' + (h.unlinked ? ' is-warn' : '') + '">' +
              '<span class="po-hl-k" title="stakeholder_map rows written before the directory existed">Map rows not linked to a person</span>' +
              '<span class="po-hl-t"><i style="width:' + (h.unlinked ? 100 : 0) + '%"></i></span>' +
              '<span class="po-hl-n">' + h.unlinked + '</span></div>' +
          '</div>' +
          // ⚠️ An unlinked row is NOT breakage — it is a register entry made before the
          //    shared directory existed. Saying so stops it reading as data loss.
          '<p class="po-hl-note">Unlinked rows are register entries made before the shared ' +
          'directory existed. They still show under <strong>By project</strong>; re-saving one ' +
          'in its project’s Stakeholder Map links it.</p>') +
      '</div>';

    wrap.querySelectorAll('[data-dup]').forEach(function (b) {
      b.onclick = function () { openPersonPanel(b.dataset.dup); };
    });
  }

  // ---- the Universe: banded grid / list -------------------------------------
  // Adopted from the separate Megawide Stakeholders app at the owner's request:
  // "seeing the whole stakeholders rather than a table and seeing the clickable
  // bands." Two things came across — a CARD grid over the whole directory, and
  // A-Z bands with counts that you can click to jump.
  // ⚠️ `sm-bands` in the Stakeholder Map module is a DIFFERENT thing with a
  //    confusingly similar name: RCM column-group toggles on the register table.
  //    These are alphabet bands over people. Named `po-dir-band*` so nothing in
  //    either file reads as the other.
  var dirLayout = 'grid';          // 'grid' | 'list'
  var dirGroup = 'letter';         // 'letter' | 'org' | 'sector' | 'none'
  var dirBand = '';                // a clicked letter, or '' for all

  function dirLetter(p) {
    var n = (p && p.name || '').trim();
    if (!n) return '#';
    // ⚠️ Band on the same NORMALISED name the matcher uses, so "Engr. Ana Reyes"
    //    lands under A with everyone else rather than under E on its honorific.
    var norm = PDStakeholders ? PDStakeholders.normName(n) : n.toLowerCase();
    var c = (norm || n).charAt(0).toUpperCase();
    return /[A-Z]/.test(c) ? c : '#';
  }
  function dirGroupKey(p) {
    if (dirGroup === 'org') return (p.organization || '').trim() || 'No organisation';
    if (dirGroup === 'sector') return (p.category || '').trim() || 'No sector';
    if (dirGroup === 'none') return '';
    return dirLetter(p);
  }

  function dirGrouped(list) {
    if (dirGroup === 'none') return [{ key: '', items: list }];
    var by = {}, order = [];
    list.forEach(function (p) {
      var k = dirGroupKey(p);
      if (!by[k]) { by[k] = []; order.push(k); }
      by[k].push(p);
    });
    // ⚠️ '#' (names that do not start with a letter) sorts LAST, never first —
    //    otherwise a handful of odd rows head a list of 240 people.
    order.sort(function (a, b) {
      if (a === '#') return 1; if (b === '#') return -1;
      return a.localeCompare(b);
    });
    return order.map(function (k) { return { key: k, items: by[k] }; });
  }

  function dirStatusOf(p) {
    // ⚠️ Absent column reads Active, matching the migration's own default, so a
    //    deployment that has not run it shows every person as active rather than
    //    as an unknown state.
    return (p && p.status) || 'Active';
  }

  function dirCard(p) {
    var n = (dirUse[p.id] || []).length;
    var initials = (p.name || '?').split(/\s+/).filter(Boolean).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('') || '?';
    var inactive = dirStatusOf(p) !== 'Active';
    return '<div class="po-dir-card' + (inactive ? ' is-inactive' : '') + '" data-person="' + esc(p.id) + '">' +
      '<div class="po-dir-ava">' + esc(initials) +
        '<span class="po-dir-dot' + (inactive ? ' off' : '') + '" title="' + esc(dirStatusOf(p)) + '"></span></div>' +
      '<div class="po-dir-body">' +
        '<div class="po-dir-name">' + esc(p.name || '(unnamed)') + '</div>' +
        '<div class="po-dir-org">' + esc(p.organization || '—') + '</div>' +
        '<div class="po-dir-role">' + esc(p.role_title || '') + '</div>' +
        '<div class="po-dir-meta">' + (n ? n + ' project' + (n === 1 ? '' : 's') : 'No project yet') + '</div>' +
      '</div>' +
      '<button type="button" class="po-dir-manage" data-open="' + esc(p.id) +
        '" title="Assign to projects, or merge a duplicate">⋯</button>' +
      '<button type="button" class="po-dir-star' + (p.is_favorite ? ' on' : '') +
        '" data-fav="' + esc(p.id) + '" title="' + (p.is_favorite ? 'Remove from favourites' : 'Mark as favourite') +
        '" aria-pressed="' + (p.is_favorite ? 'true' : 'false') + '">' + (p.is_favorite ? '★' : '☆') + '</button>' +
    '</div>';
  }

  function dirBandStrip(groups, total) {
    if (dirGroup !== 'letter') return '';
    var have = {}; groups.forEach(function (g) { have[g.key] = g.items.length; });
    var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(have['#'] ? ['#'] : []);
    // ⚠️ Every letter is rendered, present or not — a strip that only shows the
    //    letters in use jumps around as you search, and a disabled letter is the
    //    useful answer to "is there anyone under Q?".
    return '<div class="po-dir-bands" role="group" aria-label="Jump to a letter">' +
      '<button type="button" class="po-dir-bandall' + (dirBand ? '' : ' on') +
        '" data-band="" title="Show all ' + total + '">All</button>' +
      letters.map(function (L) {
        var c = have[L] || 0;
        return '<button type="button" class="po-dir-band' + (c ? '' : ' is-empty') +
          (dirBand === L ? ' on' : '') + '"' + (c ? '' : ' disabled') +
          ' data-band="' + L + '" title="' + (c ? c + ' under ' + L : 'nobody under ' + L) + '">' + L +
          (c ? '<i>' + c + '</i>' : '') + '</button>';
      }).join('') + '</div>';
  }

  function dirRenderUniverse() {
    var host = document.getElementById('po-sh-table');
    var wrap = document.getElementById('po-dir-universe');
    var all = dirVisible();
    var groups = dirGrouped(all);
    var shown = dirBand ? groups.filter(function (g) { return g.key === dirBand; }) : groups;
    var count = shown.reduce(function (a, g) { return a + g.items.length; }, 0);

    host.parentNode.style.display = dirLayout === 'list' ? '' : 'none';
    wrap.style.display = dirLayout === 'list' ? 'none' : '';

    if (dirLayout === 'list') { dirRenderList(shown); wrap.innerHTML = ''; return; }

    // ⚠️ The rail is a SIBLING of the cards inside one flex row, and comes AFTER them in
    //   source order so the tab sequence reaches the people before the index — the index
    //   is navigation, not content.
    wrap.innerHTML = '<div class="po-dir-uniwrap"><div class="po-dir-unimain">' +
      (count ? shown.map(function (g) {
        return '<section class="po-dir-sec">' +
          (g.key === '' ? '' : '<h3 class="po-dir-sechead">' + esc(g.key) +
            '<span>' + g.items.length + '</span></h3>') +
          '<div class="po-dir-grid">' + g.items.map(dirCard).join('') + '</div></section>';
      }).join('')
      : '<div class="po-empty">' + (dirRows && dirRows.length
          ? 'No one matches that search.'
          : 'The directory is empty. Add a person, or open a project’s Stakeholder Map — saving there adds them here.') +
        '</div>') +
      '</div>' + dirBandStrip(groups, all.length) + '</div>';
    dirWireCards(wrap);
  }

  function dirWireCards(root) {
    root.querySelectorAll('[data-band]').forEach(function (b) {
      b.onclick = function () { dirBand = b.dataset.band; dirRenderUniverse(); };
    });
    root.querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function (e) { e.stopPropagation(); openPersonPanel(b.dataset.open); };
    });
    root.querySelectorAll('[data-fav]').forEach(function (b) {
      b.onclick = function (e) { e.stopPropagation(); dirToggleFav(b.dataset.fav); };
    });
    root.querySelectorAll('.po-dir-card[data-person]').forEach(function (c) {
      c.onclick = function () { openPerson(c.dataset.person); };
    });
  }

  // ⚠️⚠️ OPTIMISTIC, THEN REVERTED ON REFUSAL. A star that appears to stick and
  //    silently did not is the worst of both — and `is_favorite` only exists once
  //    2026-09-10-stakeholder-profile-fields.sql has been run, so on an
  //    un-migrated database this WILL be refused. It says so, once, rather than
  //    failing quietly on every click.
  async function dirToggleFav(id) {
    var p = (dirRows || []).filter(function (x) { return String(x.id) === String(id); })[0];
    if (!p) return;
    var was = !!p.is_favorite;
    p.is_favorite = !was;
    dirRenderUniverse();
    try {
      var res = await sb().from('stakeholders').update({ is_favorite: p.is_favorite })
                          .eq('id', p.id).select('id');
      if (res.error) throw res.error;
      // ⚠ RLS answers a refused UPDATE with 200 and zero rows — the same silent
      //   success the merge counts for. Zero rows means it did not happen.
      if (!(res.data || []).length) throw new Error('The directory refused the change.');
    } catch (e) {
      p.is_favorite = was;
      dirRenderUniverse();
      var col = PDStakeholders.missingColumn(e);
      UI.toast(col
        ? 'Favourites need migrations/2026-09-10-stakeholder-profile-fields.sql to be run first.'
        : 'Could not update: ' + ((e && e.message) || e), 'warn');
    }
  }

  // ---- add a person ---------------------------------------------------------
  function openDirAdd() {
    var m = UI.modal(
      '<div class="pd-modal-header"><h2>Add a person to the directory</h2></div>' +
      '<div class="pd-modal-body">' +
        '<p class="po-dir-lead">This creates a portfolio-level person. Assign them to projects next.</p>' +
        '<div class="po-dir-form">' +
          '<div class="pd-field"><label>Name *</label><input class="pd-input" id="po-dp-name"></div>' +
          '<div class="pd-field"><label>Organization</label><input class="pd-input" id="po-dp-org"></div>' +
          '<div class="pd-field"><label>Role / position</label><input class="pd-input" id="po-dp-role"></div>' +
          '<div class="pd-field"><label>Sector</label><select class="pd-select" id="po-dp-cat">' +
            '<option value="">—</option><option>Government</option><option>Private</option></select></div>' +
          '<div class="pd-field"><label>Nickname</label><input class="pd-input" id="po-dp-nick"></div>' +
          '<div class="pd-field"><label>Email</label><input class="pd-input" id="po-dp-email"></div>' +
        '</div>' +
        '<div id="po-dp-dup"></div>' +
      '</div>' +
      '<div class="pd-modal-foot">' +
        '<button class="pd-btn" data-act="cancel">Cancel</button>' +
        '<button class="pd-btn pd-btn-primary" data-act="save">Create person</button>' +
      '</div>', { noBackdropClose: true });

    function fields() {
      return { name: (document.getElementById('po-dp-name').value || '').trim(),
               organization: (document.getElementById('po-dp-org').value || '').trim(),
               role_title: (document.getElementById('po-dp-role').value || '').trim(),
               category: document.getElementById('po-dp-cat').value,
               nickname: (document.getElementById('po-dp-nick').value || '').trim(),
               email: (document.getElementById('po-dp-email').value || '').trim() };
    }
    // ⚠️ The duplicate warning appears WHILE TYPING, not after saving. Telling a
    //    planner they have made a duplicate once it exists is worse than useless —
    //    by then somebody has to merge it.
    function checkDup() {
      var box = document.getElementById('po-dp-dup');
      var f = fields();
      if (!f.name || !dirOn()) { box.innerHTML = ''; return; }
      var hits = PDStakeholders.matchCandidates(f, dirRows || [], { limit: 3 });
