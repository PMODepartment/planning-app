<script>
(function () {
  'use strict';
  var PROJ = [], GH = [], ghById = {};
  var groupMode = 'grouphead', statusFilter = '', behindOnly = false, query = '';
  var projSel = {};   // {projectId: true} for checked projects — empty object = no filter (all projects)
  var sortCol = 'name', sortDir = 1, collapsed = {};
  var view = 'overview';   // 'overview' | 'scurve' | 'cashflow'

  function sb() { return AppAuth.getSB(); }
  function esc(s) { return Fmt.esc(s); }
  function num(v) { return Number(v) || 0; }
  function pd(v) { if (!v) return null; var m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }

  // ---- group head (the flat tag that replaced the workspace tree) ----
  // Same resolver as dashboard.html and projects.html. No ancestry to walk:
  // Workspace and Program grouping are gone because those levels no longer
  // exist — group head IS the portfolio's structure now.
  function groupHead(p) {
    if (!p || !p.group_head_id) return null;
    var g = ghById[p.group_head_id];
    return g ? g.name : p.group_head_id;
  }

  // ---- derived per-project fields ----
  function progressOf(p) { return p.schedule_progress != null ? Math.max(0, Math.min(100, num(p.schedule_progress))) : null; }
  function isOverdue(p) { var f = pd(p.forecast_finish || p.schedule_finish || p.end_date); var pr = progressOf(p); return !!(f && f < today() && (pr == null || pr < 100)); }
  function isBehind(p) {
    // slipped vs baseline finish, or overdue-and-incomplete
    var sf = pd(p.schedule_finish), ff = pd(p.forecast_finish);
    if (sf && ff && sf > ff) return true;
    return isOverdue(p);
  }
  function health(p) { if (progressOf(p) == null) return 'none'; return isBehind(p) ? 'behind' : 'ontrack'; }
  var HEALTH = { ontrack: { label: 'On Track', color: '#1f8f4e' }, behind: { label: 'Behind', color: '#C42127' }, none: { label: 'No Schedule', color: '#9a9a9a' } };
  function variance(p) { return num(p.estimated_cost) - num(p.original_budget); }

  /* ── PARENT PROJECT (consolidating contract packages) ───────────────────────
     Owner, 2026-08-27: *"Avesta Residences Tower 1 and General Requirements (AVR101)
     and Avesta Residences Towers 2-7 (AVR102) reported to be of the same project but
     treated as separate… Let's just consolidate the two into a portfolio view, similar
     to how procurement dashboard works."*

     Ported from the Procurement dashboard, which solved this first (wpm/index.html,
     `_progKey` / `_progLabel` / `_progTotals`). The key is the LEADING LETTERS of the
     project code — AVR101 and AVR102 both key to AVR — overridable per project by a
     `program` column if one is ever added.

     ⚠️ THE PREFIX IS NOT A GUESS. It is the convention every project id in this
        portfolio already follows (AVR101, BAU101, GPR101, SLN101, SLT101), so this needs
        no data entry to start working. A project whose prefix is unique simply forms a
        group of one and reads exactly as it does today.
     ⚠️ IT IS A ROLLUP, NOT A MERGE, and that is the whole design. The alternative — one
        Planners project "Avesta" holding AVR101/AVR102 as `packages` rows — is what
        produced the AVR101 › {AVR101, AVR102} nesting, and it breaks the cross-app link:
        `push-packages` resolves ONE downstream project per Planners project
        (cash_flow_settings.wpm_project_id), while WPM and Engineering each hold AVR101
        and AVR102 as separate projects. Keeping the rows separate keeps that 1:1. */
  /* ⚠️ ONE DEFINITION, IN assets/js/program.js. This screen solved the rollup
     first and carried a private copy; the owner then asked for the same
     grouping app-wide ("let's do a global approach for this in the planning-app
     first"), so the copy is gone rather than left beside the shared helper —
     two screens disagreeing about which projects are "the same project" is the
     exact confusion this exists to end. See program.js for the prefix rule, the
     shared-name label and why this is a rollup and not a merge. */
  function progKey(p) { return PDProgram.keyOf(p); }
  function progLabel(key, plist) { return PDProgram.labelOf(key, plist); }

  function groupKeyOf(p) {
    if (groupMode === 'grouphead') { return groupHead(p) || '(No group head)'; }
    if (groupMode === 'program') { return progKey(p); }
    if (groupMode === 'status') { return (p.status || 'active'); }
    return 'All Projects';
  }
  /* The key groups; this names. They differ only in program mode, where the key is the
     code prefix (AVR) and the name is the shared title (Avesta Residences). Collapse
     state and sorting stay on the KEY, so a rename never loses a collapsed group. */
  function groupDisplayOf(key, plist) {
    return groupMode === 'program' ? progLabel(key, plist) : key;
  }

  function projSelCount() { return Object.keys(projSel).length; }
  function filtered() {
    var q = query.trim().toLowerCase();
    return PROJ.filter(function (p) {
      if (projSelCount() && !projSel[p.id]) return false;
      if (statusFilter && (p.status || 'active') !== statusFilter) return false;
      if (behindOnly && !isBehind(p)) return false;
      if (q) { var hay = ((p.name || '') + ' ' + (p.id || '') + ' ' + (groupHead(p) || '')).toLowerCase(); if (hay.indexOf(q) === -1) return false; }
      return true;
    });
  }

  /* ==========================================================================
     THE OVERVIEW IS A DECISION SURFACE, NOT A REGISTER
     ==========================================================================
     It used to report LEVELS — eight cards, a donut and a bar chart. "Portfolio
     Progress 10%" is a level; "8 percentage points behind plan" is a decision. The
     shape here is the one the Contracts portfolio view arrived at on 2026-09-15 (q):
     a strip of exposures, then projects RANKED by how much attention they need, then
     the register kept underneath because the page is also used to find one project.

     ⚠️⚠️ THE FIRST PAINT COSTS NOTHING AND IS NOT WAITED FOR. Everything below renders
     from PROJ, which is already in memory; the four reads that enrich it land
     independently and repaint as they arrive. A landing page that blocks on four
     round trips is the defect this module just spent two commits removing.
     ⚠️ Each read owns its own slice and its own error. One failing does not blank the
     others, and every block says which of its inputs is missing rather than printing
     a confident zero. */
  var ovX = { ids: null, status: null, claims: null, ms: null, iss: null, curve: null, err: {} };
  var _ovGen = 0;

  function ovReset() { ovX = { ids: null, status: null, claims: null, ms: null, iss: null, curve: null, err: {} }; }

  async function loadOverview(force) {
    var ids = scopedProjectIds();
    if (!force && ovX.ids && ovX.ids.join(',') === ids.join(',')) return;
    var gen = ++_ovGen;
    ovReset(); ovX.ids = ids;
    if (!ids.length) { renderAll(); return; }

    function settle(key, p, shape) {
      return p.then(function (v) { if (gen === _ovGen) { ovX[key] = shape ? shape(v) : v; renderAll(); } })
              .catch(function (e) { if (gen === _ovGen) { ovX.err[key] = e; renderAll(); } });
    }

    /* ⚠️ `schedule_scurve_status` is ONE pass per project with no month series — see
       migrations/2026-09-15-scurve-status-per-project.sql for why this is not an
       extension of the curve RPC. Absent (un-migrated) it degrades: the behind-plan
       column and card say so by name instead of showing a wrong number. */
    settle('status', (async function () {
      /* ⚠️⚠️ FANNED OUT FOR THE SAME REASON AS THE MILESTONE READ ABOVE. The RPC takes a
         LIST of ids, and handed all eighteen it walks every activity of every project in one
         statement — cancelled at the timeout, which reached the owner as *"Behind plan is
         unavailable — the database cancelled the read on a timeout (57014); narrow the project
         filter and try again."* Telling a planner to narrow the filter is asking them to work
         around the bug.
         ⚠️ `p_ids: [id]` — the same RPC, the same SQL, one project's worth of work per call.
         ⚠️ A project that fails is skipped, not fatal: `behindPP()` already returns null for a
         project with no row, and the column renders that as a dash. Only a TOTAL failure throws,
         which is what still surfaces a genuinely absent RPC by name. */
      var r = await PDb.fanOut(ids, function (id) {
        return sb().rpc('schedule_scurve_status', { p_ids: [id] }).then(function (res) {
          if (res.error) throw res.error;
          return res.data || [];
        });
      });
      if (!r.results.length && r.failed.length) throw r.failed[0].err;
      var by = {};
      r.results.forEach(function (x) {
        (x.value || []).forEach(function (row) { by[row.project_id] = row; });
      });
      return by;
    })());

    settle('claims', PDb.selectAll('contracts_claims', function (q) { return q.in('project_id', ids); }));

    /* ⚠️⚠️ ONE PROJECT AT A TIME — THIS READ WAS BEING CANCELLED AT THE 8s TIMEOUT.
       `project_schedule` is the biggest table in the app (16k–40k rows on a large programme), and
       this asked for eighteen projects at once AND filtered with `activity_type.ilike.%milestone%`.
       A leading-wildcard ILIKE cannot use an index, so the only way to answer it was a sequential
       scan over every activity of every project in scope — `57014`, and the owner's *"the milestone
       read failed"* with `What lands next` and `Milestones due in 30 days` both blank.
       ⚠️ Per project the planner is `project_schedule_proj_id_idx (project_id, id)` — an indexed
       range scan — and the ILIKE then runs over one project's activities instead of the portfolio's.
       Same SQL, same rows back, a shape the index can serve. Exactly the fix the portfolio S-Curve
       needed for the same table on the same day; `PDb.fanOut` is that loop, generalised.
       ⚠️ A project that fails no longer fails the page: the rest still draw and the count is
       carried on the array, for the coverage line to report. Only a TOTAL failure throws. */
    settle('ms', (async function () {
      var r = await PDb.fanOut(ids, function (id) {
        return PDb.selectAll('project_schedule', function (q) {
          return q.eq('project_id', id).or('activity_type.ilike.%milestone%,program_milestone.is.true');
        }, 'id,project_id,activity_name,activity_type,program_milestone,start_date,end_date,actual_finish,percent_complete');
      });
      if (!r.results.length && r.failed.length) throw r.failed[0].err;
      return PDb.fanOutRows(r);
    })());

    /* ⚠⚠ ONE AGGREGATE CALL PER PROJECT, through the SHARED fan-out in PDScurve — never
       `schedule_scurve_agg_multi`. That one CROSS JOINs its month series against its leaf
       activities, so the cost is combinatorial in the project count; it was cancelled at the ~8s
       statement_timeout (57014) the first time a planner opened the portfolio S-Curve on
       2026-09-16, and this is the LANDING PAGE. The fan-out is the same SQL with one id, which is
       the shape `project_schedule_proj_id_idx` exists for.
       ⚠ One project failing does not fail the chart — `failed` is collected and counted, and the
       rest still draw. ⚠ The merge's carry-forward is what stops the curve dipping every time a
       project completes; it lives in PDScurve beside the fan-out. */
    settle('curve', (async function () {
      var r = await PDScurve.fanOutAgg(function (id) {
        return sb().rpc('schedule_scurve_agg', { p_id: id });
      }, ids, {});
      var merged = PDScurve.mergeAggs(r.aggs);
      return { curve: merged ? PDScurve.computeFromAgg(merged) : { empty: true },
               drawn: r.aggs.length, failed: r.failed.length };
    })());

    /* ⚠️⚠️ `priority` IS NOT A COLUMN OF `issues_lessons`, AND ASKING FOR IT FAILED THE WHOLE
       READ. PostgREST answers an unknown column with `42703`, so this read threw EVERY time, on
       every project count, from the day it was written — and `issCell()` renders a failed read as
       `?`. That is the row of question marks in the Open Issues column the owner reported
       (2026-09-16), and it is a typo, not a timeout: the table has `severity`, never `priority`,
       nothing else in the app reads such a field, and no migration ever added one.
       ⚠️ The projection is now exactly what `openIssues()` consumes — `project_id` to group by
       and `status` to test — plus `id`, which `PDb.selectAll` needs as its paging cursor.
       ⚠️ This read is deliberately NOT fanned out per project like the two below:
       `issues_lessons` is one row per issue, not per activity, so `.in()` over eighteen ids is a
       cheap indexed read. Splitting it would buy eighteen round trips and nothing else. */
    settle('iss', PDb.selectAll('issues_lessons', function (q) { return q.in('project_id', ids); },
      'id,project_id,status'));
  }

  /* ---- per-project derivations ------------------------------------------ */
  /* ⚠️ Behind plan is (actual − planned) as a share of the project's own duration
     weight, so a big project and a small one are on the same scale. NEGATIVE is
     behind. ⚠️ Measured AS OF TODAY; the S-Curve tab's own strip snaps to the end of
     the current month because its curve is monthly, so the two can differ by a few
     points inside one month. Stated in the note rather than left to be discovered. */
  function behindPP(p) {
    var r = ovX.status && ovX.status[p.id];
    if (!r || !(+r.tot_dur > 0)) return null;
    return ((+r.done_dur - +r.planned_dur) / +r.tot_dur) * 100;
  }
  /* Days the live programme runs past the finish this page DISPLAYS.
     ⚠️ `forecast_finish || end_date` — the same rule the table's Forecast Finish column,
     its sort and projects.html all use. `isBehind` still reads the bare forecast_finish
     and so never tests a project with only a contract date; that asymmetry is the owner's
     open decision, and this column deliberately does not pretend it is settled. */
  function slipDays(p) {
    var sf = pd(p.schedule_finish), cf = pd(p.forecast_finish || p.end_date);
    if (!sf || !cf) return null;
    return Math.round((sf - cf) / 86400000);
  }
  function claimsOf(pid) {
    if (!ovX.claims) return null;
    var rows = ovX.claims.filter(function (r) { return r.project_id === pid; });
    var cash = rows.filter(function (r) { return PDClaims.typeOf(r) !== PDClaims.T_EOT; });
    var eots = PDClaims.ofType(rows, PDClaims.T_EOT);
    var pend = PDClaims.pendingValue(cash, 'eval_amount', 'sub_amount');
    var shortf = PDClaims.shortfallOf(cash, 'sub_amount', 'approved_amount');
    var agg = PDClaims.agingBuckets(cash, ['eval_amount', 'sub_amount']);
    return { exposure: pend + shortf, oldest: agg.oldest,
             eotDays: PDClaims.pendingValue(eots, 'eval_days', 'sub_days') };
  }
  function openIssues(pid) {
    if (!ovX.iss) return null;
    return ovX.iss.filter(function (r) {
      return r.project_id === pid && String(r.status || '').toLowerCase() !== 'closed';
    }).length;
  }

  /* ⚠️⚠️ THE RANK IS AN ORDERING OVER SIGNALS, NEVER A SINGLE SCORE. Days, money and
     counts are not commensurable, and a made-up composite number would present them as
     if they were — this page already carries THREE different progress weightings and
     does not need a fourth invented quantity. So: how many of five signals are raised,
     then the worst slip in days, then the name. The note under the table says exactly
     that, because a ranked list with an unexplained order is not a decision surface. */
  function flagsOf(p) {
    var f = [], bp = behindPP(p), sl = slipDays(p), cl = claimsOf(p.id), oi = openIssues(p.id);
    if (bp != null && bp <= -5) f.push('behind plan');
    if (sl != null && sl > 0) f.push('past its committed finish');
    if (isOverdue(p)) f.push('overdue');
    if (variance(p) > 0) f.push('over budget');
    if (cl && cl.exposure > 0) f.push('unrecovered exposure');
    return f;
  }
  function rankSort(a, b) {
    var fa = flagsOf(a).length, fb = flagsOf(b).length;
    if (fa !== fb) return fb - fa;
    var sa = slipDays(a) || 0, sb2 = slipDays(b) || 0;
    if (sa !== sb2) return sb2 - sa;
    return (a.name || a.id).localeCompare(b.name || b.id);
  }

  function ppCell(p) {
    var v = behindPP(p);
    if (v == null) return '<span class="po-dash">—</span>';
    var t = (v > 0 ? '+' : '') + v.toFixed(1) + ' pp';
    return '<span class="' + (v <= -5 ? 'po-bad' : v < 0 ? 'po-warn' : 'po-ok') + '">' + t + '</span>';
  }
  function slipCell(p) {
    var v = slipDays(p);
    if (v == null) return '<span class="po-dash">—</span>';
    if (v <= 0) return '<span class="po-ok">' + v + 'd</span>';
    return '<span class="' + (v > 30 ? 'po-bad' : 'po-warn') + '">+' + v + 'd</span>';
  }
  function expCell(p) {
    var c = claimsOf(p.id);
    if (!c) return '<span class="po-dash">' + (ovX.err.claims ? '?' : '…') + '</span>';
    if (!c.exposure) return '<span class="po-dash">—</span>';
    return '<span class="' + (c.oldest > 90 ? 'po-bad' : c.oldest > 60 ? 'po-warn' : '') + '">' +
      Fmt.moneyShort(c.exposure) + '</span>';
  }
  function issCell(p) {
    var n = openIssues(p.id);
    if (n == null) return '<span class="po-dash">' + (ovX.err.iss ? '?' : '…') + '</span>';
    return n ? String(n) : '<span class="po-dash">—</span>';
  }

  function renderRank(list) {
    var host = document.getElementById('po-rank');
    var cnt = document.getElementById('po-rank-count');
    var note = document.getElementById('po-ranknote');
    if (!host) return;
    var sorted = list.slice().sort(rankSort);
    var flagged = sorted.filter(function (p) { return flagsOf(p).length; }).length;
    cnt.textContent = flagged ? flagged + ' of ' + sorted.length + ' need attention'
                              : sorted.length ? 'nothing is flagged' : '';
    if (!sorted.length) {
      host.innerHTML = '<tbody><tr><td class="po-empty">No projects match the current filters.</td></tr></tbody>';
      note.textContent = ''; return;
    }
    var head = '<thead><tr><th>Project</th><th>Behind plan</th><th>Past committed finish</th>' +
      '<th class="num">Budget variance</th><th class="num">Unrecovered exposure</th>' +
      '<th class="num">Open issues</th></tr></thead>';
    var body = sorted.map(function (p) {
      var f = flagsOf(p);
      return '<tr class="po-row" data-pick="' + esc(p.id) + '" title="' +
        esc(f.length ? f.join(' · ') : 'nothing flagged') + '">' +
        '<td><span class="po-proj-name"><span class="po-health" style="background:' +
          HEALTH[health(p)].color + ';"></span>' + esc(p.name || p.id) + '</span></td>' +
        '<td>' + ppCell(p) + '</td>' +
        '<td>' + slipCell(p) + '</td>' +
        '<td class="num">' + varCell(p) + '</td>' +
        '<td class="num">' + expCell(p) + '</td>' +
        '<td class="num">' + issCell(p) + '</td></tr>';
    }).join('');
    host.innerHTML = head + '<tbody>' + body + '</tbody>';
    host.querySelectorAll('.po-row[data-pick]').forEach(function (r) {
      r.onclick = function () { openProject(r.dataset.pick); };
    });

    var measured = list.filter(function (p) { return behindPP(p) != null; }).length;
    /* ⚠️⚠️ ONE LINE, NOT A PARAGRAPH. Owner 2026-09-16: *"Highlighted tooltips need to be
       simplified."* This ran to five sentences and explained the RANKING RULE, the dash
       convention and why there is no combined score — design rationale, which belongs in the
       code (it is in `rankSort`'s own comment, directly above) and not under the table on every
       load. What a planner needs here is what the order means and whether a column is
       trustworthy right now.
       ⚠️ The per-project reasons did not go anywhere: every row still carries its own flags
       in its `title`, which is where a specific question gets a specific answer. */
    note.innerHTML = 'Most signals first, then the worst slip. Unflagged projects follow, with dashes. ' +
      (ovX.status
        ? '<b>Behind plan</b> is as of today, over ' + measured + ' of ' + list.length + '.'
        : ovX.err.status
          ? '<b>Behind plan</b> is unavailable — ' + esc(PDb.errText(ovX.err.status)) + '.'
          : '<b>Behind plan</b> is loading.');
  }

  /* ⚠️ What the page could NOT see. The old strip did this for ONE figure (it reported
     whether its progress number was weighted or a plain mean, and over how many
     projects); this generalises it, because every figure above is only as good as the
     inputs that reached it. ⚠️ A comment naming a function that has been deleted is
     worse than none, so it describes the behaviour rather than citing the old name. */
  function renderCoverage(list) {
    var el = document.getElementById('po-coverage');
    if (!el) return;
    if (!list.length) { el.textContent = ''; return; }
    var noRollup = list.filter(function (p) { return !p.schedule_updated_at; }).length;
    var stale = list.filter(function (p) {
      if (!p.schedule_updated_at) return false;
      return (Date.now() - new Date(p.schedule_updated_at).getTime()) > 30 * 86400000;
    }).length;
    var noBudget = list.filter(function (p) { return !(num(p.original_budget) > 0); }).length;
    var bits = [];
    if (noRollup) bits.push('<b>' + noRollup + '</b> carry no schedule roll-up at all');
    if (stale) bits.push('<b>' + stale + '</b> were last rolled up more than 30 days ago');
    if (noBudget) bits.push('<b>' + noBudget + '</b> carry no original budget');
    Object.keys(ovX.err).forEach(function (k) {
      bits.push('the ' + ({ status: 'behind-plan', claims: 'commercial', ms: 'milestone',
                            iss: 'issues' }[k] || k) + ' read failed');
    });
    /* ⚠️ Shortened with the rank note above, and for the same reason. The trailing clause
       Its trailing clause restated what the list of caveats already implies, on every load.
       ⚠️ That clause is deliberately NOT quoted here: `test-portfolio.js` asserts it does not
       occur in this file, and a comment quoting it is an occurrence. */
    el.innerHTML = bits.length
      ? 'Computed over what is there: of ' + list.length + ' project(s), ' + bits.join('; ') + '.'
      : 'All ' + list.length + ' project(s) in scope carry a schedule roll-up and a budget.';
  }

  /* ⚠️⚠️ FOUR FIGURES, EACH TRIGGERING A DIFFERENT ACTION — replacing eight cards of
     which four restated money the portfolio has not captured. Anything that cannot be
     computed says so; a computed 0 and an absent figure are different statements, and
     printing them the same way is what made the old strip read as broken. */
  function renderKPIs(list) {
    var host = document.getElementById('po-kpis');
    if (!host) return;

    /* 1 · Behind plan — the one number this page exists to show. Weighted by duration
       across the whole scope, so a 16,000-activity tower is not one vote beside a
       fit-out. ⚠️ NEGATIVE is behind. */
    var tot = 0, plan = 0, done = 0, measured = 0;
    list.forEach(function (p) {
      var r = ovX.status && ovX.status[p.id];
      if (!r || !(+r.tot_dur > 0)) return;
      tot += +r.tot_dur; plan += +r.planned_dur; done += +r.done_dur; measured++;
    });
    var pp = tot > 0 ? ((done - plan) / tot) * 100 : null;
    var ppTxt = pp == null ? (ovX.err.status ? 'unavailable' : measured || !ovX.status ? '…' : '—')
                           : (pp > 0 ? '+' : '') + pp.toFixed(1) + ' pp';
    var ppCls = pp == null ? '' : pp <= -5 ? 'pd-kpi-bad' : pp < 0 ? 'pd-kpi-warn' : 'pd-kpi-ok';
    var ppSub = ovX.err.status ? 'run migrations/2026-09-15-scurve-status-per-project.sql'
              : pp == null ? 'no project in scope reports a dated schedule'
              : 'duration-weighted across ' + measured + ' of ' + list.length + ' project(s), as of today';

    /* 2 · Money — one card where there were four, and it says "not captured" rather
       than printing four dashes that read as a broken page. */
    var orig = list.reduce(function (a, p) { return a + num(p.original_budget); }, 0);
    var est = list.reduce(function (a, p) { return a + num(p.estimated_cost); }, 0);
    var over = list.filter(function (p) { return variance(p) > 0; }).length;
    var haveMoney = orig || est;
    var vr = est - orig;
    var moneyTxt = haveMoney ? (vr > 0 ? '+' : '') + Fmt.moneyShort(vr) : 'not captured';
    var moneySub = haveMoney
      ? Fmt.moneyShort(orig) + ' budget · ' + Fmt.moneyShort(est) + ' estimated · ' + over + ' over'
      : 'no project in scope carries a budget figure';

    /* 3 · Commercial exposure. ⚠️ MONEY AND DAYS ARE NEVER ADDED — the rule PDClaims
       already enforces; the EOT figure rides in the sub-line as its own quantity. */
    var exposure = null, oldest = 0, eotDays = 0, nExp = 0;
    if (ovX.claims) {
      exposure = 0;
      list.forEach(function (p) {
        var c = claimsOf(p.id); if (!c) return;
        exposure += c.exposure; eotDays += c.eotDays || 0;
        if (c.exposure > 0) nExp++;
        if (c.oldest > oldest) oldest = c.oldest;
      });
    }
    var expTxt = ovX.err.claims ? 'unavailable' : exposure == null ? '…'
               : exposure ? Fmt.moneyShort(exposure) : '—';
    var expSub = ovX.err.claims ? 'the commercial read failed'
               : exposure == null ? 'reading the register…'
               : exposure ? nExp + ' project(s) · oldest pending ' + (oldest || 0) + 'd' +
                            (eotDays ? ' · ' + eotDays + 'd EOT pending' : '')
                          : 'nothing outstanding across the portfolio';

    /* 4 · What lands next. ⚠️ Overdue is called out SEPARATELY rather than folded into
       the count — "6 due" and "6 due, 4 of them already late" are different facts. */
    var due = null, overdue = 0;
    if (ovX.ms) {
      var t = today(), in30 = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 30);
      var inScope = {}; list.forEach(function (p) { inScope[p.id] = 1; });
      due = 0;
      ovX.ms.forEach(function (r) {
        if (!inScope[r.project_id]) return;
        if (r.actual_finish || num(r.percent_complete) >= 100) return;
        var d = pd(r.end_date || r.start_date); if (!d) return;
        if (d < t) { overdue++; due++; } else if (d <= in30) due++;
      });
    }
    var dueTxt = ovX.err.ms ? 'unavailable' : due == null ? '…' : String(due);
    var dueSub = ovX.err.ms ? 'the milestone read failed'
               : due == null ? 'reading milestones…'
               : overdue ? overdue + ' already overdue' : 'none overdue';

    host.innerHTML =
      UI.kpi('Behind plan', ppTxt, { cls: ppCls, sub: ppSub }) +
      UI.kpi('Budget variance', moneyTxt, { cls: haveMoney && vr > 0 ? 'pd-kpi-bad' : '', sub: moneySub }) +
      UI.kpi('Unrecovered exposure', expTxt,
             { cls: exposure ? (oldest > 90 ? 'pd-kpi-bad' : 'pd-kpi-warn') : '', sub: expSub }) +
      UI.kpi('Milestones due in 30 days', dueTxt,
             { cls: overdue ? 'pd-kpi-bad' : '', sub: dueSub });
  }


  // ---- grouped, sortable portfolio table ----
  var COLS = [
    { k: 'name', label: 'Project', num: false },
    { k: 'id', label: 'ID', num: false },
    { k: 'status', label: 'Status', num: false },
    { k: 'progress', label: 'Schedule', num: false },
    { k: 'ffin', label: 'Forecast Finish', num: false },
    { k: 'orig', label: 'Original', num: true },
    { k: 'est', label: 'Estimated', num: true },
    { k: 'var', label: 'Variance', num: true }
  ];
  function sortVal(p, k) {
    switch (k) {
      case 'name': return (p.name || p.id || '').toLowerCase();
      case 'id': return (p.id || '').toLowerCase();
      case 'status': return (p.status || 'active');
      case 'progress': return progressOf(p) == null ? -1 : progressOf(p);
      case 'ffin': return +(pd(p.forecast_finish || p.end_date) || 0);
      case 'orig': return num(p.original_budget);
      case 'est': return num(p.estimated_cost);
      case 'var': return variance(p);
    }
    return 0;
  }
  function statusPill(s) { s = (s || 'active').toLowerCase(); return '<span class="pd-pill ' + (s === 'archived' ? 'pd-pill-muted' : 'pd-pill-ok') + '">' + esc(s.charAt(0).toUpperCase() + s.slice(1)) + '</span>'; }
  function schedCell(p) { var v = progressOf(p); if (v == null) return '<span style="color:var(--pd-muted);">—</span>'; return '<div class="po-sched"><div class="bar"><div style="width:' + v + '%;"></div></div><span>' + v + '%</span></div>'; }
  function varCell(p) { if (num(p.original_budget) === 0 && num(p.estimated_cost) === 0) return '—'; var v = variance(p); return '<span class="' + (v > 0 ? 'po-var-up' : v < 0 ? 'po-var-dn' : '') + '">' + Fmt.moneyShort(v) + '</span>'; }
  function projRow(p) {
    return '<tr class="po-row" data-pick="' + esc(p.id) + '">' +
      '<td><span class="po-proj-name"><span class="po-health" style="background:' + HEALTH[health(p)].color + ';"></span><span class="ic">' + Icons.svg('project', 15) + '</span>' + esc(p.name || p.id) + '</span></td>' +
      '<td><code>' + esc(p.id) + '</code></td>' +
      '<td>' + statusPill(p.status) + '</td>' +
      '<td>' + schedCell(p) + '</td>' +
      '<td>' + Fmt.date(p.forecast_finish || p.end_date) + '</td>' +
      '<td class="num">' + (p.original_budget != null ? Fmt.moneyShort(p.original_budget) : '—') + '</td>' +
      '<td class="num">' + (p.estimated_cost != null ? Fmt.moneyShort(p.estimated_cost) : '—') + '</td>' +
      '<td class="num">' + varCell(p) + '</td></tr>';
  }
  /* A group's combined schedule progress.
     ⚠️ WEIGHTED BY ACTIVITY COUNT, never a plain mean of the members' percentages —
        which is the whole reason this rollup is worth having. Avesta's AVR101 carries
        ~4,393 activities and AVR102 far fewer; averaging "60%" and "10%" to 35% describes
        no real project. Same principle as the Procurement dashboard's note on award rate:
        *"a 2-WP package at 100% and a 200-WP package at 10% is not 55%."*
     ⚠️ Falls back to the unweighted mean ONLY when no member reports an activity count,
        and the cell says which method it used rather than presenting the two alike. */
  function groupProgress(plist) {
    var m = plist.filter(function (p) { return progressOf(p) != null; });
    if (!m.length) return null;
    var wsum = m.reduce(function (a, p) { return a + num(p.schedule_activities); }, 0);
    if (wsum > 0) {
      var acc = m.reduce(function (a, p) { return a + progressOf(p) * num(p.schedule_activities); }, 0);
      return { pct: Math.round(acc / wsum), how: 'Weighted by activity count (' + wsum.toLocaleString('en-US') + ' activities)' };
    }
    return { pct: Math.round(m.reduce(function (a, p) { return a + progressOf(p); }, 0) / m.length),
             how: 'Unweighted mean of ' + m.length + ' project(s) — no activity counts recorded' };
  }
  function subtotal(name, plist) {
    var orig = plist.reduce(function (a, p) { return a + num(p.original_budget); }, 0);
    var est = plist.reduce(function (a, p) { return a + num(p.estimated_cost); }, 0);
    var pr = groupProgress(plist);
    var open = !collapsed[name];
    // In program mode the members ARE the contract packages of one development, so they
    // are counted as packages; every other mode is counting projects.
    var unit = groupMode === 'program'
      ? plist.length + ' package' + (plist.length === 1 ? '' : 's')
      : String(plist.length);
    return '<tr class="po-grp" data-grp="' + esc(name) + '"><td colspan="3"><span class="po-grp-name"><span class="po-caret">' + (open ? '▾' : '▸') + '</span>' + esc(groupDisplayOf(name, plist)) + ' <span style="color:var(--pd-muted);font-weight:400;">(' + esc(unit) + ')</span></span></td>' +
      // ⚠ CELL COUNT: colspan 3 (Project/ID/Status) + Schedule + 1 filler (Forecast
      //   Finish) + 3 money = 8, matching COLS now that Group Head is gone.
      '<td' + (pr ? ' title="' + esc(pr.how) + '"' : '') + '>' + (pr ? pr.pct + '%' : '—') + '</td><td></td>' +
      '<td class="num">' + (orig ? Fmt.moneyShort(orig) : '—') + '</td><td class="num">' + (est ? Fmt.moneyShort(est) : '—') + '</td>' +
      '<td class="num">' + ((orig || est) ? Fmt.moneyShort(est - orig) : '—') + '</td></tr>';
  }
  function renderTable(list) {
    var head = '<thead><tr>' + COLS.map(function (c) {
      return '<th class="' + (c.num ? 'num' : '') + '" data-sort="' + c.k + '">' + esc(c.label) + (sortCol === c.k ? '<span class="po-sort-ind">' + (sortDir < 0 ? '▼' : '▲') + '</span>' : '') + '</th>';
    }).join('') + '</tr></thead>';
    var sorted = list.slice().sort(function (a, b) { var x = sortVal(a, sortCol), y = sortVal(b, sortCol); return x < y ? -sortDir : x > y ? sortDir : 0; });
    var body = '';
    if (!sorted.length) { body = '<tr><td colspan="8" class="po-empty">No projects match the current filters.</td></tr>'; }
    else if (groupMode === 'none') { body = sorted.map(projRow).join(''); }
    else {
      var groups = {}, order = [];
      sorted.forEach(function (p) { var k = groupKeyOf(p); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(p); });
      order.sort();
      body = order.map(function (k) { return subtotal(k, groups[k]) + (collapsed[k] ? '' : groups[k].map(projRow).join('')); }).join('');
    }
    // grand total
    var gOrig = list.reduce(function (a, p) { return a + num(p.original_budget); }, 0), gEst = list.reduce(function (a, p) { return a + num(p.estimated_cost); }, 0);
    if (sorted.length) body += '<tr class="po-tot-row"><td colspan="3">TOTAL (' + sorted.length + ')</td><td></td><td></td>' +
      '<td class="num">' + (gOrig ? Fmt.moneyShort(gOrig) : '—') + '</td><td class="num">' + (gEst ? Fmt.moneyShort(gEst) : '—') + '</td><td class="num">' + ((gOrig || gEst) ? Fmt.moneyShort(gEst - gOrig) : '—') + '</td></tr>';
    var t = document.getElementById('po-table');
    t.innerHTML = head + '<tbody>' + body + '</tbody>';
    t.querySelectorAll('th[data-sort]').forEach(function (th) { th.onclick = function () { var k = th.dataset.sort; if (sortCol === k) sortDir = -sortDir; else { sortCol = k; sortDir = 1; } renderTable(filtered()); }; });
    t.querySelectorAll('.po-grp[data-grp]').forEach(function (g) { g.onclick = function () { var k = g.dataset.grp; collapsed[k] = !collapsed[k]; renderTable(filtered()); }; });
    t.querySelectorAll('.po-row[data-pick]').forEach(function (r) { r.onclick = function () { openProject(r.dataset.pick); }; });
  }

  function openProject(id) {
    var p = PROJ.find(function (x) { return x.id === id; }); if (!p) return;
    sessionStorage.setItem('pd_project', p.id);
    sessionStorage.setItem('pd_project_name', p.name || p.id);
    sessionStorage.setItem('pd_group_head', p.group_head_id || '');
    location.href = '../../dashboard.html';
  }

  // ---- multi-select project filter (checklist dropdown) ----
  var pfQuery = '';
  /* Every project keyed by its program, programs of 2+ first. This is what makes the
     consolidation usable BEYOND the overview table: the project filter scopes the S-curve,
     Cash Flow, Equipment, Milestones and Resources tabs too, so ticking one parent project
     puts both of its packages into every one of them at once. */
  function programGroups() { return PDProgram.groups(PROJ); }

  function projFilterLabel() {
    var n = projSelCount();
    if (!n) return 'All projects';
    if (n === 1) { var p = PROJ.find(function (x) { return projSel[x.id]; }); return p ? (p.name || p.id) : '1 project'; }

  function renderProjFilterList() {

  /* ⚠️ Paints from PROJ only — never fetches. `loadOverview` owns the reads and calls

     read degrades one block instead of holding the page. */
  /* ======================= D5 — what lands next =====================================
     The next 30 / 60 / 90 days of milestones across every project in scope, overdue first.
     ⚠⚠ NO READ OF ITS OWN. `ovX.ms` is already fetched for the strip's own 30-day figure, so
        this list and that number cannot disagree about which milestones exist — and adding a
        second read of the same table is how two blocks on one page start contradicting
        each other.
     ⚠ The Milestones view stays: that one is a month CALENDAR you navigate, this answers
       "what is coming at me" without navigating. Different questions, both worth having. */
  function miniChart(opts) {
    var W = 680, H = 170, padL = 34, padR = 8, padT = 10, padB = 20;
    var n = opts.n;
    if (!n) return '<div class="po-empty">Nothing to draw.</div>';
    function x(i) { return padL + (n === 1 ? 0 : (i / (n - 1)) * (W - padL - padR)); }
    function y(v) { return padT + (1 - (v / 100)) * (H - padT - padB); }
    function poly(vals, cls) {
      var pts = [], run = [];
      vals.forEach(function (v, i) {
        if (v == null) { if (run.length) { pts.push(run); run = []; } return; }
        run.push(x(i).toFixed(1) + ',' + y(v).toFixed(1));
      });
      if (run.length) pts.push(run);
      return pts.map(function (r) { return '<polyline class="' + cls + '" points="' + r.join(' ') + '" />'; }).join('');
    }
    var grid = [0, 25, 50, 75, 100].map(function (v) {
      return '<line class="po-tr-grid" x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) + '" />' +
             '<text class="po-tr-ax" x="' + (padL - 5) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>';
    }).join('');
    var marks = '';
    if (opts.ti != null && opts.ti >= 0 && opts.ti < n) {
      marks = '<line class="po-tr-now" x1="' + x(opts.ti) + '" y1="' + padT + '" x2="' + x(opts.ti) + '" y2="' + (H - padB) + '" />';
      if (opts.actual && opts.actual[opts.ti] != null)
        marks += '<circle class="po-tr-mark" cx="' + x(opts.ti) + '" cy="' + y(opts.actual[opts.ti]) + '" r="3.5" />';
    }
    var lbl = (opts.labels || []).map(function (t, i) {
      return t ? '<text class="po-tr-ax" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(t) + '</text>' : '';
    }).join('');
    return '<svg class="po-tr-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">' +
      grid + marks + poly(opts.planned, 'po-tr-plan') + poly(opts.actual, 'po-tr-act') + lbl + '</svg>';
  }

  function renderTrends() {
    var host = document.getElementById('po-tr-sc'), note = document.getElementById('po-tr-note');
    if (!host) return;
    if (ovX.err.curve) { host.innerHTML = '<div class="po-empty">The schedule roll-up could not be read, so the curve is not drawn.</div>'; note.textContent = 'unavailable'; return; }
    if (!ovX.curve) { host.innerHTML = '<div class="po-empty">Reading the schedule roll-up\u2026</div>'; note.textContent = ''; return; }
    var c = ovX.curve.curve;
    if (!c || c.empty) {
      host.innerHTML = '<div class="po-empty">No project in scope carries a baselined schedule, so there is no curve to draw.</div>';
      note.textContent = ''; return;
    }
    var TOT = c.TOT || 1;
    var planned = c.plannedC.map(function (v) { return v / TOT * 100; });
    /* ⚠ null, not 0, past the data date — a zero would draw a line crashing to the floor. */
    var actual = c.actualC.map(function (v, i) { return i <= c.ti ? v / TOT * 100 : null; });
    var every = Math.max(1, Math.ceil(c.months.length / 8));
    var labels = c.months.map(function (m, i) {
      return (i % every === 0) ? moLabelLocal(m) : '';
    });
    host.innerHTML = miniChart({ n: c.months.length, planned: planned, actual: actual,
                                 ti: c.ti, labels: labels }) +
      '<div class="po-tr-legend">' +
        '<span><i class="po-tr-sw po-tr-sw-plan"></i>Planned</span>' +
        '<span><i class="po-tr-sw po-tr-sw-act"></i>Actual</span>' +
        '<span class="po-mut">duration-weighted</span>' +
      '</div>';
    /* ⚠ The variance is stated in PERCENTAGE POINTS, and labelled as a variance rather than as
       progress — the two are routinely confused and only one of them is a decision. */
    var v = c.variance;
    note.innerHTML = c.plannedPct.toFixed(1) + '% planned to date \u00b7 ' + c.actualPct.toFixed(1) + '% actual \u00b7 ' +
      '<span class="' + (v < 0 ? 'po-bad' : 'po-ok') + '">' + (v >= 0 ? '+' : '') + v.toFixed(1) + ' pts</span>' +
      ' \u00b7 ' + ovX.curve.drawn + ' project(s) drawn' +
      (ovX.curve.failed ? ' \u00b7 <span class="po-warn">' + ovX.curve.failed + ' could not be read</span>' : '');
  }

    if (!list.length) { UI.toast('Nothing to export.', 'warn'); return; }
    // The parent project travels with the export, so a pivot in Excel can consolidate
    // AVR101 + AVR102 the same way the on-screen rollup does. Computed over the whole
    // portfolio, not the filtered list, or a filter that hides AVR102 would rename
    // AVR101's parent to AVR101's own title.
    var pLabel = {};
    programGroups().forEach(function (g) { g.members.forEach(function (p) { pLabel[p.id] = g.label; }); });
    var data = list.map(function (p) {
      return {
        'Project': p.name || p.id, 'ID': p.id, 'Parent project': pLabel[p.id] || '', 'Status': p.status || 'active',
        'Group Head': groupHead(p) || '', 'Schedule %': progressOf(p) != null ? progressOf(p) : '',
        'Health': HEALTH[health(p)].label,
        'Forecast Start': p.forecast_start || p.start_date || '', 'Forecast Finish': p.forecast_finish || p.end_date || '',
        'Original Budget': p.original_budget != null ? num(p.original_budget) : '', 'Estimated Cost': p.estimated_cost != null ? num(p.estimated_cost) : '',
        'Variance': (p.original_budget != null || p.estimated_cost != null) ? variance(p) : ''
      };
    });
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Portfolio');
    XLSX.writeFile(wb, 'Portfolio Dashboard.xlsx');
  }


  // ================= Portfolio Stakeholder Map (cross-project) =================
  // ⚠️ Column reuse mirrors stakeholder-map/module.js exactly: `influence` actually stores
  // IMPACT and `interest` actually stores INFLUENCE (a historical naming mismatch documented
  // there). Reading them any other way here would silently disagree with the module.
  var shRows = null, shLoadedIds = null, shQuery = '';






  AppAuth.requireLogin(async function (user, profile) {
    UI.renderUserBar(profile);
    UI.initShell();
    var isAdmin = !!profile && (profile.role === 'admin' || profile.role === 'super_admin');
    UI.renderNav(document.getElementById('side-nav'), 'portfolio', { active: 'portfolio-dashboard', base: '../../', isAdmin: isAdmin });
    UI.renderSwitcher(document.getElementById('ctx-switcher'), { mode: 'portfolio', base: '../../' });
    // ⚠️ The sidebar hides these five modules for everyone but super_admin (config.js
    // `superAdminOnly`, 2026-09-03) — but their cross-project data is ALSO reachable from
    // right here, as this page's own tabs, which are static markup rather than built off
    // APP_CONFIG.MODULES. Hiding the sidebar link and leaving the tab open would just move
    // the leak one click over, so the matching tabs are hidden the same way, off the same
    // role. `contracts` was in this list until 2026-09-03 (b) — Contracts & Claims is
    // unhidden app-wide now, so its tab stays too. `resources`/`s-curve`/`milestones`/
    // `issues`/`meetings`/`photos`/`overview` stay — none of those seven modules are
    // superAdminOnly.
    document.getElementById('po-group').onchange = function (e) { groupMode = e.target.value; collapsed = {}; renderCurrent(); };
    wireProjFilter();
    document.getElementById('po-status').onchange = function (e) { statusFilter = e.target.value; renderCurrent(); };
    document.getElementById('po-behind').onchange = function (e) { behindOnly = e.target.checked; renderCurrent(); };
    document.getElementById('po-q').oninput = function (e) { query = e.target.value; renderCurrent(); };
    document.getElementById('po-export').onclick = exportExcel;
    // Each tab's own filter row (incl. its search box) hides behind one
    // funnel toggle instead of sitting permanently open.
    // Browser-history integration — see UI.bindHistoryState in ui.js. Without this,
    // switching Overview/Milestones/Stakeholder Map never
    // touches the URL, so the browser's native Back button jumps straight past
    // every tab switch to the projects/dashboard page.
    var histView = UI.bindHistoryState({
      key: 'po_view',
      get: function () { return { v: view }; },
      apply: function (s) { switchView(s.v); }
    });

    /* ⚠️⚠️ THE SWITCHER IS BUILT AFTER AUTH, DELIBERATELY. Five views are super-admin-only
       and `window.__role` is not known until requireLogin resolves — building earlier would
       offer a planner five views they cannot open, and tabsToDropdown caches its button list
       at build time, so removing them afterwards would leave them sitting in the menu.
       ⚠️ No flash is introduced: `.pd-tabsrc` is hidden from the first frame by the shared
       `html.pd-js .pd-tabsrc` rule, so the raw strip is never on screen either way.
       ⚠️ `opts.icon` is NOT passed — this page keeps its own <h1>, and the 2026-09-04 rule is
       that only a module whose title is hidden outright supplies the icon to the dropdown. */
    /* ⚠️ The tab strip is gone (see the markup note above), so there is nothing to wire and
       nothing for `UI.tabsToDropdown` to convert. `switchView` survives as the DEEP-LINK RESOLVER
       that `#po_view=` arrives through — removing it would break links that are months old. */

    document.getElementById('po-refresh').onclick = refreshCurrent;
    /* ⚠️ The Stakeholder Map's own controls (search, group-by, layout, the directory/matrix
       switch and "+ Add person") went with the view, and so did every renderer behind them.
       ⚠️⚠️ THEIR NAMES ARE DELIBERATELY NOT WRITTEN HERE. `test-portfolio.js` asserts that
       each one "does not occur in this page at all any more" by counting occurrences in the
       source, and a comment naming them is an occurrence — it would keep that check red forever,
       or worse, teach the next person to relax the check. */
    try {
      var res = await Promise.all([PDb.getProjects(), PDb.getGroupHeads()]);
      PROJ = res[0]; GH = res[1];
      if (window.PDSync) PDSync.cachePut('po:all', { PROJ: PROJ, GH: GH });   // offline read-cache
    } catch (e) {
      // Offline / fetch failed: render the last-cached portfolio so it still opens.
      var restored = false;
      if (window.PDSync) {
        var c = await PDSync.cacheGet('po:all');
        if (c && c.rows) { PROJ = c.rows.PROJ || []; GH = c.rows.GH || []; restored = true; }
      }
      if (!restored) UI.toast('Could not load portfolio: ' + (e.message || e), 'error');
    }
    GH.forEach(function (g) { ghById[g.id] = g; });
    renderAll();
    // ⚠️ Re-apply the current view now that PROJ/GH are actually populated. A page
    // landing DIRECTLY on a non-overview tab via #po_view=… (bindHistoryState's
    // `initial` branch, e.g. the sidebar's deep links into this page) calls
    // switchView() synchronously, BEFORE this fetch resolves — so scopedProjectIds()
    // sees an empty PROJ, every loadX() bails out on "no projects match" and never
    // gets asked again. Harmless when view is still 'overview' (just re-toggles
    // display, which renderAll() already painted).
    switchView(view);

    // Presence only: the portfolio spans ALL projects, so there's no single-project
    // channel and no editing cursor (it's a read-only rollup). This shows who else is
    // viewing the portfolio right now. Live per-project data still comes via the
    // per-tab Refresh + the modules that write the rollups.
    if (window.PDCollab) {
      PDCollab.join({
        key: 'portfolio',
        self: { id: (profile && profile.id) || user.id, name: (profile && (profile.name || profile.email)) || 'Someone' },
        onPresence: function (members) { var el = document.getElementById('po-presence'); if (el) el.innerHTML = PDCollab.avatarsHTML(members || []); }
      });
    }
  });
})();
</script>
