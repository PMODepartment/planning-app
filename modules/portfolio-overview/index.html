      if (!hits.length) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="po-dir-dup"><b>Already in the directory?</b>' +
        hits.map(function (h) {
          return '<div class="po-dir-dup-row"><span>' + esc(h.person.name) +
            (h.person.organization ? ' · ' + esc(h.person.organization) : '') + '</span>' +
            '<em>' + esc(h.why) + '</em></div>';
        }).join('') +
        '<small>Creating this person anyway will leave two records for the same person. ' +
        'Cancel and open the existing one instead if it is the same.</small></div>';
    }
    ['po-dp-name', 'po-dp-org'].forEach(function (id) {
      document.getElementById(id).oninput = checkDup;
    });

    m.el.querySelector('[data-act="cancel"]').onclick = m.close;
    m.el.querySelector('[data-act="save"]').onclick = async function (e) {
      var btn = e.currentTarget, f = fields();
      if (!f.name) { UI.toast('A name is required.', 'warn'); return; }
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        var r = await PDStakeholders.createPerson(sb(), f, (profile && profile.id) || null);
        UI.toast(r.existed ? 'That person was already in the directory — opening them.' : 'Person created', 'ok');
        m.close();
        await loadDirectory(true); dirRender();
        if (r.person) openPersonPanel(r.person.id);
      } catch (err) {
        UI.toast('Could not create: ' + ((err && err.message) || err), 'error');
        btn.disabled = false; btn.textContent = 'Create person';
      }
    };
  }

  // ---- one person: assign to projects, or merge ----------------------------
  // ⚠️⚠️ CLICKING A PERSON OPENS THEIR PAGE, NOT A DIALOG. Owner: "when clicking on
  //    the stakeholder from the Portfolio View it just opens a pop-up for assigning a
  //    project. I need to have the page where I will see the personal page of that
  //    stakeholder with details."
  // ⚠️ `openPersonPanel` is KEPT and still reachable — it is where assigning to projects
  //    and merging duplicates live, and the Health view's duplicate list opens it
  //    directly. What changed is that it is no longer what a plain click does.
  function personHref(id) {
    return '../../person.html#person=' + encodeURIComponent(id);
  }
  function openPerson(id) { location.href = personHref(id); }

  function openPersonPanel(id) {
    var p = (dirRows || []).filter(function (x) { return String(x.id) === String(id); })[0];
    if (!p) return;
    var on = dirUse[p.id] || [];
    var nameById = {}; PROJ.forEach(function (x) { nameById[x.id] = x.name || x.id; });

    var projList = PROJ.map(function (x) {
      var already = on.indexOf(x.id) !== -1;
      return '<label class="po-dir-proj' + (already ? ' is-on' : '') + '">' +
        '<input type="checkbox" value="' + esc(x.id) + '"' + (already ? ' checked disabled' : '') + '>' +
        '<span>' + esc(nameById[x.id]) + '</span>' +
        (already ? '<em>already on</em>' : '') + '</label>';
    }).join('');

    // ⚠ Merge candidates come from the same shared matcher, so the dialog cannot
    //   propose a different set from the one the save path warns about.
    var cands = dirOn() ? PDStakeholders.matchCandidates(p, dirRows || [], { limit: 5, excludeIds: [p.id], threshold: 0.6 }) : [];

    var m = UI.modal(
      '<div class="pd-modal-header"><h2>' + esc(p.name || '(unnamed)') + '</h2></div>' +
      '<div class="pd-modal-body">' +
        '<p class="po-dir-lead">' +
          esc([p.role_title, p.organization].filter(Boolean).join(' · ') || 'No organisation recorded') +
          ' — on <b>' + on.length + '</b> project' + (on.length === 1 ? '' : 's') + '.</p>' +
        '<h4 class="po-dir-h">Assign to projects</h4>' +
        '<div class="po-dir-projs">' + (projList || '<span class="po-empty">No projects available.</span>') + '</div>' +
        (cands.length
          ? '<h4 class="po-dir-h">Possible duplicates</h4>' +
            '<div class="po-dir-merge">' +
              cands.map(function (h) {
                return '<label class="po-dir-mrow"><input type="radio" name="po-mrg" value="' + esc(h.person.id) + '">' +
                  '<span>' + esc(h.person.name) + (h.person.organization ? ' · ' + esc(h.person.organization) : '') +
                  ' <small>on ' + ((dirUse[h.person.id] || []).length) + ' project(s)</small></span>' +
                  '<em>' + esc(h.why) + '</em></label>';
              }).join('') +
              // ⚠ Direction stated plainly. A merge is not symmetric and the dialog
              //   must not leave which record survives to be inferred.
              '<small class="po-dir-note">Merging keeps <b>' + esc(p.name) + '</b> and folds the selected ' +
              'person into them: their projects move across, blank fields are filled in, and the duplicate ' +
              'record is deleted. It is refused if both are on the same project — settle that one by hand first.</small>' +
            '</div>'
          : '') +
      '</div>' +
      '<div class="pd-modal-foot">' +
        '<button class="pd-btn" data-act="close">Close</button>' +
        (cands.length ? '<button class="pd-btn" data-act="merge">Merge selected into this person</button>' : '') +
        '<button class="pd-btn pd-btn-primary" data-act="assign">Assign to ticked projects</button>' +
      '</div>', { noBackdropClose: true });

    m.el.querySelector('[data-act="close"]').onclick = m.close;

    m.el.querySelector('[data-act="assign"]').onclick = async function (e) {
      var btn = e.currentTarget;
      var picked = [].filter.call(m.el.querySelectorAll('.po-dir-projs input:checked:not(:disabled)'),
                                  function (i) { return true; }).map(function (i) { return i.value; });
      if (!picked.length) { UI.toast('Tick at least one project.', 'warn'); return; }
      btn.disabled = true; btn.textContent = 'Assigning…';
      try {
        var r = await PDStakeholders.assignToProjects(sb(), p, picked, (profile && profile.id) || null, on);
        // ⚠ Report the real number. `stakeholder_map_ins` requires can_access_project,
        //   so a project the planner cannot write to must not be counted as done.
        if (r.short) UI.toast('Added to ' + r.inserted + ' project(s); ' + r.short + ' were refused — check your access.', 'warn');
        else UI.toast('Added to ' + r.inserted + ' project(s).', 'ok');
        m.close();
        shLoadedIds = null;
        await loadDirectory(true); dirRender();
      } catch (err) {
        UI.toast('Could not assign: ' + ((err && err.message) || err), 'error');
        btn.disabled = false; btn.textContent = 'Assign to ticked projects';
      }
    };

    var mb = m.el.querySelector('[data-act="merge"]');
    if (mb) mb.onclick = async function (e) {
      var sel = m.el.querySelector('input[name="po-mrg"]:checked');
      if (!sel) { UI.toast('Pick the duplicate to fold in.', 'warn'); return; }
      var loser = (dirRows || []).filter(function (x) { return String(x.id) === sel.value; })[0];
      if (!loser) return;
      if (!confirm('Fold "' + (loser.name || '') + '" into "' + (p.name || '') + '"?\n\n' +
                   'Their projects move across and the duplicate record is deleted. This cannot be undone here.')) return;
      var btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Merging…';
      try {
        var r = await PDStakeholders.mergePeople(sb(), p, loser, dirUse);
        if (r.ok) {
          UI.toast('Merged. ' + r.repointed + ' project link(s) moved' +
                   (r.filled.length ? ', ' + r.filled.length + ' field(s) filled in.' : '.'), 'ok');
          m.close(); shLoadedIds = null;
          await loadDirectory(true); dirRender();
          return;
        }
        // ⚠ Every refusal names WHAT stopped it and what to do — none of them are
        //   reported as a generic failure, and none is rounded up to success.
        var msg = r.reason === 'both-on-project'
            ? 'Both are on ' + r.projects.map(function (x) { return nameById[x] || x; }).join(', ') +
              '. Remove one of them from that project first, then merge.'
          : r.reason === 'partial-repoint'
            ? 'Only ' + r.repointed + ' of ' + r.expected + ' project links could be moved — the rest belong to ' +
              'other planners, and only their owner or an admin can move them. Nothing was deleted.'
          : r.reason === 'delete-refused'
            ? 'The records were merged, but deleting the duplicate needs a planner or admin role.'
          : r.reason === 'winner-update-refused'
            ? 'The directory refused the update — you may not have write access.'
          : 'Merge did not complete.';
        UI.toast(msg, 'warn');
        btn.disabled = false; btn.textContent = 'Merge selected into this person';
        shLoadedIds = null; await loadDirectory(true); dirRender();
      } catch (err) {
        UI.toast('Merge failed: ' + ((err && err.message) || err), 'error');
        btn.disabled = false; btn.textContent = 'Merge selected into this person';
      }
    };
  }




  // ================= Tab switching =================
  /* ==========================================================================
     PORTFOLIO MILESTONE CALENDAR
     A month grid of every scoped project's milestones, so "what lands next, and
     what has already slipped" is one glance instead of one schedule at a time.

     ⚠️ ALL DATE MATHS IS ON THE STRINGS, IN UTC. `new Date('2026-08-25')` parses
     as UTC midnight and then prints in local time, which east of Greenwich is a
     day out — this app has been bitten by that repeatedly (minusDays in both
     registers, the drawing importer's whole date column). Nothing here converts
     a date string to a Date except through ymd()/addDays(), which are integer
     arithmetic on Date.UTC.
     ========================================================================== */
  var msRows = null, msLoadedIds = null, msMonth = null;   // msMonth = 'YYYY-MM'
  var msState = '', msProgOnly = false;

  function ymd(str) {
    var p = String(str || '').slice(0, 10).split('-');
    if (p.length !== 3) return null;
    var y = +p[0], m = +p[1], d = +p[2];
    if (!y || !m || !d) return null;
    return { y: y, m: m, d: d, t: Date.UTC(y, m - 1, d) };
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function isoOf(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
  function addDays(t, n) { return t + n * 86400000; }
  /* Today as the USER sees it — local getters, matching every other "today" in
     this app — then pinned to a UTC instant so it compares with the date strings. */
  function todayT() { var n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  /* The date a milestone actually lands on: the ACTUAL if it happened, else the
     planned one. ⚠️ A milestone is a single point, but the schema still carries
     start and finish — a Start Milestone stores its date in start_date and a
     Finish Milestone in end_date, so both are consulted rather than assuming one. */
  function msDate(r) {
    return r.actual_finish || r.actual_start || r.end_date || r.start_date || null;
  }
  function msPlanned(r) { return r.end_date || r.start_date || null; }
  function msAchieved(r) { return !!(r.actual_finish || r.actual_start); }
  /* ⚠️ Slip is measured against the BASELINE, not against the plan. The plan
     moves every time someone reschedules; the baseline is what was committed to,
     which is the only thing a slip can honestly be measured from. Null when
     there is no baseline — "we never committed to a date" is not zero slip. */
  function msSlip(r) {
    var b = ymd(r.bl_finish), a = ymd(msDate(r));
    if (!b || !a) return null;
    return Math.round((a.t - b.t) / 86400000);
  }
  function msStateOf(r) {
    if (msAchieved(r)) return 'achieved';
    var d = ymd(msDate(r));
    if (!d) return 'undated';
    return d.t < todayT() ? 'overdue' : 'due';
  }

  async function loadMilestones(force) {
    var ids = scopedProjectIds();
    if (!force && msLoadedIds && msLoadedIds.join(',') === ids.join(',')) { renderMilestones(); return; }
    var body = document.getElementById('po-ms-body');
    if (!ids.length) { document.getElementById('po-ms-kpis').innerHTML = ''; body.innerHTML = '<div class="po-empty">No projects match the current filter.</div>'; return; }
    body.innerHTML = '<div class="po-empty">Loading milestones across ' + ids.length + ' project(s)…</div>';
    try {
      /* ⚠️ PAGINATED, and filtered SERVER-SIDE to milestones only. Pulling every
         activity across the portfolio to find a few hundred milestones is the
         mistake the S-Curve tab already had to fix; and an unpaginated read caps
         at 1000 rows with no error, which would silently hide the later months. */
      msRows = await PDb.selectAll('project_schedule', function (q) {
        return q.in('project_id', ids)
                .or('activity_type.ilike.%milestone%,program_milestone.is.true');
      }, 'id,project_id,activity_id,activity_name,activity_type,program_milestone,' +
         'start_date,end_date,actual_start,actual_finish,bl_finish,percent_complete,phase,scope_type');
      msLoadedIds = ids;
    } catch (e) {
      body.innerHTML = '<div class="po-empty">Could not load milestones: ' + esc(e.message || String(e)) + '</div>';
      return;
    }
    if (!msMonth) {
      /* Open on the month that has something to show: today if anything is
         happening around now, otherwise the next month that carries a milestone.
         Opening on an empty month reads as "there are none". */
      var t = todayT(), fut = msRows.map(msDate).filter(Boolean).map(ymd).filter(Boolean)
        .filter(function (d) { return d.t >= t; }).sort(function (a, b) { return a.t - b.t; });
      var cur = new Date(t);
      var thisKey = cur.getUTCFullYear() + '-' + pad2(cur.getUTCMonth() + 1);
      var hasThis = msRows.some(function (r) { var d = msDate(r); return d && String(d).slice(0, 7) === thisKey; });
      msMonth = hasThis || !fut.length ? thisKey : String(isoOf(fut[0].t)).slice(0, 7);
    }
    renderMilestones();
  }

  function msVisible() {
    return (msRows || []).filter(function (r) {
      if (msProgOnly && !r.program_milestone) return false;
      if (msState && msStateOf(r) !== msState) return false;
      return true;
    });
  }

  function renderMilestones() {
    var body = document.getElementById('po-ms-body');
    if (!msRows) return;
    var rows = msVisible();
    var t = todayT();

    // ---- KPIs, over the whole scope (not just the month on screen) --------
    var undated = rows.filter(function (r) { return msStateOf(r) === 'undated'; }).length;
    var overdue = rows.filter(function (r) { return msStateOf(r) === 'overdue'; });
    var achieved = rows.filter(msAchieved);
    var next30 = rows.filter(function (r) {
      var d = ymd(msDate(r)); return d && !msAchieved(r) && d.t >= t && d.t <= addDays(t, 30);
    });
    var slips = achieved.map(msSlip).filter(function (x) { return x != null; });
    var late = slips.filter(function (x) { return x > 0; });
    document.getElementById('po-ms-kpis').innerHTML =
      msKpi('Milestones', rows.length, scopeLabel(scopedProjectIds())) +
      msKpi('Overdue', overdue.length, 'past due and not achieved', overdue.length ? 'bad' : 'good') +
      msKpi('Next 30 days', next30.length, 'coming up', next30.length ? 'warn' : '') +
      msKpi('Achieved', achieved.length, late.length + ' of ' + slips.length + ' landed late', 'good') +
      /* ⚠️ Undated milestones get their own tile rather than being dropped: a
         milestone with no date cannot appear on a calendar at all, and silently
         omitting it is how one goes unnoticed until it is missed. */
      msKpi('Undated', undated, undated ? 'cannot be placed on the calendar' : 'all dated', undated ? 'warn' : '');

    // ---- the month grid ---------------------------------------------------
    var mk = msMonth.split('-'), Y = +mk[0], M = +mk[1];
    document.getElementById('po-ms-month').textContent = MONTH_NAMES[M - 1] + ' ' + Y;

    var first = Date.UTC(Y, M - 1, 1);
    var daysIn = new Date(Date.UTC(Y, M, 0)).getUTCDate();
    /* ⚠️ MONDAY-FIRST. The working week here is Mon–Sat (see PDCal and the
       seasonal calendars), so Sunday is the rest day and belongs at the END of
       the row rather than opening it. getUTCDay() is 0=Sun, so shift by 6. */
    var lead = (new Date(first).getUTCDay() + 6) % 7;

    var byDay = {};
    rows.forEach(function (r) {
      var d = msDate(r); if (!d) return;
      var k = String(d).slice(0, 10);
      (byDay[k] = byDay[k] || []).push(r);
    });

    var inMonth = rows.filter(function (r) { var d = msDate(r); return d && String(d).slice(0, 7) === msMonth; });
    var h = '<div class="pd-card po-cal">' +
      '<div class="po-cal-head">' + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
        .map(function (d, i) { return '<div class="po-cal-dow' + (i === 6 ? ' rest' : '') + '">' + d + '</div>'; }).join('') + '</div>' +
      '<div class="po-cal-grid">';

    var CAP = 3;   // chips drawn per day before the overflow button
    for (var i = 0; i < lead; i++) h += '<div class="po-cal-cell out"></div>';
    for (var day = 1; day <= daysIn; day++) {
      var cellT = Date.UTC(Y, M - 1, day), key = isoOf(cellT);
      var list = (byDay[key] || []).slice().sort(function (a, b) {
        return (msStateOf(a) === 'overdue' ? -1 : 0) - (msStateOf(b) === 'overdue' ? -1 : 0);
      });
      var isToday = cellT === t, isRest = (new Date(cellT).getUTCDay() === 0);
      h += '<div class="po-cal-cell' + (isToday ? ' today' : '') + (isRest ? ' rest' : '') + '">' +
        '<div class="po-cal-daynum">' + day + (isToday ? '<span class="po-cal-todaytag">today</span>' : '') + '</div>';
      list.slice(0, CAP).forEach(function (r) { h += msChip(r); });
      if (list.length > CAP) {
        /* ⚠️ The overflow is a BUTTON, not a silent truncation. "+2 more" that
           cannot be opened is the same as hiding them. */
        h += '<button class="po-cal-more" data-day="' + esc(key) + '">+' + (list.length - CAP) + ' more</button>';
      }
      h += '</div>';
    }
    var tail = (7 - ((lead + daysIn) % 7)) % 7;
    for (var j = 0; j < tail; j++) h += '<div class="po-cal-cell out"></div>';
    h += '</div>';

    if (!inMonth.length) {
      h += '<div class="po-cal-none">Nothing in ' + esc(MONTH_NAMES[M - 1] + ' ' + Y) +
        (rows.length ? ' — use the arrows, or Today, to move.' : '.') + '</div>';
    }
    h += '</div>';

    // ---- an agenda under the grid, because a chip cannot show everything ---
    var agenda = inMonth.slice().sort(function (a, b) {
      return String(msDate(a)).localeCompare(String(msDate(b))) ||
             String(projNameOf(a.project_id)).localeCompare(String(projNameOf(b.project_id)));
    });
    if (agenda.length) {
      h += '<div class="pd-card po-tablecard" style="margin-top:14px;overflow:auto;">' +
        '<table class="pd-table pd-proj-table po-table"><thead><tr><th>Date</th><th>Project</th><th>Milestone</th>' +
        '<th>Phase</th><th>State</th><th class="num">Slip vs baseline</th></tr></thead><tbody>' +
        agenda.map(function (r) {
          var st = msStateOf(r), sl = msSlip(r);
          return '<tr><td class="po-nowrap">' + esc(String(msDate(r)).slice(0, 10)) + '</td>' +
            '<td>' + esc(projNameOf(r.project_id)) + '</td>' +
            '<td><strong>' + esc(r.activity_name || r.activity_id || '(unnamed)') + '</strong>' +
              (r.program_milestone ? ' <span class="po-ms-prog">program</span>' : '') +
              (r.scope_type === 'change_order' ? ' <span class="po-ms-co">change order</span>' : '') + '</td>' +
            '<td>' + esc(r.phase || '') + '</td>' +
            '<td><span class="po-ms-state ' + st + '">' + msStateLabel(st) + '</span>' +
              (msAchieved(r) && msPlanned(r) ? '<div class="po-ms-sub">planned ' + esc(String(msPlanned(r)).slice(0, 10)) + '</div>' : '') + '</td>' +
            '<td class="num">' + (sl == null
              ? '<span class="po-ms-sub">no baseline</span>'
              : '<span class="po-ms-slip ' + (sl > 0 ? 'late' : sl < 0 ? 'early' : '') + '">' + (sl > 0 ? '+' : '') + sl + 'd</span>') + '</td></tr>';
        }).join('') +
        '</tbody></table></div>';
    }

    body.innerHTML = h;
    if (window.Icons) Icons.hydrate(body);
    body.querySelectorAll('[data-day]').forEach(function (b) {
      b.onclick = function () { openMsDay(b.dataset.day, byDay[b.dataset.day] || []); };
    });
    body.querySelectorAll('[data-msid]').forEach(function (b) {
      b.onclick = function () {
        var r = (msRows || []).find(function (x) { return String(x.id) === b.dataset.msid; });
        if (r) openMsDay(String(msDate(r)).slice(0, 10), [r]);
      };
    });
  }

  function msStateLabel(st) {
    return { achieved: 'Achieved', overdue: 'Overdue', due: 'Due', undated: 'No date' }[st] || st;
  }
  function msChip(r) {
    var st = msStateOf(r);
    return '<button class="po-cal-chip ' + st + '" data-msid="' + esc(r.id) + '" title="' +
      esc(projNameOf(r.project_id) + ' — ' + (r.activity_name || r.activity_id || '')) + '">' +
      '<span class="po-cal-chip-p">' + esc(projShort(r.project_id)) + '</span>' +
      esc(r.activity_name || r.activity_id || '(unnamed)') + '</button>';
  }
  /* The milestone strip's own card, onto the same shared component. ⚠️ Its `good|warn|bad`
     vocabulary maps to the shared variants rather than keeping a second palette
     (`--po-ms-*`) that says the same three things. */
  var MS_VARIANT = { good: 'pd-kpi-ok', warn: 'pd-kpi-warn', bad: 'pd-kpi-bad' };
  function msKpi(l, v, sub, cls) {
    return UI.kpi(l, v, { sub: sub || '', cls: MS_VARIANT[cls] || '' });
  }
  function projNameOf(id) {
    var p = (PROJ || []).find(function (x) { return String(x.id) === String(id); });
    return (p && (p.name || p.id)) || id;
  }
  function projShort(id) { return String(id || '').slice(0, 8); }

  /* One day's milestones in full — the overflow target, and the chip target.
     ⚠️ Read-only: this is the portfolio view, and a milestone is owned by its
     project's schedule. Editing it here would put two writers on one row. */
  function openMsDay(dayKey, list) {
    var m = UI.modal('<h2 style="margin-top:0;">' + esc(dayKey) + '</h2>' +
      '<p class="po-ms-sub" style="margin-top:-6px;">' + list.length + ' milestone' + (list.length === 1 ? '' : 's') +
      ' across the scoped projects. Read-only — open the project schedule to change one.</p>' +
      '<div class="po-ms-daylist">' +
      list.map(function (r) {
        var st = msStateOf(r), sl = msSlip(r);
        return '<div class="po-ms-dayrow">' +
          '<div><strong>' + esc(r.activity_name || r.activity_id || '(unnamed)') + '</strong>' +
            (r.program_milestone ? ' <span class="po-ms-prog">program</span>' : '') + '</div>' +
          '<div class="po-ms-sub">' + esc(projNameOf(r.project_id)) +
            (r.phase ? ' · ' + esc(r.phase) : '') + '</div>' +
          '<div><span class="po-ms-state ' + st + '">' + msStateLabel(st) + '</span>' +
            (sl == null ? '' : ' <span class="po-ms-slip ' + (sl > 0 ? 'late' : sl < 0 ? 'early' : '') + '">' +
              (sl > 0 ? '+' : '') + sl + 'd vs baseline</span>') + '</div>' +
          (msAchieved(r) && msPlanned(r) ? '<div class="po-ms-sub">planned ' + esc(String(msPlanned(r)).slice(0, 10)) +
            ' · actual ' + esc(String(msDate(r)).slice(0, 10)) + '</div>' : '') +
          '</div>';
      }).join('') + '</div>' +
      '<div style="text-align:right;margin-top:12px;"><button class="pd-btn" id="msd-x">Close</button></div>');
    m.el.querySelector('#msd-x').onclick = m.close;
  }

  function msShiftMonth(n) {
    var k = msMonth.split('-'), Y = +k[0], M = +k[1] - 1 + n;
    var d = new Date(Date.UTC(Y, M, 1));
    msMonth = d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1);
    renderMilestones();
  }
  function wireMilestones() {
    document.getElementById('po-ms-prev').onclick = function () { msShiftMonth(-1); };
    document.getElementById('po-ms-next').onclick = function () { msShiftMonth(1); };
    document.getElementById('po-ms-today').onclick = function () {
      var n = new Date(todayT());
      msMonth = n.getUTCFullYear() + '-' + pad2(n.getUTCMonth() + 1); renderMilestones();
    };
    document.getElementById('po-ms-state').onchange = function (e) { msState = e.target.value; renderMilestones(); };
    document.getElementById('po-ms-prog').onchange = function (e) { msProgOnly = e.target.checked; renderMilestones(); };
  }

  // ⚠⚠ THE ROLE GATE MOVED IN HERE FROM THE TAB STRIP, AND IT IS STRICTLY STRONGER.
  //    It used to be a loop that set `hidden` on five `.po-tab` buttons — which never
  //    stopped anyone typing the `#po_view=` hash, because the hash goes straight to
  //    switchView. Gating the view itself closes the entry point the tabs never covered.
  //    ⚠ Same five as before, matching `superAdminOnly` in config.js, which is also what
  //    gates the sidebar (ui.js `visible`). UI visibility only — no RLS change, as before.
  // ⚠️ The module KEY each of those five views belongs to — needed so this gate can go
  // through `AppAuth.moduleVisible` (2026-09-15) rather than the bare role check, which
  // is what lets admin.html's per-user Modules override reach this page too.
  var PO_SUPERADMIN_MODULE_KEY = {
    risk: 'risk-register', stakeholders: 'stakeholder-map', equipment: 'equipment-loading',
    cashflow: 'cash-flow', productivity: 'productivity-rates'
  };
  function poViewAllowed(v) {
    var key = PO_SUPERADMIN_MODULE_KEY[v];
    if (!key) return true;
    return !window.AppAuth || AppAuth.moduleVisible({ key: key, superAdminOnly: true }, window.__profile);
  }

  /* ==== THE SIX THAT MOVED OUT, AND WHERE THEY WENT =========================================
     Owner 2026-09-15: *"there is a dropdown that links to each module. that is wrong … the design
     of those dashboards must be pushed to each module established on the left."*
     These six dashboards now live in their own modules (assets/js/portfolio-dash.js, mounted by
     the module when it is opened portfolio-wide). ⚠️ A DEEP LINK MUST NOT DIE WITH THE TAB: the
     sidebar carried `#po_view=` links into every one of them for months, they are in bookmarks
     and in messages, and `switchView` is what every one of those links arrives through. So the
     view name still resolves — to the module that owns it now, in portfolio scope.
     ⚠️ AFTER the super-admin gate above, deliberately: a planner who cannot see Risk Register must
     land on the Overview exactly as they did before, not be redirected to a module page instead.
     ⚠️ `location.replace`, not `href`: the tab that no longer exists should not sit in the Back
     history as a step to return to. */
  /* ⚠️⚠️ AND THE ONE THAT DID NOT MOVE, BECAUSE THE READ-ONLY SCOPE WOULD HAVE BROKEN IT.
     The Stakeholder Map's portfolio view is an authoring directory — *+ Add person*, assign,
     favourite — and writes are refused at the shared Supabase chokepoint whenever the portfolio
     flag is set (auth.js). Mounting it inside `stakeholder-map` under `#pd_scope=portfolio`
     would have left every one of those buttons raising a read-only toast. It stays here, where
     this page is NOT in portfolio scope and the writes still land. Moving it needs the scope
     question answered first, not a redirect. Milestones stays too: it has no module at all. */
  var PO_MOVED_VIEWS = {
    risk: 'risk-register', issues: 'issues-lessons', meetings: 'minutes-of-meeting',
    contracts: 'contracts-claims', photos: 'progress-photos', productivity: 'productivity-rates',
    // ⚠️ The second wave, 2026-09-16 — the four heaviest, each with its own chart or
    //    server-side aggregate. Same redirect, same reason.
    scurve: 's-curve', cashflow: 'cash-flow', resources: 'resource-loading',
    equipment: 'equipment-loading'
  };

  function switchView(v) {
    if (!poViewAllowed(v)) v = 'overview';
    if (PO_MOVED_VIEWS[v]) { location.replace('../' + PO_MOVED_VIEWS[v] + '/index.html#pd_scope=portfolio'); return; }
    view = v;
    /* ⚠️ Flip `.active` on the hidden source button and the dropdown's trigger re-labels
       itself — UI.tabsToDropdown watches these with a MutationObserver. Writing the
       trigger's text directly would be a second place that has to know the view names. */
    var strip = document.querySelector('.po-tabs');
    if (strip) strip.querySelectorAll('button[data-view]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.view === v);
    });
    wireMilestones();
    document.getElementById('po-view-overview').style.display = v === 'overview' ? '' : 'none';
    document.getElementById('po-view-milestones').style.display = v === 'milestones' ? '' : 'none';
    document.getElementById('po-view-stakeholders').style.display = v === 'stakeholders' ? '' : 'none';
    // ⚠️ Through viewLoaders() — the same list renderCurrent() reads, so a new view cannot
    //    be wired for arrival and forgotten when the project filter changes (or vice versa).
    var f = viewLoaders()[v];
    if (f) f(false);
    syncFilterBtn(v);
  }

  /* ⚠️⚠️ `placeScope` / `SCOPE_PANEL` ARE GONE, AND THAT IS THE POINT. They moved the one
     scope node between a bar of its own and four views' filter panels, so the control that
     scopes EVERY view sat somewhere different depending on where you were standing — which
     is the inconsistency the owner reported, not a cure for it. It now lives permanently in
     the module bar beside Refresh and Export, in the same place on every view.
     ⚠️ It is still ONE node with its wiring, state and selection intact; what changed is
     that nothing moves it any more. */

  function exportExcel() {
    if (typeof XLSX === 'undefined') { UI.toast('Excel library still loading — try again.', 'error'); return; }
    var list = filtered();
    if (!list.length) { UI.toast('Nothing to export.', 'warn'); return; }
    // The parent project travels with the export, so a pivot in Excel can consolidate
    // AVR101 + AVR102 the same way the on-screen rollup does. Computed over the whole
    // portfolio, not the filtered list, or a filter that hides AVR102 would rename
    // AVR101's parent to AVR101's own title.
    var pLabel = {};
    programGroups().forEach(function (g) { g.members.forEach(function (p) { pLabel[p.id] = g.label; }); });
    var data = list.map(function (p) {
      return {
        'Project': p.name || p.id, 'ID': p.id, 'Parent project': pLabel[p.id] || '', 'Status': p.status || 'active',
        'Group Head': groupHead(p) || '', 'Schedule %': progressOf(p) != null ? progressOf(p) : '',
        'Health': HEALTH[health(p)].label,
        'Forecast Start': p.forecast_start || p.start_date || '', 'Forecast Finish': p.forecast_finish || p.end_date || '',
        'Original Budget': p.original_budget != null ? num(p.original_budget) : '', 'Estimated Cost': p.estimated_cost != null ? num(p.estimated_cost) : '',
        'Variance': (p.original_budget != null || p.estimated_cost != null) ? variance(p) : ''
      };
    });
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Portfolio');
    XLSX.writeFile(wb, 'Portfolio Dashboard.xlsx');
  }


  // ================= Portfolio Stakeholder Map (cross-project) =================
  // ⚠️ Column reuse mirrors stakeholder-map/module.js exactly: `influence` actually stores
  // IMPACT and `interest` actually stores INFLUENCE (a historical naming mismatch documented
  // there). Reading them any other way here would silently disagree with the module.
  var shRows = null, shLoadedIds = null, shQuery = '';
  function shImpact(r) { return (r.influence != null && r.influence !== '') ? +r.influence : null; }
  function shInfluence(r) { return (r.interest != null && r.interest !== '') ? +r.interest : null; }
  function shApproach(r) {
    if (r.mgmt_approach) return r.mgmt_approach;   // a planner's own judgement overrides the grid
    var i = shImpact(r), f = shInfluence(r);
    return (i && f && window.MCCRCM && MCCRCM.stkApproach) ? (MCCRCM.stkApproach(i, f) || '') : '';
  }
  async function loadStakeholders(force) {
    // ⚠ The Directory does not depend on the project filter, so it is loaded and
    //   rendered on its own path rather than being squeezed through the scoped one.
    document.getElementById('po-sh-add').hidden = shView !== 'directory';
    document.getElementById('po-sh-group').hidden = shView !== 'directory';
    document.getElementById('po-sh-layout').style.display = shView === 'directory' ? '' : 'none';
    // ⚠ Health draws in its own container, so BOTH the universe and the table are put
    //   away for it — otherwise whichever the Directory left showing stays on screen
    //   under the dashboard.
    var hl = document.getElementById('po-dir-health');
    hl.style.display = shView === 'health' ? '' : 'none';
    if (shView !== 'health') hl.innerHTML = '';
    if (shView !== 'directory') {
      var uni = document.getElementById('po-dir-universe');
      if (uni) { uni.innerHTML = ''; uni.style.display = 'none'; }
      document.getElementById('po-sh-table').parentNode.style.display =
        shView === 'health' ? 'none' : '';
    }
    if (shView === 'health') {
      // ⚠ Health is a read of the DIRECTORY, so it loads the same rows the Directory
      //   loads — and reuses them when they are already in hand.
      hl.innerHTML = '<div class="po-empty">Reading the directory\u2026</div>';
      document.getElementById('po-sh-kpis').innerHTML = '';
      await loadDirectory(force);
      dirRenderHealth();
      return;
    }
    if (shView === 'directory') {
      var host = document.getElementById('po-sh-table');
      if (!dirRows || force) host.innerHTML = '<tbody><tr><td class="po-empty">Loading the directory\u2026</td></tr></tbody>';
      await loadDirectory(force);
      dirRender();
      return;
    }
    var ids = scopedProjectIds();
    if (!force && shLoadedIds && shLoadedIds.join(',') === ids.join(',')) return;
    var tbl = document.getElementById('po-sh-table'), kpis = document.getElementById('po-sh-kpis');
    if (!ids.length) { kpis.innerHTML = ''; tbl.innerHTML = ''; return; }
    tbl.innerHTML = '<tbody><tr><td class="po-empty">Reading the stakeholder maps of ' + ids.length + ' project(s)…</td></tr></tbody>';
    kpis.innerHTML = '';
    try {
      shRows = await PDb.selectAll('stakeholder_map', function (q) { return q.in('project_id', ids); });
    } catch (e) {
      var msg = (e && e.message) || String(e);
      tbl.innerHTML = '<tbody><tr><td class="po-empty">' + esc(msg) + '</td></tr></tbody>';
      return;
    }
    shLoadedIds = ids;
    shRender();
  }
  function shVisible() {
    var q = shQuery.trim().toLowerCase();
    return (shRows || []).filter(function (r) {
      if (q && ((r.name || '') + ' ' + (r.organization || '') + ' ' + (r.category || '')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function shRender() {
    var list = shVisible();
    var mc = list.filter(function (r) { return shApproach(r) === 'Manage Closely'; }).length;
    var ks = list.filter(function (r) { return shApproach(r) === 'Keep Satisfied'; }).length;
    var projSet = {}; list.forEach(function (r) { projSet[r.project_id] = 1; });
    document.getElementById('po-sh-kpis').innerHTML =
      kpi2('Stakeholders', String(list.length)) + kpi2('Manage Closely', String(mc), mc ? '--pd-bad' : null) +
      kpi2('Keep Satisfied', String(ks)) + kpi2('Projects', String(Object.keys(projSet).length));
    var nameById = {}; PROJ.forEach(function (p) { nameById[p.id] = p.name || p.id; });
    var sorted = list.slice().sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
    var head = '<thead><tr><th>Project</th><th>Name</th><th>Organization</th><th>Sector</th><th>Approach</th><th>Primary responsible</th></tr></thead>';
    var body = sorted.length ? sorted.map(function (r) {
      var ap = shApproach(r);
      return '<tr><td>' + esc(nameById[r.project_id] || r.project_id) + '</td>' +
        '<td>' + esc(r.name || '(unnamed)') + '</td>' +
        '<td>' + esc(r.organization || '—') + '</td>' +
        '<td>' + esc(r.category || '—') + '</td>' +
        '<td>' + (ap ? statePill(ap, ap === 'Manage Closely' ? 'bad' : ap === 'Keep Satisfied' ? 'warn' : 'muted') : '—') + '</td>' +
        '<td>' + esc(r.primary_responsible || '—') + '</td></tr>';
    }).join('') : '<tr><td colspan="6" class="po-empty">No stakeholders match the current filter.</td></tr>';
    document.getElementById('po-sh-table').innerHTML = head + '<tbody>' + body + '</tbody>';
  }






  AppAuth.requireLogin(async function (user, profile) {
    UI.renderUserBar(profile);
    UI.initShell();
    var isAdmin = !!profile && (profile.role === 'admin' || profile.role === 'super_admin');
    UI.renderNav(document.getElementById('side-nav'), 'portfolio', { active: 'portfolio-dashboard', base: '../../', isAdmin: isAdmin });
    UI.renderSwitcher(document.getElementById('ctx-switcher'), { mode: 'portfolio', base: '../../' });
    // ⚠️ The sidebar hides these five modules for everyone but super_admin (config.js
    // `superAdminOnly`, 2026-09-03) — but their cross-project data is ALSO reachable from
    // right here, as this page's own tabs, which are static markup rather than built off
    // APP_CONFIG.MODULES. Hiding the sidebar link and leaving the tab open would just move
    // the leak one click over, so the matching tabs are hidden the same way, off the same
    // role. `contracts` was in this list until 2026-09-03 (b) — Contracts & Claims is
    // unhidden app-wide now, so its tab stays too. `resources`/`s-curve`/`milestones`/
    // `issues`/`meetings`/`photos`/`overview` stay — none of those seven modules are
    // superAdminOnly.
    document.getElementById('po-group').onchange = function (e) { groupMode = e.target.value; collapsed = {}; renderCurrent(); };
    wireProjFilter();
    document.getElementById('po-status').onchange = function (e) { statusFilter = e.target.value; renderCurrent(); };
    document.getElementById('po-behind').onchange = function (e) { behindOnly = e.target.checked; renderCurrent(); };
    document.getElementById('po-q').oninput = function (e) { query = e.target.value; renderCurrent(); };
    document.getElementById('po-export').onclick = exportExcel;
    // Each tab's own filter row (incl. its search box) hides behind one
    // funnel toggle instead of sitting permanently open.
    // Browser-history integration — see UI.bindHistoryState in ui.js. Without this,
    // switching Overview/Milestones/Stakeholder Map never
    // touches the URL, so the browser's native Back button jumps straight past
    // every tab switch to the projects/dashboard page.
    var histView = UI.bindHistoryState({
      key: 'po_view',
      get: function () { return { v: view }; },
      apply: function (s) { switchView(s.v); }
    });

    /* ⚠️⚠️ THE SWITCHER IS BUILT AFTER AUTH, DELIBERATELY. Five views are super-admin-only
       and `window.__role` is not known until requireLogin resolves — building earlier would
       offer a planner five views they cannot open, and tabsToDropdown caches its button list
       at build time, so removing them afterwards would leave them sitting in the menu.
       ⚠️ No flash is introduced: `.pd-tabsrc` is hidden from the first frame by the shared
       `html.pd-js .pd-tabsrc` rule, so the raw strip is never on screen either way.
       ⚠️ `opts.icon` is NOT passed — this page keeps its own <h1>, and the 2026-09-04 rule is
       that only a module whose title is hidden outright supplies the icon to the dropdown. */
    (function () {
      var strip = document.querySelector('.po-tabs');
      if (!strip) return;
      strip.querySelectorAll('button[data-view]').forEach(function (b) {
        if (!poViewAllowed(b.dataset.view)) {
          b.parentNode.removeChild(b); return;
        }
        b.onclick = function () { switchView(b.dataset.view); histView.push(); };
      });
      if (window.UI && UI.tabsToDropdown) UI.tabsToDropdown('.po-tabs');
    })();

    document.getElementById('po-refresh').onclick = refreshCurrent;
    // ⚠ One search box drives both views, so it must dispatch on the current view
    //   rather than always calling the mirror renderer.
    document.getElementById('po-sh-q').oninput = function (e) {
      shQuery = e.target.value;
      if (shView === 'directory') dirRender();
      // ⚠ Health is a portfolio-wide read of the whole directory, so the search box
      //   does not narrow it — a completeness figure over the rows matching a search
      //   is not the directory's completeness.
      else if (shView !== 'health') shRender();
    };
    document.getElementById('po-sh-add').onclick = openDirAdd;
    document.getElementById('po-sh-group').onchange = function (e) {
      dirGroup = e.target.value;
      dirBand = '';           // ⚠ a band from the old grouping means nothing in the new one
      dirRenderUniverse();
    };
    document.querySelectorAll('#po-sh-layout [data-lay]').forEach(function (b) {
      b.onclick = function () {
        dirLayout = b.dataset.lay;
        document.querySelectorAll('#po-sh-layout [data-lay]').forEach(function (x) {
          x.classList.toggle('on', x === b);
        });
        dirRenderUniverse();
      };
    });
    document.querySelectorAll('#po-sh-view [data-shv]').forEach(function (b) {
      b.onclick = function () {
        shView = b.dataset.shv;
        document.querySelectorAll('#po-sh-view [data-shv]').forEach(function (x) {
          x.classList.toggle('on', x === b);
        });
        loadStakeholders(false);
      };
    });
    try {
      var res = await Promise.all([PDb.getProjects(), PDb.getGroupHeads()]);
      PROJ = res[0]; GH = res[1];
      if (window.PDSync) PDSync.cachePut('po:all', { PROJ: PROJ, GH: GH });   // offline read-cache
    } catch (e) {
      // Offline / fetch failed: render the last-cached portfolio so it still opens.
      var restored = false;
      if (window.PDSync) {
        var c = await PDSync.cacheGet('po:all');
        if (c && c.rows) { PROJ = c.rows.PROJ || []; GH = c.rows.GH || []; restored = true; }
      }
      if (!restored) UI.toast('Could not load portfolio: ' + (e.message || e), 'error');
    }
    GH.forEach(function (g) { ghById[g.id] = g; });
    renderAll();
    // ⚠️ Re-apply the current view now that PROJ/GH are actually populated. A page
    // landing DIRECTLY on a non-overview tab via #po_view=… (bindHistoryState's
    // `initial` branch, e.g. the sidebar's deep links into this page) calls
    // switchView() synchronously, BEFORE this fetch resolves — so scopedProjectIds()
    // sees an empty PROJ, every loadX() bails out on "no projects match" and never
    // gets asked again. Harmless when view is still 'overview' (just re-toggles
    // display, which renderAll() already painted).
    switchView(view);

    // Presence only: the portfolio spans ALL projects, so there's no single-project
    // channel and no editing cursor (it's a read-only rollup). This shows who else is
    // viewing the portfolio right now. Live per-project data still comes via the
    // per-tab Refresh + the modules that write the rollups.
    if (window.PDCollab) {
      PDCollab.join({
        key: 'portfolio',
        self: { id: (profile && profile.id) || user.id, name: (profile && (profile.name || profile.email)) || 'Someone' },
        onPresence: function (members) { var el = document.getElementById('po-presence'); if (el) el.innerHTML = PDCollab.avatarsHTML(members || []); }
      });
    }
  });
})();
</script>
</body>
