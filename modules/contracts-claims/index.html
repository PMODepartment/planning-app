<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon-icon.png?v=20260903a" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png?v=20260830b" />
  <script src="../../assets/js/theme.js?v=20260910w7"></script>
  <title>Contracts &amp; Claims Register · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260916a" />
  <link rel="stylesheet" href="module.css?v=20260916h" />
  <link rel="stylesheet" href="../../assets/css/portfolio-dash.css?v=20260916e" />
</head>
<body>
  <div class="pd-app">
    <!-- Persistent module sidebar (uniform across the suite — see MODULE_CONTRACT.md
         §"Sidebar"). Contents are mode='project', rendered by UI.renderNav below. -->
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="../../assets/img/logo-white.png" alt="Megawide Construction"><img class="pd-brand-mark" src="../../assets/img/favicon-icon.png?v=20260903a" alt="" aria-hidden="true">Planners Dashboard<small>Planning Suite</small></div>
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="appEngineering"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="appProcurement"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>PMO Department</div>
    </aside>
    <div class="pd-content">
      <div class="pd-topbar">
        <h1 class="cc-title" style="margin:0;"><span class="cc-title-ico" data-ico="contract" data-ico-size="20"></span> <span class="cc-title-txt">Contracts &amp; Claims</span></h1>
        <div class="cc-projctx">
          <select class="pd-select cc-project" id="cc-project" title="Project"></select>
        </div>
        <div class="cc-tabs pd-tabsrc" role="tablist">
          <!-- ⚠️ THREE TABS, NOT SIX (2026-08-26). Owner: *"There are too many tabs to keep
               track of."* Packages folded into Contract (a contract defines a package, so
               one list keyed by package carries both); BOQ folded under Contract and PMI
               under Claims — both keep their own screens, reached from inside the parent
               tab instead of competing with it at the top level.
               ⚠️ The tab count is load-bearing for the TITLE: module.css hid
               `.cc-title-txt` below 1460px because "5 tabs need more room", so the sixth
               tab is why the page had no title at all on a normal laptop. -->
          <button class="cc-tab active" data-view="contract">Contract</button>
          <button class="cc-tab" data-view="claims">Claims / Change Order</button>
          <button class="cc-tab" data-view="eot">Extension of Time</button>
          <!-- ⚠️ A FOURTH TAB, DELIBERATELY — see 2026-09-16 in module.js above ccDashHTML().
               Not the landing tab (owner: "it need not be the landing tab"); Contract stays
               active by default. The strip is a dropdown (UI.tabsToDropdown below), which is
               why a fourth entry costs nothing in width — the owner's own reason for allowing it. -->
          <button class="cc-tab" data-view="dashboard">Dashboard</button>
        </div>
        <div class="cc-topbar-tools" id="cc-topbar-tools">
          <!-- Filters, moved into a single toggleable group (UI.wireFilterToggle,
               ui.js) instead of the always-open bar this used to be. Hidden on
               the Contract tab (which is keyed by package, not this filter
               bar) — see render() in module.js. -->
          <button class="pd-filttoggle" id="cc-filttoggle" title="Filters"><span data-ico="filter" data-ico-size="16"></span></button>
          <span class="cc-tb-sep"></span>
          <button class="pd-btn cc-tb-labeled pd-btn-primary" id="cc-add" title="Add a record">+ Add</button>
          <span class="cc-tb-sep"></span>
          <button class="pd-btn" id="cc-export" title="Export to Excel"><span data-ico="download" data-ico-size="16"></span></button>
          <button class="pd-btn" id="cc-print" title="Print / PDF"><span data-ico="printer" data-ico-size="16"></span></button>
          <button class="pd-btn cc-clearbtn" id="cc-clear" title="Clear all records for this project" style="display:none;"><span data-ico="trash" data-ico-size="16"></span></button>
        </div>
        <div id="cc-presence" title="People viewing this project"></div>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <!-- Filter bar. The date-window controls mirror the Power Apps screens: you
             pick WHICH status date to filter on, then a start/end window. -->
        <div class="cc-filters" id="cc-filters">
          <span class="cc-filt-ico" data-ico="filter" data-ico-size="15"></span>
          <input class="pd-input cc-search" id="cc-f-search" placeholder="Search description, reference, counterparty…" />
          <select class="pd-select" id="cc-f-type"><option value="">All Claim/CO</option></select>
          <select class="pd-select" id="cc-f-status"><option value="">All statuses</option></select>
          <select class="pd-select" id="cc-f-pkg" title="Contract package" style="display:none;"><option value="">All packages</option></select>
          <select class="pd-select" id="cc-f-datefield" title="Which date the window below filters on">
            <option value="">Date filter: none</option>
            <option value="date_submitted">Submitted date</option>
            <option value="date_evaluated">Evaluated date</option>
            <option value="date_approved">Approved date</option>
            <option value="date_filed">Filed date</option>
          </select>
          <input class="pd-input cc-date" id="cc-f-from" type="date" title="From" />
          <input class="pd-input cc-date" id="cc-f-to" type="date" title="To" />
          <button class="cc-clearfilt" id="cc-f-clear" title="Clear all filters" hidden><span data-ico="x" data-ico-size="13"></span> Clear</button>
          <span class="cc-count" id="cc-count"></span>
        </div>

        <div id="cc-view"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="../../assets/js/config.js?v=20260915a"></script>
  <script src="../../assets/js/auth.js?v=20260915a"></script>
  <script src="../../assets/js/db.js?v=20260915i"></script>
  <script src="../../assets/js/program.js?v=20260827a"></script>
  <script src="../../assets/js/ui.js?v=20260915i"></script>
  <script src="../../assets/js/claims.js?v=20260915a"></script>
  <script src="../../assets/js/notebook.js?v=20260915d"></script>
  <script src="../../assets/js/icons.js?v=20260915f"></script>
  <script src="../../assets/js/offline.js?v=20260812b"></script>
  <script src="../../assets/js/collab.js?v=20260812b"></script>
  <script src="../../assets/js/autosave.js?v=20260812b"></script>
  <!-- boq.js must load BEFORE module.js's init runs (it is read as window.BOQ). -->
  <!-- locmatch.js first: boq.js and affected.js both call PDLoc, and the schedule loads it too. -->
  <script src="../../assets/js/locmatch.js?v=20260910z1"></script>
  <!-- ⚠ attach.js BEFORE module.js: `PDAttach` is the attachment engine this module's own
       att* delegates are built on (it was extracted out of module.js on 2026-09-15 so the
       Project Schedule could use the same ordering rules rather than a second copy). The
       instance is built lazily on first use, so strictly this only has to precede a click —
       but a shared dependency listed after its consumer is how a load-order bug gets written
       later by someone reading the order as the contract. -->
  <script src="../../assets/js/attach.js?v=20260915b"></script>
  <script src="../../assets/js/co-insert.js?v=20260909r"></script>
  <script src="../../assets/js/xlgrid.js?v=20260907e"></script>
  <script src="../../assets/js/portfolio-dash.js?v=20260915x"></script>
  <script src="boq.js?v=20260914s"></script>
  <script src="pmi.js?v=20260911uc"></script>
  <script src="packages.js?v=20260911uc"></script>
  <!-- affected.js before wizard.js and module.js: both read it as window.CCAffected. -->
  <script src="affected.js?v=20260911b"></script>
  <script src="wizard.js?v=20260915c"></script>
  <script src="module.js?v=20260916h"></script>
  <script>
    // Item 1 (2026-09-02): the topbar tab strip becomes ONE dropdown, and the
    // static module label beside it goes with it — the trigger already names
    // the active screen, so the two together were a literal duplicate. Same
    // shared component minutes-of-meeting / issues-lessons / progress-photos
    // already use; it drives the real (now-hidden) buttons, so this module's
    // own view-switching logic is untouched.
    // ⚠️ Bound to DOMContentLoaded HERE, not called from inside
    // AppAuth.requireLogin's callback — see the full note in
    // risk-register/index.html (2026-09-03 bug fix + why NOT to call
    // UI.initModuleTopbar() explicitly/early — it breaks theme.js's own
    // topbar injection, which relies on running before it via
    // DOMContentLoaded listener registration order).
    (function () {
      function go() { if (window.UI && UI.tabsToDropdown) UI.tabsToDropdown('.cc-tabs'); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
      else go();
    })();
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      var pname = sessionStorage.getItem('pd_project_name') || sessionStorage.getItem('pd_project') || '';
      UI.renderNav(document.getElementById('side-nav'), 'project', {
        active: 'contracts-claims', base: '../../', pname: pname, modules: APP_CONFIG.MODULES,
      });

      /* ==== PORTFOLIO SCOPE IS THIS MODULE’S DASHBOARD =======================================
         Owner 2026-09-15, looking at the Portfolio Dashboard’s view dropdown: *"there is a
         dropdown that links to each module. that is wrong … the design of those dashboards must
         be pushed to each module established on the left."* It was a second home for this module:
         the sidebar already opens this page portfolio-wide, and the same rows were also a view of
         a page called Portfolio Dashboard. That view now lives here — see portfolio-dash.js.
         ⚠️ THE MODULE’S OWN init() IS SKIPPED, deliberately. It would read this register a second
         time, into a UI that is hidden underneath the dashboard — a duplicate cross-project fetch
         on every project the planner can see, for nothing anybody can look at.
         ⚠️ The project selector is wired by takeOver() for exactly that reason: skipping init()
         skips the code that fills it, and without it there is no way to leave portfolio scope from
         the page you are standing on. */
      if (window.AppAuth && AppAuth.isPortfolioScope() && window.PortfolioDash && PortfolioDash.has('contracts')) {
        PortfolioDash.takeOver('contracts', { select: '#cc-project' }).catch(function (e) {
          if (window.UI && UI.toast) UI.toast('Could not draw the portfolio view: ' + (e.message || e), 'error');
        });
        return;
      }
      ContractsClaims.init(user, profile);
    });
  </script>
</body>
</html>
