<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/img/icon.png?v=20260830b" />
  <script src="../../assets/js/theme.js?v=20260812b"></script>
  <title>Contracts &amp; Claims Register · Planners Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=20260901d" />
  <link rel="stylesheet" href="module.css?v=20260827b" />
</head>
<body>
  <div class="pd-app">
    <!-- Persistent module sidebar (uniform across the suite — see MODULE_CONTRACT.md
         §"Sidebar"). Contents are mode='project', rendered by UI.renderNav below. -->
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="../../assets/img/logo-white.png" alt="Megawide Construction">Planners Dashboard<small>Planning Suite</small></div>
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="externalLink"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>EPC &middot; PMO &middot; Planning Suite</div>
    </aside>
    <div class="pd-content">
      <div class="pd-topbar">
        <h1 class="cc-title" style="margin:0;"><span class="cc-title-ico" data-ico="contract" data-ico-size="20"></span> <span class="cc-title-txt">Contracts &amp; Claims</span></h1>
        <div class="cc-projctx">
          <select class="pd-select cc-project" id="cc-project" title="Project"></select>
        </div>
        <div class="cc-tabs" role="tablist">
          <!-- ⚠️ THREE TABS, NOT SIX (2026-08-26). Owner: *"There are too many tabs to keep
               track of."* Packages folded into Contract (a contract defines a package, so
               one list keyed by package carries both); BOQ folded under Contract and PMI
               under Claims — both keep their own screens, reached from inside the parent
               tab instead of competing with it at the top level.
               ⚠️ The tab count is load-bearing for the TITLE: module.css hid
               `.cc-title-txt` below 1460px because "5 tabs need more room", so the sixth
               tab is why the page had no title at all on a normal laptop. -->
          <button class="cc-tab active" data-view="contract">Contract</button>
          <button class="cc-tab" data-view="claims">Claims / Change Order</button>
          <button class="cc-tab" data-view="eot">Extension of Time</button>
        </div>
        <div class="cc-topbar-tools" id="cc-topbar-tools">
          <button class="pd-btn cc-tb-labeled pd-btn-primary" id="cc-add" title="Add a record">+ Add</button>
          <span class="cc-tb-sep"></span>
          <button class="pd-btn" id="cc-export" title="Export to Excel"><span data-ico="download" data-ico-size="16"></span></button>
          <button class="pd-btn" id="cc-print" title="Print / PDF"><span data-ico="printer" data-ico-size="16"></span></button>
          <button class="pd-btn cc-clearbtn" id="cc-clear" title="Clear all records for this project" style="display:none;"><span data-ico="trash" data-ico-size="16"></span></button>
        </div>
        <div id="cc-presence" title="People viewing this project"></div>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <!-- Filter bar. The date-window controls mirror the Power Apps screens: you
             pick WHICH status date to filter on, then a start/end window. -->
        <div class="cc-filters" id="cc-filters">
          <span class="cc-filt-ico" data-ico="filter" data-ico-size="15"></span>
          <input class="pd-input cc-search" id="cc-f-search" placeholder="Search description, reference, counterparty…" />
          <select class="pd-select" id="cc-f-type"><option value="">All Claim/CO</option></select>
          <select class="pd-select" id="cc-f-status"><option value="">All statuses</option></select>
          <select class="pd-select" id="cc-f-pkg" title="Contract package" style="display:none;"><option value="">All packages</option></select>
          <select class="pd-select" id="cc-f-datefield" title="Which date the window below filters on">
            <option value="">Date filter: none</option>
            <option value="date_submitted">Submitted date</option>
            <option value="date_evaluated">Evaluated date</option>
            <option value="date_approved">Approved date</option>
            <option value="date_filed">Filed date</option>
          </select>
          <input class="pd-input cc-date" id="cc-f-from" type="date" title="From" />
          <input class="pd-input cc-date" id="cc-f-to" type="date" title="To" />
          <button class="cc-clearfilt" id="cc-f-clear" title="Clear all filters" hidden><span data-ico="x" data-ico-size="13"></span> Clear</button>
          <span class="cc-count" id="cc-count"></span>
        </div>

        <div id="cc-view"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="../../assets/js/config.js?v=20260901c"></script>
  <script src="../../assets/js/auth.js?v=20260901b"></script>
  <script src="../../assets/js/db.js?v=20260901d"></script>
  <script src="../../assets/js/program.js?v=20260827a"></script>
  <script src="../../assets/js/ui.js?v=20260901d"></script>
  <script src="../../assets/js/icons.js?v=20260902e"></script>
  <script src="../../assets/js/offline.js?v=20260812b"></script>
  <script src="../../assets/js/collab.js?v=20260812b"></script>
  <script src="../../assets/js/autosave.js?v=20260812b"></script>
  <!-- boq.js must load BEFORE module.js's init runs (it is read as window.BOQ). -->
  <script src="boq.js?v=20260827e"></script>
  <script src="pmi.js?v=20260825a"></script>
  <script src="packages.js?v=20260827f"></script>
  <script src="wizard.js?v=20260827e"></script>
  <script src="module.js?v=20260830b"></script>
  <script>
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      var pname = sessionStorage.getItem('pd_project_name') || sessionStorage.getItem('pd_project') || '';
      UI.renderNav(document.getElementById('side-nav'), 'project', {
        active: 'contracts-claims', base: '../../', pname: pname, modules: APP_CONFIG.MODULES,
      });
      ContractsClaims.init(user, profile);
    });
  </script>
</body>
</html>
