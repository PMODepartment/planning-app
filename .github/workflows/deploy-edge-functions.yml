name: Deploy Edge Functions

# This repo has eight Supabase Edge Functions under supabase/functions/, and
# until this file existed the ONLY way to deploy any of them was somebody
# running the Supabase CLI on their own laptop -- so a function could sit
# undeployed for a day while the module it serves was already live, on any
# day that laptop was shut. Two ways in now:
#   1. Actions tab -> this workflow -> Run workflow -> a function name or "all".
#   2. A merge to main touching supabase/functions/** deploys only the
#      functions that actually changed in that push, not all eight.
#
# Requires one repo secret: SUPABASE_ACCESS_TOKEN (generate at
# supabase.com/dashboard/account/tokens). Provider secrets a function itself
# needs at runtime (GROQ_API_KEY, WPM_SERVICE_KEY, ...) are set separately in
# Supabase's own Edge Function secrets, never here -- a provider key living in
# two places is a key that goes stale in one of them.

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Function directory name under supabase/functions/, or "all"'
        required: true
        default: all
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bgupuqnkqhixpuctyder

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A push event diffs against the commit before the push, which
          # needs history beyond the default single-commit shallow clone.
          fetch-depth: 0

      - name: Determine which functions to deploy
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FUNCTION: ${{ github.event.inputs.function }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          FUNCTIONS_DIR="supabase/functions"

          # The known-function list is derived from the repo itself, on this
          # checkout, never hardcoded -- so a function added or removed later
          # can't drift out of sync with this workflow.
          mapfile -t ALL_ARR < <(find "$FUNCTIONS_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          ALL="${ALL_ARR[*]}"

          is_known() {
            local name="$1" f
            for f in "${ALL_ARR[@]}"; do
              [ "$f" = "$name" ] && return 0
            done
            return 1
          }

          TARGETS=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REQ="$INPUT_FUNCTION"
            if [ "$REQ" = "all" ]; then
              TARGETS="$ALL"
            elif is_known "$REQ"; then
              TARGETS="$REQ"
            else
              echo "::error::Unknown function '$REQ'. Known functions: $ALL"
              exit 1
            fi
          else
            # Push event: deploy only what actually changed in this push.
            if [ -z "${BASE_SHA:-}" ] \
               || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
              echo "::warning::Base commit unreachable (force-push, first push, or shallow history) -- not auto-deploying. Use Run workflow to deploy manually."
              TARGETS=""
            else
              CHANGED_NAMES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$FUNCTIONS_DIR" \
                | awk -F/ '{print $3}' | sort -u)
              for f in $CHANGED_NAMES; do
                if is_known "$f"; then
                  TARGETS="$TARGETS $f"
                fi
              done
              TARGETS=$(echo "$TARGETS" | xargs echo -n)
            fi
          fi

          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          if [ -n "$TARGETS" ]; then
            echo "Will deploy: $TARGETS"
          else
            echo "Nothing to deploy."
          fi

      - name: Set up Supabase CLI
        if: steps.pick.outputs.targets != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        if: steps.pick.outputs.targets != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TARGETS: ${{ steps.pick.outputs.targets }}
        run: |
          set -euo pipefail
          for f in $TARGETS; do
            echo "::group::Deploying $f"
            if [ "$f" = "reconstruction-webhook" ]; then
              # The one deliberate exception in this repo: reconstruction-webhook
              # is called by RunPod, which has no Supabase session, so it cannot
              # go through the platform's normal JWT check. Every other function
              # deploys with that check ON -- get this flag wrong and either
              # RunPod's callback is rejected, or a function that should be
              # checking its caller's JWT silently stops doing so.
              supabase functions deploy "$f" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
            else
              supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_REF"
            fi
            echo "::endgroup::"
          done
