<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon-icon.png?v=20260903a" />
  <link rel="apple-touch-icon" href="assets/img/icon.png?v=20260830b" />
  <script src="assets/js/theme.js?v=20260910w7"></script>
  <title>Stakeholder profile &mdash; Planners Dashboard</title>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260912o" />
  <link rel="stylesheet" href="assets/css/mcc-rcm.css?v=20260910w3" />
  <!-- ⚠️ The register's own stylesheet, because the project form rendered on this
       page IS that module's form — the same markup, so it needs the same rules.
       Loaded AFTER dashboard.css and BEFORE person.css, which is the order the
       module's own page uses. -->
  <link rel="stylesheet" href="modules/stakeholder-map/module.css?v=20260912o" />
  <link rel="stylesheet" href="assets/css/person.css?v=20260911ug" />
</head>
<body>
  <div class="pd-app">
    <aside class="pd-sidebar">
      <div class="pd-brand"><img class="pd-brand-logo" src="assets/img/logo-white.png" alt="Megawide Construction"><img class="pd-brand-mark" src="assets/img/favicon-icon.png?v=20260903a" alt="" aria-hidden="true">Planners Dashboard<small>Planning Suite</small></div>
      <nav id="side-nav"></nav>
      <div class="pd-nav-foot">
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/engineering-app/" target="_blank" rel="noopener" title="Opens Engineering App in a new tab">
          <span class="pd-navico" data-ico="appEngineering"></span><span class="pd-navtxt">Engineering App</span>
        </a>
        <a class="pd-nav-sibling" href="https://pmodepartment.github.io/prc-app/" target="_blank" rel="noopener" title="Opens Procurement App in a new tab">
          <span class="pd-navico" data-ico="appProcurement"></span><span class="pd-navtxt">Procurement App</span>
        </a>
      </div>
      <div class="pd-sidebar-foot">Megawide Construction Corporation<br>PMO Department</div>
    </aside>

    <div class="pd-content">
      <div class="pd-topbar">
        <!-- No static title: the profile's own header card names the person, and a
             second heading above it repeats them (the shape dashboard.html settled
             on — switcher + user-bar only). -->
        <div id="ctx-switcher"></div>
        <div id="user-bar"></div>
      </div>

      <div class="pd-main">
        <div class="pp-wrap" id="pp-body"><div class="pp-empty">Loading&hellip;</div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260912a"></script>
  <script src="assets/js/auth.js?v=20260901b"></script>
  <script src="assets/js/db.js?v=20260909n"></script>
  <script src="assets/js/program.js?v=20260827a"></script>
  <script src="assets/js/ui.js?v=20260912a"></script>
  <script src="assets/js/icons.js?v=20260912i"></script>
  <script src="assets/js/stakeholders.js?v=20260910u7"></script>
  <!-- ⚠️⚠️ The Stakeholder Map module is loaded HERE so the project form on this page
       is the register's own form, not a copy of it. `mountForm` is its entry point and
       deliberately does not call `init()` — none of the register's chrome exists here.
       Its dependencies come with it: offline/collab/autosave/mcc-rcm are what the form
       body reads, and omitting one fails only when a planner reaches that band. -->
  <script src="assets/js/offline.js?v=20260812b"></script>
  <script src="assets/js/collab.js?v=20260812b"></script>
  <script src="assets/js/autosave.js?v=20260812b"></script>
  <script src="assets/js/mcc-rcm.js?v=20260911uc"></script>
  <script src="modules/stakeholder-map/module.js?v=20260911ud"></script>
  <script src="assets/js/person.js?v=20260910y2"></script>
  <script>
  (function () {
    AppAuth.requireLogin(function (user, profile) {
      UI.renderUserBar(profile);
      var isAdmin = profile.role === 'admin' || profile.role === 'super_admin';
      // ⚠️ The sidebar is PORTFOLIO mode even when the page is scoped to a project:
      //    this is a directory record, reached from either side, and putting it in
      //    project mode would imply the profile belongs to that one job.
      UI.renderNav(document.getElementById('side-nav'), 'portfolio', { active: '', base: '', isAdmin: isAdmin });
      UI.renderSwitcher(document.getElementById('ctx-switcher'), { mode: 'portfolio', base: '' });
      PDPerson.start(profile);
    });
  })();
  </script>
</body>
</html>
